        #LOC_KSPZH_4876 = Gambit 计划
        #LOC_KSPZH_1822 = KH-7（空军 206 计划）代号 Gambit，是美国于 1963 年 7 月至 1967 年 6 月使用的一种侦察卫星。与更早的科罗娜（Corona）系统一样，它通过拍摄照片并把未冲洗的胶片送回地球来获取图像情报，典型地面分辨率为 2 至 3 英尺。在项目结束后的总结报告中，国家侦察局认为 Gambit 项目极为成功：它拍出了首批高分辨率卫星照片，其中 69.4% 的图像分辨率优于 3 英尺（0.91 米）；其发射、入轨与回收的成功记录远超以往各系统；并把技术水平推进到足以研制并成功飞行更大后续系统的程度。报告还指出，Gambit 为情报界提供了首批针对禁区的高分辨率卫星照片，其情报价值被认为“极高”。尤其值得一提的是，它的整体成功与两个第一代照相侦察计划形成鲜明对比：科罗娜故障过多，难以取得稳定的成功；而萨莫斯（Samos）则基本彻底失败，所有卫星要么在发射事故中损失，要么未能送回可用图像。
