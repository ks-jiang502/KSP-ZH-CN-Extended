        #LOC_KSPZH_4949 = 游骑兵计划
        #LOC_KSPZH_4950 = 游骑兵计划是美国在 20 世纪 60 年代实施的一系列无人太空任务，目标是首次获取月球表面的近距离图像。游骑兵飞船的设计是在撞毁之前拍摄月面图像并把图像传回地球。然而一连串事故导致前六次飞行全部失败。该计划一度被戏称为“打了再说”。国会就 NASA 总部和喷气推进实验室的“管理问题”展开调查。在两个机构经过两次重组后，游骑兵 7 号于 1964 年 7 月成功传回图像，随后又有两次任务获得成功。
        #LOC_KSPZH_4918 = 水手号计划
        #LOC_KSPZH_4919 = 水手计划（Mariner）是美国航天局 NASA 与喷气推进实验室（JPL）联合实施的一项包含 10 次任务的计划。该计划于 1962 至 1973 年间发射了一系列机器人行星际探测器，用于考察火星、金星和水星。该计划创造了多项第一，包括首次行星飞越、首次行星环绕和首次引力助推机动。水手系列的十台探测器中有七台获得成功，成为此后众多 NASA/JPL 空间探测计划的起点。原计划的水手木星-土星探测器被改造成旅行者计划，而海盗计划的轨道器则是水手 9 号飞船的放大版。后来基于水手平台的飞船包括麦哲伦探测器和伽利略探测器，第二代水手 Mark II 系列则演变为卡西尼-惠更斯探测器。水手计划的总耗资约为 5.54 亿美元。
        #LOC_KSPZH_4987 = 勘测者计划
        #LOC_KSPZH_4988 = 勘测者计划是 NASA 于 1966 年 6 月至 1968 年 1 月间把七台机器人探测器送上月球表面的计划。其主要目标是验证在月球上软着陆的可行性。勘测者飞船是第一批在另一个天体上实现软着陆的美国飞船。这些任务要求飞船沿撞击轨道直接飞向月球，飞行持续 63 至 65 小时，最后用三分钟略多的减速实现软着陆。该计划由 NASA 喷气推进实验室（JPL）实施，为阿波罗计划做准备。JPL 选定休斯飞机公司研制飞船系统。勘测者计划的总耗资官方数字为 4.69 亿美元。有五台勘测者飞船成功软着陆月球，其中包括第一台。另外两台失败：勘测者 2 号在中途修正失败后高速撞毁，勘测者 4 号在预定触地前 2.5 分钟失联（可能发生爆炸）。七台飞船至今仍留在月球上；没有任何任务安排将它们带回地球。勘测者 3 号的部分部件由阿波罗 12 号的乘员带回地球，后者于 1969 年在它附近着陆。这台飞船的相机现陈列于华盛顿特区的国家航空航天博物馆。
        #LOC_KSPZH_4911 = 月球轨道器计划
        #LOC_KSPZH_4912 = 月球轨道器计划是美国于 1966 至 1967 年发射的一系列五次无人月球轨道器任务。该计划旨在通过绘制月面地图来帮助选定阿波罗着陆点，它们提供了首批来自月球轨道的照片，并拍摄了月球和地球。五次任务全部成功，以 60 米（200 英尺）或更好分辨率拍摄的照片覆盖了月球表面的 99%。前三次任务专门用于对根据地基观测选出的 20 个潜在载人登月点成像，均在低倾角轨道飞行。第四次和第五次任务则致力于更广泛的科学目标，在高空极轨道飞行。月球轨道器 4 号拍摄了整个正面和 9% 的背面，月球轨道器 5 号完成了背面覆盖，并对 36 个预选区域获取了中等（20 米，66 英尺）和高（2 米，6 英尺 7 英寸）分辨率图像。所有月球轨道器航天器均由宇宙神-阿金纳-D 运载火箭发射。
        #LOC_KSPZH_4888 = Intelsat I 计划
        #LOC_KSPZH_2863 = Intelsat I（因谚语“早起的鸟儿有虫吃”而绰号“早鸟”）是首颗被送入地球同步轨道的商业通信卫星，于 1965 年 4 月 6 日发射。它由休斯飞机公司空间与通信集团（后为休斯空间与通信公司，现为波音卫星系统）为 COMSAT 建造，COMSAT 于 6 月 28 日将其启用。该卫星以休斯为 NASA 建造的、用于验证同步轨道卫星通信可行性的那颗卫星为基础。其助推火箭为推力增强型德尔塔（Delta D）。经过一系列机动后，它抵达大西洋上空西经 28° 的地球同步轨道位置，并在那里投入使用。
        #LOC_KSPZH_3900 = 回声号计划
        #LOC_KSPZH_3901 = 回声计划是首个被动式通信卫星实验。1960 年和 1964 年发射的两颗美国航天器各是一颗金属化气球卫星，充当微波信号的被动反射器。通信信号从一个地面站经其反射传送到另一个地面站。
        #LOC_KSPZH_2778 = IDCSC 网络 I
        #LOC_KSPZH_4863 = 国防卫星通信系统（DSCS）为美国提供军事通信，以支持分布全球的军事用户。自 2007 年起，DSCS 正由宽带全球卫星通信系统（WGS）取代。1980 年代初至 2003 年间共发射了 14 颗 DSCS-III 卫星。1985 年 STS-51-J 飞行期间，两颗卫星由航天飞机亚特兰蒂斯号发射。截至 2015 年 11 月 23 日，仍有七颗 DSCS-III 卫星在轨运行。DSCS 目前由施里弗空军基地的第 4 太空作战中队运营。DSCS 经历了三个主要阶段——IDCSP（临时国防通信卫星计划）、DSCS-II 和 DSCS-III。自首次发射以来，DSCS 一直是军事卫星通信的“主力”。所有 DSCS III 卫星都已超过其 10 年设计寿命。美国国家科学基金会使用 DSCS 卫星，为南极洲阿蒙森-斯科特南极点站和罗斯岛上的麦克默多站提供额外带宽。
        #LOC_KSPZH_3296 = 林肯实验卫星
        #LOC_KSPZH_4907 = 林肯实验卫星系列由麻省理工学院林肯实验室在美国空军资助下于 1965 至 1976 年间设计建造，用于测试卫星通信的器件与技术。该系列卫星编号为 LES1 至 LES9，曾遭遇多次发射问题。
        #LOC_KSPZH_4990 = 子午仪系统
        #LOC_KSPZH_4991 = 子午仪系统，又称 NAVSAT 或 NNSS（海军导航卫星系统），是第一个投入实际使用的卫星导航系统。该系统主要供美国海军为其北极星弹道导弹潜艇提供精确定位信息，同时也被海军水面舰艇用作导航系统，并用于水道测量和大地测量。子午仪自 1964 年起提供持续的导航卫星服务，最初服务于北极星潜艇，后来也向民用开放。
        #LOC_KSPZH_4960 = SECOR 计划
        #LOC_KSPZH_4117 = SECOR（Sequential Collation of Ranges，距离顺序比对）是 20 世纪 60 年代发射的一系列美国武装部队小型卫星，用于大地测量，以精确确定地球表面各点的位置，尤其是太平洋上的偏远岛屿。这些数据改进了全球地图绘制，并为其他卫星的地面站提供精确定位。任何一颗 SECOR 卫星都可与四个机动地面站联动：其中三个设在精确测定的已知位置，第四个设在未知位置。通过测量卫星到三个已知站的距离，可确定其在空间中的位置；再利用未知地面站与先前测定的卫星位置之间的距离，即可算出该未知地面站的坐标。这一过程要重复多次以提高测量精度。一旦未知站的位置被精确确定，它便成为已知站；随后四个站之一被转移到新的未知点，整个过程重新开始。SECOR 是 Timation 和 Navstar-GPS（全球定位系统）等导航卫星系统的前身。
        #LOC_KSPZH_4937 = 轨道太阳观测台计划
        #LOC_KSPZH_4936 = 轨道太阳观测台（OSO）计划是一系列美国空间望远镜的统称，主要目的是研究太阳，但也包含重要的非太阳实验。1962 至 1975 年间，NASA 用德尔塔火箭将八台 OSO 成功送入近地轨道。它们的主要任务是观测为期 11 年的太阳黑子周期在紫外和 X 射线波段的表现。最初的七台（OSO 1–7）由位于科罗拉多州博尔德的 Ball Aerospace（当时名为 Ball Brothers Research Corporation，BBRC）制造。OSO 8 由位于加利福尼亚州卡尔弗城的休斯空间与通信公司制造。整个系列的基本设计包含一个旋转部分——“轮”，用于提供陀螺稳定；第二个部分——“帆”——由电机驱动，相对轮的旋转反向转动，并稳定指向太阳。帆上装载指向太阳的仪器，以及为飞船供电的太阳能电池阵列。轮与帆之间的关键轴承是该设计的一大特色，因为它必须在没有常规润滑的条件下，在太空硬真空中连续数月平稳运转。它还负责把帆产生的电力和指向太阳的仪器数据传送到轮，飞船的大部分功能都位于轮内。轮内还可以安装其他科学仪器，通常沿旋转的径向矢量向外观测，每几秒钟扫过一次天空和太阳。
