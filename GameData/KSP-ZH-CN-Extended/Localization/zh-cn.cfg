        #LOC_KSPZH_5000 = 东方号计划
        #LOC_KSPZH_5001 = 东方号计划是苏联的一项载人航天项目，目的是把第一批苏联公民送入近地轨道并安全返回。它与美国的“水星”计划竞争，并于 1961 年 4 月 12 日由尤里·加加林乘坐东方 1 号完成单圈环绕，成功将人类首次送入太空。东方号飞船由天顶号侦察卫星项目发展而来，其运载火箭则由现有的 R-7“谢米奥尔卡”洲际弹道导弹（ICBM）设计改造而成。“东方”这一名称在加加林飞行首次向世界媒体公开之前一直被列为机密。该计划在 1961 至 1963 年间执行了六次载人航天飞行。最长的一次飞行持续近五天，最后四次是成对发射，相隔一天。这超过了“水星”计划所展示的最长飞行略超 34 小时的记录，也超过了其单次任务的模式。东方号之后是 1964 年和 1965 年的两次上升号计划飞行，它们使用了东方号返回舱的三人和两人改进型以及更大的运载火箭。
        #LOC_KSPZH_4998 = 上升号计划
        #LOC_KSPZH_4999 = 上升号计划是苏联第二个载人航天项目。1964 年和 1965 年各进行了一次为期一天的载人飞行，使用上升号飞船和火箭；1966 年还有两只狗执行了为期 22 天的任务。上升号的研制既是对东方号计划的延续，也是对该计划在最初六次飞行后被取消所剩部件的再利用。上升号计划后来被联盟号计划取代。上升号飞船基本上是东方号飞船，只是在其返回舱顶部增加了一台备份固体燃料反推火箭。由于它重得多，运载火箭采用 11A57，即去掉 Blok L 级的闪电 8K78M，后来成为联盟号运载火箭的基础。弹射座椅被拆除，舱内增设了两到三个与东方号乘员朝向成 90 度的乘员座椅。然而，飞行中控制装置的位置没有改变，因此乘员必须把头转 90 度才能看到仪表。
        #LOC_KSPZH_4982 = 联盟号计划
        #LOC_KSPZH_4983 = 联盟号计划（俄语意为“联盟”）是由苏联在 20 世纪 60 年代初发起的一项载人航天计划，最初是一个登月项目的一部分，旨在把苏联航天员送上月球。它是继东方号和上升号计划之后苏联的第三个载人航天计划。
        #LOC_KSPZH_4219 = 礼炮号研究计划
        #LOC_KSPZH_4968 = 礼炮计划（俄语意为“礼炮”或“烟花”）是苏联实施的第一个空间站计划，从 1971 年到 1986 年的 15 年间，共包括四座载人科研空间站和两座载人军事侦察空间站。另有两次礼炮发射失败。礼炮一方面用于开展长期太空生活问题的研究以及各种天文、生物和地球资源实验；另一方面，这个民用计划也被用作高度机密的军用“钻石”空间站的掩护，后者以礼炮的编号飞行。计划中的第一座空间站礼炮 1 号成为世界上第一座载人空间站。&br;&br;礼炮创下了多项航天纪录，包括若干任务时长纪录、首次在轨将空间站从一组乘员移交给另一组乘员，以及多项太空行走纪录。随后的联盟号计划对于空间站技术的发展至关重要：从基础的工程研制阶段、单对接口空间站，发展为具备惊人科学能力的复杂多端口长期轨道前哨，其技术遗产延续至今。最终，从礼炮空间站获得的经验为和平号和国际空间站等多模块空间站铺平了道路，这些空间站的核心舱段都源自礼炮。
        #LOC_KSPZH_3906 = 先锋计划
