        #LOC_KSPZH_4981 = 苏联，正式名称为苏维埃社会主义共和国联盟（USSR），是 1922 年至 1991 年间存在于欧亚大陆的社会主义国家。名义上它是多个民族苏维埃共和国的联盟，但其政府和经济高度集中。该国为一党制国家，由共产党执政，首都莫斯科位于其最大的加盟共和国俄罗斯苏维埃联邦社会主义共和国（俄罗斯 SFSR）。其他主要城市包括列宁格勒、基辅、明斯克、阿拉木图和新西伯利亚。它东西横跨 11 个时区、超过 10,000 公里，南北纵贯超过 7,200 公里，拥有五个气候带：苔原、泰加林、草原、沙漠和山地。苏联是 20 世纪许多重大技术成就与创新的强国，包括世界上第一颗人造卫星、第一批进入太空的人类，以及首个在另一颗行星——金星——着陆的探测器。该国拥有世界第二大经济体和世界上规模最大的常备军。苏联被承认为五个核武器国家之一，并拥有世界上最大的大规模杀伤性武器储备。它是联合国安理会创始常任理事国，也是欧洲安全与合作组织（OSCE）、世界工会联合会（WFTU）的成员，以及经济互助委员会（CMEA）和华沙条约组织的领头成员。
