        #LOC_KSPZH_4843 = 陆军弹道导弹局（ABMA）的成立是为了研制美国陆军的第一种大型弹道导弹。该局于 1956 年 2 月 1 日在红石兵工厂成立，由约翰·B·梅达里斯少将指挥，维尔纳·冯·布劳恩任技术主任。冯·布劳恩继续推进后来成为木星-C 中程弹道导弹的设计工作。这是一种三级火箭，巧合的是，它可以通过朱诺一号构型用于发射卫星。1956 年 9 月，木星-C 搭载一颗 30 磅（14 千克）的模拟卫星发射。人们普遍认为，如果当时美国政府允许，ABMA 本可以在那时就把卫星送入轨道。一年后，苏联发射了斯普特尼克 1 号。当先锋火箭失败后，一枚以红石为基础的木星-C 于 1958 年 1 月 31 日发射了美国的第一颗卫星——探险者 1 号。[1] 红石后来被用作水星计划的运载火箭。红石还曾以 PGM-11 的编号被美国陆军部署，是第一种携带核弹头的导弹。
