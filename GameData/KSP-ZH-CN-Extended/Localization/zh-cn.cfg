        #LOC_KSPZH_4989 = TIROS 计划
        #LOC_KSPZH_4761 = TIROS，即电视红外观测卫星，是美国自 1960 年 TIROS-1 开始发射的一系列早期气象卫星。TIROS 是第一颗能够对地球进行遥感观测的卫星，使科学家得以从全新的视角——太空——观察地球。该计划由哈里·韦克斯勒推动，在军用侦察卫星尚在秘密研制或使用之时，证明了卫星气象观测的实用价值。TIROS 在当时证明了“天才的关键往往在于简单”。
        #LOC_KSPZH_3899 = 信使号计划
        #LOC_KSPZH_3989 = 信使计划由美国陆军通信兵于 1958 年 9 月提出，是 1958 年 12 月 18 日发射的 SCORE 计划的后续。SCORE“是发展供军事部门使用的通信卫星系统这一演进计划的第一步”。信使计划是美国国防部高级研究计划局（ARPA）与位于新泽西州蒙茅斯堡的美国陆军通信研发实验室的联合项目。基本上，信使 1B 会接收消息或照片，将其存储，然后再转发出去。信使 1B 是一个实验系统，用于验证利用卫星解决全球通信问题的可行性。它被设计用来存储电传打字消息，并在卫星处于地面站视野内时高速发送。它被设计在 690 英里高度环绕地球运行。信使号的有效消息传输速率为每秒 55,000 比特，使用特高频（UHF）通信。这一部分电磁频谱此前相对未被使用，且一般不受人造与大气干扰。信使卫星在太空中以每小时 16,000 英里的速度运行的同时，每分钟可同时收发约 68,000 个单词，并能收发传真照片。
        #LOC_KSPZH_4939 = 先驱者计划
