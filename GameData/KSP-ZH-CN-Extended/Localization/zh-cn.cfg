        #LOC_KSPZH_4835 = 阿波罗计划
        #LOC_KSPZH_4837 = 阿波罗计划（又称 Project Apollo）是美国国家航空航天局（NASA）实施的第三个美国载人航天计划，于 1969 至 1972 年间实现了人类首次登月。它最初在艾森豪威尔政府时期构想，是继将首批美国人送入太空的单人水星计划之后的三乘员飞船；后来阿波罗被赋予肯尼迪总统的国家目标——在 20 世纪 60 年代末之前“把人送上月球并安全返回地球”，这一目标由他于 1961 年 5 月 25 日在国会演讲中提出。&br;&br;肯尼迪的目标在阿波罗 11 号任务中实现：1969 年 7 月 20 日，航天员尼尔·阿姆斯特朗和巴兹·奥尔德林驾驶登月舱（LM）着陆月面并行走其上，迈克尔·柯林斯则留在月球轨道上的指令/服务舱（CSM）中；7 月 24 日三人全部安全返回地球。此后又有五次阿波罗任务将航天员送上月球，最后一次在 1972 年 12 月。在这六次太空飞行中，共有十二人踏上月球。
        #LOC_KSPZH_4977 = 天空实验室计划
        #LOC_KSPZH_4480 = 天空实验室是美国的第一座空间站，1973 至 1979 年环绕地球运行，最终在全球媒体的巨大关注下坠回地球。它由 NASA 发射并运营，包含一个工作舱、一座太阳观测台，以及供乘员生存和科学实验所需的其他系统。它由一枚改装过的土星五号火箭无人发射，重 170,000 磅（77,111 千克）。将天空实验室送入近地轨道是土星五号火箭（因首次及后续载人登月而闻名）的最后一次任务与发射。
        #LOC_KSPZH_4858 = 科罗娜计划
        #LOC_KSPZH_4859 = 科罗娜计划是由美国中央情报局科学技术处研制并运营、并得到美国空军大力协助的一系列美国战略侦察卫星。科罗娜使用了 4 种不同的锁眼卫星型号（KH-1、KH-2、KH-3、KH-4）。科罗娜卫星自 1959 年 6 月起至 1972 年 5 月止，用于对苏联、中华人民共和国及其他地区进行照相侦察。科罗娜最初以“发现者”（Discoverer）之名启动，属于美国空军 WS-117L 卫星侦察与防护计划的一部分。据估计，科罗娜计划共花费 8.5 亿美元，按通胀调整后相当于 2019 年的 68.4 亿美元。
