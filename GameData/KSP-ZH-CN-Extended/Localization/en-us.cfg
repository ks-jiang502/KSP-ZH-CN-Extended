        #LOC_KSPZH_1383 = Big Screen Plasma TV
        #LOC_KSPZH_5602 = Unlike the DSEV graphene radiator, the plasma screen tv can actually display images. It's perfect for giving your intrepid crew the ability to see around their ship when stuffed in the back of a cargo bay, or for just watching an in-flight movie so they don't get bored.
