        #LOC_KSPZH_3946 = Prometheus-33B-FB 1.875m Adapter Fairing Base SAF
        #LOC_KSPZH_76 = 1.875m fairing base that integrates a 1.875m to 0.9375m structural adapter. Designed to completely enclose the Belle upper stage and sensitive payloads for the Prometheus 33B and 34B rockets. Was also adapted for the Bossart PC23F. Can be enabled as a decoupler but it is recommended to place the Bossart-PCR3B-SI 0.9375m Interstage on top when using with a Belle upper stage.
        #LOC_KSPZH_1973 = Daleth-P/K 1.875m Prometheus Fairing Adapter SAF
        #LOC_KSPZH_5133 = This 1.875m fairing base was designed to allow the 1.5m Daleth P/K Fairing Adapter to use the standard Prometheus fairing. Simply place on top of the 1.5m Daleth fairing skirt. Also features an optional top attach node to enable its use as a standalone fairing base.
        #LOC_KSPZH_1797 = Chryslus-II-VCA Fairing Cone
        #LOC_KSPZH_693 = A special fairing base for the Chryslus II rocket. The fairing might not be very spacious but will safely enclose a Vicenza cluster and a small payload.
