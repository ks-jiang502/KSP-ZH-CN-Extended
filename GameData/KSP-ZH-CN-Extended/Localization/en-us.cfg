        #LOC_KSPZH_1299 = BX-60 "Kodama-D" Cryogenic Engine
        #LOC_KSPZH_968 = An extrememe performance evolution of the basic expander bleed cycle, this engine uses upstream boost pumps to achieve high turbo-pump and chamber pressures and produces double the thrust of a typical closed expander cycle engine. By injecting the bleed exhaust back into the nozzle for film cooling, some of the Isp loss from using the bleed cycle is also recovered. The end result is a no compromise upper stage engine. This version has been modified with a deployable carbon nozzle extension for a more compact envelope.
