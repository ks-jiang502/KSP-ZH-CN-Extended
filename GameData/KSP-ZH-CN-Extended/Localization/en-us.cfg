        #LOC_KSPZH_4692 = Stretched droop-style animated drop umbilical with 5 color options. The umbilical can be lengthened by adjusting the deploy limit slider, and there is also an adjustable-length extension tube. The mount has 8 color options. Animation can be either staged or done manually/action-grouped.
