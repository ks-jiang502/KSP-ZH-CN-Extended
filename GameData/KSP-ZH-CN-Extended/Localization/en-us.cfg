        #LOC_KSPZH_1795 = Chryslus-EE5 "Rhesus" Vernier Exhaust Engine
        #LOC_KSPZH_5428 = This small vernier nozzle gimbals the exhaust stream of a gas generator engine, adding roll control to your rocket. Though we suppose it could be jury rigged to work with any engine. It's up to you, really.
