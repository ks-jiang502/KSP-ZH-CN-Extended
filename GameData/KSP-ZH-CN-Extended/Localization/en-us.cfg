        #LOC_KSPZH_3742 = P-SSM-3H 0.3125m Payload Separation Mechanism
        #LOC_KSPZH_654 = A small, 0.3125m decoupler designed especially for deploying a satellite from the launch vehicle. Rather than using explosive bolts to separate the part above it, a spring loaded plate gently pushes the payload away. This one is taller than most, for payloads that need a large standoff from the upper stage below. Additional height (needed for solar panels or instruments hanging below the bottom plane of the payload, for example) can be gained by attaching structural payload adapters to the bottom.
        #LOC_KSPZH_3743 = P-SSM-3L 0.3125m Payload Separation Mechanism
        #LOC_KSPZH_652 = A small, 0.3125m decoupler designed especially for deploying a satellite from the launch vehicle. Rather than using explosive bolts to separate the part above it, a spring loaded plate gently pushes the payload away. This one is designed to be as low profile as possible, to minimize the length of the fairing. Additional height (needed for solar panels or instruments hanging below the bottom plane of the payload, for example) can be gained by attaching structural payload adapters to the bottom.
