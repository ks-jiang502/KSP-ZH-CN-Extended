        #LOC_KSPZH_1952 = Daleth IV Heavy 3.125m Radial Decoupler
        #LOC_KSPZH_3158 = Large radial decoupler for separating 3.125m boosters and core from each other. Includes separation motors at the bottom. The side with double ended struts should be attached to the radial boosters.
        #LOC_KSPZH_1951 = Daleth IV Heavy 3.125m Nose Cone
