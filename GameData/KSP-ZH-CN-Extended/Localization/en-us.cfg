        #LOC_KSPZH_3083 = LMSS-CTT 0.9375m Crew Tube
        #LOC_KSPZH_19 = 0.9375m crew tube for the Leo Modular Space Station.
        #LOC_KSPZH_3084 = LMSS-CTTD 0.9375m Crew Tube
        #LOC_KSPZH_20 = 0.9375m crew tube for the Leo Modular Space Station. This one is longer, in case you need something... longer.
        #LOC_KSPZH_3241 = Leo-KZ24 Dipole Antenna
        #LOC_KSPZH_527 = A simple extending dipole antenna made for the extended Leo program.
        #LOC_KSPZH_3235 = Leo-F-DGAF Docking Guidance Antenna
        #LOC_KSPZH_2300 = Fixed version of the Leo docking antenna.
        #LOC_KSPZH_3234 = Leo-F-DGA Docking Guidance Antenna
        #LOC_KSPZH_292 = A deployable antenna for advanced Leo variants.
        #LOC_KSPZH_3240 = Leo-HD6D Colinear Antenna Array
        #LOC_KSPZH_263 = A colinear antenna array made for the Leo program.
        #LOC_KSPZH_3087 = LMSS-IAM "Expanse" Inflatable Airlock
        #LOC_KSPZH_2837 = Inflatable airlock for Leo-based stations, useful for allowing crew EVA access to the outside of the station.
        #LOC_KSPZH_3243 = Leo-LAS Launch Escape System
        #LOC_KSPZH_5434 = This solid rocket tower is designed to wrench the command pod up and away from a malfunctioning rocket. Use only in case of emergency. WARNING: Staging the LES will also decouple it from the bottom node, in order to dispose of it after launch. Map the engine to the ABORT action group for emergency use. Designed for advanced Leo variants launched on anything bigger than a Prometheus II.
        #LOC_KSPZH_3091 = LMSS-ORS 1.875m One-Room Space Station Module
        #LOC_KSPZH_1868 = Core building block of the Leo Modular Space Station, this module contains a single pressurized volume with associated support equipment. Provides enough space for two crew members.
        #LOC_KSPZH_3092 = LMSS-RAP Radial Attachment Point
        #LOC_KSPZH_950 = An expansion node for the Leo Modular Space Station. Can be used to add more docking points or other structural connections to a station.
        #LOC_KSPZH_3096 = LMSS-STM 1.875m Station Endcap
        #LOC_KSPZH_349 = A hemispherical cap designed to terminate station modules that don't need a docking port or other inline parts attached past it. An attachment node is still provided to aid in mating the module to the launch vehicle. Optionally, it can also act as a 1.875m to 0.625m adapter if the central cover is removed.
        #LOC_KSPZH_3094 = LMSS-SNMK 1.25m Structural Node
        #LOC_KSPZH_44 = 1.25m structural node module for the Leo Modular Space Station. Use radial attachment points to add nodes according to your needs.
        #LOC_KSPZH_3101 = LMSS-TRS 1.875m Two-Room Space Station Module
        #LOC_KSPZH_1867 = Core building block of the Leo Modular Space Station, this module contains a large pressurized volume split into two "rooms", with associated support equipment. Provides enough space for three crew members.
        #LOC_KSPZH_3231 = Leo-DVO Whip Antenna
        #LOC_KSPZH_526 = A simple extending antenna made for the extended Leo program.
        #LOC_KSPZH_2676 = Hermes-OMS Equipment Section
        #LOC_KSPZH_219 = A 1.25m to 0.9375m adapter that integrates a monopropellant powered fuel cell and batteries.
        #LOC_KSPZH_2674 = Hermes-OMS 1.25m Structural Interstage
        #LOC_KSPZH_4382 = Short 1.25m interstage for attaching the Hermes capsule to the top of the Hermes-OMS lab.
        #LOC_KSPZH_2673 = Hermes-OMS 1.25m Lab Module
        #LOC_KSPZH_566 = A small 1.25m lab module. It doesn't provide much space for working, but it may prove useful for testing theories about working in space.
        #LOC_KSPZH_2675 = Hermes-OMS Crew Ladder
        #LOC_KSPZH_3131 = Ladder for transferring from a Hermes pod to the Hermes-OMS lab.
        #LOC_KSPZH_3095 = LMSS-SSA 0.9375m Structural Adapter
        #LOC_KSPZH_623 = A small plate for adapting a stack from 0.9375m to 0.625m.
        #LOC_KSPZH_3090 = LMSS-OLS 1.5m Orbital Laboratory Segment
        #LOC_KSPZH_220 = A 1.5m station laboratory module.
        #LOC_KSPZH_1293 = BSA-0120-0100 - MOS-SA Small Structural Adapter
        #LOC_KSPZH_455 = A nearly flat 1.5m adapter for MOS and LMSS stations.
        #LOC_KSPZH_1296 = BSA-0150-0120 - MOS-LA Large Structural Adapter
        #LOC_KSPZH_456 = A nearly flat 1.875m adapter for MOS and LMSS stations.
        #LOC_KSPZH_3387 = MOS-AS "Adventure" Airlock Segment
        #LOC_KSPZH_1998 = Dedicated airlock module for MOS stations, useful for allowing crew access to the station as they leave their ships.
        #LOC_KSPZH_3401 = MOS-NL10 "Dorian" Reconnaissance System
        #LOC_KSPZH_5384 = This powerful telescope and camera system was originally designed for use by [REDACTED] before being converted to more peaceful, scientific uses. It can be used to gather data from the surface of planets. As well as spy on Kr-[REDACTED]. Don't listen to anyone trying to convince you that unmanned satellites are cheaper and just as effective. The results from the camera cannot be transmitted. It is recommended to recover the data or better yet, process them in a lab such as the MOS-LS "Mossy".
        #LOC_KSPZH_3392 = MOS-CBS Control Block Segment
        #LOC_KSPZH_5118 = Thin 1.875m control and avionics system. Use for controlling your MOS stations, and Rhea resupply vehicles.
        #LOC_KSPZH_3393 = MOS-DM 1.875m Docking Mechanism
        #LOC_KSPZH_5329 = This large docking module is used to connect MOS segments to each other. It is capable of soft docking to line up the segments, before retracting and solidifying the connection.
        #LOC_KSPZH_3398 = MOS-EFS Equipment Module
        #LOC_KSPZH_2182 = Equipment section for the MOS space station and Leo Ferry. Contains plenty of monopropellant and electricity.
        #LOC_KSPZH_1295 = BSA-0120-0120 - MOS-TA 5 Way Structural Adapter
        #LOC_KSPZH_314 = A five way 1.5m adapter for MOS based stations.
        #LOC_KSPZH_3086 = LMSS-FDM 1.875m Fork Docking Mechanism
        #LOC_KSPZH_5328 = This large docking module is used to connect Leo Modular Space Station segments to each other. It is capable of soft docking to line up the segments before retracting and solidifying the connection. Note that it is designed to dock with the corresponding LMSS-RDM 1.875m Ring Docking Mechanism.
        #LOC_KSPZH_3402 = MOS-NLS "Dorian" Orbital Laboratory Segment
        #LOC_KSPZH_5355 = This mobile laboratory segment was originally designed for use by [REDACTED] before being converted to more peaceful, scientific uses. It can be used to conduct experiments and process data. As well as spy on Kr-[REDACTED].
        #LOC_KSPZH_3100 = LMSS-TRP2 Surface Radiator
        #LOC_KSPZH_486 = A radially attachable radiator panel to help dissipate heat into space.
        #LOC_KSPZH_3403 = MOS-PS-80 Propellant Carrier
        #LOC_KSPZH_371 = A large rack of spherical tanks for storing monopropellant.
        #LOC_KSPZH_3400 = MOS-MCL Communications Dish
        #LOC_KSPZH_2686 = High speed communications system for transmitting large amounts of classified data back down to Kerbin. Adjust the deploy limit to change the final resting angle.
        #LOC_KSPZH_3388 = MOS-CB RCS Control Block
        #LOC_KSPZH_5332 = This large, powerful RCS block is capable of controlling the attitude of entire stations.
        #LOC_KSPZH_3093 = LMSS-RDM 1.875m Ring Docking Mechanism
        #LOC_KSPZH_5327 = This large docking module is used to connect Leo Modular Space Station segments to each other. It is capable of soft docking to line up the segments before retracting and solidifying the connection. Note that it is designed to dock with the corresponding LMSS-FDM 1.875m Fork Docking Mechanism.
        #LOC_KSPZH_3099 = LMSS-TRP1 Surface Radiator
        #LOC_KSPZH_1294 = BSA-0120-0120 - MOS-TA 3 Way Structural Adapter
        #LOC_KSPZH_738 = A three way 1.5m adapter for MOS based stations.
        #LOC_KSPZH_3399 = MOS-GTA Tracking Antenna
        #LOC_KSPZH_2685 = High speed communications system for transmitting large amounts of classified data back down to Kerbin.
        #LOC_KSPZH_3406 = MOS-UCS Unpressurized Cargo Segment
        #LOC_KSPZH_5134 = This 1.875m unpressurized bay is useful for bringing up things such as small station segments, satellites, supplies, and parts ready to be attached to the outside of something.
        #LOC_KSPZH_3085 = LMSS-EX4 Fixed Solar Array
        #LOC_KSPZH_383 = A large, non-tracking solar array for Leo Modular Space Stations.
        #LOC_KSPZH_3211 = Leo-010SM Solar Antenna
        #LOC_KSPZH_4498 = Small deployable solar wings with communications antennas on the tips.
        #LOC_KSPZH_3404 = MOS-PVP-100 Solar Array
        #LOC_KSPZH_375 = A large solar array, for those stations that are hungry for electricity.
        #LOC_KSPZH_3405 = MOS-PVP-2 Solar Array
        #LOC_KSPZH_3448 = Medium sized tracking solar panels. Primitive, but capable of generating more power than anything else with our current technology. Hopefully we'll come up with something better soon.
        #LOC_KSPZH_3395 = MOS-DOTD-F2 Fixed Solar Array
        #LOC_KSPZH_3174 = Large, heavy solar panels imported from the far East. Primitive, but capable of generating more power than anything else with our current technology. Hopefully we'll come up with something better soon.
        #LOC_KSPZH_3397 = MOS-DOTD-R2 Tracking Solar Array
        #LOC_KSPZH_3394 = MOS-DOTD-F1 Fixed Solar Array
        #LOC_KSPZH_3396 = MOS-DOTD-R1 Tracking Solar Array
        #LOC_KSPZH_3173 = Large, heavy solar panels important from the far East. Primitive, but capable of generating more power than anything else with our current technology. Hopefully we'll come up with something better soon.
        #LOC_KSPZH_3365 = MIP-KRA Whip Antenna
        #LOC_KSPZH_667 = A small, fixed whip antenna for the MIP probe series.
        #LOC_KSPZH_3362 = MIP-ACC Probe Core
        #LOC_KSPZH_3713 = Originally developed for a long-forgotten lunar probe program, the MIP is a capable, if boring, probe core. Includes a small battery and cold gas nitrogen tank.
        #LOC_KSPZH_3364 = MIP-FMP Folding Magnetometer Boom
        #LOC_KSPZH_5288 = This instrument is used for measuring a planet's magnetic field. It breaks magnetometer convention by folding up instead of telescoping. It's harder to fit within a fairing, but is lighter. Sufficiently crafty pilots can use it to right a lander that has tipped over, though this is not recommended.
        #LOC_KSPZH_3363 = MIP-ESP RCS Solar Panel
        #LOC_KSPZH_5423 = This small solar panel is spring loaded to extend on command. It is capable of rotating to track the sun, and some non-tracking RCS jets are also included.
        #LOC_KSPZH_3367 = MIP-SSD 0.125m Decoupler
        #LOC_KSPZH_681 = A small, very low profile 0.125m stack decoupler for tiny probes.
        #LOC_KSPZH_4611 = Staara-13-A "Retras" Solid Rocket Motor
        #LOC_KSPZH_4621 = Staara-series solid rocket motor, model 13-A. Vacuum optimized nozzle, simpler and more reliable than liquid boosters. Includes 0.3125m mounting hardware. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and manuevers.
        #LOC_KSPZH_3366 = MIP-RMS Extending Rubidium Magnetometer
        #LOC_KSPZH_5246 = This fascinating instrument uses rubidium vapour to measure the magnetic fields as the spacecraft passes through them. Make sure you leave enough room for it to extend - close proximity to the spacecraft will scramble the instrument's sensors.
        #LOC_KSPZH_2549 = HLR-SSQ-R Mini Solar Panel
        #LOC_KSPZH_675 = A small, non-tracking photovoltaic panel mounted to a 90 degree hinge.
        #LOC_KSPZH_2548 = HLR-SSQ Mini Solar Panel
        #LOC_KSPZH_678 = A small, static photovoltaic panel for things that need a small amount of electricity.
        #LOC_KSPZH_774 = ALTTE-TMA Sounding Antenna
        #LOC_KSPZH_491 = A relatively long extending sounding antenna for the Skylark satellite series.
        #LOC_KSPZH_773 = ALTTE-D2 "Skylark" Research Satellite
        #LOC_KSPZH_3893 = Primitive, spin stabilized bus designed to serve as an ionospheric exploration probe.
        #LOC_KSPZH_1401 = Bion-MPB Adapter Section
        #LOC_KSPZH_5156 = This adapter contains instruments to monitor the effects of space travel on simple life forms. Offers superior quality of scientific data compared to the OTLTH-E but the experiment must be recovered. Mount a Spyglass return capsule to the top to return the science and little critters safely back to Kerbin.
        #LOC_KSPZH_1402 = Bion-QRZ Telemetry Antenna
        #LOC_KSPZH_599 = A small extending telemetry antenna for the Bion satellite series.
        #LOC_KSPZH_1400 = Bion-MFD Magnetometer Attitude Control Boom
        #LOC_KSPZH_5008 = The attitude control scheme of the Bion satellites used a magnetometer to help orient it relative to the planet. That doesn't prevent it from also recording and returning the data it collects...
        #LOC_KSPZH_4793 = Tangerine-SDI23 "Citron" Satellite Bus
        #LOC_KSPZH_4799 = Tangerine-SDI23-489-N "Juicer" Bipropellant Space Engine
        #LOC_KSPZH_1488 = Breakthroughs in engineering have allowed engineers to create a compact, highly efficient bipropellant engine intended for satellite propulsion that runs on liquid fuel. This engine is intended for getting satellites in orbit around other celestial bodies, but it can be used for a wide range of applications.
        #LOC_KSPZH_4801 = Tangerine-SDI23-CRA High Gain Antenna
        #LOC_KSPZH_730 = A suprisingly simple and robust antenna designed for the Tangerine-SDI23 satellite. Can support near-Kerbin and inner solar system type missions. Designed specifically for Munar and asteroid flyby operations.
        #LOC_KSPZH_4794 = Tangerine-SDI23 "ISA" Adapter
        #LOC_KSPZH_2175 = Engineers realized that a discarded kick stage could be more than just a simple discarded kick stage; it could also be a secondary satellite! Designed for the Tangerine-SDI23 Satellite kick stage, ISA is intended to be fixed to a Staara-37 solid motor. ISA is its own probe core and includes its own solar panels. ISA is a platform for an integrated radiation monitoring experiment and a micrometeorite/debris impact detector experiment. Includes a decoupler for the top of ISA (designed to separate the primary payload from ISA). However, ISA does not include SAS control (as ISA is spin stabilized) or an internal antenna (the ISA whip antennas are separate parts).
        #LOC_KSPZH_4795 = Tangerine-SDI23 "ISA" Whip Antenna
        #LOC_KSPZH_669 = A small, fixed whip antenna for the SDI-23 "ISA" satellite.
        #LOC_KSPZH_4797 = Tangerine-SDI23 Lower RCS
        #LOC_KSPZH_679 = A small, three-way RCS intended for the aft section of the Tangerine-SDI23 satellite.
        #LOC_KSPZH_4800 = Tangerine-SDI23-AIO Imaging Sensor Platform
        #LOC_KSPZH_5028 = The cream of the crop in imaging technology. This cutting-edge science platform was designed to test the latest imaging systems in long-term space operations with classified shady government techology. The result is one of the most advanced mapping cameras to date. This sensor platform captures images in visible, near infrared, long wave infrared, and ultraviolet light as well as acquiring altitude terrain data with a LIDAR system, all in a small package. However, the compactness of the instrument limits some of the infrared and ultraviolet imaging capabilities slightly. Designed to be used with the Tangerine-SDI23 satellite.
        #LOC_KSPZH_4796 = Tangerine-SDI23 "Swiss" Tracking Solar Panel
        #LOC_KSPZH_5253 = This fold-out, tracking solar panel was originally designed for the Tangerine-SDI23 satellite. The hole in the center of the panel is for the satellite's low gain antennas to poke out of. Includes a variant to have it folded straight so it can be used in more applications.
        #LOC_KSPZH_4802 = Tangerine-SDI23-SSA "Compass" Star Tracker
        #LOC_KSPZH_287 = A cutting edge assembly composed of two star trackers and an advanced computer system designed to help increase the pointing accuracy of the Tangerine-SDI23 spacecraft to aid mapping operations.
        #LOC_KSPZH_4798 = Tangerine-SDI23 Upper RCS
        #LOC_KSPZH_680 = A small, three-way RCS intended for the forward section of the Tangerine-SDI23 satellite.
        #LOC_KSPZH_1743 = CRR-1B "Messenger" Communications Satellite
        #LOC_KSPZH_3889 = Primitive, spin stabilized bus designed to be used as an early communications satellite. Includes deployable antennas and a large surface area of solar cells.
        #LOC_KSPZH_2907 = JPR1-62BU1 Biconical Horn Antenna
        #LOC_KSPZH_2906 = JPR1-2677 "Repeater" Communications Satellite
        #LOC_KSPZH_3891 = Primitive, spin stabilized bus designed to be used as an early communications satellite. The whip antennas on the bottom are for telemetry - attach an antenna to the top for use as a relay.
        #LOC_KSPZH_4751 = TAT-PHON-F21 Helical Antenna
        #LOC_KSPZH_4752 = TAT-PHON1 "Kompfner" Communications Satellite
        #LOC_KSPZH_3890 = Primitive, spin stabilized bus designed to be used as an early communications satellite. The central ring is filled with two arrays of horn antennas, and a helical antenna can be placed on top to enhance reception.
        #LOC_KSPZH_1282 = BE-SLR227 "Lighthouse" Laser Reflector
        #LOC_KSPZH_660 = A small, but cutting edge laser reflector designed to take geodetic measurements. Also includes a forward electrostatic probe to take ionospheric measurements. This experiment is designed to be used with the TNSS-5 "Statum" satellite bus to give it use as a scientific satellite.
        #LOC_KSPZH_4612 = Staara-17 "Longinus" Solid Rocket Motor
        #LOC_KSPZH_4622 = Staara-series solid rocket motor, model 17. Vacuum optimized nozzle, simpler and more reliable than liquid boosters. Includes 0.3125m mounting hardware. Can be upgraded to model 17-A, which features minor impovements to thrust and ISP, as well as an increased amount of solid propellant. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_4014 = REI-ESDA Electric Field Dipole Antenna
        #LOC_KSPZH_302 = A dipole antenna designed for the REI spacecraft specifically configured to take measurements of the local electric field.
        #LOC_KSPZH_4018 = REI-S17 Solid Rocket Motor Decoupler
        #LOC_KSPZH_563 = A small 0.3125m decoupler designed specifically for separating the Staara-17 solid rocket motor from the REI "Helix" Probe Core.
        #LOC_KSPZH_4011 = REI "Helix" Probe Core
        #LOC_KSPZH_5315 = This is the core of REI (Radio Exploratory Investigator), a satellite designed to conduct radio astronomy observations. This core might be small, but it's actually quite capable (and somewhat heavy) for its size. Includes a small magnetic stabilization system, SAS capabilities, and electric charge. While orginally intended to be a Kerbin-orbiting satellite, this satellite can be upgraded to hold a small amount of monopropellant to make it capable of Munar operations.
        #LOC_KSPZH_4017 = REI-RBR1500 Radio Astronomy V-Antenna
        #LOC_KSPZH_980 = An ultra-long antenna designed for radio astronomy signal collection for the REI spacecraft. The antenna is tightly wound into a coil which is deployed by a motor driven system. This antenna includes a variant for surface attachment as well as a variant for mount attachment.
        #LOC_KSPZH_4012 = REI-ACS2 RCS Boom
        #LOC_KSPZH_921 = An RCS block mounted on a small boom, for added leverage and thus higher fuel efficiency. Intended to give additional attitude control to the REI-B satellite so it would be able to conduct missions in Munar orbit.
        #LOC_KSPZH_4009 = REI "Ginkgo" Double-Sided Solar Paddle
        #LOC_KSPZH_978 = An tiny and strange double-sided oddly shaped solar paddle. Originally intended for the REI line of satellites, this fan-shaped solar is curved so that it can wrap around the cylindrical REI "Helix" Probe Core while keeping a small radial profile. While the solar panel is intended to be used in sets of four, angled at 28.5° for maximum solar coverage regardless of the direction the spacecraft is facing, this solar panel comes with a straight variant as well. Used on the Explorer 38 and 49.
        #LOC_KSPZH_4013 = REI-CDTSA Telemetry Antenna
        #LOC_KSPZH_666 = A small, fixed telemetry antenna for the REI probe series. Includes two length variants.
        #LOC_KSPZH_4010 = REI "Ginkgo" Tracking Solar Paddle
        #LOC_KSPZH_965 = An extremely peculiar and small double sided solar panel. Folds up for storage in fairings, but doesn't track the sun. This solar panel comes in a variety of sizes depending on electrical needs. Folds out at a 45 degree angle and includes a dipole telemetry antenna for maintaining ground communication.
        #LOC_KSPZH_4015 = REI-MCS Velocity Correction Propulsion System
        #LOC_KSPZH_5607 = Upon discovering that radio noise from Kerbin can interfere with radio astronomy observations, engineers set out to find a way to enable the REI-B satellite to preform its radio astronomy observations from Munar orbit. This small 0.3125m package contains two tiny monopropellant-fueled engines and four monopropellant tanks. This system can be used to help correct and refine the orbit of the REI spacecraft after Munar insertion. While it was originally designed for REI, it can be used for any number of applications.
        #LOC_KSPZH_4016 = REI-MCS-DU Decoupler
        #LOC_KSPZH_562 = A small 0.3125m decoupler designed specifically for separating the REI-MCS Velocity Correction Propulsion System from the REI-B spacecraft after a desirable Munar orbit is achieved. Decouples from the upper node.
        #LOC_KSPZH_4554 = Sonne-MBM-AA Structural Adapter
        #LOC_KSPZH_2861 = Integral structural adapter for the bottom of the Sonne probe. It decouples on the bottom, to separate from the solid kick motor (typically a Staara-37). Several experiments, as well as the low gain antenna, should be mounted to it.
        #LOC_KSPZH_4555 = Sonne-MBM-HEOS Probe Core
        #LOC_KSPZH_21 = 0.9375m probe core for the Sonne spacecraft, created as a joint project between BDB and our teutonic partners. Place a sun shade above and below (flip the lower shade over) to form an hourglass shape, and then attach the experiment arms and RPWS antennas. Includes an integrated cosmic ray detector. Micrometeoroid detector is included, but requires the separate Sonne experiment to be run.
        #LOC_KSPZH_4557 = Sonne-MBM-LGCA Communications Array
        #LOC_KSPZH_269 = A combined medium and high gain antenna for the Sonne spacecraft, created as a joint project between BDB and our Teutonic partners. Place above the top sun shade.
        #LOC_KSPZH_4556 = Sonne-MBM-LGA Low Gain Antenna
        #LOC_KSPZH_3345 = Low gain horn antenna for the Sonne probe. Mounts on the lower adapter, on the opposite side to the MM detector.
        #LOC_KSPZH_4559 = Sonne-MBM-MEB Magnetometer Boom
        #LOC_KSPZH_1940 = DMagic and Bluedog Design Bureau
        #LOC_KSPZH_3155 = Large magnetometer on an extending arm for the Sonne spacecraft, created as a joint project between BDB and our teutonic partners. Place one on each side of the HEOS probe core on the mounting plates provided. Includes two different variants of magnetometer, use one of each.
        #LOC_KSPZH_4560 = Sonne-MBM-MMS Micrometeoroid Detector
        #LOC_KSPZH_818 = Advanced micrometeoroid detector with a built in mass spectrometer. Detects impacts and the composition of interplanetary dust. Mounts on the lower adapter of the Sonne probe, on the opposite side to the matching grate on the probe core.
        #LOC_KSPZH_4562 = Sonne-MBM-ZPS Photometer
        #LOC_KSPZH_5756 = Zodiacal light Photometer, designed to measure light reflected by interplanetary dust. Mounts on the lower adapter of the Sonne probe, in 3x symmetry.
        #LOC_KSPZH_4558 = Sonne-MBM-LRWA RPWS Antenna
        #LOC_KSPZH_4027 = RPWS whip antenna for the Sonne spacecraft, created as a joint project between BDB and our teutonic partners. Place one on each side of the HEOS probe core on the mounting plates provided. Do note that while it technically works with only one antenna, using at least two would theoretically provide much better data.
        #LOC_KSPZH_4561 = Sonne-MBM-SER Sun Shade
        #LOC_KSPZH_3171 = Large, conical 0.9375m to 1.5m adapter for the Sonne spacecraft, created as a joint project between BDB and our teutonic partners. Place above and below the HEOS probe core (flip the bottom one over to make an hourglass shape). Attach the dish on top and a Staara-37FNV underneath. Contains a mix of solar cells and reflective surfaces to reject heat while providing sufficient electrical power.
        #LOC_KSPZH_2508 = HGHS-301 "Satkom" Communications Satellite
        #LOC_KSPZH_561 = A small (but capable) cylindrical, spin-stabilized communications satellite. Comes with space for an apogee motor and is equipped with thrusters and a small supply of monopropellant.
        #LOC_KSPZH_964 = An extremely large array of a variety of antennas optimized for Keostationary orbit communications. This array features five high-gain helical UHF antennas, two low-gain X-band horn antennas, and a single biconical antenna for telemetry and control. This antenna can fold up to fit in a 1.875m fairing. Designed for the HGHS-318 "Botte" satellite bus. Features Kerbin-tracking capabilities.
        #LOC_KSPZH_2509 = HGHS-318 "Botte" Satellite Bus
        #LOC_KSPZH_758 = A very large, barrel-shaped satellite bus. Sized at 1.75m, this satellite bus is the perfect size for 1.875m fairings/launch vehicles. Equipped with thrusters, batteries, and a modest supply of monopropellant. Includes a 0.3125m upper node for payload attachment, and while not designed for apogee motors, this satellite includes space for apogee motors up to 0.9375m in diameter on the bottom of the spacecraft.
        #LOC_KSPZH_3376 = MOCA Relay Satellite
        #LOC_KSPZH_3888 = Primitive, simple probe core with built in antennas. Useful as an early communications satellite, or perhaps a relay sat dropped from a larger probe bus. Their small size allows for an entire constellation to be deployed in a single launch and a dedicated multi decoupler system is available for this purpose.
        #LOC_KSPZH_2532 = HLR-PCS Attitude Control Thruster
        #LOC_KSPZH_356 = A highly efficient electrical xenon RCS thruster. Includes variants with one, two, or three thrusters.
        #LOC_KSPZH_2555 = HLR-ZECR6 "Tempel" Ion Engine
        #LOC_KSPZH_3990 = Prototype xenon-powered engine for highly efficient interplanetary travel. Keep in mind that this prototype is more expensive and likely not as efficient as our upcoming models.
        #LOC_KSPZH_2556 = HLR-mNGS Xenon Tank
        #LOC_KSPZH_422 = A medium sized xenon tank for a 0.625m stack.
        #LOC_KSPZH_2513 = HLR-1rNGS Xenon Tank
        #LOC_KSPZH_628 = A small radially attached bottle of xenon gas. Useful for probes that need ion RCS, probably not enough for serious course adjustments.
        #LOC_KSPZH_2557 = HLR-sNGS Xenon Tank Assembly
        #LOC_KSPZH_637 = A small sized xenon tank for a 0.625m stack.
        #LOC_KSPZH_2517 = HLR-3rNGS Xenon Tank Assembly
        #LOC_KSPZH_5489 = Three small radially attached bottle of xenon gas. Useful for probes that need ion RCS, probably not enough for serious course adjustments.
        #LOC_KSPZH_2519 = HLR-JD03 0.125m Decoupler
        #LOC_KSPZH_4484 = Small 0.125m decoupler for tiny tiny probes.
        #LOC_KSPZH_3788 = Pathfinder-11 "Kraushaar" Satellite
        #LOC_KSPZH_2140 = Early orbital satellite, contains instruments for exploring the gamma ray environment of space.
        #LOC_KSPZH_3789 = Pathfinder-7 "Suomi" Satellite
        #LOC_KSPZH_2144 = Early orbital satellite, contains instruments for measuring the flux of solar energy absorbed by the planet.
        #LOC_KSPZH_3790 = Pathfinder-8 "Jacchia" Satellite
        #LOC_KSPZH_2143 = Early orbital satellite, contains instruments for measuring electrical environment of space.
        #LOC_KSPZH_3792 = Pathfinder-S45 "Seddon" Satellite
        #LOC_KSPZH_2142 = Early orbital satellite, contains instruments for investigating the shape of the ionosphere.
        #LOC_KSPZH_3793 = Pathfinder-S46 "Sui" Satellite
        #LOC_KSPZH_2141 = Early orbital satellite, contains instruments for further radiation experiments following the discoveries by Pathfinder-1.
        #LOC_KSPZH_3786 = Pathfinder Crossed Dipole Antenna
        #LOC_KSPZH_463 = A pair of dipole antennas, crossed and bent to help fit inside payload fairings.
        #LOC_KSPZH_3802 = Pilgrim-P1 "Ramo" Probe Core
        #LOC_KSPZH_5127 = This 0.3125m probe core integrates an omni antenna and geiger counter for measuring radation. Designed to be flung hopefully at the Mun, it has an integrated retro motor to help capture it into orbit. Without any onboard power generation it is strongly suggested to hibernate the probe between maneuvers to reduce power consumption. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_3808 = Pilgrim-P4 "Amba" Probe Core
        #LOC_KSPZH_5126 = This 0.3125m probe core integrates an omni antenna and a low fidelity film camera. Although designed for a Munar flyby, it does not have onboard power generation. It is strongly recommended to hibernate the probe between maneuvers to reduce power consumption.
        #LOC_KSPZH_3803 = Pilgrim-P1-008 "Wally" Solid Rocket Booster
        #LOC_KSPZH_4376 = Set of 8 extremely small rocket boosters on a 0.125m mount. Only really useful for putting distance between a probe and it's mother craft. The motors may or may not have been stolen from a model rocket kit belonging to a BDB engineer's offspring. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, and since it's a cluster of engines, restarted again, allowing for more accurate orbital insertions and maneuvers. Not that you'll have much time to activate it.
        #LOC_KSPZH_1417 = Boruki-K2 "Johannes" Probe Core
        #LOC_KSPZH_1418 = Boruki-K2-EEB Electronics Box
        #LOC_KSPZH_2487 = Greeble anything you want with this rad box'o'science! Is capable of storing experiment data and results.
        #LOC_KSPZH_1419 = Boruki-K2-FCA High Gain Antenna
        #LOC_KSPZH_1425 = Boruki-K2-LGOA Omni Antenna
        #LOC_KSPZH_1420 = Boruki-K2-FPR Radiator Panel
        #LOC_KSPZH_483 = A radially attachable curved radiator panel designed to help dissipate heat into space.
        #LOC_KSPZH_1421 = Boruki-K2-HDNT-4 Attitude Control Thruster
        #LOC_KSPZH_1427 = Boruki-K2-RWA-2 Double Reaction Wheel Assembly
        #LOC_KSPZH_1426 = Boruki-K2-RWA-1 Reaction Wheel
        #LOC_KSPZH_3690 = One half of the Boruki reaction wheel assembly, for when you just need a little push in the right direction.
        #LOC_KSPZH_1422 = Boruki-K2-KPLR37 "Charbonneau" Advanced Exoplanet Transitory Observation Telescope
        #LOC_KSPZH_4544 = Solar panel assembly developed for the Boruki space telescope. Attached to the probe core. Has an optional foil shroud that conforms to the main telescope part.
        #LOC_KSPZH_1423 = Boruki-K2-KPLR37 Telescope CCD Photometer Electronics
        #LOC_KSPZH_1424 = Boruki-K2-KST2 Advanced Star Tracker
        #LOC_KSPZH_2954 = KMAC-23-5 "Klaw" 0.625m Grapple Unit
        #LOC_KSPZH_2172 = Engineers at Bluedog Design Bureau found some old blueprints for some kind of over-engineered grabbing device in the dumpster behind a competitor. These documents were studied and revised, and then subsequently thrown in the dumpster again. Later an intern found the discarded designs and they were finally adapted to make a sleek 0.625m grapple unit that can be used for all sorts of applications. While originally solely created for asteroid rendezvous missions, this grapple unit can be modified for missions that have non-asteroid targets.
        #LOC_KSPZH_1814 = Codac-A23 Omni Antenna
        #LOC_KSPZH_3725 = Our engineers said we needed another omni antenna. Our accountants said why. Our engineers said they needed one that folded sideways. Our accountants said ok.
        #LOC_KSPZH_1816 = Codac-LO-2180 "Eastkan" Film Camera
        #LOC_KSPZH_2293 = Film cameras are limited in that the film must be returned to Kerbin in order to be developed. In order to get a better idea of what lies further out in space, we have developed this advanced film camera in conjunction with our partner Codac. After exposing the film, it is developed automatically and then transmitted in strips using a primitive photoscanner. A significant amount of detail is lost in this process, so the images aren't as valuable as actually returning the film. The film is stored after development, and can be still be examined if it happens to be returned. Interestingly this camera also features a Geiger counter built into the housing to measure radiation.
        #LOC_KSPZH_1821 = Codac-PCT "Kreuznach" Probe Core
        #LOC_KSPZH_753 = A unique probe core design, the avionics and control systems are built around a truss structure. The inside of the truss is left open for experiments like cameras. The outer ring can be be fitted with folding solar panels and communications equipment. Typically launched upside down inside a Belle upper stage. The control direction can be reversed to assist with this and can also be changed back in flight.
        #LOC_KSPZH_1815 = Codac-A66 Communications Dish
        #LOC_KSPZH_4522 = Small, retractable communications dish to provide high gain transmission of scientific information.
        #LOC_KSPZH_1820 = Codac-PAD4R "Marquardt" Orbital Propulsion System
        #LOC_KSPZH_676 = A small, roughly 0.625m monopropellant powered engine. Contains integrated 4-way RCS for two axis control, and four small bottles of monopropellant.
        #LOC_KSPZH_1817 = Codac-MOPP20-S Solar Panel
        #LOC_KSPZH_918 = Alternate version of the Codac Solar panel which can fold along the spacecraft sides. Doesn't track the sun.
        #LOC_KSPZH_1818 = Codac-MOPP20-T Solar Panel
        #LOC_KSPZH_5554 = Tracking version of the Codac Solar panel.
        #LOC_KSPZH_1819 = Codac-MOPP20-U Solar Panel
        #LOC_KSPZH_1406 = Blocky, cheap solar panel with a simple unfold mechanism. Designed to fold underneath the Codac probe. Doesn't track the sun.
        #LOC_KSPZH_1116 = Argo-MRNR-340 "Argo Navis-1" Star Tracker
        #LOC_KSPZH_460 = A newly designed instrument that is the first of its type, this special sensor is designed to use the star Kanopus as a navigational reference object to help a satellite determine its attitude. Enables an intermediate level of SAS control to the Argo-MRNR "Otto" probe core.
        #LOC_KSPZH_1120 = Argo-MRNR-340 Solar Panel
        #LOC_KSPZH_3515 = Minor advancements in solar panel technology learned from the Burke program has allowed for a more lightweight, efficient solar panel. Includes a solar pressure vane on the end of the panel to aid stabilization as well as built-in RCS thrusters.
        #LOC_KSPZH_1121 = Argo-MRNR-340-PIXL TV Camera Scan Platform
        #LOC_KSPZH_3726 = Our engineers were able to design a robust and reliable vidicon TV camera system to take photographs on film, electronically scan it, and send it back to Kerbin. The pictures are broken up into many discrete pieces of data that are each assigned a value pertaining to a grayscale color. One of our engineers referred to these pieces of color data that make up the image as 'pixels'. However, some detail and quality in the pictures is lost when using this transmission system. The vidicon TV camera is mounted on a scan platform that is capable of tracking the body it orbits. Also includes a intertial and temperature simulator experiment.
        #LOC_KSPZH_1143 = Argo-MRNR340-PIXL-UV TV Camera and UV Photometer Scan Platform
        #LOC_KSPZH_748 = A tracking TV Camera and UV Photometer scan platform. Orginally supposed to fly on an Argo satellite, electrical problems associated with the UV Photometer were discovered causing it to be removed and swapped for a temperature experiment. This unflown version of the scan platform features the UV Photometer that was originally intended to be used on the platform.
        #LOC_KSPZH_1128 = Argo-MRNR-500 "Argo Navis-2" Star Tracker
        #LOC_KSPZH_552 = A slightly more refined version of the Argo-MRNR-340 "Argo Navis-1" Star Tracker that has a slightly reduced mass. Uses the star Kanopus as a navigational reference object to help a satellite determine its attitude. Enables an intermediate level of SAS control to the Argo-MRNR "Otto" probe core.
        #LOC_KSPZH_1129 = Argo-MRNR-500 "Spoon" Solar Panel
        #LOC_KSPZH_5666 = We asked our engineers to build a spacecraft on short notice, so they took spare parts from the Argo-MRNR-340 Solar Panel to assemble this solar panel. Includes a temperature reference experiment at the end of the solar panel along with built-in RCS thrusters.
        #LOC_KSPZH_1130 = Argo-MRNR-500 Solar Panel - Antenna
        #LOC_KSPZH_5665 = We asked our engineers to build a spacecraft on short notice, so they took spare parts from the Argo-MRNR-340 Solar Panel to assemble this solar panel. Includes a dual-frequency reciever antenna at the end of the solar panel along with built-in RCS thrusters.
        #LOC_KSPZH_1131 = Argo-MRNR-500 Sun Shield
        #LOC_KSPZH_659 = A small, basic deployable sunshield for the Argo 5 probe. Protects the satellite from solar radiation while exploring the inner planets.
        #LOC_KSPZH_1135 = Argo-MRNR-700 High Gain Antenna
        #LOC_KSPZH_4839 = The Argo 700-series high gain antenna.
        #LOC_KSPZH_1136 = Argo-MRNR-700 Low Gain Omni Antenna
        #LOC_KSPZH_532 = A simple reliable omnidirectional low gain antenna for the Argo 700-series probes. Attaches to the toggleable LGA node on the probe core.
        #LOC_KSPZH_1137 = Argo-MRNR-700 Scanning Platform
        #LOC_KSPZH_4335 = Scan platform for the Argo-700 probe.
        #LOC_KSPZH_1134 = Argo-MRNR-700 "Paddle" Solar Panel
        #LOC_KSPZH_5604 = Upgraded Argo-series solar panel,for Argo 6/7. This one includes the standard 4-way RCS block on the end.
        #LOC_KSPZH_1141 = Argo-MRNR-900 High Gain Antenna
        #LOC_KSPZH_298 = A derivative of the Argo 700-series high gain antenna, this dish includes unique mounting hardware to attach it directly to the 900-series' oversized propulsion module. Make sure the louver part below it is set to the correct variant, so that it connects to the lower mounting point.
        #LOC_KSPZH_1142 = Argo-MRNR-900 Low Gain Omni Antenna
        #LOC_KSPZH_533 = A simple reliable omnidirectional low gain antenna for the Argo 900-series probes. Attaches to the back side of the propulsion module.
        #LOC_KSPZH_1138 = Argo-MRNR-900 "Flour Sack" Propulsion Module
        #LOC_KSPZH_859 = After a number of fly-by missions, our engineers had an epiphany: what if we attempted to orbit another planet? That would provide us with far more scientific opportunities than a single high-speed pass. With this thought in the back of their minds, our team developed the biggest innovation in the history of our robotics program - bigger fuel tanks, and an engine to use them. Includes mounting points for the low and high gain antennas. The star tracker gets tucked in under the side.
        #LOC_KSPZH_1140 = Argo-MRNR-900 "Scoop" Solar Antenna
        #LOC_KSPZH_5682 = When our engineers started work on the 900-series Argo probes, they realized that the large propulsion module mounted on top would prevent mounting the panels in the by-then traditional way. This led to the 900-series' second great innovation: mounting the solar panels on stand-offs. This one includes a conical medium gain antenna, along with the standard 4-way RCS block on the end.
        #LOC_KSPZH_1139 = Argo-MRNR-900 "Oar" Solar Panel
        #LOC_KSPZH_5683 = When our engineers started work on the 900-series Argo probes, they realized that the large propulsion module mounted on top would prevent mounting the panels in the by-then traditional way. This led to the 900-series' second great innovation: mounting the solar panels on stand-offs. This one includes the standard 4-way RCS block on the end.
        #LOC_KSPZH_1133 = Argo-MRNR-700 "Argo Navis-32" Star Tracker
        #LOC_KSPZH_553 = A slightly more refined version of the Argo-MRNR-500 "Argo Navis-2" Star Tracker that has a slightly reduced mass. Uses the star Kanopus as a navigational reference object to help a satellite determine its attitude. Enables an advanced level of SAS control to the Argo-MRNR "Otto" probe core.
        #LOC_KSPZH_1114 = Argo-MRNR "Otto" Probe Core
        #LOC_KSPZH_1117 = Argo-MRNR-340 Cosmic Dust Detector
        #LOC_KSPZH_3727 = Our scientists think space might not be as empty as we once thought. Developed based on the experience learned from the Argo 2 cosmic dust experiment. This device contains plates for measuring the impacts of 'micrometeoroids', the little pieces of debris and particles that travel through open vacuum at thousands of meters per second. Measuring the number of impacts gives us an idea of how dangerous an area of space may be for our ships.
        #LOC_KSPZH_1118 = Argo-MRNR-340 Cosmic Ray Detector
        #LOC_KSPZH_5279 = This instrument holds a compact sensor that is capable of measuring the impact direction and energy spectrum of the alpha particles and protons it comes into contact with.
        #LOC_KSPZH_1124 = Argo-MRNR-345 "Pagasa" Payload Separation Mechanism
        #LOC_KSPZH_207 = A 0.9375m payload separation mechanism specifically designed for early Argo satellites. Includes a small amount of clearance for aft-mounted experiments or solar shades.
        #LOC_KSPZH_1123 = Argo-MRNR-345 "Nereid-1" Elliptical High-Gain Antenna
        #LOC_KSPZH_4066 = Recent advancements in communications technology have allowed engineers to design this robust and effective uniquely shaped elliptical high-gain dish antenna intended for early Argo satellite planetary exploration missions. Its aluminum honeycomb structure allows for it to be lightweight, and the fact its fixed instead of tracking or deployable increases its relability and decreases its cost. The antenna was given an elliptical shape to make up for its inability to track and allows it to have a broader pointing range along the direction of Kerbin's orbital motion. Comes with multiple mounting configurations.
        #LOC_KSPZH_1122 = Argo-MRNR-345 "Dodona-1M" Mast Low-Gain Antenna Helium-Vector Magnetometer
        #LOC_KSPZH_4428 = Simple, lightweight mast antenna for early Argo satellites that carries a small helium-vector magnetometer. Includes multiple mounting configurations and a toggleable node for the Argo 4 Ionization Chamber experiment.
        #LOC_KSPZH_1119 = Argo-MRNR-340 Ionization Chamber and Geiger Counter
        #LOC_KSPZH_611 = A small ionization chamber experiment for the Argo 4 spacecraft based off of Burke hardware that also includes a rudimentary geiger counter. Designed to measure the charged particle and radiation environment around a spacecraft. Desgined to be surface mounted or mounted to the Argo-MRNR-345 "Dodona-1M" Mast.
        #LOC_KSPZH_1115 = Argo-MRNR Thermal Control Louver
        #LOC_KSPZH_755 = A versatile thermal control louver designed to help regulate the temperature of the Argo satellite series. Cheap and easy to produce, but reliable and effective.
        #LOC_KSPZH_1127 = Argo-MRNR-357 "Argus" Midcourse Correction Engine
        #LOC_KSPZH_1125 = Argo-MRNR-345 Solar Plasma Probe
        #LOC_KSPZH_5283 = This instrument is designed to detect solar wind particles and determine their flow and intensity. Includes a toggleable cover.
        #LOC_KSPZH_1126 = Argo-MRNR-345 Trapped Radiation Detector
        #LOC_KSPZH_5414 = This small but advanced instrument is designed to analyze and measure trapped electrons and ions and map planetary radiation belts.
        #LOC_KSPZH_1132 = Argo-MRNR-500-UPM Ultraviolet Photometer
        #LOC_KSPZH_3717 = Originally intended to fly on the Argo 4 spacecraft, this instrument was removed due to electrical problems and repurposed to fly on the Argo 5 spacecraft. This instrument measures ultraviolet light emissions and reflections to determine the chemical compositions and other properties of observed bodies.
        #LOC_KSPZH_5655 = WLE-5000 "Duovid" Television Camera System
        #LOC_KSPZH_5160 = This advanced camera system for designed for Argo 10 includes a set of stereoscopic high quality television cameras and a basic airglow ultraviolet spectrometer.
        #LOC_KSPZH_5654 = WLE-5000 "Duovid" Standalone Television Camera System
        #LOC_KSPZH_5161 = This advanced camera system for designed for Argo-10 spacecraft includes a set of stereoscopic high quality television cameras and a basic airglow ultraviolet spectrometer. Available with both compact quadpod and mast mounting options.
        #LOC_KSPZH_1096 = Argo-10-EPE98 Charged Particles Telescope
        #LOC_KSPZH_5241 = This experiment is designed to measure energetic electrons, protons, and alpha particles in the interplanetary medium and in the vicinity of planets in low orbit.
        #LOC_KSPZH_1144 = Argo-WSA-2 Payload Separation Mechanism
        #LOC_KSPZH_208 = A 0.9375m payload separation mechanism specifically designed for the Argo program, able to provide room for aft scientific payloads, folding sunshield mechanisms, and more.
        #LOC_KSPZH_1098 = Argo-10-MPS990 "Horton" Midcourse Correction Engine
        #LOC_KSPZH_618 = A small monopropellant powered engine with an internal fuel supply. Although designated a midcourse correction engine, it has a generous store of monopropellant to allow for several burns on a multiplanetary flyby mission. Designed to be mounted up halfway inside the spacecraft bus. Attitude control is accomplished through jet vanes mounted inside the nozzle. An extra hidden bottom attach node is located within the engine to allow the decoupler to attach to it.
        #LOC_KSPZH_5661 = Wayfarer-10-HGRD-22 High Gain Relay Dish
        #LOC_KSPZH_3877 = Powerful relay antenna for the Wayfarer 10 probe with built in attitude control jets and homeworld tracking. The attitude control jets are set to the pitch axis only by default. Features both an angled version for Wayfarer 10 and a straighter version for easier radial attachment for other uses.
        #LOC_KSPZH_1093 = Argo-10-ALA22 Omni Antenna
        #LOC_KSPZH_531 = A simple reliable omnidirectional low gain antenna for the Argo 10 probe.
        #LOC_KSPZH_1095 = Argo-10-DTFM Folding Magnetometer Boom
        #LOC_KSPZH_1100 = Argo-10-SEAEC/TCIR Electrostatic Science & IR Radiometer
        #LOC_KSPZH_5263 = This high end experiment package contains three instruments. An Ionization and Electrostatic Analysis experiment designed to study the plasma regime around planets, a broadband infrared radiometer, and an experiment to study solar wind.
        #LOC_KSPZH_1099 = Argo-10-OPB "Amru" Probe Core
        #LOC_KSPZH_1101 = Argo-10-SPL Structural Science Palette
        #LOC_KSPZH_3285 = Lightweight sidemount truss for mounting instruments and other necessities.
        #LOC_KSPZH_1092 = Argo-10-ACSP Folding Solar Panel
        #LOC_KSPZH_5553 = Tracking solar panel with attitude control jets on the tip. The control jets are configured by default for roll and yaw only. Can be switched from the standard angled fold to a straight vertical storage position.
        #LOC_KSPZH_1094 = Argo-10-CNP44 "Sirius" Precision Star Tracker
        #LOC_KSPZH_5214 = This compact star tracker device can provide advanced SAS modes to any spacecraft.
        #LOC_KSPZH_1102 = Argo-10-UBL34 Sun Shield
        #LOC_KSPZH_296 = A deployable sunshield for the Argo 10 probe. Protects the probe from solar radiation while exploring the inner planets. Attaches to the Argo 10 engine and has a small opening for the thruster.
        #LOC_KSPZH_1097 = Argo-10-EUS77 Ultraviolet Spectrometer
        #LOC_KSPZH_5158 = This advanced Extreme Ultraviolet Spectrometer consists of dual instruments. The combination of an occultation spectrometer and an airglow spectrometer yields high quality data.
        #LOC_KSPZH_826 = Aeolus-BATA Beacon and Telemetry Antenna
        #LOC_KSPZH_5644 = Very low gain but rugged antenna for the later Aeolus satellites. Not useful for transmitting scientific data, but a low electricity way to receive commands and transmit telemetry.
        #LOC_KSPZH_830 = Aeolus-EST Camera Equipment Torus
        #LOC_KSPZH_2145 = Early structural torus for mounting instruments for the Aeolus meteorological satellites. While this has less electrical storage than the later model, it has a battery of cameras for observing cloud coverage.
        #LOC_KSPZH_837 = Aeolus-PSM Payload Separation Mechanism
        #LOC_KSPZH_499 = A roughly 0.9375m payload separation mechanism specifically designed for the Aeolus probe series, providing room for the experiments mounted to the bottom of the instrument torus.
        #LOC_KSPZH_828 = Aeolus-ECCA RCS/Command Antenna
        #LOC_KSPZH_1828 = Command and control antenna for the early Aeolus meteorological satellites. Includes built-in six axis RCS thrusters.
        #LOC_KSPZH_834 = Aeolus-LCC "Stratus" Control Core
        #LOC_KSPZH_1857 = Control core for the early model Aeolus meteorological satellites.
        #LOC_KSPZH_831 = Aeolus-IST Instrument Support Torus
        #LOC_KSPZH_4705 = Structural torus for mounting instruments for the Aeolus meteorological satellites. Includes supplementary batteries and monopropellant.
        #LOC_KSPZH_836 = Aeolus-PBR Planetary Radiation Budget Instrument
        #LOC_KSPZH_5287 = This instrument is used for long term measurements of the solar radiation budget of an atmospheric planet. Part one of the Aeolus Multi Instrument Suite - it can be used without either subsequent experiment for reduced science return.
        #LOC_KSPZH_829 = Aeolus-ESMR Electrically Scanning Microwave Radiometer
        #LOC_KSPZH_5285 = This instrument is used for mapping the microwave radiation from a planet's surface. This information is used to measure the water content of clouds, and to observe sea ice. Returns a medium to high amount of science compared to other microwave radiometers.
        #LOC_KSPZH_838 = Aeolus-SAMS Stratospheric and Mesospheric Sounder
        #LOC_KSPZH_5271 = This instrument can be used to map the air layers of the atmosphere. Part three of the Aeolus Multi Instrument Suite - it requires the Planetary Radiation Budget and Total Ozone Mapping System experiments, but together their combined returned data will fully map the the primary weather systems of the planet.
        #LOC_KSPZH_840 = Aeolus-SIS Satellite Infrared Spectrometer
        #LOC_KSPZH_5290 = This instrument is used for measuring the infrared spectrum of a planet, useful for determining the vertical profiles of temperature and water vapor in the atmosphere.
        #LOC_KSPZH_841 = Aeolus-SMMR Scanning Multichannel Microwave Radiometer
        #LOC_KSPZH_5286 = This instrument is used for long term measurements of the cloud cover of an atmospheric body. Returns a high amount of science compared to other microwave radiometers.
        #LOC_KSPZH_832 = Aeolus-ITHIR Scanning Infrared Radiometer
        #LOC_KSPZH_5273 = This instrument can be used to measure the infra-red reflections coming off a planet's surface. Certain IR bands are released from specific chemical processes, which lets scientists infer what sort of activity is occurring on a body.
        #LOC_KSPZH_844 = Aeolus-TOMS Total Ozone Mapping System
        #LOC_KSPZH_5272 = This instrument can be used to measure and map the ozone layers of a planet. Part two of the Aeolus Multi Instrument Suite - it requires the Planetary Radiation Budget experiment, but combined the instruments can return more weather data.
        #LOC_KSPZH_835 = Aeolus-LCCA Command Antenna
        #LOC_KSPZH_1829 = Command and control antenna for the late model Aeolus meteorological satellites.
        #LOC_KSPZH_833 = Aeolus-LCC "Cirrus" Control Core
        #LOC_KSPZH_1858 = Control core for the later model Aeolus meteorological satellites. Includes built-in six axis RCS thrusters.
        #LOC_KSPZH_842 = Aeolus-SPD Payload Deck
        #LOC_KSPZH_3290 = Lightweight structural deck, to get more space for mounting experiments or other radially attached parts. Based on the Aeolus satellite's instrument torus.
        #LOC_KSPZH_839 = Aeolus-SBCA S-Band Antenna
        #LOC_KSPZH_4108 = S-band communications antenna for the Aeolus meteorological satellites. Nominally several are mounted to the bottom of the instrument torus for increased data bandwidth.
        #LOC_KSPZH_827 = Aeolus-BSP Solar Panel
        #LOC_KSPZH_5252 = This fold-out, tracking solar panel was originally designed for the Aeolus meteorological satellite series. When placed in 2x symmetry, it will mirror so that both panels fold to one side. This frees up room on the other side of the satellite for mounting taller instruments.
        #LOC_KSPZH_843 = Aeolus-STS Structural Truss
        #LOC_KSPZH_3293 = Lightweight truss for the Aeolus meteorological satellite series.
        #LOC_KSPZH_783 = AOO-WPE "Bentham" Advanced Ultraviolet Telescope
        #LOC_KSPZH_5278 = This instrument for the improved AOO-3 Roman space telescope contains a single large ultraviolet telescope and three complementary x-ray instruments. Both experiments return more science compared to earlier models and the telescope can also function as a SENTINEL to detect asteroids.
        #LOC_KSPZH_778 = AOO-MPC "Roman 3" Service Module
        #LOC_KSPZH_5403 = This service module component with opening door panels for the Roman 3 spacecraft provides a lot of mission flexibility. Useful to store extra propellant, batteries, experiments etc.
        #LOC_KSPZH_777 = AOO-CTR Command Antenna
        #LOC_KSPZH_575 = A small antenna to receive command signals.
        #LOC_KSPZH_781 = AOO-RBM Balance Boom
        #LOC_KSPZH_568 = A small RCS quad mounted on a boom, for added leverage and thus higher fuel efficiency.
        #LOC_KSPZH_779 = AOO-MPC "Roman" Probe Core
        #LOC_KSPZH_780 = AOO-OSA "Smithson" Secondary Telescope
        #LOC_KSPZH_2088 = Double up your science! This secondary instrument containing four X-Ray telescopes attaches to the "bottom" of the AOO Space Telescope probe core so you can perform observations at both ends of the observatory.
        #LOC_KSPZH_775 = AOO-BSP-L Lower Solar Panel
        #LOC_KSPZH_776 = AOO-BSP-U Upper Solar Panel
        #LOC_KSPZH_785 = AOO-XSA 0.9375m to 1.25m Spacecraft Adapter
        #LOC_KSPZH_214 = A 0.9375m to 1.255m payload adapter with built in decoupler. For when you need to attach a spacecraft larger than the stage below it.
        #LOC_KSPZH_782 = AOO-STP Precision Star Tracker
        #LOC_KSPZH_5065 = The product of extensive development in order to provide the required pointing accuracy for the Astromical Orbital Observatory program, this high precision star tracker provides additional SAS control modes to probe cores as a result of high quality positional data.
        #LOC_KSPZH_784 = AOO-WPE "Marquette" Ultraviolet Telescope
        #LOC_KSPZH_5063 = The primary instrument for the early AOO space telescopes, this block contains no fewer than five ultraviolet telescopes and a pair of UV spectrometers for good measure. Can function as a SENTINEL to detect asteroids.
        #LOC_KSPZH_3678 = OTLTH-A Communications Antenna
        #LOC_KSPZH_647 = A small triple-boom mounted antenna.
        #LOC_KSPZH_3679 = OTLTH-E Space Adaptation Experiment
        #LOC_KSPZH_5421 = This small self contained laboratory can measure the adaptation of small, primitive organisms to a microgravity environment over an extended time. Originally used with a MIP probe core. Data gathered can be transmitted but the science returns will be lower than a dedicated recoverable experiment such as the Bion probe adapter.
        #LOC_KSPZH_2521 = HLR-OOG 0.9375m to 0.625m Payload Adapter
        #LOC_KSPZH_213 = A 0.9375m to 0.625m payload adapter with built in decoupler.
        #LOC_KSPZH_2520 = HLR-OOG "Sansisco" Probe Core
        #LOC_KSPZH_3449 = Medium sized, rectangular probe bus for scientific and commercial satellites, originally design for our geophysical research satellite series. Includes the standard loadout of control processors, batteries, and other essential equipment.
        #LOC_KSPZH_2527 = HLR-OOG-EP4 Ionization and Electrostatic Analysis Boom
        #LOC_KSPZH_4563 = Sophisticated instrument used for gathering Electrostatic data from Auroral particles and other sources.
        #LOC_KSPZH_2526 = HLR-OOG-EP2 Gravimetric Scanner
        #LOC_KSPZH_5164 = This advanced instrument can map the gravitational fields of planetary bodies.
        #LOC_KSPZH_2525 = HLR-OOG-EP1 Ion Trap Boom
        #LOC_KSPZH_5275 = This instrument can trap charged particles that pass through it. That will allow us to measure the solar wind around the system.
        #LOC_KSPZH_2523 = HLR-OOG High Gain Antenna
        #LOC_KSPZH_1837 = Compact but powerful high gain antenna.
        #LOC_KSPZH_2529 = HLR-OOG-EP6 Gamma Ray Spectrometer
        #LOC_KSPZH_5664 = We are not sure why our scientists wanted a Gamma Ray Spectrometer before an Alpha or a Beta one but here it is! The instrument is particularly sensitive to the Hydrogen spectrum in order to locate water.
        #LOC_KSPZH_2528 = HLR-OOG-EP5 Folding Magnetometer Boom
        #LOC_KSPZH_5298 = This interestingly shaped hoop magnetometer is designed to study magnetohydrodynamic waves and other magnetic field structures in orbit.
        #LOC_KSPZH_2530 = HLR-OOG-OPEP Science Instrument
        #LOC_KSPZH_5401 = This science container contains a mass spectrometer that can be used used to analyze the composition of atmospheres and surfaces from orbit, as well as a cosmic ray telescope that can detect solar and galactic cosmic radiation.
        #LOC_KSPZH_2522 = HLR-OOG Attitude Control Thruster
        #LOC_KSPZH_5492 = Tiny 3-way RCS thrusters on a fixed boom originally designed for the HLR-OOG Sansico probe. A pair placed on one end of the bus is enough to give sufficient control authority. But we're sure you can find other uses for this.
        #LOC_KSPZH_2531 = HLR-OOG-RPWS Solar Panel
        #LOC_KSPZH_3446 = Medium sized folding solar panel with sun tracking and a Radio Plasma Wave Science experiment built in.
        #LOC_KSPZH_2524 = HLR-OOG Solar Panel
        #LOC_KSPZH_3447 = Medium sized folding solar panel with sun tracking.
        #LOC_KSPZH_4171 = SOO-ARM Actuating Reaction Member
        #LOC_KSPZH_569 = A small RCS quad mounted on a boom, for added leverage and thus higher fuel efficiency. Also has a small antenna built into the bottom.
        #LOC_KSPZH_4172 = SOO-NON Probe Core
        #LOC_KSPZH_4641 = Standard 0.625m probe core. Has 9 sides, yes, really.
        #LOC_KSPZH_4174 = SOO-SEP Solar Experiment Package
        #LOC_KSPZH_1776 = Centerpiece of the Solar Orbiting Observatory series of probes. This standalone version has the solar panel removed. The experiment package is designed to track the sun, making sure that it keeps the various experiments pointed at Kerbol. (Author's note - the solar panel module is a workaround to let the standalone version of the experiment track the sun)
        #LOC_KSPZH_4173 = SOO-PPE Photopolarimeter Experiment
        #LOC_KSPZH_530 = A simple photometric experiment used to measure the intensity of light levels.
        #LOC_KSPZH_4175 = SOO-SES Solar Experiment Sail
        #LOC_KSPZH_1775 = Centerpiece of the Solar Orbiting Observatory series of probes. This large sail shaped photovoltaic panel contains a large, sophisticated package of solar experiments. The panel and the experiment package are designed to track the sun, making sure that it both provides power and gives the experiments a clear view of Kerbol.
        #LOC_KSPZH_3129 = LVO1-LA3 Lyman-Alpha UV Photometer
        #LOC_KSPZH_4811 = Telescope used to measure the UV spectrum of a body.
        #LOC_KSPZH_3127 = LVO1-GXM Gravity Gradient Stabilized Magnetometer
        #LOC_KSPZH_5400 = This rollout magnetometer features 4 supplementary gravity gradient stabilisation booms. Requires the supplementary LV01-GXM-2 boom to be present on the craft to function (preferably on the opposite side).
        #LOC_KSPZH_3128 = LVO1-GXM-2 Gravity Gradient Stabilized Magnetometer
        #LOC_KSPZH_5399 = This rollout magnetometer cannot function on its own. However it works together as a package with the LVO1-GXM. Place on the same craft on the opposite side.
        #LOC_KSPZH_3125 = LVO1-10 "Limpet-10" Probe Core
        #LOC_KSPZH_4424 = Simple pill shaped probe core designed to be piggybacked on Bossart rockets. Features cutouts for science instruments.
        #LOC_KSPZH_3120 = LVO-1XSG X-ray Spectrometer
        #LOC_KSPZH_5240 = This experiment is designed to detect X-ray fluorescence and alpha particles both in deep space and in orbit around planetary bodies.
        #LOC_KSPZH_3124 = LVO1-1 "Limpet-1" Probe Core
        #LOC_KSPZH_4425 = Simple pill shaped probe core designed to be piggybacked on Bossart rockets. This probe is not stabilized.
        #LOC_KSPZH_3123 = LVO1 Propulsion Kit
        #LOC_KSPZH_5206 = This capable readymade kit can be used to add 3-axis control, comms and a set of small monopropellant thrusters to the Staara "Aquilae" kick motor. It also includes a decoupler to deploy LVO1 series "Limpet" probes.
        #LOC_KSPZH_3820 = Pilgrim-PNR10F Aft Adapter
        #LOC_KSPZH_5454 = This structural adapter is designed to provide an interface for the Pilgrim-PNR10F "Allen" Probe Core to be mated to a launch vehicle. Includes louvers for thermal control.
        #LOC_KSPZH_3821 = Pilgrim-PNR10F Aft Adapter (Alternate)
        #LOC_KSPZH_5455 = This structural adapter is designed to provide an interface for the Pilgrim-PNR10F "Allen" Probe Core to be mated to a launch vehicle. This version does not include louvers.
        #LOC_KSPZH_3826 = Pilgrim-PNR10F-AMD "Orpheus" Asteroid Detector
        #LOC_KSPZH_5238 = This experiment contains four non-imaging telescopes with photomultipliers designed to spot dust particles or larger asteroids.
        #LOC_KSPZH_3819 = Pilgrim-PNR10F "Allen" Probe Core
        #LOC_KSPZH_3828 = Pilgrim-PNR10F-CPI Charged Particle Detector
        #LOC_KSPZH_580 = A small charged particle experiment designed to detect energetic electrons, protons, and alpha particles in both planetary and interplanetary regions.
        #LOC_KSPZH_3827 = Pilgrim-PNR10F-CCC Cosmic Ray Telescope
        #LOC_KSPZH_609 = A small instrument that analyzes the composition and energy of cosmic ray particles.
        #LOC_KSPZH_3823 = Pilgrim-PNR10F Payload Separation Mechanism
        #LOC_KSPZH_202 = A 0.3125m payload separation mechanism specifically designed to mate the Pilgrim-PNR10F spacecraft to a Staara-37FNV Solid Rocket Motor.
        #LOC_KSPZH_3829 = Pilgrim-PNR10F-EXP Experiment Payload Bay
        #LOC_KSPZH_5440 = This squashed hexagonal lightweight container was designed with the purpose of being used as an extension to the Pilgrim-PNR10F "Allen" Probe Core. Small cutouts are marked in the bay for placement of experiments or other equipment.
        #LOC_KSPZH_3841 = Pilgrim-PNR10X Extension Bay
        #LOC_KSPZH_5215 = This compartment was designed with the purpose of being used as an extension to the Pilgrim-PNR10F "Allen" Probe Core. Designed as part of the PNR10X program, a series of proposals involving extending the lifespan of Pilgrim-PNR10 satellites and repurposing this hardware for new missions. It houses a small supply of monopropellant and an integrated battery. Can also be used as a platform for mounting equipment.
        #LOC_KSPZH_3830 = Pilgrim-PNR10F-GTT Geiger Tube
        #LOC_KSPZH_5242 = This experiment is designed to measure the intensity of ionizing radiation in the surrounding environment.
        #LOC_KSPZH_3836 = Pilgrim-PNR10F-RFLCTR27 High Gain Antenna
        #LOC_KSPZH_367 = A large high gain dish antenna (and medium gain antenna) designed for the Pilgrim-PNR10F spacecraft that is very light for its size. Great at transmitting at vast distances at the cost of transmission speed. Includes integrated RCS thrusters and two sun sensors that gives a small amount of SAS control. Equipped with several aft-mounted micrometeorite detection panels.
        #LOC_KSPZH_3837 = Pilgrim-PNR10F-RFLCTR27 High Gain Antenna (Alternate)
        #LOC_KSPZH_366 = A large high gain dish antenna (and medium gain antenna) designed for the Pilgrim-PNR10F spacecraft that is very light for its size. Great at transmitting at vast distances at the cost of transmission speed. Does NOT include integrated RCS thrusters and sun sensors. Equipped with several aft-mounted micrometeorite detection panels.
        #LOC_KSPZH_3833 = Pilgrim-PNR10F-IRE Infrared Radiometer
        #LOC_KSPZH_5270 = This instrument analyzes the infrared radiation being reflected off a body. This data can be used to analyze a planet or moon's heat output and weather systems.
        #LOC_KSPZH_3832 = Pilgrim-PNR10F-IPP Imaging Photopolarimeter
        #LOC_KSPZH_622 = A small photopolarimeter imaging system intended for use with spin-stabilized spacecraft and designed for the Pilgrim-PNR10F spacecraft. Unlike traditional TV camera imaging, this instrument does not have a vidicon tube, and instead uses spin-scan imaging techniques. It can also preform photopolarimetric observations in addition to imaging. While it doesn't take the best images, it is a pretty effective photometer. Includes both a basic imaging experiment and a photopolarimeter experiment.
        #LOC_KSPZH_3842 = Pilgrim-PNR10X Large Thermal Control Louver
        #LOC_KSPZH_388 = A larger thermal control louver designed for the Pilgrim-PNR10X mission proposals.
        #LOC_KSPZH_3838 = Pilgrim-PNR10F-SBLGA Low Gain Omni Antenna
        #LOC_KSPZH_665 = A small, fixed omnidirectional s-band low gain antenna. Designed for the Pilgrim-PNR10F spacecraft, this antenna is designed to communicate with ground stations during launch and the beginning of the its cruise period. While designed as a secondary antenna, this antenna could be used for any number of applications, including as a primary antenna.
        #LOC_KSPZH_3831 = Pilgrim-PNR10F-HVM Helium Vector Magnetometer
        #LOC_KSPZH_5277 = This instrument designed for the Pilgrim-PNR10F spacecraft is used to analyze and map planetary and interplanetary magnetic fields. Includes a toggleable counterweight at the end of the boom to aid in balancing the center of mass for proposed follow-up missions.
        #LOC_KSPZH_3822 = Pilgrim-PNR10F Medium Thermal Control Louver
        #LOC_KSPZH_425 = A medium-sized thermal control for the Pilgrim-PNR10F spacecraft. Intended to be placed in pairs on the aft side of the Pilgrim-PNR10F-EXP Experiment Payload Bay.
        #LOC_KSPZH_3847 = Pilgrim-PNR10X-MLS Multispectral Line Scan Camera
        #LOC_KSPZH_5165 = This advanced instrument developed for the proposed Pilgrim-PNR10X follow-up missions to the Pilgrim-PNR10F missions is designed to take multispectral line-scan images.
        #LOC_KSPZH_3848 = Pilgrim-PNR10X-OPO Propulsion System
        #LOC_KSPZH_5618 = Using lessons learned from the Codac-PAD4R "Marquardt" Orbital Propulsion System, engineers at Bluedog Design Bureau have developed an advanced monopropellant-fueled propulsion system for Pilgrim-PNR10X mission proposals. Could be useful for constructing outer solar system orbiter missions. Includes aft-mounted thermal control louvers as well as a toggleable micrometeorite shield.
        #LOC_KSPZH_3846 = Pilgrim-PNR10X-LSS Line-Scan Imaging Science Platform
        #LOC_KSPZH_5169 = This advanced science system designed for one of the Pilgrim-PNR10X mission proposals incorporates the Pilgrim-PNR10F-IRE Infrared Radiometer and the Pilgrim-PNR10F-UVP Ultraviolet Photometer along with a new advanced vidicon camera imaging system to create a multi-mode line-scan imaging system intended for planetary missions.
        #LOC_KSPZH_3835 = Pilgrim-PNR10F-QPA Quadrispherical Solar Plasma Analyzer
        #LOC_KSPZH_5284 = This instrument is designed to detect solar wind particles originating from Kerbol for the Pilgrim-PNR10F spacecraft. Intended to be mounted on top of the Pilgrim-PNR10F-EXP Experiment Payload Bay and peer through a hole in the Pilgrim-PNR10F-RFLCTR27 High Gain Antenna's dish.
        #LOC_KSPZH_3844 = Pilgrim-PNR10X-APP "Caelus" Atmospheric Entry Probe
        #LOC_KSPZH_1945 = DS-P10P 0.625m Tall Payload Separation Mechanism
        #LOC_KSPZH_492 = A relatively tall 0.625m payload separation mechanism that was originally designed for mating Staara-37 Solid Rocket Motors to payloads on Daleth rockets. The extra height can house the top half of the Staara-37, and the extra height can also fit some aft-mounted equipment on your payload. Also used with one of the Pilgrim-PNR10X mission proposals where it is used to mate the Pilgrim-PNR10X spacecraft to a Staara-37FNV Solid Rocket Motor.
        #LOC_KSPZH_3845 = Pilgrim-PNR10X-APTA Atmospheric Entry Probe Telemetry Antenna
        #LOC_KSPZH_5398 = This robust and reliable telemetry antenna is designed to send telemetry and experiment data from the Pilgrim-PNR10X-APP "Caelus" Atmospheric Entry Probe back to the Pilgrim-PNR10X spacecraft. This antenna is optimized to send data with minimum electricity usage at the cost of longer transmission times.
        #LOC_KSPZH_3850 = Pilgrim-PNR10X-PSA Atmospheric Entry Probe Adapter
        #LOC_KSPZH_3843 = Pilgrim-PNR10X-AEPE Atmospheric Experiment Package
        #LOC_KSPZH_715 = A standalone version of the atmospheric experiment package integrated into the Pilgrim-PNR10X-APP "Caelus" Atmospheric Entry Probe. This small (but heavier than it looks) experiment package contains a small photometer and a quadrupole mass spectrometer.
        #LOC_KSPZH_3824 = Pilgrim-PNR10F Shunt Radiator
        #LOC_KSPZH_636 = A small shunt radiator designed for the Pilgrim-PNR10F spacecraft to aid in maintaining thermal control.
        #LOC_KSPZH_3849 = Pilgrim-PNR10X-PRA Relay Antenna
        #LOC_KSPZH_2173 = Engineers at Bluedog Design Bureau took the Pilgrim-PNR10F-SBLGA Low Gain Omni Antenna, added a ground plate and other equipment to upgrade its capabilities so it can serve as a short-range relay antenna. Designed for missions involving the Pilgrim-PNR10X-APP "Caelus" Atmospheric Entry Probe, this antenna can achieve a link with the atmospheric entry probe so the Pilgrim-PNR10X spacecraft can relay it back to Kerbin.
        #LOC_KSPZH_3825 = Pilgrim-PNR10F Small Thermal Control Louver
        #LOC_KSPZH_716 = A standalone version of the small thermal control louver from the Pilgrim-PNR10F Aft Adapter.
        #LOC_KSPZH_3762 = PB-PANS-19P Radioisotope Thermoelectric Generator
        #LOC_KSPZH_465 = A pair of radioisotope electric generators intended for deep space missions, specifically designed for the Pilgrim-PNR10F spacecraft. The RTG is mounted on three extending rods so that the radiation being emitted from these generators does not damage or interfere with spacecraft electronics. This RTG can be upgraded by adding a third PB-PANS-19 unit to extend the operating life of the Pilgrim-PNR10 spacecraft as used in the Pilgrim-PNR10X mission proposals.
        #LOC_KSPZH_3839 = Pilgrim-PNR10F-SRA Kanopus Tracker
        #LOC_KSPZH_400 = A lightweight star tracker designed to use the star Kanopus as a reference point. Even though to designed help track the position, attitude, and spin of the Pilgrim-PNR10F spacecraft, this star tracker can be used to provide additional SAS control modes to other probe cores as well.
        #LOC_KSPZH_3834 = Pilgrim-PNR10F-JTR Trapped Radiation Detector
        #LOC_KSPZH_3840 = Pilgrim-PNR10F-UVP Ultraviolet Photometer
        #LOC_KSPZH_5468 = This tiny, basic instrument analyzes ultraviolet light emissions and reflections to determine the chemical compositions of observed bodies.
        #LOC_KSPZH_3811 = Pilgrim-PIO6E-CCB "Kohoutek" Probe Core
        #LOC_KSPZH_5641 = Versatile, drum shaped probe core with room on top for instruments and antennas, and a ring of solar panels around its sides. Includes an integrated cosmic ray telescope.
        #LOC_KSPZH_3812 = Pilgrim-PIO6E-ITE Folding Ion Trap Boom
        #LOC_KSPZH_464 = A pair of hemispherical ion traps on a boom, to keep them away from the spacecraft.
        #LOC_KSPZH_3813 = Pilgrim-PIO6E-MAG Folding Magnetometer Boom
        #LOC_KSPZH_684 = A smaller magnetometer boom, with a slightly lower scientific return.
        #LOC_KSPZH_3817 = Pilgrim-PIO6E-PWD Communications Antenna
        #LOC_KSPZH_4429 = Simple, lightweight mast antenna.
        #LOC_KSPZH_3814 = Pilgrim-PIO6E-MCE "Mickel" Midcourse Correction Engine
        #LOC_KSPZH_5672 = Weak monoprop engine meant to help refine a probe's flyby, comes with a small propellant bottle attached. Never used on the Pilgrim 6 probes as flown, but proposed - one wonders how precise their heliocentric trajectory needed to be.
        #LOC_KSPZH_3815 = Pilgrim-PIO6E-PAT Folding RCS Boom
        #LOC_KSPZH_3816 = Pilgrim-PIO6E-PSM Service Module
        #LOC_KSPZH_204 = A 0.625m drum covered in solar panels, containing some batteries, a small monopropellant bottle, and space for an engine or some experiments. Has an alternate node to connect to the 0.625m ring on the bottom.
        #LOC_KSPZH_3818 = Pilgrim-PIO6E-SEA Communications Antenna
        #LOC_KSPZH_4427 = Simple, lightweight deployable antenna. Mounts to the bottom rim of the PIO6E service module, and folds up along the side of the probe until deployed.
        #LOC_KSPZH_2551 = HLR-TTS1 Tracking Training Satellite
        #LOC_KSPZH_4507 = Small piggyback payload, used for verifying and training operators for the Deep Space Network. Includes transmitters and a temperature probe.
        #LOC_KSPZH_3809 = Pilgrim-P5 "Hajj" Probe Core
        #LOC_KSPZH_5390 = This probe is a scaled down version of Pilgrim-P3E6. While being much smaller and lighter, it is far less complex and does not have an engine. Includes a rudimentary micrometeorite detector, ionization chamber, and geiger mullen-tube.
        #LOC_KSPZH_3810 = Pilgrim-P5-TSP Solar Paddle
        #LOC_KSPZH_5424 = This small solar panel is spring loaded to extend on command. It is capable of rotating to track the sun.
        #LOC_KSPZH_1479 = Bossart-SAA 0.9375m Interstage
        #LOC_KSPZH_658 = A small, 0.9375m to 0.9375m extension interstage originally designed to attach an Alpha upper stage to the Bossart rocket. There's no getting around it, its going to look weird.
        #LOC_KSPZH_3806 = Pilgrim-P3-VLFA Antenna
        #LOC_KSPZH_668 = A small, fixed whip antenna for the Pilgrim P3 probe.
        #LOC_KSPZH_3807 = Pilgrim-P3E6 "Pog" Probe Core
        #LOC_KSPZH_5387 = This probe core includes a first generation SAS system, some big batteries and is instrumented with radiation and micrometeorite impact experiments. Despite massively overengineered and expensive, it's fairly advanced and capable for when it was developed. It also includes a retrograde facing monopropellant thruster, though curiously it doesn't include any fuel...
        #LOC_KSPZH_3804 = Pilgrim-P3-MCE "Taber" Course Correction System
        #LOC_KSPZH_3692 = One of the first pure vacuum engines ever invented, the "Taber" includes a supply of monopropellant suitable for low-energy orbital insertions and course corrections. Normally mounted inside the Pilgrim P3 probe bus, there is an optional top attachment point that enables it to be used externally with other spacecraft.
        #LOC_KSPZH_3805 = Pilgrim-P3-TSP Solar Paddle
        #LOC_KSPZH_5662 = Wayfarer-2-DDS Cosmic Dust Detector
        #LOC_KSPZH_3729 = Our scientists think space might not be as empty as we once thought. This device contains plates for measuring the impacts of 'micrometeoroids', the little pieces of debris and particles that travel through open vacuum at thousands of meters per second. Measuring the number of impacts gives us an idea of how dangerous an area of space may be for our ships.
        #LOC_KSPZH_1107 = Argo-2-ICC Ion Chamber
        #LOC_KSPZH_5261 = This hemispherical ion trap allows us to sense charged particles that pass through it. That will allow us to measure the radiation from higher-energy particles around the system.
        #LOC_KSPZH_1106 = Argo-2-ETS Radiometer
        #LOC_KSPZH_5280 = This instrument is a combination of a microwave and an infrared radiometer, for analyzing the cloud cover and heat return from a planet.
        #LOC_KSPZH_1103 = Argo-2-ASP Folding Solar Panel - Antenna
        #LOC_KSPZH_1790 = Cheap, primitive solar panel with a simple deployment mechanism. Folds up for storage in fairings, but doesn't track the sun. Can be switched from the standard angled fold to a straight vertical storage position. This variant includes a low-powered omni antenna, for ensuring contact with home.
        #LOC_KSPZH_1104 = Argo-2-BSP Folding Solar Panel
        #LOC_KSPZH_1789 = Cheap, primitive solar panel with a simple deployment mechanism. Folds up for storage in fairings, but doesn't track the sun. Can be switched from the standard angled fold to a straight vertical storage position.
        #LOC_KSPZH_1108 = Argo-2-TASP Tracking Solar Panel - Antenna
        #LOC_KSPZH_1787 = Cheap, primitive solar panel with a simple deployment mechanism. Folds up for storage in fairings and equipped with a rotary joint for tracking the sun. Can be switched from the standard angled fold to a straight vertical storage position. This variant includes a low-powered omni antenna, for ensuring contact with home.
        #LOC_KSPZH_1109 = Argo-2-TBSP Tracking Solar Panel
        #LOC_KSPZH_1786 = Cheap, primitive solar panel with a simple deployment mechanism. Folds up for storage in fairings and equipped with a rotary joint for tracking the sun. Can be switched from the standard angled fold to a straight vertical storage position.
        #LOC_KSPZH_1105 = Argo-2-ET Experiment Truss
        #LOC_KSPZH_3292 = Lightweight truss for mounting instruments, includes a built in magnetometer.
        #LOC_KSPZH_1112 = Argo-B-LSP Folding Solar Panel
        #LOC_KSPZH_1113 = Argo-B-TLSP Tracking Solar Panel
        #LOC_KSPZH_1111 = Argo-B-LMT Experiment Truss
        #LOC_KSPZH_1521 = Burke-ZAP Rechargeable Battery Pack
        #LOC_KSPZH_4495 = Small capacity radial battery for probes. The white dust cover is meant to face out to protect the part - not the black battery. It will last you long enough to reach, say, the Mun. (Note: Warranty void if used inside Mun's SOI)
        #LOC_KSPZH_1494 = Burke-1-EDA1 Electrostatic Analyzer Device 1
        #LOC_KSPZH_3695 = One of the two devices required for the electrostatic analyzer experiment to function.
        #LOC_KSPZH_1495 = Burke-1-EDA2 Electrostatic Analyzer Device 2
        #LOC_KSPZH_1496 = Burke-1-EIA Electrostatic Analyzer Experiment
        #LOC_KSPZH_4564 = Sophisticated instrument used for gathering Electrostatic data. Requires both the separate "Electrostatic Analyzer Devices 1 & 2" to be on board the vessel to function.
        #LOC_KSPZH_1497 = Burke-1-LMT Lyman-Alpha UV Telescope
        #LOC_KSPZH_1498 = Burke-1-RMT Experiment Truss
        #LOC_KSPZH_5561 = Truss for mounting instruments, includes a built in magnetometer and ion trap.
        #LOC_KSPZH_1502 = Burke-2-GRSP Gamma Ray Spectrometer
        #LOC_KSPZH_1501 = Burke-2-61-P Omni Antenna
        #LOC_KSPZH_5474 = This uniquely shaped low-gain omni antenna is designed to go over the rough lander in the Burke Block 2 probes. Make sure you deploy it before you release the probe!
        #LOC_KSPZH_1503 = Burke-2-RAD Radar Altimeter
        #LOC_KSPZH_5243 = This experimental radar altimeter dish can be used to map the surface height of the planet below. Needs to be deployed before use.
        #LOC_KSPZH_1505 = Burke-2-RMD 0.3125m Decoupler
        #LOC_KSPZH_201 = A 0.3125m decoupler specifically designed to decouple the Burke Block 2 rough lander just prior to impact. It's also useful in general as a payload decoupler.
        #LOC_KSPZH_1504 = Burke-2-RLP Rough Landing Probe
        #LOC_KSPZH_5123 = This "rough lander" is designed to be attached to a Staara-10-LYC "Aethra" solid motor. Fired retro just before impact aboard a lunar impactor, if all goes well it should be brought to a nearly complete stop before landing, more or less intact, on the surface. Once there it has a simple seismometer experiment that can be transmitted back home.
        #LOC_KSPZH_1506 = Burke-2-VTS Television Camera
        #LOC_KSPZH_537 = A simple television camera system for relaying images back home. The quality of data gathered is worse than a regular camera but all of the data collected can be transmitted.
        #LOC_KSPZH_1507 = Burke-3-RCA Television Camera System
        #LOC_KSPZH_5218 = This conical structure contains six television cameras and the associated hardware for rapidly processing them for transmission home. The quality of data gathered is worse than a regular camera but all of the data collected can be transmitted.
        #LOC_KSPZH_1512 = Burke-HKS "Rorat" Probe Bus
        #LOC_KSPZH_4706 = Sturdy hexagonal probe core with integrated trusses, for attaching things such as solar panels and instruments. It includes storage for monopropellant fuel, for use with the included attitude control thrusters or small engines. Unfortunately this didn't leave space for any batteries - don't forget to attach them! Includes a bare probe core variant, and a double stacked version for Argo-B-DSPB is also unloackable.
        #LOC_KSPZH_1520 = Burke-WTD Payload Separation Mechanism
        #LOC_KSPZH_206 = A 0.625m payload separation mechanism specifically designed for the Burke probe series, providing room for the high gain dish to be folded underneath.
        #LOC_KSPZH_1518 = Burke-OVBR-1 Communications Dish
        #LOC_KSPZH_5210 = This communications dish might be a little bit heavy, and hard to fit into a fairing, but it's the best we'll be able to provide for the time being. By default it folds underneath what it is attached to, but it can be switched to fold upwards.
        #LOC_KSPZH_1517 = Burke-MP829 "Groudle" Midcourse Correction Engine
        #LOC_KSPZH_617 = A small monopropellant powered engine with an internal fuel supply, not enough for large orbital maneuvers but sufficient for adjusting an encounter trajectory. Designed to be mounted up inside the spacecraft bus. Attitude control is accomplished through jet vanes mounted inside the nozzle.
        #LOC_KSPZH_1513 = Burke-L-6TP1 Antenna
        #LOC_KSPZH_268 = A combination of a high gain dish and a low gain omni antenna.
        #LOC_KSPZH_1514 = Burke-L-LSL Landing Leg
        #LOC_KSPZH_5667 = We crashed a bunch of Burke probes into the Mun when someone had the bright idea to maybe put some landing legs and a more powerful propulsion system on one. These tiny legs will enable you to convert a Burke probe core into a soft lander.
        #LOC_KSPZH_1516 = Burke-L-TDPS Terminal Propulsion System
        #LOC_KSPZH_2037 = Descent propulsion for the Burke-L Lander Prototype. Use a solid motor to reduce most of the speed, and these for your final touchdown.
        #LOC_KSPZH_1510 = Burke-FSSP Folding Solar Panel
        #LOC_KSPZH_1785 = Cheap solar panel with a simple unfold mechanism. Folds up for storage in fairings. Doesn't track the sun.
        #LOC_KSPZH_1511 = Burke-FSSPT Folding Tracking Solar Panel
        #LOC_KSPZH_1784 = Cheap solar panel with a simple unfold mechanism, mounted on a servo to track the sun. Folds up for storage in fairings.
        #LOC_KSPZH_1515 = Burke-L-STT Structural Truss
        #LOC_KSPZH_3291 = Lightweight truss for mounting instruments and other necessities. Contains some batteries.
        #LOC_KSPZH_1508 = Burke-A27-C Antenna
        #LOC_KSPZH_5493 = Tired of long antennas? This one comes coiled up in a cylinder! The overall length is kept down, but weighs slightly more as a result.
        #LOC_KSPZH_1519 = Burke-SPD Payload Deck
        #LOC_KSPZH_3289 = Lightweight structural deck, to get more space for mounting experiments or other radially attached parts.
        #LOC_KSPZH_1499 = Burke-17-ZOID Folding Solar Panel
        #LOC_KSPZH_3170 = Large, cheap solar panel with a simple unfold mechanism. Folds up for storage in fairings. Doesn't track the sun.
        #LOC_KSPZH_1500 = Burke-17-ZOIDT Tracking Solar Panel
        #LOC_KSPZH_3169 = Large, cheap solar panel with a simple unfold mechanism. Folds up for storage in fairings, and is equipped with a rotary joint for tracking the sun.
        #LOC_KSPZH_3430 = MarinerB Upgrade
        #LOC_KSPZH_2510 = HLR-0x5-MPS Monopropellant Tank
        #LOC_KSPZH_627 = A small radially attached bottle of Monopropellant. Useful for small probes that need RCS, probably not enough for serious course adjustments.
        #LOC_KSPZH_2512 = HLR-1r5-MPS Monopropellant Tank Assembly
        #LOC_KSPZH_5490 = Three small radially attached bottles of Monopropellant. Useful for small probes.
        #LOC_KSPZH_2518 = HLR-3x-MPS Monopropellant Sphere
        #LOC_KSPZH_629 = A small radially attached spherical monopropellant tank.
        #LOC_KSPZH_2537 = HLR-RT Attitude Control Thruster
        #LOC_KSPZH_3897 = Probe sized RCS cluster, includes many layout variants.
        #LOC_KSPZH_2536 = HLR-PCST Attitude Control Thruster
        #LOC_KSPZH_142 = 3 way probe RCS. Place 45 degrees off axis for proper transforms. The bottom thruster has been enlarged. You can engage its overdrive via the throttle.
        #LOC_KSPZH_3758 = PB-GPHS Radioisotope Thermoelectric Generator
        #LOC_KSPZH_673 = A small, modular radioisotope thermoelectric generator. Suitable for use in probes where solar panels are unusable. The cutting edge in RTG technology, this RTG is highly versatile and perfect for a wide variety of applications.
        #LOC_KSPZH_3759 = PB-MHW Radioisotope Thermoelectric Generator
        #LOC_KSPZH_674 = A small, modular radioisotope thermoelectric generator. Suitable for use in probes where solar panels are unusable. This RTG was developed to be perfect for long-duration, deep-space missions.
        #LOC_KSPZH_3767 = PB-TNY-CT Radioisotope Heater Unit
        #LOC_KSPZH_743 = A tiny pellet of plutonium used to keep electronics warm. Produces a very small amount of power.
        #LOC_KSPZH_3760 = PB-PANS-19 Radioisotope Thermoelectric Generator
        #LOC_KSPZH_671 = A small, modular electric generator.
        #LOC_KSPZH_3761 = PB-PANS-19N Radioisotope Thermoelectric Generator
        #LOC_KSPZH_309 = A double stack of PANS-19 RTGs in a peculiar angled mount.
        #LOC_KSPZH_3763 = PB-PANS-19Q Radioisotope Thermoelectric Generator
        #LOC_KSPZH_2324 = Four PANS-19 RTGs mounted on a truss. The arm swings out, to get the RTGs further away from the spacecraft's systems and instruments.
        #LOC_KSPZH_3765 = PB-PANS-3 Radioisotope Thermoelectric Generator
        #LOC_KSPZH_740 = A tiny RTG for providing a trickle of keep-alive power for spacecraft.
        #LOC_KSPZH_2511 = HLR-15 Solar Battery
        #LOC_KSPZH_5182 = This arrangement of three small solar panels includes a battery. They can either charge the battery or provide power directly to your spacecraft systems.
        #LOC_KSPZH_4034 = RVMR-HG25R High Gain Relay Antenna
        #LOC_KSPZH_4951 = The Raumvermesser mast holds a Planar-array High-Gain Antenna, which shouldn't be use for grilling, but can be used as a relay.
        #LOC_KSPZH_4036 = RVMR-PVAR Solar Panel
        #LOC_KSPZH_3112 = LVMR-ISD Payload Separation Mechanism
        #LOC_KSPZH_468 = A payload separation mechanism specifically designed for the Lanvermesser program, able to provide room for the retro motor's nozzle.
        #LOC_KSPZH_3110 = LVMR-AS32-R Alpha Spectrometer Experiment
        #LOC_KSPZH_2026 = Deployable experiment for the Landvermesser probe. Goes on the rear of the spacecraft, replacing the auxiliary battery used in the earlier missions.
        #LOC_KSPZH_3105 = LVMR-55i Landvermesser Auxiliary Battery
        #LOC_KSPZH_5017 = The blueprints show that this was a case for some science experiment, but there was a page missing. To prevent design delays, the engineers just crammed a dense battery in it.
        #LOC_KSPZH_3111 = LVMR-CAM-S1 Landing Site Survey Camera
        #LOC_KSPZH_5068 = The rotating head with a mirror window allows the camera to take a mosaic of pictures of the landing site for analysis without having to move the actual camera. This is useful for evaluating the safety of a landing site ahead of sending a Kerbal crew, but there is only enough film for one site survey. If you need to run more surveys, bring additional cameras or have a Kerbonaut ironically replace the film.
        #LOC_KSPZH_3114 = LVMR-MB 'Landvermesser' Lander Core
        #LOC_KSPZH_5483 = This very light and rugged probe is designed to perform landing site surveys ahead of crewed flights. Includes propellant for its 3 vernier engines (Sold separately) and the control thrusters mounted on the legs (Also sold separately). The Solid Fuel Retromotor will be required for retro braking maneuvers.
        #LOC_KSPZH_3116 = LVMR-SLG Landing Leg
        #LOC_KSPZH_3107 = LVMR-A071-99 Landvermesser Omni Antenna
        #LOC_KSPZH_5147 = This Omni antenna is a masterful re-use of old plumbing equipment and electronic parts from the bargain bin. It complements Landvermesser's HGA for short-range or emergency communication. Inclides the two variants for Landvermesser, as well as a veriant for the Raumvermesser orbiter.
        #LOC_KSPZH_3115 = LVMR-SC28-L Topsoil Scoop
        #LOC_KSPZH_5153 = This actuated arm can be used to interact with the topsoil to expose material for photography. It can help analyze physical properties of the surface material but collects none and can run no chemical analysis. Be sure to check that the arm can reach the ground because, well, that would be embarrassing...
        #LOC_KSPZH_3109 = LVMR-AE20 HGA Antenna and Solar Panel
        #LOC_KSPZH_4902 = The Landvermesser mast holds a Planar-array High-Gain Antenna and a single Solar Panel for charging the batteries; neither of which should be used for grilling, but those radio waves will likely cook something... eventually.
        #LOC_KSPZH_3113 = LVMR-LV03 Landvermesser Vernier
        #LOC_KSPZH_5416 = This small engine is designed to be mounted to the Landvermesser as a set of three. It is a fairly efficient early design, but far too fragile to be mounted on a stack.
        #LOC_KSPZH_4724 = SurveyorOrbiter Upgrade
        #LOC_KSPZH_3680 = OTWS Weather Satellite
        #LOC_KSPZH_3892 = Primitive, spin stabilized bus designed to serve as an experimental weather satellite. It mounts two television cameras, one with a wide field of view and another with a narrow lens. Placing it in a low orbit will allow it to relay images of things like hurricanes back to KSC, providing early warning to communities in the areas it can see.
        #LOC_KSPZH_4778 = TNSS-GRV1 "NANA" Geodetic Satellite
        #LOC_KSPZH_497 = A robust early satellite for mapping the gravitational fields of planetary bodies. Engineers "borrowed" a TNSS-2A "Walnut" satellite, scooped out all the navigation equipment, and replaced it with geodesy equipment. Includes an upper mount designed for attaching secondary payloads or other desired equipment.
        #LOC_KSPZH_2824 = IW-1 "Trunk" Satellite
        #LOC_KSPZH_746 = A tiny satellite that's designed to study radiation and the magnetic field in the ionosphere and beyond. Designed to be launched as a secondary payload sandwiched between TNSS-4A and SR-1 probes, but it can also be launched by itself as a small payload. Has minimal SAS control with magnetic stabilization. Includes built-in solar panels, antennas, and an aft decoupler.
        #LOC_KSPZH_4196 = SR-I "Lofty" Probe Core
        #LOC_KSPZH_744 = A tiny satellite built out of a SR-1 "Jekyll" probe core. All of the SIGINT surveillance equipment was removed and replaced with ionospheric measurement equipment and a VLF antenna. It is designed to be launched as a secondary (or tertiary) payload, but it can also be launched by itself. Includes a built in decoupler.
        #LOC_KSPZH_3737 = P-20 "Tulip-1" Probe Core
        #LOC_KSPZH_955 = An extended version of the SR-1 "Jekyll" probe core. The P-20 "Tulip-1" pushes this design to its maximum intelligence collection capabilities. Unlike its previous incarnations, the fact this satellite is a SIGINT/ELINT reconnaissance satellite is no longer secret. It is designed to be launched as a secondary (or tertiary) payload, but it can also be launched by itself. Includes a built in decoupler as well as antennas.
        #LOC_KSPZH_3738 = P-24 "Tulip-2" Probe Core
        #LOC_KSPZH_633 = A small satellite that is an evolution of the P-20 "Tulip-1" design. Features a larger profile, more solar panels, and more advanced SIGINT/ELINT reconnaissance technology. Despite intended to be launched 4 at a time on a Belle-D, the P-24 "Tulip-2" can also be launched by itself. Features an upper node where an optional thruster control block can be added for control and orbital adjustment. Includes a built in decoupler and internal antenna.
        #LOC_KSPZH_3739 = P-24 Control Block
        #LOC_KSPZH_573 = A small ammonia micro-thruster control block.
        #LOC_KSPZH_3740 = P-24 Control Block and Antenna
        #LOC_KSPZH_572 = A small ammonia micro-thruster control block with an antenna.
        #LOC_KSPZH_3741 = P-24 Omni Antenna
        #LOC_KSPZH_594 = A small extending antenna for the P-24 "Tulip-2" satellite.
        #LOC_KSPZH_4194 = SR-1 "Jekyll" Probe Core
        #LOC_KSPZH_745 = A tiny satellite that evolved from the Easton-V3 probe core. Small and unassuming, the SR-1 is presented to the public as a scientific satellite to study solar x-rays. However this is a cover for its classified primary mission, to intercept signals from the Krussians. It is designed to be launched as a secondary (or tertiary) payload, but it can also be launched by itself. Includes a built in decoupler as well as antennas.
        #LOC_KSPZH_4195 = SR-8 "Kreplin" Probe Core
        #LOC_KSPZH_956 = An extended version of the SR-1 "Jekyll" probe core. This is a purely scientific satellite, possessing none of the reconnaissance equipment that SR-1 used. Includes experiments to study solar UV and X-Ray emissions, along with other solar activity. This satellite pushes this probe design's scientific capabilities to its limits. That being said, the large amount of experiments on this satellite comes at the cost of science value. It is designed to be launched as a secondary (or tertiary) payload, but it can also be launched by itself. Includes a built in decoupler as well as antennas.
        #LOC_KSPZH_4762 = TNSS-2A "Walnut" Navigation Satellite
        #LOC_KSPZH_495 = A robust early navigational satellite. Includes an integrated solar panel, a very basic internal relay antenna, equipment for mapping the gravitational fields of planetary bodies, and an upper mount designed for attaching secondary payloads or other desired equipment.
        #LOC_KSPZH_4763 = TNSS-4A "Barrel" Navigation Satellite
        #LOC_KSPZH_496 = A robust early navigational satellite. TNSS-4A is also designed to be a test platform for the PB-PANS-3 RTG which can be attached to the lower mount of the satellite. Includes an integrated solar panel, a very basic internal relay antenna, equipment for mapping the gravitational fields of planetary bodies, and an upper mount designed for attaching secondary payloads or other desired equipment.
        #LOC_KSPZH_4764 = TNSS-4A 0.3125m Decoupler
        #LOC_KSPZH_564 = A small 0.3125m decoupler intended for the TNSS-4A satellite. Also provides clearance for the PB-PANS-3 RTG.
        #LOC_KSPZH_4765 = TNSS-5 "Lampshade" Navigation Antenna
        #LOC_KSPZH_598 = A small extending navigational antenna for the TNSS-5 satellite series.
        #LOC_KSPZH_4766 = TNSS-5 "Statum" Satellite Core
        #LOC_KSPZH_747 = A tiny, versatile satellite bus designed to be as compact and light as possible. While one of the smallest of the program, this satellite bus is the most advanced of the TNSS program. While designed for navigation constellations, this satellite bus can be used for a number of things. Includes all the basic necessities that a probe core would have, although to keep it as light as possible it has only minimal SAS control.
        #LOC_KSPZH_4771 = TNSS-5BN Aft Fin Adapter
        #LOC_KSPZH_200 = A 0.3125m adapter intended for the TNSS-5BN satellite. The fins are intended to keep the front of the spacecraft pointing forward in case of reentry, so that its RTG is vaporized on reentry to minimize radioactive material that reaches the surface. This adapter is hollow to allow for equipment to be placed inside. The bottom node includes a built-in decoupler.
        #LOC_KSPZH_4769 = TNSS-5 Gravity Gradient Boom
        #LOC_KSPZH_198 = A 0.125m extending gravity gradient boom. Once extended, the spacecraft will become stabilized due to tidal gravitational effects. This method of stabilization requires no electrical power. Adds additional SAS control.
        #LOC_KSPZH_4772 = TNSS-5BN Gravity Gradient Boom
        #LOC_KSPZH_199 = A 0.125m extending gravity gradient boom. Once extended, the spacecraft will become stabilized due to tidal gravitational effects. This method of stabilization requires no electrical power. Adds additional SAS control. This version also has a small amount of solar cells to power a light on the end of the gravity gradient boom to aid in ground tracking.
        #LOC_KSPZH_4774 = TNSS-5E Extending Magnetometer Experiment
        #LOC_KSPZH_5289 = This instrument is used for measuring a planet's magnetic field. Requires the separate "TNSS-5E Magnetometer Equipment Device" to be on board the vessel to function.
        #LOC_KSPZH_4775 = TNSS-5E Magnetometer Equipment Device
        #LOC_KSPZH_301 = A device required for the TNSS-5E Magnetometer experiment to function.
        #LOC_KSPZH_4773 = TNSS-5BN Power and Communications Section
        #LOC_KSPZH_5305 = This is a section of the TNSS-5BN satellite that combines the power unit, a PB-PANS-9 Radioisotope Thermoelectric Generator with a navigation antenna ground plate. Perfect for nuclear powered navigation satellites.
        #LOC_KSPZH_3766 = PB-PANS-9 Radioisotope Thermoelectric Generator
        #LOC_KSPZH_672 = A small, modular electric generator. Learning from the design of the previous PB-PANS-3 RTG, engineers have made a much more sophisticated electrical generator. This RTG occupies the middle ground between the PB-PANS-3 and the PB-PANS-19 radioisotope thermoelectric generators.
        #LOC_KSPZH_4768 = TNSS-5 Double-Sided Solar Panel
        #LOC_KSPZH_4776 = TNSS-5E Solar Experiment Package
        #LOC_KSPZH_565 = A small 0.3125m platform for solar science.
        #LOC_KSPZH_4767 = TNSS-5 Advanced Navigation Antenna
        #LOC_KSPZH_440 = A more advanced version of TNSS-5's navigational antenna.
        #LOC_KSPZH_4770 = TNSS-5 STOT Cradle
        #LOC_KSPZH_4966 = The STOT ("Stacked TNSS on TNSS") cradle is an epoxy structure capable of supporting the weight of a second TNSS-5 satellite on top of it, allowing for two TNSS-5 satellites to be launched together. This cradle is fixed to one satellite and includes a built-in decoupler on the top node to separate a second TNSS-5 satellite.
        #LOC_KSPZH_4777 = TNSS-5E Ultraviolet Telescope
        #LOC_KSPZH_661 = A small, cheap, and compact telescope designed to take measurements in the UV spectrum.
        #LOC_KSPZH_2550 = HLR-TRYP Probe Core
        #LOC_KSPZH_983 = An unusually shaped standard probe core for unusually shaped satellites.
        #LOC_KSPZH_4590 = Spartan/B-LDD Bioshield Decoupler
        #LOC_KSPZH_4698 = Structural adapter for the Spartan Lander's Bioshield. Connects to the top of the core. The bottom node includes a decoupler, for jettisoning the truss and the lower bioshield after the lander has departed. The staging is disabled on the decoupler by default, to minimize accidents.
        #LOC_KSPZH_4597 = Spartan/O-PCC Probe Core
        #LOC_KSPZH_4592 = Spartan/O-HGA High Gain Antenna
        #LOC_KSPZH_4594 = Spartan/O-LTA Launch Adapter
        #LOC_KSPZH_853 = Aft adapter for the Spartan Orbiter, connecting it to the upper stage. Mounts to the bottom of the core.
        #LOC_KSPZH_4593 = Spartan/O-LGG Low Gain Omni Antenna
        #LOC_KSPZH_534 = A simple reliable omnidirectional low gain antenna for the Spartan/O probe.
        #LOC_KSPZH_4598 = Spartan/O-PSD Propulsion Module
        #LOC_KSPZH_3157 = Large propulsion module for probes, sufficient to bring the Spartan probe complex to orbit around Duna. Include liquid fuel, oxidizer, and a gimballing engine. Attaches to the bottom of the probe core.
        #LOC_KSPZH_4599 = Spartan/O-RSP "Voyeur" Scanning Platform
        #LOC_KSPZH_5051 = The main science instrumentation for the Spartan/O probe, this science platform includes telephoto cameras, an infrared radiometer, and an infrared spectrometer.
        #LOC_KSPZH_4595 = Spartan/O-NTSP Folding Solar Panel
        #LOC_KSPZH_3661 = Non-tracking solar panel with attitude control jets on the tip. The control jets are configured by default for roll and yaw only. Can be switched from the standard angled fold to a straight vertical storage position.
        #LOC_KSPZH_4596 = Spartan/O-NTSP.R Relay Solar Panel
        #LOC_KSPZH_3660 = Non-tracking solar panel with attitude control jets on the tip. Includes a relay antenna, for communicating with the lander on its way to the surface.
        #LOC_KSPZH_4591 = Spartan/O-CST "Calliope" Precision Star Tracker
        #LOC_KSPZH_4755 = TC-1 "Midge" Auxiliary Engine
        #LOC_KSPZH_578 = A small bipropellant engine that can serve a multitude of purposes including orbit trimming, auxiliary propulsion, or primary propulsion for small probes.
        #LOC_KSPZH_3647 = Nomad-DG1 Boom Sampler
        #LOC_KSPZH_259 = A boom with a scoop to scoop soil. And hopefully discover something interesting about the surface of other planets.
        #LOC_KSPZH_3629 = Nomad ALX-256 Panoramic Camera System
        #LOC_KSPZH_353 = A high quality panoramic camera to send those beautiful images back home from your robotic landers.
        #LOC_KSPZH_3630 = Nomad C7C-2 Command Antenna
        #LOC_KSPZH_1827 = Command and control antenna for the Nomad lander. Fixed design so it can receive signals from the orbiter's relays throughout the descent.
        #LOC_KSPZH_3607 = NMD-14 "Nomad" Lander Core
        #LOC_KSPZH_2204 = Evolved from the Landvermesser, the Nomad Lander can carry a substantial science payload down to the surface of bodies with thin atmospheres. Outfitted with large batteries and a capacious fuel tank. A floating lower attach node has decouple functionality and is used to attach to the heatshield.
        #LOC_KSPZH_4782 = TR33 "Halberd" Descent Engine
        #LOC_KSPZH_5236 = This engine is designed for propulsive landing on bodies with thin atmospheres. The engine bell is canted outwards and shaped to reduce dust being kicked up at the landing site. The engine does not gimbal so make sure to bring an attitude control system and to use in a symmetry group of at least 3 engines. The engine runs on monopropellant which is found to be less likely to contaminate landing sites than bipropellant exhaust.
        #LOC_KSPZH_3640 = Nomad-A11 Auger Drill
        #LOC_KSPZH_5200 = This auger type drill does not penetrate very deep but can obtain surface samples deeper than a soil scoop.
        #LOC_KSPZH_3648 = Nomad-HG14 High Gain Antenna
        #LOC_KSPZH_2680 = High data rate dish for transmitting science.
        #LOC_KSPZH_3651 = Nomad-LTG3 Landing Leg
        #LOC_KSPZH_729 = A sturdy retracting landing leg, perfect for landing on other bodies. Includes attitude control jets and adjustable friction pads. RCS disabled by default, and toggles with the Gear action group. Use the Gear action group (default keybind: G) after seperating from the heat shield.
        #LOC_KSPZH_3650 = Nomad-LRS Hydrometer
        #LOC_KSPZH_5293 = This instrument measures a planet's atmosphere for moisture, one of the most important substances known to Kerbalkind, and a building block of life as we know it. Also useful for washing the ship before takeoff. Includes a bonus thermometer.
        #LOC_KSPZH_3659 = Nomad-SSP4 Parachute
        #LOC_KSPZH_4714 = Supersonic parachute. Configured by default for thin atmospheres with very low pressure and high altitude for deployment. Its suggested to bring an engine or three for propulsive landing for final touchdown or things might get bumpy.
        #LOC_KSPZH_3655 = Nomad-PSMS Passive Air Sampler
        #LOC_KSPZH_5295 = This instruments combines an atmospheric mass spectrometer, barometer, and atmosphere analysis instrument.
        #LOC_KSPZH_3634 = Nomad Lander RDLT-45 Radar Altimeter Science Package
        #LOC_KSPZH_5226 = This disk shaped radar altimeter dish can be used to map the surface height of the body below. Also features a basic gravity sensor and accelerometer.
        #LOC_KSPZH_3653 = Nomad-NMK2 Radioisotope Thermoelectric Generator
        #LOC_KSPZH_977 = An oddly angled RTG designed to attach to the Nomad lander at a corner. Also has a variant to attach it to a flat surface.
        #LOC_KSPZH_3637 = Nomad SMD-24 Mount
        #LOC_KSPZH_2915 = Just a simple frame covered in fabric, this mount with built in decoupler is sized specifically to attach the Staara 24 motor to the Nomad Lander core.
        #LOC_KSPZH_3609 = NMD-AS8 Annular Solar Panel
        #LOC_KSPZH_1005 = Annular solar panel designed to attach in an array of eight to the corners of the "Nomad-SEM8 Service Module".
        #LOC_KSPZH_3652 = Nomad-MSO3 Atmospheric Mass Spectrometer
        #LOC_KSPZH_5183 = This atmospheric mass spectrometer can analyze the compositon of the atmosphere of the body below from orbit.
        #LOC_KSPZH_3641 = Nomad-ASB36 Capsule Backshell
        #LOC_KSPZH_2275 = Featuring a built in decoupler, this backshell together with the accompanying heatshield can encapsulate a planetary lander in a cosy contamination free environmnet until its time to deorbit. The Backshell is intended to be retained by the orbiter.
        #LOC_KSPZH_3608 = NMD-73 "Nomad" Probe Core
        #LOC_KSPZH_4930 = The Nomad 73 probe core is a top of the line bus designed for prestigous planetary science missions. This unit is equipped with large batteries, advanced SAS modes and a recess for an atmospheric lander capsule. A flat top option is also available for more versatility.
        #LOC_KSPZH_3646 = Nomad-CR64 Cosmic Ray Detector
        #LOC_KSPZH_3633 = Nomad Heat Shield
        #LOC_KSPZH_4102 = Roughly 3.6m heat shield for the Nomad lander. Has built in RCS jets and a store of monopropellant for atttitude control during deorbit and entry until the lander can take over after separation. RCS disabled by default, and toggles with the action group Custom 10. Use the Custom 10 action group (default keybind: 0) after seperating from the backshell.
        #LOC_KSPZH_3644 = Nomad-CDR18 High Gain Dish Antenna
        #LOC_KSPZH_3876 = Powerful relay antenna for the Nomad Orbiter with homeworld tracking. Features an optional receptacle that allows the dish to be placed flat against a surface.
        #LOC_KSPZH_3643 = Nomad-CDR130 High Gain Dish Antenna
        #LOC_KSPZH_5476 = This upgraded high gain antenna for the Nomad orbiter is as wide as the probe itself! Attaches to the same point as the standard high gain dish but folds underneath instead. Features cutouts for the spacecraft adapter attachement points and the engines. Hopefully the holes dont affect the perfomance too much! Features homeworld tracking.
        #LOC_KSPZH_3649 = Nomad-LGA22 Low Gain Antenna
        #LOC_KSPZH_525 = A simple deployable low gain, omni directional antenna.
        #LOC_KSPZH_3631 = Nomad HLR-NMD-EP5 Folding Magnetometer Boom
        #LOC_KSPZH_5299 = This interestingly shaped hoop magnetometer is designed to study magnetohydrodynamic waves and other magnetic field structures in orbit. Derived from an instrument used on the HLR-OOG Sansisco probe.
        #LOC_KSPZH_3645 = Nomad-CDR9 Medium Gain Antenna
        #LOC_KSPZH_253 = A backup relay antenna for the Nomad orbiter, this medium gain dish features homeworld tracking.
        #LOC_KSPZH_3654 = Nomad-P1NG-3MD Micrometeoroid Detector
        #LOC_KSPZH_3728 = Our scientists think space might not be as empty as we once thought. This device contains a plate for measuring the impacts of 'micrometeoroids', the little pieces of debris and particles that travel through open vacuum at thousands of meters per second. Measuring the number of impacts gives us an idea of how dangerous an area of space may be for our ships.
        #LOC_KSPZH_3632 = Nomad HLR-NMD-SM6 Folding Soil Moisture Sensor Boom
        #LOC_KSPZH_5294 = This instrument measures neutron albedo to try to detect moisture in the soil below.
        #LOC_KSPZH_3610 = NMD-PM200 Propulsion Module
        #LOC_KSPZH_260 = A capacious propulsion module for the Nomad probe orbiter with large fuel tanks, attachment points for primary and secondary engines, and even solar panels. Designed to fit inside of the NMD-SM "Nomad" Service Module. The pressurisation spheres might poke out the top into the probe core above.
        #LOC_KSPZH_3657 = Nomad-PSP-VMP Planetary Scan Platform
        #LOC_KSPZH_889 = All of the orbital science package for the baseline Nomad orbiter is contained in this mega instrument. Features a set of vidicon cameras, infrared spectrometers, an ultraviolet spectrometer, and an infrared radiometer.
        #LOC_KSPZH_3656 = Nomad-PSP-FCMP Improved Planetary Scan Platform
        #LOC_KSPZH_5605 = Upgraded orbital science package for the Nomad orbiter . Features mostly the same instruments as the baseline version including infrared spectrometers, an ultraviolet spectrometer, and an infrared radiometer. However the primary imaging system has been upgraded from Vidicons to a high resolution film camera and accompanying built in scanner.
        #LOC_KSPZH_3635 = Nomad Lander Relay Antenna
        #LOC_KSPZH_5419 = This small relay antenna allows Nomad to stay in contact with it's lander probe.
        #LOC_KSPZH_3658 = Nomad-SEM8 Service Module
        #LOC_KSPZH_276 = A convenient service module for the Nomad probe system, this unit has built in RCS booms for attitude control, space to attach a propulsion system and plenty of surface area for science instruments and other support equipment.
        #LOC_KSPZH_3628 = Nomad 4QS Fixed Solar Panel
        #LOC_KSPZH_319 = A flat solar panel designed to attach to the bottom of the Nomad orbiter's propulsion module.
        #LOC_KSPZH_3638 = Nomad SPS Solar Plasma Sampler
        #LOC_KSPZH_5291 = This instrument is used to measure the composition of the solar wind plasma.
        #LOC_KSPZH_3639 = Nomad XRI Solar X-ray Imager
        #LOC_KSPZH_571 = A small X-ray imager for Nomad.
        #LOC_KSPZH_3642 = Nomad-BD-SPM-4.25 Spacecraft Adapter
        #LOC_KSPZH_501 = A roughly 4.25m truss spacecraft adapter and built in decoupler designed specifically for the Nomad spacecraft.
        #LOC_KSPZH_3636 = Nomad Precision Star Tracker
        #LOC_KSPZH_351 = A high precision star tracker designed for the Nomad probe core. Place over the constellation marking on the Nomad-SEM8 Service Module.
        #LOC_KSPZH_5718 = Y0-Y0 De-Spin Device
        #LOC_KSPZH_648 = A small weight that when staged will move outwards on a rigid pole and then detach. Given angular momentum = mass * velocity * radius, increasing radius will decrease angular velocity since momentum is conserved. Technically this is not a yoyo despin device because there is no "snap" when the weight is fully extended stopping or reversing the spin. Always attach in symmetry. In typical use, a 0.3125 Spin Motor Decoupler is attached to the bottom of the kick motor (Staara 20), and the Despin Device is attached to the side of the kick motor or payload. First the spin motor "spins up" the vessel, then the kick motor is fired. When the kick motor completes its burn, the Despin Device is deployed to slow the spin rate back down.
        #LOC_KSPZH_3791 = Pathfinder-BCN "Bloon" Satellite
        #LOC_KSPZH_5125 = This 0.125m probe core is derived from the Pathfinder-1 "Sienno" probe core. Instead of Pathfinder-1's geiger counter, Pathfinder-BCN houses an inflatable "balloon" experiment for use in space. This experiment is intended to make atmospheric density measurements in Kerbin orbit. Also has a small apogee kick motor built into the nose as well as an omni antenna.
        #LOC_KSPZH_3787 = Pathfinder-1 "Sienno" Satellite
        #LOC_KSPZH_5124 = This 0.125m probe core integrates an omni antenna and a geiger counter for measuring radation. Attaches to the top of the "Vicenza" solid motor.
        #LOC_KSPZH_2195 = Etoh-C Guidance Unit
        #LOC_KSPZH_2503 = Guidance core for the Etoh-C Rocket with built in RCS jets. Includes a bottom decoupler, to separate from the core stage and align the high speed stages for orbital insertion.
        #LOC_KSPZH_2196 = Etoh-C Nose Cone
        #LOC_KSPZH_5369 = This nose cone comes with an optional built in decoupler for attaching the "Vicenza" high speed stages to the booster. Optionally it can be cut down for use as a more traditional 1.25m to 0.625m adapter.
        #LOC_KSPZH_2188 = Etoh-140-TU "Sandstone" Liquid Fuel Engine
        #LOC_KSPZH_5385 = This primitive booster engine was originally designed to run on alcolox. Initially used on the Sandstone ballistic missile, the engine would later be upgraded to use a more volatine Hydyne fuel. The engine was also used on the Hermes Sandstone launch vehicle but the designers went back to the safer although less performant Alcolox mix. The shroud includes vanes below the nozzle that deflect the engine exhaust, allowing for primitive thrust vectoring. Includes a slightly lighter shroudless version, without any thrust vectoring.
        #LOC_KSPZH_2194 = Etoh-AVRT Air Vane
        #LOC_KSPZH_581 = A small control fin with two RCS jets built into the base.
        #LOC_KSPZH_2193 = Etoh-AF Aerodynamic Fin
        #LOC_KSPZH_5175 = This aerodynamic fin.
        #LOC_KSPZH_2197 = Etoh-CS Control Surface
        #LOC_KSPZH_5174 = This aerodynamic fin includes a control surface, to help keep your rocket going the right way. It also includes a thrust vane, but you don't want to know about that.
        #LOC_KSPZH_2189 = Etoh-1400 Liquid Fuel Tank
        #LOC_KSPZH_5128 = This 1.25m tank was originally over twice as long as the FLT-800. You aren't ready for this kind of power. Maybe we'll have to take it away from you.
        #LOC_KSPZH_2198 = Etoh-H Guidance Unit
