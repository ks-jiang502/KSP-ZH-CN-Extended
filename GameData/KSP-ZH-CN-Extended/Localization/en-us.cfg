        #LOC_KSPZH_4143 = SG9-RV2 Return Capsule Parachute
        #LOC_KSPZH_421 = A medium sized parachute for SG-9 Return Capsules. Makes you wonder if its possible to catch the capsule mid air... Includes a manually operated decoupler for separating the retro motor from the rest of the pod once the retro burn is accomplished.
        #LOC_KSPZH_4145 = SG9-RV8 Return Capsule Retro Pack
        #LOC_KSPZH_387 = A larger retro pack to deorbit the upgraded SG-9 Return Capsules. Make sure to decouple with the capsule facing the correct orientation for the retro burn - the RCS pack (disabled by default) really only has enough monopropellant for spin stabilization.
        #LOC_KSPZH_4147 = SG9-SPS "Tanya" Service Engine
