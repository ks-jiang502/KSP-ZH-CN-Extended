        #LOC_KSPZH_1843 = Condor-MMEP Micrometeorite Impact Experiment Wing
        #LOC_KSPZH_757 = A very large panel designed to monitor and record micrometeorite impacts. This advanced experiment can map the density and distribution of micrometeorites in planetary orbits.
        #LOC_KSPZH_1845 = Condor-SSP2 Solar Panel
