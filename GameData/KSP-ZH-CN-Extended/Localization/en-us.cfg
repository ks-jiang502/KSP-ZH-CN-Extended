        #LOC_KSPZH_1006 = Anomalous Signal Sensor
        #LOC_KSPZH_5422 = This small sensor is designed to scan for anomalous signals across several regions of the electromagnetic spectrum. You must be within 250m of the signal to obtain science results; use it from further out to obtain an estimate of the range and distance to the signal. For the best results, return the device to the KSC for further study.
        #LOC_KSPZH_4710 = Submersible Oceanography and Bathymetry
        #LOC_KSPZH_5614 = Use this submersible science package to explore the uncharted depths of the oceans. Data can be collected above and below the depth threshold to maximize science gain.
        #LOC_KSPZH_2206 = ExoKerbol Core Drill
        #LOC_KSPZH_4872 = The ExoKerbol Core Drill (XKCD) is designed to collect subsurface core samples to search for signs of biological activity on atmospheric planets. Three drill core samples can be stored in the incubation chambers for return. Check drill animator orientation with the preview in the VAB/SPH.
        #LOC_KSPZH_2125 = Dynamic Albedo of Neutrons
        #LOC_KSPZH_4865 = The Dynamic Albedo of Neutrons instrument scans the upper layers of the surface to detect any hydrogen molecules within, specifically searching for water.
        #LOC_KSPZH_4719 = Surface Ablation Laser Light Imager
        #LOC_KSPZH_3881 = Presenting the latest in laser based geological science. This device is capable of vaporizing surface samples to study their composition and expose hidden layers of the surface for further study. Warning: DMagic Orbital Science does not condone the use of this laser in any space combat related hijinks, please refrain from such activities.
        #LOC_KSPZH_3484 = Micro Goo Containment Pod
        #LOC_KSPZH_824 = Advances in materials science have allowed for the construction of a tiny goo pod capable of storing two independent samples simultaneously.
        #LOC_KSPZH_4112 = SC-901 Science Micro
        #LOC_KSPZH_3624 = New construction techniques have allowed the standard SC-9001 to be built in a new, compact enclosure capable of storing two samples simultaneously.
        #LOC_KSPZH_4369 = Seismic Sensor Pod
        #LOC_KSPZH_4972 = The Seismic Sensor Pod is designed to be used in conjunction with the DMagic Seismic Impact Hammer. Place at least two pods at variable distances away from the impact hammer using the built-in decoupler mechanism (the pod has a very high impact tolerance) or by placing them on a separate vessel.
        #LOC_KSPZH_4368 = Seismic Impact Hammer
        #LOC_KSPZH_4971 = The Seismic Impact Hammer is used to generate seismic waves that provide information about a planet's interior. Use in conjunction with one or more Seismic Sensor Pods to maximize science return. The hammer must impact the surface for the experiment to succeed.
        #LOC_KSPZH_5716 = XRD Surface Analyzer
        #LOC_KSPZH_5276 = This instrument collects a small surface sample and determines its exact mineral composition through powder X-Ray diffraction. Because Kerbals don't trust what they can't see the chamber has been filled with a special scintillation gas to allow for easy visibility of the X-Ray beam. The drill must contact the surface to obtain a usable sample; perform adequate tests before launch!
        #LOC_KSPZH_5587 = Univ. Storage - ASERT
        #LOC_KSPZH_5593 = Univ. Storage - Mystery Goo Containment
        #LOC_KSPZH_5475 = This unit was something one of our engineers came upon while dumpster divin-- Erm, while researching alternative applications for existing technologies. It's a sealed container which appears to be filled with a strange looking substance. We couldn't reach in or break the canister open, but watching how the Goo behaves when subjected to different situations could be very educational.
        #LOC_KSPZH_5597 = Univ. Storage - SC-9001 Science Jr.
        #LOC_KSPZH_4992 = The US-SC-9001 is a cutting edge, self contained laboratory. Have you ever wondered what happens to something in zero G? Or, have you ever pondered the truly meaningful questions? Such as what would happen if I exposed this to the rigors of stellar radiation and an unforgiving vacuum? Comes with complimentary notepad. Recommended for ages 4-8. Small parts inside make it not suitable for small children.
