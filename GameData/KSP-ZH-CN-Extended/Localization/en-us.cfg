        #LOC_KSPZH_1382 = Big Brother Stereo Surveillance Camera
        #LOC_KSPZH_1939 = DMagic
        #LOC_KSPZH_5170 = This advanced surveillance camera features two telescopes designed to capture stereographic images while sweeping 90 degree bands of the surface. It includes four non-reusable film cannisters and has extensive on-board processing capabilities. Use this when only the best spy photos of the surface will suffice. Can be used at up to five times the normal low orbit altitude.
        #LOC_KSPZH_3734 = Oversize Signals Intelligence Satellite
        #LOC_KSPZH_332 = A grossly oversized radio signals intelligence dish that can be used for listening in to every imaginable from of communication, discovering radio anomalies on a planet's surface, or just impressing your neighbor. Warning: Dish is FRAGILE; it is NOT for use in the atmosphere; CANNOT be retracted! Can be used at up to five times the normal low orbit altitude. This instrument can also be used as a powerful communications antenna.
        #LOC_KSPZH_331 = A grossly oversized radio signals intelligence dish that can be used for listening in to every imaginable from of communication, discovering radio anomalies on a planet's surface, or just impressing your neighbor. This instrument also servers as a nose cone, and uses deployable fairing shrouds. Warning: Dish is FRAGILE; it is NOT for use in the atmosphere; CANNOT be retracted! Can be used at up to five times the normal low orbit altitude. This instrument can also be used as a powerful communications antenna.
        #LOC_KSPZH_5579 = Undersize Signals Intelligence Satellite
        #LOC_KSPZH_427 = A mildly oversized radio signals intelligence dish that can be used for listening in to every imaginable from of communication, discovering radio anomalies on a planet's surface, or just impressing your neighbor. Warning: Dish is FRAGILE; it is NOT for use in the atmosphere; CANNOT be retracted! Can be used at up to five times the normal low orbit altitude. This instrument can also be used as a powerful communications antenna.
        #LOC_KSPZH_3306 = Little Brother Surveillance Camera
        #LOC_KSPZH_5410 = This single-camera surveillance telescope features a continuously panning aperture that covers 110 degree bands of the surface. This model features two non-reusable film cannisters and has limited on-board processing capabilities. Use for obtaining detailed photos of the surface or spotting any unusual features. Can be used at up to five times the normal low orbit altitude.
        #LOC_KSPZH_1174 = Asteroid Sounding Experiment by Radiowave Transmission
        #LOC_KSPZH_4830 = The ASERT is an asteroid-only experiment used to study the interior composition of asteroids. It must be paired with a second module placed on the opposite side of an asteroid. When two modules are properly positioned the experiment can be conducted with the science amount dependent on how much of the asteroid the signal passed through.
        #LOC_KSPZH_2345 = GORESat
        #LOC_KSPZH_4884 = The Global Orbital Radiance Experiment Satellite (GORESat) monitors the total light reflected from a planet's surface across multiple wavelengths using four cavity radiometers. Can only be used from high orbit.
        #LOC_KSPZH_3568 = Multi-Spectral Imaging Platform
        #LOC_KSPZH_5361 = This multi-spectral imaging platform is used to study the surface and composition of planets. Use only in orbit.
        #LOC_KSPZH_3413 = Magnetometer Boom
        #LOC_KSPZH_5045 = The magnetometer instruments are used to determine the magnitude and direction of planetary magnetic fields. The long boom separates these instruments from any interference caused by magnetic elements in the probe. Use in low to high orbit or on the surface. Not for use during atmospheric flight.
        #LOC_KSPZH_4026 = RPWS Antenna
        #LOC_KSPZH_4947 = The Radio and Plasma Wave Science instrument measures electrostatic and electromagnetic fields generated by the interaction of planetary magnetospheres and the interplanetary plasma medium. Deploy and use while in low to high orbit. Not for use during atmospheric flight or surface deployment.
        #LOC_KSPZH_3703 = Orbital Telescope
        #LOC_KSPZH_5464 = This telescope makes things that are far away look like they are less far away. Use in low to high orbits. Not for use during atmospheric flight or on the surface.
        #LOC_KSPZH_4532 = Soil Moisture Sensor
        #LOC_KSPZH_5375 = This orbital sensor deploys a large L-band microwave detector comprised of 82 individual antenna elements. It can be used to study the water content of the upper soil layers and the salinity levels of large water features. Can only be used in low orbit. This instrument can also be used as a powerful communications antenna.
        #LOC_KSPZH_4538 = Solar Particle Collector
