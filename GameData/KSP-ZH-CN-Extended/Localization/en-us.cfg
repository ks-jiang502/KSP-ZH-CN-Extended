        #LOC_KSPZH_1391 = Bigby Instrument Unit
        #LOC_KSPZH_1491 = Built at part of the partnership with Bigby Tools, the Bigby Instrument Unit provides a 3.75m probe core that literally fills the gap between 2.5m probe cores and 3.75m probe cores. Its batteries will last about 10 minutes. Not to be used as a giant basketball hoop.
        #LOC_KSPZH_5525 = Titan Instrument Unit V2
        #LOC_KSPZH_1390 = Bigby Inline Radiator
        #LOC_KSPZH_4708 = Sub-contracted to Bigby Tools, connect this radiator to the end of a station module in order to provide cooling. There's a small amount of MonoPropellant storage, just in case. It also makes a great patio.
        #LOC_KSPZH_4684 = Station Logistics Hub
        #LOC_KSPZH_1492 = Built from several Coaches stacked together, this module is a logistics hub that can serve as a cornerstone for a space station. The hub has a small amount of storage capacity as well as probe core components "borrowed" from a Stayputnik. As long as nobody notices the missing components, everything will be fine. You'll find a little extra something in your sales brochure, you didn't see nothing.
