        #LOC_KSPZH_2199 = Etoh-L "Aussat" Probe Core
        #LOC_KSPZH_389 = A leftover reentry test vehicle turned into an scientfic satellite. Equipped with experiments to measure the ionosphere, Kerbin's ultraviolet halo, and solar x-ray emissions.
        #LOC_KSPZH_1241 = BD-AFB-AS Alphastar Fairing Base SAF
