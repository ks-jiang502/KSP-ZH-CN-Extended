        #LOC_KSPZH_2858 = Inon-TG-ACS Avionics and Control System
        #LOC_KSPZH_127 = 2.5m avionics segment for the Inon G/G'/T upper stages, includes a control core, reaction wheels, batteries, and a small amount of fuel. It also serves as the structural adapter for the payload.
