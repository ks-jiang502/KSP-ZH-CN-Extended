        #LOC_KSPZH_5548 = Tower Umbilical Droop 5A - Extra Large
        #LOC_KSPZH_5549 = Tower Umbilical Droop 5B - Extra Large
        #LOC_KSPZH_5552 = Tower Umbilical Straight 3 - Large
        #LOC_KSPZH_3177 = Large-size animated drop umbilical pipe for the general and specialty towers, available in 4 colors. The mount also has 2 size options, the normal short one and an extended beam long version, both with 8 color options. The umbilical can be adjusted in length by using the deploy limit slider. Animation can be either staged or done manually/action-grouped.
        #LOC_KSPZH_5551 = Tower Umbilical Straight 2 - Medium
        #LOC_KSPZH_3452 = Medium-size animated drop umbilical pipe for the general and specialty towers, available in 4 colors. The mount also has 2 size options, the normal short one and an extended beam long version, both with 8 color options. The umbilical can be adjusted in length by using the deploy limit slider. Animation can be either staged or done manually/action-grouped.
        #LOC_KSPZH_5550 = Tower Umbilical Straight 1- Small
        #LOC_KSPZH_4525 = Small-size animated drop umbilical for small service towers and crew elevators, with 4 color options for the pipe. The the mount can be switched between the standard short type and a long beam type for more clearance, and both have 8 color options. The pipe can be adjusted in length by using the deploy limit slider. Animation can be either staged or done manually/action-grouped.
        #LOC_KSPZH_3193 = Launch Plate Energia
        #LOC_KSPZH_700 = A specialized rectangular launch plate for the new TantaresLV Energia rocket. It sits flush with the launch pad; put the dark lower section under the VAB floor to ensure proper positioning. The Plate has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_2263 = Falcon 9 Launch Plate
        #LOC_KSPZH_699 = A specialized rectangular launch plate designed for Falcon 9 and Falcon Heavy-style rockets. Insert sections can be turned off for Falcon Heavy/tri-core rockets. The plate can accomodate the Large General Fallback Tower, attached to the node on the wider side of the plate. Use the Medium General Drop-Arm Hold-Downs for Falcon 9-sized (2.5m) rockets. There is also a special tower attach node for the Shuttle FSS Tower with Rodan Crew Arm. The plate also has rotattion options, to enable proper rotation of a non-square launch clamps. The plate has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3194 = Launch Plate N1
        #LOC_KSPZH_696 = A specialized giant-sized round launch plate for the new TantaresLV N1 rocket. It sits flush with the launch pad; put the dark lower section under the VAB floor to ensure proper positioning. The Plate has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3195 = Launch Plate Size 1 Round
        #LOC_KSPZH_759 = A very low profile minimalist round launch clamp base, the launch plate sits flush with the launch pad; put the dark lower section under the VAB floor to ensure proper positioning. The Plate has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3197 = Launch Plate Size 2 Round
        #LOC_KSPZH_3199 = Launch Plate Size 3 Round
        #LOC_KSPZH_3196 = Launch Plate Size 1 Square
        #LOC_KSPZH_760 = A very low profile minimalist square launch clamp base, the launch plate sits flush with the launch pad; put the dark lower section under the VAB floor to ensure proper positioning. Square or rectangular exhust hole configurations can be selected. The Plate has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3198 = Launch Plate Size 2 Square
        #LOC_KSPZH_3200 = Launch Plate Size 3 Square
        #LOC_KSPZH_845 = Aerobee Launch Stand
        #LOC_KSPZH_705 = A specialty launch stand for the Aerobee and other small sounding rockets, inspired by two versions of the real Aerobee launch tower. The Aerobee was indeed placed inside the tower onto a rail. This is actually a launch clamp, and the clamp parts can be turned off for a better look. The tower has both triangular and square styles with multiple height variants. The launch rail inside is purely cosmetic with no collider, and its position can be adjusted with the slider. The optional cover structure has 4 height variants. Tower has 9 color options.
        #LOC_KSPZH_1190 = Atlas-Agena Service Tower
        #LOC_KSPZH_703 = A specialized single-piece service tower for the Atlas-Agena rocket. The tower section has 6 height options. The tower has 8 color options as well. Uses the separate Atlas-Agena Umbilical Arm, which attaches to the node on the cut-out on the front of the tower.
        #LOC_KSPZH_1195 = Atlas-Centaur I/II Umbilical Arm 1
        #LOC_KSPZH_1001 = Animated retracting umbilical arm for the Atlas-Centaur I/II Service Tower. This is the upper arm, and the umbilicals are placed on the flared base of the 4m fairing that was also used with the Atlas V. Alternate straight-on umbilical ends are also available. This arm retracts to the left when looking at the rocket from the tower. The arm beam has 8 color options. The arm can be retracted either by manual toggling the animation or by staging.
        #LOC_KSPZH_1196 = Atlas-Centaur I/II Umbilical Arm 2
        #LOC_KSPZH_1000 = Animated retracting umbilical arm for the Atlas-Centaur I/II Service Tower. This is the middle arm, and the umbilicals are placed so they are straddling the bottom of the Centaur stage and the top of the interstage. This arm retracts to the right when looking at the rocket from the tower. The arm beam has 8 color options. The arm can be retracted either by manual toggling the animation or by staging.
        #LOC_KSPZH_1198 = Atlas-Centaur I/II Wind Damper Arm 3
        #LOC_KSPZH_1002 = Animated retracting wind damper arm for the Atlas-Centaur I/II Service Tower. This is the lower arm, and the end connector is placed just above the bottom of the Atlas I/II interstage. This arm retracts downwards at launch. The arm beam has 8 color options. The arm can be retracted either by manual toggling the animation or by staging.
        #LOC_KSPZH_1181 = Atlas Launch Stand Alternate
        #LOC_KSPZH_438 = A modified version of the Atlas Launch Stand without a frame and with separately adjustable center and side section. The stand has 8 color options, and the clamp arms and side umbilicals have 2 color options. The side umbilicals and Atlas pipe connectors can be toggled off for use with other 1.875m diameter rockets. The stand also has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_1180 = Atlas Launch Stand
        #LOC_KSPZH_697 = A specialized launch stand for the Atlas SLV and derivatives from Bluedog Design Bureau, based on the real launch mount that the Atlas used. The stand has 8 color options, and the clamp arms and side umbilicals have 2 color options. The side umbilicals and Atlas pipe connectors can be toggled off for use with other 1.875m diameter rockets. The stand also has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_1182 = Atlas Side Clamp Arm
        #LOC_KSPZH_4371 = Separate standalone version of the Atlas Side Clamp Arm, for use as a hold-down with other launch bases and plates. The arm has 2 color options, and the mount can be turned off for use with the separate Atlas Side Umbilical. The retraction animation can be be done manually or via staging.
        #LOC_KSPZH_1183 = Atlas Side Umbilical
        #LOC_KSPZH_4372 = Separate standalone version of the Atlas Side Umbilical, for use with other launch bases and plates. The umbilical has 2 color options. The retraction animation can be be done manually or via staging.
        #LOC_KSPZH_1191 = Atlas-Agena Umbilical Arm
        #LOC_KSPZH_1004 = Animated vertical retracting umbilical arm for the Atlas-Agena. Designed to mount on the Atlas-Agena Service Tower, but can be used with other towers as well. The arm's umbilical section has two height variants. It has four integrated animated drop umbilicals (with one being a pair), each with separate color options, and each can be turned off as well. Each umbilical is adjusted vertically and horizontally the associated deploy limit sliders. The arm also has 8 color options. The arm can be retracted either by manual toggling the animation or by staging. Use with the Atlas Launch Stand for best effect.
        #LOC_KSPZH_1772 = Centaur Separate Umbilical Arm 1 - Tall
        #LOC_KSPZH_4374 = Separate version of the tall animated vertical retracting umbilical arm for the Centaur upper stage used on the Atlas SLV-3 rocket, for attaching to the top plates or nodes of other towers. This arm normally straddled the Centaur tank-fairing junction. The arm beam has 8 color options. The arm can be retracted either by manual toggling the animation or by staging. The retractor device behind the arm can be toggled on/off.
        #LOC_KSPZH_1773 = Centaur Separate Umbilical Arm 2 - Short
        #LOC_KSPZH_4373 = Separate version of the short animated vertical retracting umbilical arm for the Centaur upper stage used on the Atlas SLV-3 rocket, for attaching to the top plates or nodes of other towers. This arm normally straddled the Centaur interstage-tank junction. The arm beam has 8 color options. The arm can be retracted either by manual toggling the animation or by staging. The retractor device behind the arm can be toggled on/off.
        #LOC_KSPZH_1192 = Atlas-Centaur D Service Tower
        #LOC_KSPZH_704 = A specialized single-piece service tower for the Atlas-SLV Centaur D rocket. The tower section has 5 height options. The tower has 9 color options as well. Uses the separate Atlas-Centaur Umbilical Arms, which attaches to the node on the top of the tower.
        #LOC_KSPZH_1194 = Atlas-Centaur I/II Service Tower
        #LOC_KSPZH_702 = A specialized single-piece service tower for the Atlas I and II rocket. The tower section has 4 height options and 9 color options as well. Uses the separate Atlas-Centaur I/II Umbilical Arms, which attach to the two nodes on the sides of the tower. The Atlas I/II Wind Damper Arm attaches to the lower center node. The uppermost node on the Mast 3 pipe is for a drop umbilical, there is a specialized Atlas I/II umbilical available but the general umbilicals will work also. There are also optional general arm attach nodes.
        #LOC_KSPZH_1193 = Atlas-Centaur D Umbilical Arms
        #LOC_KSPZH_1003 = Animated twin vertical retracting umbilical arms for the Centaur upper stage used on the Atlas SLV-3 Centaur D rocket. The arms bracket the Centaur stage, with the bottom arm straddling the interdstage-tank division, and the upper arm stradding the tank-fairing junction. Designed to mount on the Atlas-Centaur Service Tower, but can be used with other towers as well. The whole arm frame assembly can be adjusted upward by using the offset gizmo for fine positioning. The upper tall arm (Arm 1) can be adjusted in both horizontal and vertical position using the deploy limit sliders. The lower flat arm can be adjusted horizontally with its slider. The arms and frame also have 8 color options. The arms can be retracted either by manual toggling the animation or by staging. Use with the Atlas Launch Stand for best effect.
        #LOC_KSPZH_1895 = Crew Elevator Mercury-Atlas Umbilical
        #LOC_KSPZH_691 = A special Mercury Spacecraft umbilical for the Mercury-Atlas Crew Elevator, which also doubled as the Launch Umbilical Tower. It attaches to the node on top of the pipe that sits just above the front platform of the elevator tower. The umbilical can be adjusted in lenght with the deploy limit slider. Retraction can be done manually or via staging with Animated Decouplers.
        #LOC_KSPZH_1896 = Crew Elevator Mercury-Atlas, with Hatch
        #LOC_KSPZH_279 = A crew access elevator for small manned spacecraft, inspired by the emergency egress and umbilical tower used for Mercury-Atlas and designed for the Tier 1 launch pad and the Atlas Launch Stand, but can be used with some other launch bases and stands. The elevator tower is a fixed type, with 8 colors available. The stopping height of the elevator car is adjusted with a deploy limit slider. Use with the Mercury-Atlas Elevator Crew Walkway, which attaches to one of the front nodes, and flips up to retract. The separate Mercury Umbilical Mast attaches to a node on the front platform of the tower. Hatch on the elevator car allows an alternate method of travel.
        #LOC_KSPZH_1890 = Crew Elevator Gemini, with Hatch
        #LOC_KSPZH_278 = A crew access elevator for Gemini spacecraft, inspired by the erector used for the Titan II-Gemini. Designed for use with the mtaching Titan II Launch Stand, but also can be used with other Launch Stands, Plates and Bases. The elevator tower fits around the Titan II or other rocket, with the access floor in the top white room fitting close to the capsule. Both the elevator car maximum height and the access floor height can be adjusted with their deploy limit sliders so they match up with each other. The elevator tower has three height variants, and is a downward rotating type, with an exterior elevator car. The front white panels on the tower can be retracted if desired. There is only one color option for the tower. Hatches on the elevator car allow an alternate method of travel.
        #LOC_KSPZH_1897 = Crew Elevator Mercury-Redstone, with Hatch
        #LOC_KSPZH_280 = A crew access elevator for small manned spacecraft, inspired by the rollback gantry used for Mercury-Redstone and designed for the Tier 1 launch pad and the Redstone Launch Stand, but can be used with some other launch bases and stands. The elevator tower is an animated rollback type, with 8 colors available. The stopping height of the elevator car is adjusted with a deploy limit slider. Hatch on the elevator car allows an alternate method of travel.
        #LOC_KSPZH_1903 = Crew Elevator Walkway Mercury-Atlas
        #LOC_KSPZH_5035 = The flip-up crew access walkway for the Mercury-Atlas Crew Elevator. It also has optional mounts for use with the Mini and Small General Crew Elevators. It attaches to one of the front center nodes on the elevator tower. Has 8 color options and three configurations of the capsule hatch interface plate.
        #LOC_KSPZH_1904 = Crew Elevator Walkway Mini
        #LOC_KSPZH_516 = A short flip-up crew access walkway for the Mini General Crew Elevator. It attaches to one of the large center nodes on the elevator tower. Has 8 color options.
        #LOC_KSPZH_2012 = Delta IV Launch Stand / 3.125m-2.5m
        #LOC_KSPZH_706 = A specialty launch stand for the Delta IV rocket, both the single and triple-core versions. By default it is set up for the Delta IV from Bluedog Design Bureau, which has 3.125m diameter core tanks. By adjusting the positions and width of the umbilical masts and hold-down posts with the deploy limit sliders, tank sizes of 2.5m can be accomodated as well. The stand is designed to sit flush on the launch pad surface, so move the stand down until the dark band on the bottom of the large corner support columns is on or slightly extending into the floor of the VAB. The stand has two manual generators that output electric charge and fuel resources. Use with the Delta IV Service Tower for the full LC-37 Delta IV recreation.
        #LOC_KSPZH_2013 = Delta IV Modular Service Tower Core
        #LOC_KSPZH_4633 = Stackable multi-height core section for the modular Delta IV service tower. It has six height options, and additional sections can be stacked by turning off the base frame. Optional side panels in three styles can be selected. The base frame has no colliders on it, so it can be pushed under the VAB floor to help align the tower with the Delta IV rocket.
        #LOC_KSPZH_2014 = Delta IV Modular Service Tower Top
        #LOC_KSPZH_4634 = Stackable top section for the modular Delta IV service tower. It has optional side panels in three styles. Both the Delta IV tower side detail and front truss structure can be toggled on or off. The attach node at top is for the Delta IV Swing Arm 3.
        #LOC_KSPZH_2015 = Delta IV Service Tower - Single Piece
        #LOC_KSPZH_701 = A specialized service tower for the Delta IV, styled after the actual Delta IV Fixed Service Tower at the Cape. It has two height options, default Delta IV height and a 6m extended variant. The front part of the upper external trusswork can be turned off, which all replaces the default Delta IV swing arm nodes with 7 general-type nodes. The base frame has no colliders on it, so it can be pushed under the VAB floor to help align the tower with the Delta IV rocket.
        #LOC_KSPZH_2439 = General Rectangular Launch Stand
        #LOC_KSPZH_326 = A general rectangular node-attached launch clamp, intended for early career, that can accomodate rockets of 2.5m, 1.875m, 1.5m, 1.25m, 0.9375m and 0.625m diameters with two small side boosters. Center and optional outer hold-down support plates can be adjusted in length with their deploy limit sliders. There are different combinations of integrated hold-down bolts and clamp arms, each of which can be adjusted inwards with their deploy limit slider to align with the bottom of a tank or engine mount. The bolts can also be switched between short, tall and extended heights. The extended height bolts have an additional height adjust slider. The stand also has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_2440 = General Round Launch Stand
        #LOC_KSPZH_327 = A general round node-attached launch clamp, intended for early career, that can accomodate rockets of 2.5m, 1.875m, 1.5m, 1.25m, 0.9375m and 0.625m diameters. The stand can be configured as the base flat ring or with a conical extension. Support plates for the integrated hold-downs are configured separately, allowing a mix of bolts and clamp arms. The hold-down bolts are non-animated and have 4 configurations and 3 heights, and can be adjusted inwards with their deploy limit slider to align with the bottom of a tank or engine mount. The extended height bolts have an additional height adjust slider. There are optional integrated side clamps available in different configurations, and are also adjusted with their deploy limit slider. The stand also has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_4073 = Redstone Launch Stand Petal Cover / 1.5m
        #LOC_KSPZH_996 = Animated "petal" cover used for the deployed Jupiter IRBM sites. It is sized for 1.5m diameter rockets, namely the Jupiter from Bluedog Design Bureau. It attaches to an optional node in the Redstone Launch Stand; adjust the height until the base ring sits on the ground. The opening animation can be be done manually or via staging.
        #LOC_KSPZH_3205 = Launch Rail 4 - Large Size
        #LOC_KSPZH_799 = Add-on part for launch bases and stands that provides a rotatable launch rail for angled launching of rockets. This is the Large size rail, meant for larger rockets of size 1.25m and up. Rockets are only surface-attached to the rail, and the rail has built-in a decoupler. The rail can also be switched between the default forward direction and reverse. Rotating the rail can be done with the B9PD switcher or optionally with Animated Attachment installed via the deploy limit slider animation. The Animated Attachment method requires that the rail or launch base/stand be the root part in order to move the attached rocket. The rail part however can not be the root part after rotation or it will not decouple from the rocket. The rail can be rotated 100 degrees in the forward direction or 20 degrees in the reverse direction.
        #LOC_KSPZH_3204 = Launch Rail 3 - Medium Size
        #LOC_KSPZH_800 = Add-on part for launch bases and stands that provides a rotatable launch rail for angled launching of rockets. This is the Medium size rail, meant for larger rockets of size 0.937m and up. Rockets are only surface-attached to the rail, and the rail has built-in a decoupler. The rail can also be switched between the default forward direction and reverse. Rotating the rail can be done with the B9PD switcher or optionally with Animated Attachment installed via the deploy limit slider animation. The Animated Attachment method requires that the rail or launch base/stand be the root part in order to move the attached rocket. The rail part however can not be the root part after rotation or it will not decouple from the rocket. The rail can be rotated 100 degrees in the forward direction or 20 degrees in the reverse direction.
        #LOC_KSPZH_3202 = Launch Rail 1 - Mini Size
        #LOC_KSPZH_801 = Add-on part for launch bases and stands that provides a rotatable launch rail for angled launching of rockets. This is the Mini size rail (actually a rod), sized for 0.3125m and 0.625m rockets; the rod can be moved with the deploy limit slider. Rockets can be only surface-attached to the rail, and the rail has a built-in decoupler. Rotating the rail can be done with the B9PD switcher or optionally with Animated Attachment installed via the deploy limit slider animation. The Animated Attachment method requires that the rail or launch base/stand be the root part in order to move the attached rocket. The rail part however can not be the root part after rotation or it will not decouple from the rocket. The rail can be rotated 100 degrees in the forward direction or 20 degrees in the reverse direction.
        #LOC_KSPZH_3203 = Launch Rail 2 - Small Size
        #LOC_KSPZH_802 = Add-on part for launch bases and stands that provides a rotatable launch rail for angled launching of rockets. This is the Small size rail, meant for smaller rockets. Rockets are only surface-attached to the rail, and the rail has built-in a decoupler. The rail can also be switched between the default forward direction and reverse. Rotating the rail can be done with the B9PD switcher or optionally with Animated Attachment installed via the deploy limit slider animation. The Animated Attachment method requires that the rail or launch base/stand be the root part in order to move the attached rocket. The rail part however can not be the root part after rotation or it will not decouple from the rocket. The rail can be rotated 100 degrees in the forward direction or 20 degrees in the reverse direction.
        #LOC_KSPZH_3504 = Mini Milkstool Launch Stand 1 / 0.3125m, 0.625m
        #LOC_KSPZH_736 = A tall node-attached launch clamp for raising tiny rockets up from the ground. Has two height variants and 8 color options. The hold-down bolts at the top can be configured for 0.3125m or 0.625m diameter rockets, with vertical or horizontal styles; the bolts can also be turned off. The stand has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3505 = Mini Milkstool Launch Stand 2 / 0.9375m, 1.25m, 1.5m
        #LOC_KSPZH_735 = A tall node-attached launch clamp for raising small rockets up from the ground. Has two height variants and 8 color options. The hold-down bolts at the top can be configured for 0.9375, 1.25m or 1.5m diameter rockets, with vertical or horizontal styles; the bolts can also be turned off. The stand has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3506 = Mini Milkstool Launch Stand 3 / 1.875m, 2.5m
        #LOC_KSPZH_734 = A tall node-attached launch clamp for raising medium rockets up from the ground. Has three height variants and 8 color options. The hold-down bolts at the top can be configured for 1.875m or 2.5m diameter rockets, with vertical or horizontal styles; the bolts can also be turned off. The stand has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_3497 = Mini Milkstool Decoupler Size 1 Short
        #LOC_KSPZH_713 = A stand-alone mini milkstool part for use with launch plates and launch bases, to raise a rocket up off the deck of the base or plate. Has 8 color options. Use with the separate hold-downs.
        #LOC_KSPZH_3498 = Mini Milkstool Decoupler Size 1 Tall
        #LOC_KSPZH_3499 = Mini Milkstool Decoupler Size 2 Short
        #LOC_KSPZH_3500 = Mini Milkstool Decoupler Size 2 Tall
        #LOC_KSPZH_3501 = Mini Milkstool Decoupler Size 3 Medium
        #LOC_KSPZH_3502 = Mini Milkstool Decoupler Size 3 Short
        #LOC_KSPZH_3503 = Mini Milkstool Decoupler Size 3 Tall
        #LOC_KSPZH_3507 = Mini Modular Service Tower Type 1
        #LOC_KSPZH_434 = A mini-size modular truss-type service tower for the launch stands and smaller rockets, with 3 height options. Additional tower sections can be stacked to create taller towers, with the base pad turned off. There are also optional side panels available in multiple configurations. The tower section has 8 color options as well. Uses the separate Small Drop Umbilicals which are node-attached to the front of the tower.
        #LOC_KSPZH_3508 = Mini Modular Service Tower Type 2
        #LOC_KSPZH_433 = A mini-size modular pole-type service tower for the launch stands and smaller rockets, with 3 height options. There are 2 pole width options and 3 styles of pole details. The sections can be stacked in various ways to create taller towers, with the base pad disabled on the additional sections; the large size sections go on the bottom part of the tower. The tower sections have 8 color options as well. Uses the separate Small Drop Umbilicals which are node-attached to the front of the tower.
        #LOC_KSPZH_3509 = Mini Modular Service Tower Type 3
        #LOC_KSPZH_934 = An alternate mini-size modular truss-type service tower for the launch stands and smaller rockets, with 3 height options. Additional tower sections can be stacked to create taller towers, with the base pad turned off. There are also optional platforms available in multiple configurations. The tower section has 8 color options as well. Uses the separate Small Drop Umbilicals which are node-attached to the front of the tower.
        #LOC_KSPZH_3510 = Mini Modular Service Tower Type 4
        #LOC_KSPZH_435 = A mini-size modular truss-type service tower with two style variants. The tower section has 6 height options, and the base pad can be turned off, allowing multiple sections to be stacked for a taller tower. The front details can be toggled off in different ways to have a space for the Atlas-Agena Umbilical Arm to retract into. The tower section has 8 color options as well. Uses the separate Small Drop Umbilicals which are node-attached to the front of the tower.
        #LOC_KSPZH_4072 = Redstone Launch Stand / 1.25m, 1.5m
        #LOC_KSPZH_708 = A specialty round node-attached launch clamp designed for the Redstone rocket from Bluedog Design Bureau, but also with optional hold-down bolt positions for standard 1.25m and 1.5m fuel tanks. There is also an integrated version of the Redstone Umbilical Pole, available in 6 heights at either 1.25m and 1.5m tank positions. The pole is dropped with the launch clamp release. The stand has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_4074 = Redstone Umbilical Pole
        #LOC_KSPZH_509 = A separate version of the animated fallback umbilical pole from the Redstone Launch Stand. The pole has 9 height options and the umbilical at the end has three length variants. Drop the pole either by manual toggling the animation or by staging.
        #LOC_KSPZH_4300 = Saturn IB Launch Stand Tower Pedestal
        #LOC_KSPZH_895 = Alphadyne Construction Company
        #LOC_KSPZH_5057 = The optional tower pedestal for the Saturn Launch Stand, upon which the service tower was mounted. It attaches to one of the nodes around the Saturn Launch Stand. It is not a launch clamp, so it only has a fixed height. There is a working ladder on the front side.
        #LOC_KSPZH_4299 = Saturn IB Launch Stand
        #LOC_KSPZH_368 = A large launch stand styled after the concrete "stool" used at the original LC-34/37 for the Saturn I and IB rockets. Has switchable hold-down arm configurations in 4.25m, 3.75m, 3.125m, 2.5m and 1.875m. Integrated hold-down arms have switchable configurations, and can be turned off. Optional base block for the tower is available in four different positions.
        #LOC_KSPZH_5486 = Thor/Delta Launch Stand / 1.5m
        #LOC_KSPZH_3627 = Node-attached launch clamp styled after various hold-down assemblies used by the Thor/Delta/Delta II rockets, sized for 1.5m diameter rockets. It is designed to sit flush with the ground, so move it down so the bottom sits slightly below the VAB floor. It has three style variants: Thor type, Delta II type and a mini type with just the hold-down mounts, and 8 color options. Each style has three hold-down bolt height options: short, tall and extra-tall, the latter two for use with SRB-using Thor/Delta variants. The bolts have two position options, either for the BDB LR-79 engine (early Thors and Deltas) or the RS-27 engine (later Deltas and all Delta IIs). The stand has two manual generators that output electric charge and fuel resources.
        #LOC_KSPZH_5487 = Thor/Delta Service Tower - Fallback Type
        #LOC_KSPZH_997 = Animated fallback tower for the Thor-Able/Delta rockets, though it was most used with the Able-derived upper stages (Able, Ablestar and Delta). It has three integrated animated drop umbilicals, each with separate color options, and each can be turned off as well. Each umbilical is adjusted vertically and horizontally the associated deploy limit sliders. The tower also has 9 color options. The tower can be retracted either by manual toggling the animation or by staging. Use with the Thor/Delta Launch Stand for best effect.
        #LOC_KSPZH_5515 = Titan III Launch Stand / 1.875m
        #LOC_KSPZH_707 = A specialty launch stand for the Titan III and Titan IV, inspired by the real one. The center section can be switched between Titan II style (flat) and Titan IV style (elevated). Integrated hold-down bolts in short and tall variants for both the core and side boosters can be adjusted with the deploy limit sliders or separately turned off. The 4-corner support columns and the side wheels can be separately turned on/off. Special attach nodes for the Titan III Auxiliary Mast and Service Tower are located on the stand proper; other attach nodes are also available. The stand also has two manual generators that output electric charge and fuel resources, and 8 color options are available.
        #LOC_KSPZH_5504 = Titan II Launch Stand / 1.875m
        #LOC_KSPZH_709 = A specialty round quad-tripod node-attached launch clamp designed for the Titan II rocket from Bluedog Design Bureau. It's meant to sit flush with the top of the static launch pad, so move the stand down until the bottom edge is just below the floor of the VAB. The hold-down bolts on the top blocks have configurations for the BDB LR-87 engine or standard 1.875m tanks. The stand has two manual generators that output electric charge and fuel resources. Use with the Titan II Service Tower and Titan II Crew Elevator for the full LC-19 recreation.
        #LOC_KSPZH_5510 = Titan II Service Tower Mast
        #LOC_KSPZH_5007 = The antenna mast for the Titan II GLV Service Tower. It attaches to a small node on the top of the tower, on the top of the arm mount rail.
        #LOC_KSPZH_5505 = Titan II Modular Service Tower Base
        #LOC_KSPZH_5016 = The base section for the modular version of the Titan II GLV Service Tower. Attach the tower core sections to the top of the base.
        #LOC_KSPZH_5507 = Titan II Modular Service Tower Detail Section
        #LOC_KSPZH_4829 = The 3m short section for the modular version of the Titan II GLV Service Tower with optional details. Attach the tower core sections to the top of the base. The section has 3 optional platforms that can be moved down up to 6m using the deploy limit sliders, or be turned off. A structural detail pole also can be turned on and moved up 6m with its deploy limit slider. Umbilical attach nodes can be toggled between the Titan II Tower and General types.
        #LOC_KSPZH_5506 = Titan II Modular Service Tower Core Section
        #LOC_KSPZH_5056 = The multi-height core section for the modular version of the Titan II GLV Service Tower. Attach the tower core sections to the top of the base. There are 4 height options for the core section. Umbilical attach nodes can be toggled between the Titan II Tower and General types.
        #LOC_KSPZH_5508 = Titan II Modular Service Tower Top
        #LOC_KSPZH_5083 = The top section for the modular version of the Titan II GLV Service Tower. Attach to the top node of a core section. Umbilical attach node can be toggled between the Titan II Tower and General types. There is also an attach node on top of the umbilical mount rail for the Titan II Tower Mast.
        #LOC_KSPZH_5509 = Titan II Service Tower - Single Piece
        #LOC_KSPZH_548 = A single-piece version of the Titan II GLV Service Tower, sized and customized for the Bluedog Design Bureaau Titan II GLV rocket. Uses separate Titan II Tower umbilicals or the General Umbilicals. Use with the Titan II Launch Stand for the full LC-19 recreation.
        #LOC_KSPZH_5514 = Titan II Umbilical Gemini - Straight Style
        #LOC_KSPZH_690 = A special Gemini Spacecraft umbilical for the Titan II GLV Service Tower. It attaches to the top of the large angled arm style of the Titan II Tower Umbilical. Umbilical pipe is adjustable in length using the deploy limit slider.
        #LOC_KSPZH_5512 = Titan II Umbilical - Straight Style
        #LOC_KSPZH_286 = A custom umbilical for the Titan II GLV Service Tower, with three switchable arm styles. For reference, from the top down, there were two large angled arms, then two large straight arms, then a small beam arm, then at the bottom another large straight arm. The separate Gemini Spacecraft umbilical attaches to the top of the large angled arm style. Umbilical pipe is adjustable in length using the deploy limit slider.
        #LOC_KSPZH_5513 = Titan II Umbilical Gemini - Droop Style
        #LOC_KSPZH_692 = A special droop-style Gemini Spacecraft umbilical for the Titan II GLV Service Tower. It attaches to the top of the large angled arm style of the Titan II Tower Umbilical. Umbilical has an extension tube that is adjustable in length using the deploy limit slider.
        #LOC_KSPZH_5511 = Titan II Umbilical - Droop Style
        #LOC_KSPZH_285 = A custom droop-style umbilical for the Titan II GLV Service Tower, with three switchable arm styles. For reference, from the top down, there were two large angled arms, then two large straight arms, then a small beam arm, then at the bottom another large straight arm. The separate Gemini Spacecraft umbilical attaches to the top of the large angled arm style. Umbilical has an extension tube that is adjustable in length using the deploy limit slider.
        #LOC_KSPZH_5516 = Titan III Mast
        #LOC_KSPZH_5009 = The auxiliary structure used for the Titan II and IV, mounted on the mobile launch platform and positioned to be directly in front of the main fixed tower. The mast has multiple height variants and 8 color options. The top portion can be swutched between the older solid structure type, the later open-truss type, and the open-truss with a small plate on the front. The center trusses have attach nodes for attaching umbilicals and swing arms if desired.
        #LOC_KSPZH_5629 = Vanguard Launch Stand / 0.9375m
        #LOC_KSPZH_710 = A specialty square node-attached launch clamp designed for the Vanguard and Scout rockets from Bluedog Design Bureau. The hold-down structure in the center has configurations for the BDB Vanguard shrouded engine (2 types), bare engine/0.9375m tank and 1.25m tank; the structure can also be turned off so other hold-downs can be used instead. Optional nodes for the separate Redstone Umbilical Pole can be turned on. The stand has two manual generators that output electric charge and fuel resources. Use with the Vanguard Service Tower for the full LC-18A recreation.
        #LOC_KSPZH_5630 = Vanguard Service Tower
        #LOC_KSPZH_5019 = The companion service tower for the Vanguard Launch Stand, attaching to one of the outer nodes. The tower is sized for the BDB Vanguard rocket with the stand placed at ground level, with half-height (9m) and full-height (18m) variants. The base frame and top beam can be toggled off to allow stacking of multiple tower sections. The front detail structure can also be turned off. 9 color options are also available. Uses separate umbilicals which are node-attached.
        #LOC_KSPZH_4303 = Saturn Launcher Hold-Down - Saturn IB
        #LOC_KSPZH_4301 = Saturn IB animated retracting hold-down arm. Eight were used on the Milkstool, with the arm positioned at the base of the fin. Retraction can be done manually or by staging with Animated Decouplers.
        #LOC_KSPZH_4304 = Saturn Launcher Hold-Down - Saturn V
        #LOC_KSPZH_4333 = Saturn V animated retracting hold-down arm. Four were used on the Saturn Launcher Base, placed in between the F-1 engine fairings. Retraction can be done manually or by staging with Animated Decouplers.
        #LOC_KSPZH_4315 = Saturn Tower Crew Access Arm
        #LOC_KSPZH_4316 = Saturn Tower Crew Access arm, allowing for crew boarding of the command pod. This arm's length is sized for 2.5m command pods.
        #LOC_KSPZH_4319 = Saturn Tower Hammerhead Crane
        #LOC_KSPZH_897 = Alphadyne Crane Systems
        #LOC_KSPZH_303 = A distinctive feature of the Saturn tower was this hammerhead crane that sat on the very top. This crane has no hoist capability, but it can be rotated up to 180 degrees via an animation; set the rotation limit to 50 to rotate only 90 degrees to the launch position. For launches, the crane was rotated 90 degree in the clockwise direction. A gray variant is also available. The lightning mast on top can be switched between the original Saturn tower mast or the new Shuttle mast, which was first used for the ASTP Saturn IB launch, or can be turned off.
        #LOC_KSPZH_4309 = Saturn Mobile Launcher Base - Free-Standing
        #LOC_KSPZH_5317 = This is the free-standing base for the Saturn Mobile Launcher. The base attaches to a free node in the center of a rocket's lower or core stage using the size 5 node at the top of the exhaust hole opening. The tower base section attaches to the size 5 node on the other end of the launcher base. Includes a built-in decoupler and an elevator for crew access from the ground to the top deck. For best results, put the front legs so that they are inside the white part of the big circle on the VAB floor. No launch clamps are necessary. Includes a manually-activated generator for electric charge. The base's exhaust hole can be configured for three sizes of rockets: Saturn V (6.4/5.625m), SLS (5m) and the Saturn IB (4.25/3.75m), with various square and rectangular shapes for either single-core or tri-core rockets. A variety of switchable hold-down arm support configurations are available, along with optional center-mount hold-down and Saturn V tail service mast attach nodes.
        #LOC_KSPZH_4305 = Saturn Launcher Milkstool
        #LOC_KSPZH_4822 = The "Milkstool", as it was nicknamed, was a stand created to allow the Saturn IB-Apollo to use the Saturn V's Launch Umbilical Tower on LC 39. The three Skylab crews and the Apollo CSM for the Apollo-Soyuz Test Project were launched from LC 39 with the milkstool. In reality it was a gray color, but a red variant is also available as an alternative. Attach the milkstool to a bottom center node of a rocket, then attach the launcher base to the bottom node of the milkstool. The center ring at top has switchable hold-down arm support and node arrangements. There is a built-in decoupler for separating the milkstool from a rocket for liftoff.
        #LOC_KSPZH_4306 = Saturn Launcher Tail Service Mast
        #LOC_KSPZH_5488 = Three of these tail service masts were located on the launcher base, connected to the lower part of the S-IC stage of the Saturn V, and were retracted at liftoff. These have to be placed separately, and attach to nodes right outside the flame hole, two on one side, and one on the other side. Rotate them 5 degrees to have them properly aligned with the S-IC.
        #LOC_KSPZH_4320 = Saturn Tower Lightning Mast
        #LOC_KSPZH_510 = A separate version of the original Saturn tower lightning mast that was mounted on the hammerhead crane, for use with other towers. Red and gray versions can be selected, and the mounting plate can be turned off.
        #LOC_KSPZH_4307 = Saturn Milkstool Launch Stand
        #LOC_KSPZH_714 = A standalone launch clamp version of the Saturn "Milkstool", with two height variants: the regular tall version and an alternate short one, both with two color options. The center ring at top has switchable hold-down arm support pads, which can be adjusted horizontally with the deploy limit slider. The railings on the ring can also be turned off.
        #LOC_KSPZH_4302 = Saturn Launcher Base
        #LOC_KSPZH_5312 = This is the base for the Saturn Mobile Launcher. The base attaches to a free node in the center of a rocket's lower or core stage using the size 5 node at the top of the exhaust hole opening. The tower base section attaches to the size 5 node on the other end of the launcher base. Includes an elevator for crew access from the ground to the top deck. For best results, put the front legs so that they are inside the white part of the big circle on the VAB floor. Includes manually-activated generators for electric charge and fuel resources. The base's exhaust hole can be configured for three sizes of rockets: Saturn V (6.4/5.625m), SLS (5m) and the Saturn IB (4.25/3.75m), with various square and rectangular shapes for either single-core or tri-core rockets. A variety of switchable hold-down arm support configurations are available, along with optional Saturn V tail service mast attach nodes.
        #LOC_KSPZH_4310 = Saturn Modular Tower Base - Angled, with Hatches
        #LOC_KSPZH_995 = Angled base section of the modular Saturn launch tower, with two color options: classic red and new gray. The base has two independent crew elevators, each with four switchable maximum height options; elevators can also be turned off. Adjust the deploy limit of the elevators to make them stop at a lower height than the maximum. Elevators start at the highest point and have to be brought down first. Hatches on the elevator cars allow an alternate method of travel.
        #LOC_KSPZH_4311 = Saturn Modular Tower Base - Square, with Hatches
        #LOC_KSPZH_4610 = Square base section of the modular Saturn launch tower, with two color options: classic red and new gray. The base has two independent crew elevators, each with four switchable maximum height options; elevators can also be turned off. Adjust the deploy limit of the elevators to make them stop at a lower height than the maximum. Elevators start at the highest point and have to be brought down first. Hatches on the elevator cars allow an alternate method of travel.
        #LOC_KSPZH_4312 = Saturn Modular Tower Core Section
        #LOC_KSPZH_3540 = Modular multi-height core section of the Saturn launch tower. Seven heights of the section are available, each with two color options: default Saturn red and alternate new gray. Nodes for attaching the swing arms are located on the mount rail on the front side of the sections.
        #LOC_KSPZH_4317 = Saturn Tower Crew Section Floor
        #LOC_KSPZH_506 = A separate crew access floor for the crew access tower section of the Saturn tower, used to provide access from the tower elevator to the crew access arm when a command pod's hatch does not align with the bottom of the crew access section. Attach the floor to the node in the elevator shaft of the crew access section, and adjust its height with the offset gizmo. The floor has two configurations: Saturn Crew Arm access from the back with the walkway or Milkstool access from the front. The floor also has two color options, default red and alternate gray.
        #LOC_KSPZH_4313 = Saturn Modular Tower Crew Section
        #LOC_KSPZH_3539 = Modular crew access section of the Shuttle Launcher's FSS tower, used to allow boarding of spacecraft via a crew access arm and the separate crew access floor. Section has two height options for greater room to align the arm and floor, and two color otions: default gray and alternate black and white. A separate crew access floor is attached to the node inside the section, which then can be moved up and down to align the floor with the elevator exit and the crew arm. There are also optional side panels, with each side separately toggleable.
        #LOC_KSPZH_4318 = Saturn Tower Damper Arm
        #LOC_KSPZH_4334 = Saturn V tower damper arm. This V-shaped arm connected to the Apollo LES tower, and was used to stabilize the Saturn V during rollout and times of high winds. Two color options are available from the right-click menu. Arm was retracted before launch. ** Disable staging if retracting manually **
        #LOC_KSPZH_4321 = Saturn Tower Swing Arm - General
        #LOC_KSPZH_4322 = Saturn Tower general swing arm for use with non-Saturn rockets. The arm's length can be adjusted with the deploy limit slider. 7 different umbilical connector types, 15 pipe styles and 2 color options are available from the right-click menu.
        #LOC_KSPZH_4725 = Swing Arm Saturn IB S-IB
        #LOC_KSPZH_4331 = Saturn Tower swing arm for the Saturn IB's first stage (called the S-IB). Two sizes for 3.75m and 4.25m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4726 = Swing Arm Saturn V #1 S-IC Intertank
        #LOC_KSPZH_4323 = Saturn Tower swing arm #1 for the Saturn V. This is the S-IC Intertank arm. Two sizes for 5.625m and 6.4m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4727 = Swing Arm Saturn V #2 S-IC Forward
        #LOC_KSPZH_4324 = Saturn Tower swing arm #2 for the Saturn V. This is the S-IC Forward arm. Two sizes for 5.625m and 6.4m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4728 = Swing Arm Saturn V #3 S-II Aft
        #LOC_KSPZH_4325 = Saturn Tower swing arm #4 for the Saturn V. This is the S-II Aft arm. Two sizes for 5.625m and 6.4m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4729 = Swing Arm Saturn V #4 S-II Intermediate
        #LOC_KSPZH_4326 = Saturn Tower swing arm #4 for the Saturn V. This is the S-II Intermediate arm. Two sizes for 5.625m and 6.4m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4730 = Swing Arm Saturn V #5 S-II Forward
        #LOC_KSPZH_4327 = Saturn Tower swing arm #5 for the Saturn V. This is the S-II Forward arm. Two sizes for 5.625m and 6.4m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4731 = Swing Arm Saturn V #6 S-IVB Aft
        #LOC_KSPZH_4328 = Saturn Tower swing arm #6 for the Saturn V. This is the S-IVB Aft arm. Two sizes for 3.75m and 4.25m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4732 = Swing Arm Saturn V #7 S-IVB Forward
        #LOC_KSPZH_4329 = Saturn Tower swing arm #7 for the Saturn V. This is the S-IVB Forward arm, which includes the LM umbilical. Two sizes for 3.75m and 4.25m tanks, and two color options are available from the right-click menu.
        #LOC_KSPZH_4733 = Swing Arm Saturn V #8 Serv Mod
        #LOC_KSPZH_4330 = Saturn Tower swing arm #8 for the Saturn V. This is the Service Module arm. It has only one size for 2.5m Apollo CSM parts. Two color options are available from the right-click menu.
        #LOC_KSPZH_4314 = Saturn Modular Tower Top Section
        #LOC_KSPZH_5084 = The top section of the Saturn tower, with two color options: default red and alternate gray. An optional roof railing can be turned on if the hammerhead crane is not attached.
        #LOC_KSPZH_4400 = Shuttle Modular FSS Tower Base, with Hatches
        #LOC_KSPZH_5012 = The base section for the Shuttle Launcher's Fixed Service Structure (FSS) tower. It ataches to a large node off to the side of the shuttle launcher base. Two different height variants allow it to be used with the stock Tier 2 launch pad or the LC-39 pad from KSC Extended. Base has two independent elevators with multiple height options; each elevator can alos be turned off. Elevators have to be brought down first, then can be raised. Adjust the maximum stopping height with the deploy limit slider. There are also optional side panels, with each side separately toggleable. Hatches on the elevator cars allow an alternate method of travel.
        #LOC_KSPZH_4401 = Shuttle Modular FSS Tower Core Section
        #LOC_KSPZH_3541 = Modular multi-height core section of the Shuttle Launcher's FSS tower. Six heights of the section are available, each with two color options: default gray and alternate black and white. Nodes for attaching the Intertank Access Structure (only one is needed) are located on the right side of the tower core. There are also optional side panels, with each side separately toggleable.
        #LOC_KSPZH_4403 = Shuttle Modular FSS Tower Crew Section Floor
        #LOC_KSPZH_507 = A separate crew access floor for the crew access tower section of the Shuttle Launcher's FSS tower, used to provide access from the tower elevator to the crew access arm when a command pod's hatch does not align with the bottom of the crew access section. Attach the floor to the node in the elevator shaft of the crew access section, and adjust its height with the offset gizmo. The floor has three configurations: Shuttle Arm access, Rodan Arm access and Launch Platform access. The floor also has two color options, default gray and alternate black&white.
        #LOC_KSPZH_4402 = Shuttle Modular FSS Tower Crew Section
        #LOC_KSPZH_4404 = Shuttle Modular FSS Tower Top Section
        #LOC_KSPZH_5085 = The top section of the Shuttle Launcher's FSS tower, with two color options: default gray and alternate black and white. A node for attaching the LOX Vent Arm (beanie cap) is located on mount rail on the front; the rail can also be turned off. There are also optional side panels, with each side separately toggleable.
        #LOC_KSPZH_4397 = Shuttle Launcher Platform Base
        #LOC_KSPZH_5313 = This is the base for the Shuttle Launch Platform, and can be also used with an accurate SLS recreation. The base attaches to the shuttle's External Tank via the large node in the center, and requires a free attach node below the center of the shuttle's External Tank in order to be attached. The base attaches to the SLS via the large attach node on the deck in the area of the SSME exhaust hole. The Fixed Service Structure Tower (FSS) base attaches to the large node off to the side of the launch base. The SLS tower base attaches to the 3rd large node opposite the SSME hole. There are 3 deck variants for different kinds of shuttle stacks and a 4th variant for the SLS. SRB hold-downs are integrated into the base and are adjusted with the deploy limit sliders. The shuttle tail service masts attach on the sides of the square main engine exhaust hole, either with the two nodes or by surface attach. The whole base can be rotated via the switcher to keep the support legs in the right place.
        #LOC_KSPZH_4406 = Shuttle Rotating Service Structure Hinge
        #LOC_KSPZH_4885 = The Hinge for the Shuttle Launcher Rotating Service Structure (RSS). The hinge attaches to a large node located on the FSS Tower's base section. The RSS itself is then attached to the hinge. The hinge has two color options, default gray and alternate black&white. The hinge details (the platforms and discs) can also be turned off.
        #LOC_KSPZH_4405 = Shuttle Rotating Service Structure
        #LOC_KSPZH_4954 = The Rotating Service Structure (RSS) for the Shuttle Launcher Base, used to access and change out the orbiter's payload bay IRL; this version can not be used for that. It attaches to a large node located on the top of the RSS Hinge's central pole. The RSS support legs can be switched between the default height for the stock tier 3 pad and a shorter height for the larger LC-39 pad in Tundra's Space Center/KSC Extended. The RSS can be closed and rolled out via an animation...a slow animation, as this thing is huge after all!
        #LOC_KSPZH_4398 = Shuttle Launcher SRB Hold-Down
        #LOC_KSPZH_1877 = Cosmetic hold-down assembly for the space shuttle's SRBs. These attach to the nodes in the launcher base's two SRB exhaust holes. Use mirror symmetry when attaching them to the nodes. They have animated retracting bolts.
        #LOC_KSPZH_4399 = Shuttle Launcher Tail Service Mast
        #LOC_KSPZH_5567 = Two of these tail service masts are mounted on the Shuttle Launcher Base, one on each side of the orbiter's engine section. Use mirror symmetry to orient them properly so the umbilicals face towards the shuttle. The umbilicals have an animated retraction. The sparkers have to be started manually with an action group.
        #LOC_KSPZH_4413 = Shuttle Tower Lightning Mast
        #LOC_KSPZH_5311 = This is the Shuttle FSS tower lightning mast that was first used for the AS-210 Saturn IB launch (ASTP Apollo), mounted on the hammerhead crane. The crane with the mast was also used for a time with the Space Shuttle's FSS tower, then the crane was removed and the mast mounted directly on the top of the tower. This mast has switchable mount styles: FSS Tower, Hammerhead Crane and a General Tower mount. It attaches to the top node on a tower top section or on the top of the Hammerhead Crane.
        #LOC_KSPZH_4407 = Shuttle Tower Arm: Hydrogen Vent
        #LOC_KSPZH_2351 = Gaseous Hydrogen Vent Arm for the Shuttle Launcher's FSS Tower. This arm was used to vent hydrogen gas boiling up into the intertank area, and was dropped at liftoff. The arm attaches to the intertank access structure, on the node at the top, with the umbilical touching the External Tank's intertank at about the middle.
        #LOC_KSPZH_4408 = Shuttle Tower Arm: Intertank Access
        #LOC_KSPZH_5039 = The intertank access arm for the Shuttle Launcher's FSS Tower. It was used to allow pad technicians access to the External Tank's intertank and to attach the hydrogen vent arm. The arm attaches to the intertank access structure, on the node at the front and to the side, pointing towards the external tank.
        #LOC_KSPZH_4409 = Shuttle Tower Arm: LOX Vent
        #LOC_KSPZH_4824 = The "beanie cap" Liquid Oxygen Vent Arm for the shuttle launcher's FSS tower. The arm is attached to a side node on the FSS top section, with the cap centered over the top of the shuttle's External Tank and almost touching the tank. The arm was retracted at around the T-2 minute point in the countdown
        #LOC_KSPZH_4410 = Shuttle Tower Crew Access Arm: Orbiter
        #LOC_KSPZH_1908 = Crew access arm for the shuttle FSS tower, allowing for crew boarding of the orbiter. It is attached to the crew access section type of the FSS tower, with the walkway lining up with the railing opening in the crew section floor's orbiter variant.
        #LOC_KSPZH_4412 = Shuttle Tower Intertank Structure
        #LOC_KSPZH_4890 = The Intertank Access Structure for the Shuttle Launcher FSS tower. This attaches to a side node on the FSS tower, and was used to access the External Tank's intertank. The intertank access arm is attached to the front node off to the sie, and the hydrogen vent arm are attached to to the top node on the walkway.
        #LOC_KSPZH_4162 = SLC-6 Shuttle Tower Arm: LOX Vent
        #LOC_KSPZH_4823 = The "beanie cap" Liquid Oxygen Vent Arm for the SLC-6 shuttle tower. Has 3 color variants; the IRL arm was still mostly gray with some red beams at the rear. The arm is attached to a node on the front of top section, not on the square-sided mast base, with the cap centered over the top of the shuttle's External Tank and almost touching the tank. The arm was retracted at around the T-2 minute point in the countdown.
        #LOC_KSPZH_4164 = SLC-6 Shuttle Tower Crew Access Arm
        #LOC_KSPZH_1907 = Crew access arm for the SLC-6 Shuttle tower, allowing for crew boarding of the orbiter. It is attached to a node on the front of SLC-6 tower crew section, with the walkway lining up with the orbiter's hatch. The arm retracts backwards into the tower, it does not swing.
        #LOC_KSPZH_4161 = SLC-6 Shuttle Launch Mount
        #LOC_KSPZH_4516 = Small size launch base for the Space Shuttle, made for smaller flat launch pads, and inspired by the launch mount for the shuttle at Vandenberg's SLC-6 pad. The base attaches to the shuttle's External Tank via the large node in the center, and requires a free attach node below the center of the shuttle's External Tank in order to be attached. Service towers are attached to the nodes around the outside of the mount. SRB hold-downs are integrated into the base and are adjusted with the deploy limit sliders. The shuttle tail service masts attach on the sides of the square main engine exhaust hole, either with the two nodes or by surface attach. The whole base can be rotated via the switcher to keep the support legs in the right place.
        #LOC_KSPZH_4163 = SLC-6 Shuttle Tower Core Section
        #LOC_KSPZH_5020 = The core (lower) section for the SLC6 Shuttle tower. It ataches to a large node off to the side of the SLC6 Shuttle Launch Mount. Has multiple height variants, and two color options. A node on the side is for attaching the SLC-6 Shuttle Intertank Structure. Has one crew elevator, which has to be brought down first, then can be raised. Adjust the maximum stopping height with the deploy limit slider. A hatch on the elevator car allows an alternate method of travel.
        #LOC_KSPZH_4165 = SLC-6 Shuttle Tower Crew Section
        #LOC_KSPZH_5029 = The crew (middle) section for the SLC6 Shuttle tower. It ataches to the top of the core section. Has two crew access height variants plus optional extra core levels on top. Includes an adjustable integrated floor to align with the SLC6 crew arm and the orbiter. The crew arm attaces to the node on the front. A node on the side is for attaching the SLC-6 Shuttle Intertank Structure.
        #LOC_KSPZH_4166 = SLC-6 Shuttle Tower Intertank Structure
        #LOC_KSPZH_4891 = The Intertank Structure for the SLC-6 shuttle tower. It attaches to one of the nodes on the side of the tower opposite the crew arm. The main structure can be adjusted sideways with the deploy limit slider. The one thing that was mounted on this structure was the Hydrogen Vent Arm, which attaches to the node at the end of the main structure.
        #LOC_KSPZH_4168 = SLC-6 Shuttle Tower Top Mast
        #LOC_KSPZH_5310 = This is the SLC-6 Shuttle tower mast. It attaches to the node on the SLC-6 Tower Top Section's Mast Base. Has 2 color options.
        #LOC_KSPZH_4167 = SLC-6 Shuttle Tower Top
        #LOC_KSPZH_5075 = The top (upper) section for the SLC6 Shuttle tower. It attaches to the top of the crew section. Has 3 height variants, though the default height matches the IRL tower. The mast base has 6 height variants, with 4x matching the IRL one. The LOX Vent Arm attaches to the node in the top front, while the mast attaches to the node on top of the square-sided mast base.
        #LOC_KSPZH_4570 = Soyuz Launch Base Large Fuel Arm
        #LOC_KSPZH_4904 = The Large Fuel Arm for the Soyuz Launch Base and other bases, styled after the actual Soyuz arm which serviced the third stage and spacecraft. Three color options are available. It attaches to one of the auxiliary nodes on the Soyuz base or a tower node on other bases. Six height options are available, and the umbilical can be adjusted horizontally and vertically with the deploy limit sliders. Arm retraction can be either done manually or by staging.
        #LOC_KSPZH_4571 = Soyuz Launch Base Small Fuel Arm
        #LOC_KSPZH_4492 = Small Fuel Arm for the Soyuz Launch Base and other bases, styled after the actual Soyuz arm which serviced the core stage. Three color options are available. It attaches to one of the auxiliary nodes on the Soyuz base ring or a tower node on other bases. Six height options are available, and the umbilical can be adjusted horizontally with the deploy limit slider. Arm retraction can be either done manually or by staging.
        #LOC_KSPZH_4568 = Soyuz Launch Base Clamp Arm
        #LOC_KSPZH_999 = Animated retracting clamp arm for the Soyuz Launch Base or other launch base/plate, styled after the actual Soyuz support arms . It surface attaches to the clamp arm pads or the deck of the base, not the auxiliary nodes. There are three color options available. The arm end pad can be adjusted in size with the deploy limit slider. Retraction of the arm can be done manually or by staging.
        #LOC_KSPZH_4573 = Soyuz Solo Crew Elevator with Hatches
        #LOC_KSPZH_508 = A separate version of the Soyuz Gantry crew elevator only. Elevator tower has 7 height options and two color options. The crew elevator pad's height, the walkway platform's height and platform extension's length can be adjusted with the deploy limit sliders. Optional transfer airlock can be turned on to allow crew boarding of a spacecraft inside a fairing via the crew transfer function. Hatches on the elevator car and at the bottom of the tower allow an alternate method of travel.
        #LOC_KSPZH_4569 = Soyuz Launch Base Gantry with Hatches
        #LOC_KSPZH_2350 = Gantry arm assembly for the Soyuz Launch Base. Three color options are available. It attaches to the auxiliary node in the center of the Soyuz base. There are multiple height options for the arms, and the full arms can be turned off so only the crew elevator is visible. The gantry platform stack has three height variants, and the whole stack can be moved down up to 2.4m with the deploy limit slider. The crew elevator pad's height, the walkway platform's height and platform extension's length can be adjusted with the deploy limit sliders. Optional transfer airlocks can be turned on to allow crew boarding of a spacecraft inside a fairing via the crew transfer function. Hatches on the elevator car and at the bottom of the tower allow an alternate method of travel.
        #LOC_KSPZH_4572 = Soyuz Launch Base, a node-attached launch clamp pad styled after the actual Soyuz launch pad facility at Baikonur. Three color options are available. It attaches via the upper larger node in the central hole to a center node at the bottom of a rocket. The clamp arms, service gantry, large fuel arm, and small fuel arm are separately attached. The clamp arm pads can be switched among several options. 8 auxiliary nodes for the fuel arms or other tower are on the deck. Has two manual fuel and electric charge generators.
        // ---- ProbesBeforeCrew ----
        #LOC_KSPZH_2949 = K.A.R.A
        #LOC_KSPZH_2660 = Here at the Kerbalkind Achievement Records Agency (or K.A.R.A for short), our mission is to record and celebrate every advance in the fields of science, technology, aeronautics, and space exploration. It is through the accurate and secure maintainance of these records that we hope to drive Kerbalkind to always reach further, to insist on finding truth, and to never stop dreaming.
        #LOC_KSPZH_4808 = Telemetry Report
        // ---- RealChute ----
        #LOC_KSPZH_4056 = RealChute
        #LOC_KSPZH_304 = A division of Wenkel Corporation, RealChutes was the result of an Industry-Government-Academia Joint Research project undertaken in conjunction with the Kerbal Space Administration (KSA) and the University of Kerbin to develop improved spacecraft recovery systems.
        #LOC_KSPZH_5674 = Wenkel Corporation
        #LOC_KSPZH_3715 = Originally founded by Wenkel Kerman in KY 450 to commercialize his vapor-compression refrigeration units for domestic use, the company now develops and manufactures air conditioning and thermal control systems for the aerospace industry. More recently, it has entered the spacecraft recovery systems market through innovative new products by its subsidiary, RealChute Aerodynamic Deacceleration Recovery Systems.
        #LOC_KSPZH_4057 = RealChute Cone Chute
        #LOC_KSPZH_855 = After Bob almost splattered against the walls of a descending capsule whose instantly-deploying, one-size fits all parachute ripped off, he demanded change. KSC ignored his demand, citing cost, until he returned with a BACC, a lighter, and an empty bottle of Scotch. Terrified, KSC engineers invented the Real Chute, which is highly configurable gradually deploys.
        #LOC_KSPZH_4058 = RealChute Cone Double Chute
        #LOC_KSPZH_854 = After Bill nearly met fiery doom because his Real Chute could not stop his capsule's screaming descent, he demanded change. KSC ignored his demand, citing cost, until he strapped some spare boosters from Jebediah's Junkyard onto his car and flew into the boardroom one afternoon, terrorizing the already traumatized directors with savage screams and his wafer-thin heatshield. KSC engineers hastily added a drogue chute to their otherwise successful Real Chute design.
        #LOC_KSPZH_4059 = RealChute Radial Chute
        #LOC_KSPZH_858 = After Jebediah rejoiced his new heavy capsule's having only one parachute, KSC engineers foresaw the impending fiasco and immediately invented a radial version of the Real Chute.
        #LOC_KSPZH_4060 = RealChute Stack Chute
        #LOC_KSPZH_5678 = When Vernher designed a parachute that could be placed under things, administrators with brimming eyes called the nursing home. When Verhner spelled "Institutionalize THIS!" with smoking craters on KSC's lawn, they immediately effected his vision.
