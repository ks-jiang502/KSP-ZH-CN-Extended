        #LOC_KSPZH_1891 = Crew Elevator Large Base - 70m with Hatch
        #LOC_KSPZH_5011 = The base section for the Large General Crew Elevator tower with a 70m high elevator car. The separate elevator tower sections are attached to to the top. The base section has 8 color options and two toggleable styles of truss: General and Saturn types. Optional side panels in either 3 or 4-side configurations are also available. The elevator car's stopping height can be moved downward with the deploy limit slider. The elevator car can also be turned off. Hatch on the elevator car allows an alternate method of travel.
        #LOC_KSPZH_1893 = Crew Elevator Large Side Extension
        #LOC_KSPZH_521 = A side-mount walkway extension section for the Large General Crew Elevator. It attaches to one of the center nodes on the front of a tower section, or onto the tower section's optional side nodes, or onto the top of a tower section. The top floor is accessible, and there are optional middle and bottom floors as well. The four walls can be independently switched off to creat different walkway types. The wall trusses have two switchable styles: General and Saturn types. Optional bottom brace beams can also be separately switched on. There are also 8 color options.
