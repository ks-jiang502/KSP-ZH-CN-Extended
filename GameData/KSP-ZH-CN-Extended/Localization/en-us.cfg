        #LOC_KSPZH_3590 = Muo-V-DR180 "Czar" Liquid Engine
        #LOC_KSPZH_2827 = Imported directly from Krussia, the "Czar" employs two thrusters instead of one, giving it more power and control. When smaller rockets see it, they do a 180 and walk away.
        #LOC_KSPZH_2852 = Inon-R-10A41N "Sorau" Cryogenic Engine
        #LOC_KSPZH_928 = An advanced version of the R-10A "Isor" cryogenic engine, the R-10A41 "Sorau" includes a deployable bell extension. This allows the engine to have higher performance of a larger vacuum bell, but without increasing the total height of the engine. Be sure to check that any tanks connected to it are filled with the correct propellants, and remember its fuel will boil off over time. This model is used on the Inon V "Common Inon" either as a pair or singly on Bossart III and Muo V rockets. It was also used on upgraded versions of the Inon II.
        #LOC_KSPZH_2853 = Inon-R-10B2 "Eisorau" Cryogenic Engine
        #LOC_KSPZH_5694 = While the R-10A41 "Sorau" was a marked improvement in some applications, there were others that needed an even larger engine, but with the efficiency of the R-10 engine family. The R-10B2 "Eisorau" features an even larger engine bell extension, which increases performance but also prevents it from being mounted in some configurations. Be sure to check that any tanks connected to it are filled with the correct propellants, and remember its fuel will boil off over time. Although originally designed for a theoretical Daleth cryogenic stage, theres nothing stopping you from using it on an Inon!
