        #LOC_KSPZH_90 = 1.875m tankage for the Vejur upper stage. Includes built-in RCS thrusters.
        #LOC_KSPZH_5634 = Vejur-200FT Balloon Fuel Tank
        #LOC_KSPZH_89 = 1.875m tankage for the Vejur upper stage.
        #LOC_KSPZH_5637 = Vejur-3ST-SD Truss Interstage
        #LOC_KSPZH_399 = A lightweight interstage for the Vejur third stage.
        #LOC_KSPZH_5636 = Vejur-3ST-160 Liquid Fuel Tank
        #LOC_KSPZH_3696 = Open truss fuel tank for the Vejur third stage. Includes attitude control and avionics capabilities.
        #LOC_KSPZH_2919 = K-15 Wedgetail Aerodynamic Camera
        #LOC_KSPZH_2171 = Engineering camera for the K-15, used on a mission-to-mission basis to collect footage from various installations on the fuselage. One of their primary uses is observing material samples for things such as ablative coverings. Non-transmitable results. AUTHOR'S NOTE: Use NeptuneCamera for best results.
        #LOC_KSPZH_2927 = K-15 Wedgetail Fixed Vertical Stabilizer
        #LOC_KSPZH_2301 = Fixed vertical stabilizer for the K-15 Wedgetail experimental rocket plane. Includes airbrakes.
        #LOC_KSPZH_2921 = K-15 Wedgetail Cockpit
        #LOC_KSPZH_1812 = Cockpit for the K-15 Wedgetail experimental rocket plane. Includes a small payload bay, RCS fuel, auxiliary power units, and pilot.
        #LOC_KSPZH_2945 = K-15D Wedgetail Delta Elevon
        #LOC_KSPZH_2163 = Elevon control surface for the K-15D delta wing research plane.
        #LOC_KSPZH_2946 = K-15D Wedgetail Delta Fin
        #LOC_KSPZH_3733 = Outboard vertical stabilizers for the delta-wing K-15D.
        #LOC_KSPZH_2947 = K-15D Wedgetail Delta Wing
        #LOC_KSPZH_3428 = Main wing for the K-15D Wedgetail delta wing variant. Includes thrusters used for roll control outside of the atmosphere. Must be attached one at a time, with the correct side selected.
        #LOC_KSPZH_2922 = K-15 Wedgetail Dorsal Fin
        #LOC_KSPZH_2085 = Dorsal vertical stabilizer for the K-15 Wedgetail experimental rocket plane. Uses an all-moving fin design.
        #LOC_KSPZH_2923 = K-15 Wedgetail Drone Core
        #LOC_KSPZH_2100 = Drone core for the K-15U Wedgetail experimental uncrewed rocket plane, replacing the cockpit. Includes a small payload bay, RCS fuel, auxiliary power units, but no pilot. Not to be used for defending classified military installations. Make sure the APU is running - the probe core consumes a good deal of electricity.
        #LOC_KSPZH_2924 = K-15 Wedgetail Drop Tank
        #LOC_KSPZH_2103 = Drop tanks for the K-15 Wedgetail.
        #LOC_KSPZH_2926 = K-15 Wedgetail Experimental Dummy Scramjet
        #LOC_KSPZH_2209 = Experimental Dummy Scramjet. Designed to test high-speed aerodynamics. Certinaly not a Cubic Octagonal Strut
        #LOC_KSPZH_2925 = K-15 Wedgetail Engine
        #LOC_KSPZH_4093 = Rocket engine for the K-15 Wedgetail experimental rocket plane. More variants are in development.
        #LOC_KSPZH_2928 = K-15 Wedgetail Fuselage
        #LOC_KSPZH_2339 = Fuselage for the K-15 Wedgetail experimental rocket plane. Includes multiple length variants.\n\nThe "vent" engine will dump fuel quite quickly when landed, but not use much fuel in flight, to allow for startup venting effects during airlaunch (vent toggles with action group 09 by default).
        #LOC_KSPZH_2943 = K-15A-2 Wedgetail Helium Tank
        #LOC_KSPZH_4715 = Supplemental helium tank for the uprated K-15A-2. We don't have any use for helium, so we've decided to fill it with monopropellant instead. Attaches to the node on top of the K-15 engine.
        #LOC_KSPZH_2929 = K-15 Wedgetail Horizon Definition Experiment
        #LOC_KSPZH_4355 = Science tailbox for the K-15 Wedgetail. This one includes an infrared experiment designed to measure horizon phenomena and their stability at reference points for navigation in space.
        #LOC_KSPZH_2932 = K-15 Wedgetail Nose
        #LOC_KSPZH_3664 = Nose for the K-15 Wedgetail experimental rocket plane. Provides advanced SAS modes as well as atmospheric readings.
        #LOC_KSPZH_2933 = K-15 Wedgetail Nose Gear
        #LOC_KSPZH_3665 = Nose landing gear for the K-15 Wedgetail experimental rocket plane. Also includes the forward RCS units for pitch and yaw control outside of the atmosphere.
        #LOC_KSPZH_2934 = K-15 Wedgetail Photometer Experiment
        #LOC_KSPZH_4354 = Science tailbox for the K-15 Wedgetail. This one includes a photometer experiment to aid in the development of attitude sensing and control systems.
        #LOC_KSPZH_2935 = K-15 Wedgetail Pylon
        #LOC_KSPZH_1999 = Dedicated pylon for attaching the K-15 Wedgetail to the carrier plane (Not included).
        #LOC_KSPZH_2930 = K-15 Wedgetail Horizontal Stabilizer
        #LOC_KSPZH_4063 = Rear horizontal stabilizer for the K-15 Wedgetail experimental rocket plane. Must be attached one at a time, with the correct side selected.
        #LOC_KSPZH_2937 = K-15 Wedgetail S.E.R.J. Engine
        #LOC_KSPZH_4986 = The Supercharged Ejector RamJet is a multi-mode combination air-breathing and closed cycle rocket engine for the K-15 Wedgetail experimental rocket plane. Be sure to include the air intake. Runs in high effecicency fan mode below Mach 1, automatically transitioning to ramjet mode at higher speeds. Rocket Augmented mode is used to boost past Mach 1.
        #LOC_KSPZH_2920 = K-15 Wedgetail Air Intake
        #LOC_KSPZH_880 = Air intake for the K-15 Wedgetail experimental rocket plane, for use with the S.E.R.J. engine.
        #LOC_KSPZH_2931 = K-15 Wedgetail Landing Skid
        #LOC_KSPZH_4064 = Rear landing skid for the K-15 Wedgetail experimental rocket plane. Must be attached one at a time, with the correct side selected.
        #LOC_KSPZH_2938 = K-15 Wedgetail Spy Camera
        #LOC_KSPZH_4351 = Science experiment for the K-15 Wedgetail cockpit payload bay.
        #LOC_KSPZH_2939 = K-15 Wedgetail Stack Adapter
        #LOC_KSPZH_4717 = Sure a large carrier aircraft is a perfectly fine way to launch a K-15 Wedgetail, but what if you want more speed? This 1.25m decoupling adapter allows mounting the K-15 in-line on top of a rocket! Fits the standard KLR-99 engine variant.
        #LOC_KSPZH_2940 = K-15 Wedgetail Stellar Camera Experiment
        #LOC_KSPZH_4352 = Science experiment for the K-15 Wedgetail cockpit payload bay. Designed to meaure UV luminocity of the sky while at high altitudes to avoid the effects of the atmosphere. Also takes pretty pictures. Non-transmitable results.
        #LOC_KSPZH_2944 = K-15B Wedgetail Tandem Cockpit
        #LOC_KSPZH_4792 = Tandem cockpit for the K-15B Wedgetail experimental rocket plane. The "skylight hatch" has been removed, and the space occupied by a second occupant. They don't have a lot of room, and they are taking up one of the main scientific bays, but we're sure you'll put them to work. Also includes RCS fuel, auxiliary power units, and pilot.
