        #LOC_KSPZH_4365 = Secondary engines for the Belle upper stage system. Attach to the node switch on the truss on the Belle-D for intended use. Unintended use is not covered under warranty, but is encouraged. Takes liquid fuel and oxidizer from the main tank, and contains a supplementary monopropellant supply for the posigrade thrusters.
        #LOC_KSPZH_1350 = Belle-ESPS-B "Nafuni" Secondary Propulsion System
        #LOC_KSPZH_916 = Alternate secondary engines for the Belle upper stage system, sacrificing the fine-tuning thruster for another pressure fed liquid engine. Attach to the node switch on the truss on the Belle-D for intended use. Unintended use is not covered under warranty, but is encouraged. Takes liquid fuel and oxidizer from the main tank, and contains a supplementary fuel supply.
        #LOC_KSPZH_1351 = Belle-ESPS-C "Nafuni" Secondary Propulsion System
        #LOC_KSPZH_917 = Alternate secondary engines for the Belle upper stage system, sacrificing the larger liquid engine for a second RCS thruster. Attach to the node switch on the truss on the Belle-D for intended use. Unintended use is not covered under warranty, but is encouraged. Contains a supplementary monopropellant supply for the posigrade thrusters.
        #LOC_KSPZH_4118 = SG-1 "Bloodhound" Camera System
        #LOC_KSPZH_502 = A rudimentary panoramic camera system for peaceful reconnaissance usage.
        #LOC_KSPZH_4119 = SG-4 "Cerveza" Camera System
        #LOC_KSPZH_4961 = The SG-4 improves upon the SG-1 with a more advanced stereoscopic camera system.
        #LOC_KSPZH_4120 = SG-4B "Cerveza" Camera System
        #LOC_KSPZH_4962 = The SG-4B "Cerveza" camera system is similar in basic design to the SG-4 but is larger and achieves superior resolution.
        #LOC_KSPZH_4121 = SG-7 "Gamble" Camera System
        #LOC_KSPZH_4963 = The SG-7 "Gamble" was a short-lived member of the Spyglass satellite series. It represents a significant improvement over the earlier "Bloodhound" in terms of resolution and reliability. Launched on the Muo-Belle launch vehicle.
        #LOC_KSPZH_4123 = SG-8 "Gamble-3" Camera System
        #LOC_KSPZH_4964 = The SG-8 "Gamble-3" is the latest and greatest in Kerbin observation systems from Bluedog Design Bureau. Typically launched on the Prometheus 3B.
        #LOC_KSPZH_4128 = SG-DPA Dual Return Capsule Adapter
        #LOC_KSPZH_5228 = This dual adapter conveniently allows multiple Spyglass return capsules to be stacked on top of each other.
        #LOC_KSPZH_4122 = SG-7 "Gamble" Orbital Control Vehicle
        #LOC_KSPZH_1860 = Control segment for the Spyglass-7 "Gamble" photographic reconnaissance satellite, featuring a batteries, fuel, attitude control thrusters and orbital manuevering thrusters for adjusting the satellite's orbit. The SG-7 series is unique among the Belle-based Spyglass satellites in that it separated from the upper stage after reaching orbit, thus requiring this control vehicle.
        #LOC_KSPZH_4130 = SG-RCA 0.9375m to 0.625m Adapter
        #LOC_KSPZH_210 = A 0.9375m to 0.625m adapter typically used to attach a Spyglass Recovery Capsule to the larger 0.9375m diameter camera systems.
        #LOC_KSPZH_2507 = HAMSAT 1 Radio Communications Package
        #LOC_KSPZH_663 = A small, extremely rudimentary radio transmitter built by civilians designed to be launched on the aft equipment shroud of the Belle-B. Has a small internal power supply.
        #LOC_KSPZH_3752 = P770 "Scarecrow" Satellite Bus Fairing
        #LOC_KSPZH_4938 = The P770 "Scarecrow" Bus is intended to push Belle-based satellites' life and capabilities to their full potential. Not only does this bus expand the Belle's profile from 0.9375m to 1.25m, it also introduces redundant systems, intregated batteries, a built-in fairing, and a new state-of-the-art solid-state data recording system. This sytem is While intended to be a platform for singals intelligence reconnaissance collection, this bus can be used for any number of applications with the Belle upper stage and beyond.
        #LOC_KSPZH_3750 = P770 "Harvester" High-Band Antenna
        #LOC_KSPZH_3749 = P770 "Harvester Lite" High-Band Antenna
        #LOC_KSPZH_493 = A repurposed antenna from a P770 "Scarecrow" satellite. Originally meant for signals collection, this antenna has been stripped of all its SIGINT hardware and now only functions as a small, compact, deployable relay antenna.
        #LOC_KSPZH_3751 = P770 "Reaper" Helical Antenna Array
        #LOC_KSPZH_458 = A nest of several helical antennas designed to work in tandem for receiving signals. While it can function as a normal relay antenna, it is designed to be a part of the SIGINT data collection package in the P770 "Scarecrow" series of satellite.
        #LOC_KSPZH_3756 = P770 Belle Solar Panel
        #LOC_KSPZH_322 = A folding solar panel designed to fit in the Belle-ERD equipment rack for the P770 "Scarecrow" series of satellites. Does not track the sun.
        #LOC_KSPZH_3754 = P770 "Starfish" Relay Antenna
        #LOC_KSPZH_272 = A compact-folding large antenna with relay capabilities. While it is designed to be used in the SIGINT data collection package for the P770 "Scarecrow" series of satellite, it can be repurposed as a general relay.
        #LOC_KSPZH_3753 = P770 "Starfish Lite" Relay Antenna
        #LOC_KSPZH_5071 = The smaller twin of the P770 "Starfish" relay antenna. While it is designed to be used in the SIGINT data collection package for the P770 "Scarecrow" series of satellite, it can be repurposed as a general relay.
        #LOC_KSPZH_3755 = P770 "Thresher" SIGINT Collection System
        #LOC_KSPZH_3757 = P770 Telemetry Antenna
        #LOC_KSPZH_585 = A small deployable telemetry antenna designed for the P770 "Scarecrow" satellite series.
        #LOC_KSPZH_3979 = Prometheus-IIIB 1.875m Adapter Interstage
        #LOC_KSPZH_2866 = Interstage Adapter designed to attach the Belle upper stage to the Prometheus III-B (23B and 24B variants)
        #LOC_KSPZH_876 = AgenaB Upgrade
        #LOC_KSPZH_877 = AgenaD Upgrade
        #LOC_KSPZH_878 = AgenaHDA Upgrade
        #LOC_KSPZH_874 = Agena8096B Upgrade
        #LOC_KSPZH_875 = Agena8096C Upgrade
        #LOC_KSPZH_4133 = SG-RV3 Return Capsule Heatshield
        #LOC_KSPZH_607 = A small heatshield to protect the Spyglass Return Capsule on reentry.
        #LOC_KSPZH_4132 = SG-RV2 Return Capsule Parachute
        #LOC_KSPZH_621 = A small parachute for Spyglass Return Capsules. Makes you wonder if its possible to catch the capsule mid air... Includes a manually operated decoupler for separating the retro motor from the rest of the pod once the retro burn is accomplished.
        #LOC_KSPZH_4131 = SG-RV1 Return Capsule Pod
        #LOC_KSPZH_4134 = SG-RV4 Return Capsule Retro Pack
        #LOC_KSPZH_630 = A small retro pack to deorbit Spyglass Return Capsules.
        #LOC_KSPZH_1369 = Belle-SOT15 Strap On Tank
        #LOC_KSPZH_3288 = Lightweight strap-on tanks for the Belle upper stage. Attach using mini radial decouplers with crossfeed enabled in 8x symmetry and stage in pairs. These are designed to fit within a 1.875m fairing base.
        #LOC_KSPZH_1370 = Belle-SOT25 Strap On Tank
        #LOC_KSPZH_3287 = Lightweight strap-on tanks for the Belle upper stage. Attach using mini radial decouplers with crossfeed enabled in 6x symmetry and stage in pairs. These are designed to fit within a 2.5m fairing base.
        #LOC_KSPZH_1367 = Belle-SOT-GA Guidance Array
        #LOC_KSPZH_5157 = This add-on guidance package for the Belle SOT provides additional communications and guidance support for the stage while on extended missions.
        #LOC_KSPZH_1368 = Belle-SOT-SS Structural Support Skirt
        #LOC_KSPZH_5132 = This 1.875m fairing base ring mounts to the interstage node of a Belle engine mount, allowing 1.875m interstages to be used. An optional fairing base can also spawn from the bottom of the ring.
        #LOC_KSPZH_2967 = Kanaloa-AARDV-SBA Omni Antenna
        #LOC_KSPZH_620 = A small omnidirectional antenna for sending and receiving commands from autonomous vehicles, such as the AARDV.
        #LOC_KSPZH_2963 = Kanaloa-AARDV-CRM Cargo Resupply Module
        #LOC_KSPZH_1167 = As the lifetime of stations increased from months to years, it became impossible to rely solely on supplies brought up using the limited space inside Kane-11 capsules. The previous first generation ships that had supplied MOS stations could not bring the large volumes of supplies that were needed for sustained operations. This is the cargo volume for the Kanaloa Block I automated resupply ship, the standardized second generation cargo vessel. Note that it only serves as an ore carrier by default, unless fascinating ideas such as 'life support' or 'advanced science systems' have been discovered...
        #LOC_KSPZH_2964 = Kanaloa-AARDV-CRM2 Cargo Resupply Module
        #LOC_KSPZH_2962 = Kanaloa-AARDV-CACB Control Block
        #LOC_KSPZH_135 = 2.5m inline control core for Kanaloa AARDV systems. Goes between the cargo module and service module, and provides control and guidance for resupply vehicles and tugs.
        #LOC_KSPZH_2965 = Kanaloa-AARDV-FNA Nose Adapter
        #LOC_KSPZH_4497 = Small cone to adapt the Kanaloa-CRM's 0.9375m top node to the 0.625m Kane Docking Mechanism.
        #LOC_KSPZH_2966 = Kanaloa-AARDV-FPA Adapter
        #LOC_KSPZH_457 = A nearly flat 2.5m plate, for adapting the top of the AARDV cargo module to the docking nose.
        #LOC_KSPZH_2968 = Kanaloa-AARDV-UCS Unpressurized Cargo Segment
        #LOC_KSPZH_5135 = This 2.5m unpressurized bay is useful for bringing up things such as small station segments, satellites, supplies, and parts ready to be attached to the outside of something.
        #LOC_KSPZH_3683 = Octans 75-A Androgynous Docking Port
        #LOC_KSPZH_1411 = Bluedog Design Bureau and Tantares Space Technologies
        #LOC_KSPZH_3616 = Navalia-ASTP VHF-FM Antenna
        #LOC_KSPZH_664 = A small, fixed VHF-FM whip antenna for the Navalia-ASTP "Diplomat" Docking Module.
        #LOC_KSPZH_3614 = Navalia-ASTP "Diplomat" Docking Module
        #LOC_KSPZH_698 = A specialized module designed to allow the docking of two separate spacecraft to either end of this module. In addition to mating spacecraft, it provides additional living/working space, as well as a platform for experiments. Can accommodate two crew at a time.
        #LOC_KSPZH_3615 = Navalia-ASTP MA-059 UV Absorbtion Experiment
        #LOC_KSPZH_5239 = This experiment is a modified and slightly enhanced version of the Far Ultraviolet Spectrometer. This experiment can be used to study measure emissions from celestial bodies, zodiacal light, solar atmosphere emissions, stellar emissions, and galactic emissions.
        #LOC_KSPZH_2977 = Kane Nose Cone
        #LOC_KSPZH_2830 = In early versions of the Kane capsule, the docking port was omitted because there were no plans to rendezvous and dock during a mission. This structural nose cone was placed on top instead. It is capable of interfacing with the Kane LES tower in the same way a docking port would.
        #LOC_KSPZH_2988 = Kane-11-CDA High Gain Antenna
        #LOC_KSPZH_266 = A collapsible relay antenna consisting of four high gain dishes, for transmitting the many exciting things you've discovered. Intended to be placed on the mounting bracket of the Kane-11 engine plate.
        #LOC_KSPZH_2998 = Kane-11-MSM Service Module
        #LOC_KSPZH_273 = A complete package of fuel, monoprop, batteries, fuel cells, and storage bays for your service module. The fuel cells are powered by monopropellant. Designed to circularize around the Mun with a lander in tow, and then return home to Kerbin. Engine, RCS quads, communications, docking light, and decoupler sold separately.
        #LOC_KSPZH_3002 = Kane-11-SE60 Service Propulsion System
        #LOC_KSPZH_5349 = This massive service engine sacrifices much of its power to eliminate weight. The result is a very light, though not extremely efficient, propulsion system for large orbiters in the 2.5m size class and up.
        #LOC_KSPZH_2989 = Kane-11-CDA33 High Gain Antenna
        #LOC_KSPZH_264 = A collapsible relay antenna consisting of a high gain dish, for transmitting the many exciting things you've discovered. Intended to be placed on the mounting bracket of the Kane-11 engine plate.
        #LOC_KSPZH_2987 = Kane-11-8OMM Orbital Mission Module
        #LOC_KSPZH_4896 = The Kane-11's adaption to the Block III+ configuration resulted in an extremely cramped and uncomfortable capsule for the crew. While it was acceptable for short durations such as during takeoff and landing, any amount of time longer than an hour or so required a larger habitable volume. This mission module is essentially several more cubic meters of living space for the crew. Place it upside down in place of the lunar module, with docking ports on each end. Extract with the CSM after circularization.
        #LOC_KSPZH_2985 = Kane-11-3OSM Service Module
        #LOC_KSPZH_4420 = Similar to the Kane-11-MSM service module, the 13 variant includes a sufficient supply of fuel, monoprop, and large batteries storage for LKO missions. Complexity is reduced by simply packing batteries instead of fuel cells. Missions beyond LKO may void warranty. Engine, RCS quads, communication, lights and decoupler still not included. Allegations that a trash compactor is a key manufacturing component are entirely unfounded.
        #LOC_KSPZH_2983 = Kane-11-12OMM Orbital Mission Module
        #LOC_KSPZH_2318 = Following the introduction of more capable lifters for crewed LKO missions, the venerable Kane Block III+ mission module was replaced with a larger can. Includes a larger attachment node on top for using larger androgynous docking ports. Place it upside down in place of the lunar module, with docking ports on each end. Extract with the CSM after circularization.
        #LOC_KSPZH_2990 = Kane-11-CDA55 High Gain Antenna
        #LOC_KSPZH_265 = A collapsible relay antenna consisting of a high gain dish, for transmitting the many exciting things you've discovered. Intended to be placed on the mounting bracket of the Kane-11 service engine.
        #LOC_KSPZH_3000 = Kane-11-PPA Deployable Solar Panels
        #LOC_KSPZH_5689 = While previous Kane-11 ships had relied on fuel cells or batteries to provide power, the longer duration missions demanded of the Block V meant that bringing enough consumables was impractical. These solar panels are fixed to the bottom of the engine mount, providing lightweight sustainable power for as long as needed.
        #LOC_KSPZH_3034 = Kane-SABP1 Command Pod Boilerplate
        #LOC_KSPZH_5122 = This "boilerplate" is designed to simulate the Kane-11-3 Command Pod in mass, shape, and more. This boilerplate capsule holds no crew and is intended for test flights to prove and certify the Kane's design before the capsule is used. Perfect for orbital flights, suborbital flights, and other types of test flights. Can be used with parachutes for drop testing. Includes probe control, minor SAS control, batteries, and a built-in direct antenna. However, this boilerplate does not include a real heatshield and as such is not intended to survive orbital reentry. Intended to be used with the Kane-SA-MSM Service Module Boilerplate.
        #LOC_KSPZH_1711 = CADS 1.25m Docking Port (Active)
        #LOC_KSPZH_1916 = CxAerospace and BDB
        #LOC_KSPZH_1830 = Common Androgynous Docking Port. Developed to eliminate the limitations of the gendered Kane docking system, as well as provide a larger passageway for delivering cargo. Equipped with a deployable capture ring to dampen impact. Permanent station ports can use the passive version, which is simpler and lighter.
        #LOC_KSPZH_1712 = CADS 1.25m Docking Port (Passive)
        #LOC_KSPZH_1831 = Common Androgynous Docking System, passive version intended to mate with active counterparts. Useful for permanent fixtures that won't have to form the active docking partner, such as berthing ports on station modules.
        #LOC_KSPZH_2991 = Kane-11-DDM6 0.625m Passive Docking Mechanism
        #LOC_KSPZH_821 = Advanced probe-and-drogue docking system. It possesses the smallest crew tube possible for Kerbals (their heads would get stuck if it were any smaller) to fit inside a 0.625m form factor. It would probably be better to have a larger passageway on cargo flights. This is the passive port, designed to catch the active port's probe.
        #LOC_KSPZH_2984 = Kane-11-3 Command Pod
        #LOC_KSPZH_2051 = Despite a... questionable track record during testing, this capsule is perhaps the pinnacle of our manned design program. While the Hermes and the Leo were essentially test vehicles, the Kane (pronounced 'khan-ay') is a real operational craft. Includes attitude control thrusters for reentry. Originally developed to be the orbiter segment of our Munar landing operations, a variety of upgrades and specialized components are being developed, and should become available in the near future.
        #LOC_KSPZH_2986 = Kane-11-5 Advanced Command Pod
        #LOC_KSPZH_1522 = By optimizing the internal volume and modifying the crew arrangement, we have managed to cram 5 Kerbals into the reentry vehicle for the Kane-11. They only will be comfortable in there for a short time, so be sure to bring some sort of extra habitable volume to dock with after you've achieved orbit.
        #LOC_KSPZH_2980 = Kane-11 2.5m Capsule Decoupler
        #LOC_KSPZH_5221 = This decoupler is designed to sit between a capsule's heatshield, and the service module. It includes an umbilical to connect the capsule to the service module's systems. The decoupler automatically maps to the abort action group in case of a failure of the launch stack.
        #LOC_KSPZH_2994 = Kane-11-FBL Docking Floodlight
        #LOC_KSPZH_2184 = Essentially a pen light glued to a flap, this light (traditionally mounted to the decoupler ring on the Kane-11 CSM) swings out to provide illumination for docking/berthing operations.
        #LOC_KSPZH_3025 = Kane-APA-18 VHF Doppler Tracking Experiment
        #LOC_KSPZH_5151 = This VHF antenna is specifically calibrated to use doppler tracking to detect and measure localized gravitational anomalies. Includes a conformal variant that is intended to conform to the exterior of the Kane service module as well as a flat variant. Can also be used as a basic relay antenna.
        #LOC_KSPZH_2981 = Kane-11 Drogue Parachute
        #LOC_KSPZH_2098 = Drogue parachute for the Kane-11 Command Pod. Attach to the node in the nose section.
        #LOC_KSPZH_2993 = Kane-11-EMT 2.5m Engine Mount
        #LOC_KSPZH_3558 = Mounting plate for attaching a single engine to 2.5m tanks. Includes a node just below the top rim for attaching the Sarnus LAM as well as a mounting point for the high gain antenna system.
        #LOC_KSPZH_2996 = Kane-11-LIB EVA Floodlight
        #LOC_KSPZH_2185 = Essentially a pen light on the end of a straw, this light (traditionally mounted to the decoupler ring on the Kane-11 CSM) swings out to provide illumination to aid kerbonauts on EVAs.
        #LOC_KSPZH_3001 = Kane-11-RFHS 2.5m Advanced Heat Shield
        #LOC_KSPZH_816 = Advanced heatshield for the Kane-11 to enable safe land recovery of the capsule. Includes deployable impact attenuating legs, as well as retro solids for cutting speed during the terminal part of the descent. Parachutes still required (and sold separately).
        #LOC_KSPZH_2997 = Kane-11-MSHS 2.5m Heat Shield
        #LOC_KSPZH_3136 = Large 2.5m structural heatshield for Kane CSM. It is very thick in order to withstand the intense heat of munar reentries. Remove some of the ablator for Kerbin orbital missions, to save weight. The structure itself is lighter as well, at the cost of removing the jettison hardware. Make sure your parachutes can stop the weight of the capsule and the heatshield.
        #LOC_KSPZH_2995 = Kane-11-LES PEBKAC Launch Escape System
        #LOC_KSPZH_3770 = PEBKAC Heavy Industries
        #LOC_KSPZH_5052 = The main thrust structure and escape engine for the PEBKAC Launch Escape System. Stage to jettison. For best results jettison high in (or out of) the atmosphere, usually around first stage cut off. After firing during an emergency abort, canards deploy to flip the capsule retrograde for parachutes. Automatically added to the abort action group. Autostrut to heaviest part to stop wobbling.
        #LOC_KSPZH_2982 = Kane-11 Main Parachute
        #LOC_KSPZH_3425 = Main parachute for the Kane-11 Command Pod. Attach to the node in the nose section.
        #LOC_KSPZH_2999 = Kane-11-PMX3 1.25m Parachute Cover
        #LOC_KSPZH_4701 = Structural cover for Kane parachutes. Place on top of the capsule after adding the main and drogue parachutes. The Active Docking Mechanism goes on top. Includes a decoupler to clear the way for the parachutes.
        #LOC_KSPZH_2992 = Kane-11-DPM6 0.625m Active Docking Mechanism
        #LOC_KSPZH_820 = Advanced probe-and-drogue docking system. It possesses the smallest crew tube possible for Kerbals (their heads would get stuck if it were any smaller) crammed inside a 0.625m form factor. It would probably be better to have a larger passageway on cargo flights. Once soft docking is achieved and the vessels properly aligned, retract the probe to hard dock and establish a solid connection.
        #LOC_KSPZH_4019 = RKPV-L Renovated Lab Module
        #LOC_KSPZH_4075 = Refurbished pressure vessel from a Kane pod, combined with much of the support systems from a Kane service module. Intended to be used as an orbital lab module.
        #LOC_KSPZH_3007 = Kane-ACT-1X Single RCS Thruster
        #LOC_KSPZH_5185 = This attitude and translation thruster pack was developed for the Kane program. This model includes multiple variants of single-direction thrusters.
        #LOC_KSPZH_3012 = Kane-ACT-2X Dual RCS Thruster
        #LOC_KSPZH_5187 = This attitude and translation thruster pack was developed for the Kane program. This model includes multiple variants of two-way thrusters.
        #LOC_KSPZH_3015 = Kane-ACT-3X Triple RCS Thruster
        #LOC_KSPZH_5186 = This attitude and translation thruster pack was developed for the Kane program. This model includes multiple variants of three-way thrusters.
        #LOC_KSPZH_3017 = Kane-ACT-4X Quad RCS Thruster
        #LOC_KSPZH_5184 = This attitude and translation thruster pack was developed for the Kane program. This model includes multiple variants of four-way thrusters.
        #LOC_KSPZH_3018 = Kane-ACT-E RCS Engine
        #LOC_KSPZH_243 = A Kane ACT thruster with a larger nozzle and higher pressure. Useful as a spacecraft OAMS system when used in groups.
        #LOC_KSPZH_3023 = Kane-ACT4-E RCS Engine Thruster Quad
        #LOC_KSPZH_2059 = Developed for the Leo-B1G service module, this attitude and translation thruster pack also includes powerful fore and aft thrusters linked to engine controls. Engine thrust direction toggles via action group Custom10 by default.
        #LOC_KSPZH_4432 = Sina-EMSS-3 Surface Shelter Module
        #LOC_KSPZH_3325 = Longer surface stays require facilities and consumables beyond what can be carried in a single MLEM lander. This is a dedicated shelter module - while it sacrifices the ascent propulsion system, it can sustain three crew members for up to a month on the surface. Includes surface communications, deployable insulation, and an expandable airlock - make sure your front leg does not have the "porch". Use the "truck" variant of the descent tank assembly for autonomous landing.
        #LOC_KSPZH_4433 = Sina-EMSS-TOP Observational Telescope
        #LOC_KSPZH_646 = A small telescope designed for ground-based optical observations on non-atmospheric bodies
        #LOC_KSPZH_3308 = Little Jeb 2 "Persei-T" Solid Rocket Motor
        #LOC_KSPZH_3884 = Primary booster / sustainer motor for the Little Jeb 2. Used both as a first stage, as well as a sustainer stage when fired in series. Has straight (center) and canted (outboard) variants. Make sure they're properly angled.
        #LOC_KSPZH_3309 = Little Jeb 2 Body
        #LOC_KSPZH_3426 = Main structural module for the Little Jeb 2 test vehicle. Mount the specially prepared "Persei-T" and "Newby" motors in the 7 slots on the bottom. Includes cold-gas attitude thrusters, which must be augmented with fins (sold separately).
        #LOC_KSPZH_3310 = Little Jeb 2 Fin
        #LOC_KSPZH_3145 = Large aerodynamic fin with a control surface for the Little Jeb 2.
        #LOC_KSPZH_3307 = Little Jeb 2 "Newby" Solid Motor
        #LOC_KSPZH_4518 = Small solid motors for augmenting the liftoff thrust of the Little Jeb 2 test vehicle. They only fire for a second or two, but provide a much needed boost off the ground. Available in single and triple mounts. Make sure the canted nozzles are properly pointing outwards.
        #LOC_KSPZH_4462 = Sina-MLEM-WCT Whip Antenna
        #LOC_KSPZH_649 = A small whip antenna, originally meant to provide a communications link between Kerbonauts on EVA, and their Sina MLEM lander.
        #LOC_KSPZH_4435 = Sina-MEM-SSC VHF Antenna
        #LOC_KSPZH_570 = A small VHF antenna, originally meant to provide a communications link between a Sina MEM lander and the Kane CSM in orbit.
        #LOC_KSPZH_4438 = Sina-MLEM-ASC Ascent Stage Cockpit
        #LOC_KSPZH_4974 = The Sina Ascent Stage Cockpit provides accommodations for two Kerbals to ride to the Mun's surface atop the Sina Decent Stage, then return to orbit. Includes integrated fuel tanks, RCS, communications system, extended life batteries, and two hammocks. Put the ascent engine on the bottom, and the passive docking port on the top. Remember to have all crew members on board before launching.
        #LOC_KSPZH_4437 = Sina-MLEM-APS Ascent Propulsion System
        #LOC_KSPZH_2033 = Derived from experience from our Belle engines, this non-gimballing liquid fueled engine prioritizes one thing: Reliability. Failure of the ascent engine could leave brave explorers trapped on the Mun.
        #LOC_KSPZH_4440 = Sina-MLEM-CRD Cosmic Ray Detector
        #LOC_KSPZH_593 = A small experiment for detecting cosmic ray impacts.
        #LOC_KSPZH_4443 = Sina-MLEM-DPS Descent Propulsion System
        #LOC_KSPZH_398 = A lightweight gimbaling liquid fueled engine designed to bring the Sina lander safely to the Mun's surface.
        #LOC_KSPZH_4445 = Sina-MLEM-LSG Landing Leg
        #LOC_KSPZH_728 = A sturdy retracting landing leg, perfect for landing on other bodies.
        #LOC_KSPZH_4436 = Sina-MLEM-ADS Lander Separator
        #LOC_KSPZH_513 = A set of guillotines and explosive bolts for connecting, and then separating, the ascent and descent stages of the MLEM.
        #LOC_KSPZH_4444 = Sina-MLEM-DST Descent Stage Assembly
        #LOC_KSPZH_4461 = Sina-MLEM-TRK Autonomous Descent Stage Assembly
        #LOC_KSPZH_4446 = Sina-MLEM-MDCD Core Sample Drill
        #LOC_KSPZH_5708 = Wireline-type core drill designed to be mounted to the side of the Sina descent stage. A hollow drill bit digs down into the ground, leaving an intact cylinder of substrate inside the shaft. These core samples are broken off at set intervals and retrieved with a small grabbing mechanism which is lowered into the shaft. This allows the drill to stay in place while subsequent cutting sections are added to increase the drill depth.
        #LOC_KSPZH_4449 = Sina-MLEM-MGC Mystery Goo Experiment
        #LOC_KSPZH_488 = A recent procurement mistake has left us with too many RTG plutonium storage casks. In an effort to save funds, BDB's engineers have converted several to mystery goo observation systems. We were worried the residual radiation from the cask might damage the experiment, but the goo seems... happy.
        #LOC_KSPZH_4442 = Sina-MLEM-CSL Laboratory Module
        #LOC_KSPZH_2159 = Efforts to extend the uses of the Sina MLEM hardware have resulted in this retrofitted orbital laboratory module. Useful as a free-flight sortie lab (with a CSM) or even a station expansion module. Contains life support for two to three crew for up to thirty days, as well as monopropellant and batteries. Experiments provided separately.
        #LOC_KSPZH_4439 = Sina-MLEM-BCT Rechargeable Battery Pack
        #LOC_KSPZH_3146 = Large capacity batteries for modified MLEM crafts. Attaches behind the landing legs, on the descent stage.
        #LOC_KSPZH_4450 = Sina-MLEM-MGS Magnetometer Boom
        #LOC_KSPZH_2316 = Folding triaxial magnetometer boom with dual detectors.
        #LOC_KSPZH_4447 = Sina-MLEM-MEP Material Experiment Palette
        #LOC_KSPZH_2302 = Fixed, surface attached version of the MESA. The MEP contains several different experiments designed to test basic principles of manufacturing in the Munar vacuum and low gravity, and the hardiness of certain materials when exposed to the space radiation environment. As a bonus, it also serves as an excellent way of collecting extra surface samples in the form of statically charged dust! It also has a well-placed television camera for observing those tremendous first few steps onto the surface of another world.
        #LOC_KSPZH_4451 = Sina-MLEM-MMID Micrometeoroid Collector Panels
        #LOC_KSPZH_2027 = Deployable micrometeoroid collector panels for the Sina MLEM-Lab.
        #LOC_KSPZH_3327 = Lono-MFV-HOP "Icarus" Munar Flying Vehicle
        #LOC_KSPZH_4448 = Sina-MLEM-MESA Material Experiment Stowage Assembly
        #LOC_KSPZH_4920 = The Material Experiment Stowage Assembly is a complete, semi-automated material science laboratory designed to be stowed in the MLEM. MESA contains several different experiments designed to test basic principles of manufacturing in the Munar vacuum and low gravity, and the hardiness of certain materials when exposed to the space radiation environment. As a bonus, it also serves as an excellent way of collecting extra surface samples in the form of statically charged dust! It also has a well-placed television camera for observing those tremendous first few steps onto the surface of another world.
        #LOC_KSPZH_4453 = Sina-MLEM-Q3S Cargo Module
        #LOC_KSPZH_4457 = Sina-MLEM-STR Deployable Radiator Panel
        #LOC_KSPZH_3429 = Managing the thermal loads during a full munar day-night cycle is one of the chief concerns for extending the surface stay of the MLEM system. The one goes on the second quadrant of the descent stage, and is deployed once the craft has landed.
        #LOC_KSPZH_4454 = Sina-MLEM-RHU2 Radioisotope Thermoelectric Generator Mount
        #LOC_KSPZH_2314 = Folding dual mount version of the PB-PANS-9 RTG. Used for upgraded munar missions that need to have keep-alive power and heat during the dormancy period of a long sortie.
        #LOC_KSPZH_4455 = Sina-MLEM-RHU4 Radioisotope Thermoelectric Generator Rack
        #LOC_KSPZH_4047 = Radial quad-mount version of the PB-PANS-9 RTG. Used for upgraded munar missions that need to have keep-alive power and heat during the dormancy period of a long sortie.
        #LOC_KSPZH_4463 = Sina-MSL "Bungalow" Shelter/Laboratory
        #LOC_KSPZH_2859 = Inspired by the fishing shacks north of the KSC, this shelter is designed to provide living and working space for two Kerbonauts for up to three months. Packed with consumables, a sample processing lab, and more. Connect the MTV deployment ramp to the node on the side - otherwise the robotics won't work. Use the "truck" variant of the descent tank assembly for autonomous landing.
        #LOC_KSPZH_4434 = Sina-FL4 Mounted Floodlight
        #LOC_KSPZH_3156 = Large mounted floodlight, for illuminating the area around your munar base. Attach to landers as needed.
        #LOC_KSPZH_4456 = Sina-MLEM-SHL Surface Shelter Module
        #LOC_KSPZH_3326 = Longer surface stays require facilities and consumables beyond what can be carried in a single MLEM lander. This is a dedicated shelter module - while it sacrifices the ascent propulsion system, it can sustain two crew members for up to a month on the surface. Includes surface communications, deployable insulation, and an expandable airlock - make sure your front leg does not have the "porch". Use the "truck" variant of the descent tank assembly for autonomous landing .
        #LOC_KSPZH_4441 = Sina-MLEM-CRZY Taxi Ascent Stage
        #LOC_KSPZH_4975 = The Sina Taxi Ascent Stage Cockpit provides accommodations for up to three Kerbals to ride to the Mun's surface atop the Sina Decent Stage, perform an extended surface stay, then return to orbit. During surface operations, the Taxi is shut down and put in a dormant state to save resources, while the crew operates out of a separately landed shelter. Includes integrated fuel tanks, RCS, communications system, extended life batteries, radiators, and deployable insulation for the dormancy period. Put the ascent engine on the bottom, and the passive docking port on the top. Remember to have all crew members on board before launching.
        #LOC_KSPZH_4452 = Sina-MLEM-PDP Payload Deployment Platform
        #LOC_KSPZH_5383 = This platform is intended to be mounted on top of a MLEM-TRK Descent Stage. Includes extending ramps for deploying a rover to the munar surface. Rover design or parts not included.
        #LOC_KSPZH_4458 = Sina-MLEM-TRK 3-4/45 RCS Thruster
        #LOC_KSPZH_3527 = Modified version of the standard Kane and Sina RCS cluster, designed to be mounted on the MLEM-Truck to provide independent attitude control for autonomous landing. Includes 3x variant for clearance when using the Payload Platform.
        #LOC_KSPZH_3344 = Lono-MTV-DHM Deployment Ramp
        #LOC_KSPZH_4090 = Robotic hinge for deploying the MTV from the Sina-MSL "Bungalow" shelter. Once the ramp has been lowered, the railing on the shelter can be raised. Failure to do so will result in an investigation by the relevant workplace safety organizations.
        #LOC_KSPZH_1277 = BDSEP-STOKE Active Seismic Experiment
        #LOC_KSPZH_662 = A small, crew-deployed mortar with explosive charges for triggering seismic events. Should not be used when personnel are nearby. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1276 = BDSEP-SMSD Surface Drill
        #LOC_KSPZH_1909 = Crew operated, surface deployed drilling expermiment. Must be brought in cargo storage and deployed on the surface by a kerbal, then run by a scientist.
        #LOC_KSPZH_1263 = BDSEP-C3PL Cosmic Ray Detector
        #LOC_KSPZH_2495 = Ground-deployed instrument package used for measuring the spectral data of charged particles striking the body's surface. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1266 = BDSEP-FROST Farside Radio Observing Scanning Telescope
        #LOC_KSPZH_4422 = Similar to ultraviolet rays, cosmic radio rays are hampered by our atmosphere. By placing one (or an array of several, if you want to be accurate) on the far side of another body, our planet's radio transmissions would be shielded and cosmic radio sources made far easier to detect. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1267 = BDSEP-GNOME Color Reference Gnomon
        #LOC_KSPZH_4501 = Small gnomon with color references, used for correcting and analyzing photos on return. Provides no functionality, but is a nice addition to our EVA photos. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1262 = BDSEP-AGD Advanced Gravioli Detector
        #LOC_KSPZH_2317 = Following demonstrations of the existence of gravioli particles, our scientists were desperate to obtain more data of this phenomena. The AGD contains a new and improved version of the original gravioli detector, intended for use as a long term, ground-deployed monitoring station. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1268 = BDSEP-JMK "Kadley" Observation Telescope
        #LOC_KSPZH_1840 = Compact telescope made with 3D printed parts. Must be brought in cargo storage and deployed on the surface by a kerbal. Run the experiment and collect the data via the PAW post deployment. Does not require an Experiment Control Station.
        #LOC_KSPZH_1279 = BDSEP-THRMSTAT Heat Flow Experiment
        #LOC_KSPZH_5219 = This control station contains a pair of heat probes which must be inserted into the soil. Once emplaced, they allow gradient measurements to be taken, allowing scientists to inference the geothermal temperatures and activity. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1270 = BDSEP-LSA Large Solar Array
        #LOC_KSPZH_3180 = Larger science stations require more power than RTGs can provide. For setups located in the lunar day, one or more of these panels can be erected to provide power for a BDSEP station. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1269 = BDSEP-LRA Laser Ranging Retro Reflector
        #LOC_KSPZH_5397 = This retro-reflector assembly allows the distance between Kerbin and the Mun to be measured down to the centimeter - very important for calculating mileage on kerbonaut's expense reports. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1261 = BDSEP-3MTM Tri-Axis Magnetometer
        #LOC_KSPZH_5043 = The loss of numerous tools, samples, and knick-knacks on previous missions made the inclusion of a magnetometer an essential piece of the BDSEP kit. Able to measure the magnetic field in all three dimensions, our days of raiding the supply closets will soon be gone! Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1272 = BDSEP-MEME Munar Ejecta and Meteorites Experiment
        #LOC_KSPZH_5027 = The cratered surface of Kerbin's closest moon is the result of thousands of asteroid and meteoroid impacts. While a large impact would likely destroy the experiment, smaller micro particles can be detected. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1273 = BDSEP-PSE Passive Seismic Experiment
        #LOC_KSPZH_677 = A small, self contained seismic monitoring station meant to be deployed by crew. Includes its own solar panels, though they're only enough to power the station itself. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1271 = BDSEP-LSRP Penetrometer
        #LOC_KSPZH_1910 = Crew operated, surface deployed penetrometer, for testing mechanical properties of soil. Must be brought in cargo storage and deployed on the surface by a kerbal, then run by a scientist.
        #LOC_KSPZH_1264 = BDSEP-CH1S7 Sample Storage Container
        #LOC_KSPZH_505 = A secure stowable container for storing core samples, shiny rocks, or detailed descriptions of your local surroudings. Deploy via a kerbal's inventory, store your science results, and pick it up again to stow back in a craft's inventory. Any science reports stored within will remain even when the part is stored.
        #LOC_KSPZH_1265 = BDSEP-COM-16S S-Band Antenna
        #LOC_KSPZH_5006 = The advantage of setting up semi-permanent science stations on other bodies is the tremendous amount of data they can return. However, sending that data back to KSC requires large amounts of bandwidth. The solution is the COM-16S combination transmission dish and MP3 player, available in stylish gold. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1275 = BDSEP-S3P Surface Electrical Properties Experiment
        #LOC_KSPZH_2494 = Ground-deployed instrument package used for electrical conduction properties of the body's surface. Must be brought in cargo storage and deployed on the surface by a kerbal. AUTHOR'S NOTE: In real life, this was paired with the SEP experiment antenna on the rover.
        #LOC_KSPZH_1274 = BDSEP-R2D4 Solar Wind Experiment
        #LOC_KSPZH_5380 = This peculiar little box contains instruments for measuring the solar wind emanating from Kerbol. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1278 = BDSEP-SWC Solar Wind Composition Experiment
        #LOC_KSPZH_5251 = This foil sheet is designed to capture solar wind particles. Once returned back to the lab, they can be analyzed to determine their composition and properties. Also useable as an emergency blanket if required. Must be brought in cargo storage and deployed on the surface by a kerbal. Run the experiment and collect the sample via the PAW post deployment. Does not require an Experiment Control Station.
        #LOC_KSPZH_1280 = BDSEP-TVO SSTV Camera
        #LOC_KSPZH_101 = 10 frames per second of grayscale goodness, broadcast at an ear-shrieking rate to the excited people back home. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_1281 = BDSEP-UBT Ultra Violet Telescope
        #LOC_KSPZH_3041 = Kerbin's atmosphere, while protecting us from solar radiation, also blocks out many spectra that would be useful for astronomy. The ground stations we've been establishing on other bodies are a great opporunity to set up an ultra violet telescope outside the atmosphere. Must be brought in cargo storage and deployed on the surface by a kerbal.
        #LOC_KSPZH_3333 = Lono-MRV-HPB Central Chassis
        #LOC_KSPZH_3416 = Main building base of the MRV. Attach the front and aft chassis segments, along with two seats. The bottom side contains a node for attaching to the deployment mechanism. Make sure to deploy the low-gain antenna once the rover is safely on the surface.
        #LOC_KSPZH_3334 = Lono-MRV-HPB Full Chassis
        #LOC_KSPZH_919 = Alternate version of the MRV chassis. Welding the front/aft frame sections prevents it from being stored on the MLEM, but means you won't have robotics-related bugs when driving around, switching crafts, etc. Use this if the "real" MRV is giving you problems, and cheat it to the surface (or send it down on a separate lander if you want).
        #LOC_KSPZH_3337 = Lono-MRV-LTG Traverse Gravimeter
        #LOC_KSPZH_2028 = Deployable surface gravimeter for the MRV. Place on the starboard side of the aft pallet. Must be detached and placed on the ground by a scientist to be activated.
        #LOC_KSPZH_3331 = Lono-MRV-HGA Communications Dish
        #LOC_KSPZH_3882 = Primary antenna for transmitting video, voice, and data from the MRV. Attaches to the port node on the front pallet.
        #LOC_KSPZH_3330 = Lono-MRV-HDM Deployment Hinge
        #LOC_KSPZH_4089 = Robotic hinge for deploying the MRV from stowage on board a lander.
        #LOC_KSPZH_3332 = Lono-MRV-HPA Aft Chassis
        #LOC_KSPZH_3335 = Lono-MRV-HPF Forward Chassis
        #LOC_KSPZH_3339 = Lono-MRV-PSD Foldable Chair
        #LOC_KSPZH_1979 = Deck chair modified for use on the munar surface. Contains a small stowage bag under the seat. Unfold the seats after the rover has been deployed from the lander.
        #LOC_KSPZH_3338 = Lono-MRV-MTC Television Camera
        #LOC_KSPZH_3885 = Primary television camera of the MRV, for showing the folks at home all the cool rocks you've found. Attaches to the starboard node on the front pallet.
        #LOC_KSPZH_3328 = Lono-MRV-ASP Aft Pallet
        #LOC_KSPZH_4065 = Rear pallet for the MRV, attached once it has been unfolded and deployed on the surface. Primarily used as a structural component, contains mounting points for the tool carrier, traverse gravimeter, and SEP experiment antenna.
        #LOC_KSPZH_3329 = Lono-MRV-FCEP Front Pallet
        #LOC_KSPZH_2330 = Front pallet for the MRV, attached once it has been unfolded and deployed on the surface. Contains the main batteries, protected solar panels, and the main communications computer. Mounting points for the high gain antenna and main camera are also provided.
        #LOC_KSPZH_3341 = Lono-MRV-SEA SEP Experiment Antenna
        #LOC_KSPZH_4350 = Science experiment designed to analyze the electrical properties of the local surface. Attaches to the node on top of the aft pallet.
        #LOC_KSPZH_3340 = Lono-MRV-SDM Deployment Hinge
        #LOC_KSPZH_4091 = Robotic slider for deploying the MRV from stowage on board a lander.
        #LOC_KSPZH_3336 = Lono-MRV-HTC Tool Carrier
        #LOC_KSPZH_2637 = Hand tool carrier meant to be attached to the MRV. Attach to the port node on the aft pallet. Unlocking the carrier will swing it outwards, so the tools on the back side can be accessed. Once it's unlocked, it can be placed on the ground. This accomplishes nothing, but it feels good.
        #LOC_KSPZH_3342 = Lono-MRV-WHL Rover Wheel
        #LOC_KSPZH_3343 = Lono-MTV "Mun Mite" Chassis
        #LOC_KSPZH_3294 = Lightweight, single crew scout rover designed to be deployed with the Sina-MSL "Bungalow" shelter. Includes storage for experiments, solar panels for recharging, and a core sample drill for performing short to medium range geological expeditions.
        #LOC_KSPZH_3003 = Kane-17-DP HF Dipole Radar Antenna
        #LOC_KSPZH_960 = An extending dipole antenna used to gather high frequency radar sounding data. Can be used as a communications antenna in a pinch. Attach in a pair to the nodes on the Kane engine plate.
        #LOC_KSPZH_2976 = Kane KSBXA-161-162 X-ray and Alpha particle spectrometer
        #LOC_KSPZH_5209 = This combo experiment is designed to detect X-ray fluorescence and alpha particles both in deep space and in orbit around planetary bodies.
        #LOC_KSPZH_2970 = Kane K-SBG160 Gamma Ray Spectrometer
        #LOC_KSPZH_5274 = This instrument can measure the composition of even very low concentration ambient gasses in space near celestial bodies.
        #LOC_KSPZH_2971 = Kane K-SBIRR171 Scanning Infrared Radiometer
        #LOC_KSPZH_4970 = The Scanning Infrared Radiometer measures thermal emission from the surface of celestial bodies in order to obtain a high-resolution surface temperature map.
        #LOC_KSPZH_2979 = Kane SBC166-175 Mapping Camera and Laser Altimeter
        #LOC_KSPZH_5163 = This advanced imaging system combines a photogrammetric mapping camera with a laser altimeter for detailed surveys of planetary bodies. A side facing stellar camera is also built in for extra science!
        #LOC_KSPZH_2972 = Kane K-SBM165 Mass Spectrometer
        #LOC_KSPZH_2978 = Kane SBC-163 Panoramic Camera
        #LOC_KSPZH_1764 = Camera system designed for wide field panoramic imaging.
        #LOC_KSPZH_2974 = Kane KSB-CSAR209 Sounding Radar
        #LOC_KSPZH_5216 = This complex synthetic aperture radar system is capable of subsurface mapping, measuring galactic electromagnetic radiation around bodies, studying surface topography and even producing surface imaging.
        #LOC_KSPZH_2975 = Kane KSBRR-209 Radar Optical Recording Unit
        #LOC_KSPZH_5225 = This device was designed to record synthetic aperture radar data in an optical format on photographic film. We've adapted it to record other forms of scientific data as well.
        #LOC_KSPZH_3031 = Kane-PFS "Sjogren" Subsatellite Core
        #LOC_KSPZH_5465 = This tiny satellite is meant to be carried in the service bay of a Kane-11 CSM, and ejected before return to Kerbin. Despite its small size it packs both a magnetometer boom (accompanied by two counterweight booms) and a charged particle detector. Use the K-MA1L Subsatellite Dispenser to store inside the Kane science bay.
        #LOC_KSPZH_2969 = Kane K-MA1L Subsatellite Dispenser
        #LOC_KSPZH_1838 = Compact letterbox shaped dispenser to safely hold the K-MA1L subsatellite until its ready to deploy.
        #LOC_KSPZH_2973 = Kane K-SBU169 Far Ultraviolet Spectrometer
        #LOC_KSPZH_4873 = The Far Ultraviolet Spectrometer is a versatile instrument which can among other things measure emissions from celestial bodies, zodiacal light, solar atmosphere emissions, stellar emissions, and galactic emissions.
        #LOC_KSPZH_3030 = Kane-OCX Payload Bay Solar Telescope
        #LOC_KSPZH_5062 = The predecessor of the Kane-OCO Telescope Mount used on the Hokulani space staton, the Kane-OCX Payload Bay Solar Telescope carries multiple solar observation experiments. Tracks the sun upon deployment. Defnitely not an orbital cannon.
        #LOC_KSPZH_3004 = Kane-17-YG VHF Yagi Antenna
        #LOC_KSPZH_321 = A folding Yagi antenna designed to enhance gathering of VHF radar sounding data. Can be used for communications in a pinch. Attach to the node on the Kane engine mount just under the science bay.
        #LOC_KSPZH_1428 = Bossart LVO1 1.25m Fairing Base
        #LOC_KSPZH_39 = 1.25m fairing base with a flat top for mounting wider payloads, such as the LVO1-23 Multi Probe Decoupler.
        #LOC_KSPZH_1462 = Bossart-F-MCA 1.25m Structural Adapter
        #LOC_KSPZH_43 = 1.25m structural adapter built for Bossart rockets. Includes optional decoupler hardware to turn it into an interstage.
        #LOC_KSPZH_1463 = Bossart-F-MCA 1.875m to 1.25m Structural Adapter
        #LOC_KSPZH_91 = 1.875m to 1.25m conical structural adapter built for Bossart rockets. Includes optional decoupler hardware to turn it into an interstage.
        #LOC_KSPZH_3121 = LVO1 "Bactrian" Sidemount Carrier Pod
        #LOC_KSPZH_3122 = LVO1 "Jamal" Sidemount Carrier Pod
        #LOC_KSPZH_386 = A larger evolution of the "Remora" series of sidemount pods, the "Jamal" can carry an entire "Limpet" class probe and its motor.
        #LOC_KSPZH_3606 = NC-57A Bossart Rocket Development Nose Cone
        #LOC_KSPZH_932 = An all in one instrumentation package to aid in the development of new rockets, this aerodynamic nose cone features a barometer experiment, pressure and acceleration sensors, and optional lead ballast storage to use as a mass simulator.
        #LOC_KSPZH_1475 = Bossart-PBF Booster Skirt
        #LOC_KSPZH_1461 = Bossart-Dioscuri-ESMR Radial Decoupler
        #LOC_KSPZH_4509 = Small radial decoupler originally designed for use on Bossart IIAS rockets with the Dioscuri 4A SRBs. Attach to the booster skirt not the core tank.
        #LOC_KSPZH_1442 = Bossart-BT1-700 Conical Adapter Balloon Fuel Tank
        #LOC_KSPZH_1852 = Conical adapter fuel tank for the Bossart 1.875m launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. This adapter tank is available in multiple lengths and top diameters.
        #LOC_KSPZH_1447 = Bossart-BT4-3400 Core Fuel Tank
        #LOC_KSPZH_3321 = Long fuel tank for the Bossart-1 launcher. You'll need to attach the adapter tank on to the bottom before mounting the booster engine skirt. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. There is a specially reinforced ring at the bottom for attaching vernier thrusters. The distinctive side pods contain probe core avionics for an all in one launch solution.
        #LOC_KSPZH_1445 = Bossart-BT3-1200 Extension Balloon Fuel Tank
        #LOC_KSPZH_2221 = Extension fuel tank for the Bossart 1.875m launcher. Used as the upper half of the core tankage for extanded variants of Bossart, and is available in multiple lengths to suit multiple builds. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can.
        #LOC_KSPZH_1481 = Bosssart-F Command Antenna
        #LOC_KSPZH_1471 = Bossart-J18E 1.875 Engine Mount
        #LOC_KSPZH_222 = A 1.875m engine mount with multiple mounting and shroud length options.
        #LOC_KSPZH_5337 = This lifter engine is optimized for vacuum flight instead of the low atmosphere. It offers tremendous efficiency to the core stage once its been lifted above the densest part of the atmosphere.
        #LOC_KSPZH_3126 = LVO1-23 Multi Probe Decoupler
        #LOC_KSPZH_4649 = Standard low-profile 1.5m decoupler for rockets produced by Bluedog Design Bureau.
        #LOC_KSPZH_1470 = Bossart-Inon "Banana" Retro Motor
        #LOC_KSPZH_4111 = SC-58Z1 "Chatterbox" Relay Antenna
        #LOC_KSPZH_2174 = Engineers at the Research Center tell us if we shoved a tape recorder and a relay transmitter receiver into this nose cone, attached it to a Bossart B rocket and launched the whole thing into space, it would count as a communications "satellite".
        #LOC_KSPZH_1474 = Bossart-PBE14 Advanced Booster Skirt
        #LOC_KSPZH_128 = 2.5m booster skirt that can mount 4 engines for larger Bossart vehicles.
        #LOC_KSPZH_1458 = Bossart-BTX5-680 Sustainer Adapter Balloon Fuel Tank
        #LOC_KSPZH_3350 = Lower adapter fuel tank for 2.5m Bossart rockets. Has a mounting point for a single sustainer and allows the use of a 2.5m jettisonable booster skirt supporting 4 engines. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can.
        #LOC_KSPZH_1456 = Bossart-BTX3-900 Aft Adapter Balloon Fuel Tank
        #LOC_KSPZH_3351 = Lower adapter fuel tank for the Bossart-1X launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. While extremely resilient, it cannot have other components radially attached to it, as doing so would compromise the structural integrity.
        #LOC_KSPZH_1455 = Bossart-BTX3-700 Conical Adapter Balloon Fuel Tank
        #LOC_KSPZH_1851 = Conical adapter fuel tank for the 2.5m Bossart-1X launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. This adapter tank is available with 1.875m and 0.9375m top node variants.
        #LOC_KSPZH_1454 = Bossart-BTX3-2900 Core Fuel Tank
        #LOC_KSPZH_3420 = Main fuel tank for the 2.5m Bossart-1X launcher. You'll need to attach the adapter tank on to the bottom before mounting the aft sections. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. The distinctive side pod contains probe core avionics for an all in one launch solution.
        #LOC_KSPZH_1453 = Bossart-BTX3-2600 Balloon Fuel Tank
        #LOC_KSPZH_2222 = Extension fuel tank for the Bossart-1X 2.5m launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. Used as the upper half of the core Bossart-1X tankage, and is available in multiple convenient lengths.
        #LOC_KSPZH_1297 = BSP "Remora" Sidemount Carrier Pod
        #LOC_KSPZH_522 = A sidemount pod for storing experiments and ocassionally a sandwich.
        #LOC_KSPZH_1480 = Bossart-STC3-Tri-coupler
        #LOC_KSPZH_725 = A structural tri-coupler that enables three 1.875m lower stages to be connected to a single 1.875m upper stage. Can optionally be used as a decoupler.
        #LOC_KSPZH_1853 = Conical adapter fuel tank for the Bossart-ADLV launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. Available in multiple top node sizes and lengths.
        #LOC_KSPZH_1436 = Bossart-ADLV-7100 Extension Balloon Fuel Tank
        #LOC_KSPZH_1917 = Cylindrical extension fuel tank for the Bossart-ADLV launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. Available in multiple convenient lengths.
        #LOC_KSPZH_1437 = Bossart-ADLV-9000 Balloon Fuel Tank
        #LOC_KSPZH_3423 = Main fuel tank for the Bossart-ADLV launcher. The extremely thin walls of this tank are kept in tension by the pressure of the fuel (and pressurant gas as the fuel is used), providing a rigidity similar to a soda can. The distinctive side pods contain probe core avionics for an all in one launch solution.
        #LOC_KSPZH_3582 = Muo-G18E 1.875 Engine Mount
        #LOC_KSPZH_73 = 1.875m engine mount made from left over bits from a DR180 "Czar" engine. Can be used to mount 1 or 2 engines.
        #LOC_KSPZH_3583 = Muo-G25E 2.5m Engine Mount
        #LOC_KSPZH_132 = 2.5m engine mount made from left over bits from a DR180 "Czar" engine. Can be used to mount 1,2 or 4 engines.
        #LOC_KSPZH_3588 = Muo-V-5XX 1.875m-2.5m Internal Conical Adapter
        #LOC_KSPZH_2883 = It might look like a typical 2.5 interstage adapter but this conical adapter is slightly narrower and designed to sit **inside** of the Muo-V-5XX 3.5m Fairing Base Adapter to hold a 1.875m Inon stage.
        #LOC_KSPZH_257 = A big engine needs a big orange tank. We don't know why these ones in particular need to be orange, but we do know they don't include retro SRBs to aid in stage separation. The distinctive side pod contains guidance avionics for an all in one launch solution.
        #LOC_KSPZH_3578 = Muo-5FLR Inon Forward Load Reactor
        #LOC_KSPZH_402 = A load bearing deployable structural piece of dubious utility. Attach to the top of Inon III fuel tank, between the fuel tank and avionics, and set the auto deploy altitude for after the payload fairing has deployed.
        #LOC_KSPZH_3589 = Muo-V-5XX 3.5m Fairing Base Adapter
        #LOC_KSPZH_228 = A 2.5m > 3.5m adapter skirt with a fairing ring on top and an internal mounting ring for an interstage or upper stage. Decoupler not included.
        #LOC_KSPZH_3581 = Muo-CGR63-S1080 "Diamond" Solid Rocket Booster
