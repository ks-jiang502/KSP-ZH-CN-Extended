        #LOC_KSPZH_4179 = SPA 3.125m Payload Adapter
        #LOC_KSPZH_4638 = Standalone version of the payload adapter truss from the 3.125m DHSS fairing base.
        #LOC_KSPZH_1968 = Daleth-IV-DHSS Cryogenic Upper Stage
        #LOC_KSPZH_2177 = Enlarged Daleth Hydrogen Second Stage for Daleth IV Medium Plus and Heavy variants. A large cryogenic upper stage with avionics and attitude control thrusters, only missing an engine. Its a tight squeeze but a dual engine mount is available.
        #LOC_KSPZH_1950 = Daleth IV DHSS 3.125m Fairing Base
        #LOC_KSPZH_150 = 3.125m fairing base with integrated payload attach fitting truss.
        #LOC_KSPZH_2902 = JA10-118-F10 "Hebel" Liquid Engine
        #LOC_KSPZH_948 = An evolved version of the JA10 engines, the "Hebel" engine uses a larger engine bell to achieve superior performance. Originally made for the Daleth F upper stage.
        #LOC_KSPZH_1975 = Daleth-P/K-180-240 Liquid Fuel Tank
        #LOC_KSPZH_3280 = Lightweight 0.9375m(ish) upper stage tank for Daleth upper stages. The Daleth-P is the base version and is upgradable to the larger Daleth-K variant via part upgrade. Hang below the "skirt" fairing base to make a Daleth-P/K upper stage. Includes built in attitude control thrusters.
        #LOC_KSPZH_1974 = Daleth-P/K Avionics Core
        #LOC_KSPZH_925 = An advanced avionics core made from a pressurized fuel tank for the Daleth-II rocket. Place below your payload.
        #LOC_KSPZH_1971 = Daleth-P/K 1.5m Fairing Adapter
        #LOC_KSPZH_5129 = This 1.5m fairing base ring allows you to "hang" a 0.9375m rocket stage within a large interstage, so it doesn't have to sustain the full launch loads. Designed for the Daleth P and K stages you could also just reuse leftover Alphastar tankage and Sina lander engines...
        #LOC_KSPZH_1972 = Daleth-P/K 1.875m Fairing Adapter
        #LOC_KSPZH_5131 = This 1.875m fairing base ring allows you to "hang" a 0.9375m rocket stage within a large interstage, so it doesn't have to sustain the full launch loads. Designed for the Daleth P and K stages you could also just reuse leftover Alphastar tankage and Sina lander engines...
        #LOC_KSPZH_4038 = RW-ATR2201 "Lysenko" Liquid Engine
        #LOC_KSPZH_299 = A derivative of the Sina MEM Descent Propulsion System, this handy upper stage engine was adapted for use on the Daleth P upper stage used on Daleth 1000, 2000 and 3000.
        #LOC_KSPZH_2020 = Delta118K Upgrade
        #LOC_KSPZH_2021 = Delta118X Upgrade
        #LOC_KSPZH_2022 = DeltaK Upgrade
        #LOC_KSPZH_3928 = Prometheus RB-1E471 "Cordele" Rocket Engine
        #LOC_KSPZH_3682 = Occupying a middle ground between the "Navi" and the "Regor" booster engines, the "Cordele" is a bit of a curious use case. Originally developed for the Prometheus-I first stage (where it would be accompanied by a pair of IE-101 verniers), it was later proposed in a 4-engine cluster for the Sarnus I first stage.
        #LOC_KSPZH_2245 = FG1 "Drury" Liquid Fuel Engine
        #LOC_KSPZH_1175 = Astral Manufactures
        #LOC_KSPZH_5211 = This compact and innocuous looking upper stage engine is in fact powered by incredibly volatile and toxic propellants. Despite being a simple pressure fed engine, it achieves exceptional efficiency. Use with extreme caution.
        #LOC_KSPZH_3357 = MBC-1 "Megalodon" Cryogenic Engine
        #LOC_KSPZH_933 = An almost unbelievably huge cryogenic engine, the Megalodon offers incredible thrust in the same class as the LEF1 Regor combined with the efficiency of liquid hydrogen fuel. Intended for mega rockets such as improved Sarnus vehicles. Originally designed for vacuum or high altitude operations, a sea level version is also available for booster applications.
        #LOC_KSPZH_1298 = BX-60 "Kodama" Cryogenic Engine
        #LOC_KSPZH_967 = An extrememe performance evolution of the basic expander bleed cycle, this engine uses upstream boost pumps to achieve high turbo-pump and chamber pressures and produces double the thrust of a typical closed expander cycle engine. By injecting the bleed exhaust back into the nozzle for film cooling, some of the Isp loss from using the bleed cycle is also recovered. The end result is a no compromise upper stage engine.
        #LOC_KSPZH_3117 = LVN-1 "Banyan" Nuclear Engine
        #LOC_KSPZH_5620 = Using the same reactor as the NERV XE, this refined design uses a full flow cycle for improved performance and reliability. A curious aerospike nozzle variant is also available to shorten the considerable length of the engine although the size constraints result in a 20s loss of vacuum Isp.
        #LOC_KSPZH_3118 = LVN-2 "Redwood" Nuclear Engine
        #LOC_KSPZH_1490 = Built around an incredibly powerful reactor, this nuclear engine emphasises thrust to enable demanding crewed interplanetary missions.
        #LOC_KSPZH_3119 = LVN-XE "Baobab" Nuclear Engine
        #LOC_KSPZH_952 = An experimental nuclear engine running a hot bleed cycle just to see if whether using nuclear reactors for propulsion is a good idea or not... Features built in roll control utilising the bleed exhaust.
        #LOC_KSPZH_3776 = PL20-X3 Cryogenic Engine
        #LOC_KSPZH_1413 = Bluedog Design Bureau's first attempt at a staged combustion cycle design, this high pressure engine delivers high thrust and Isp in a remarkably compact package. Includes variants optimized for either sea-level or vacuum operation. A deployable nozzle extension keeps the vacuum optimized version very compact even with a large expansion ratio.
        #LOC_KSPZH_4039 = RXD-30 "Zhar-Ptitsa" Cryogenic Engine
        #LOC_KSPZH_5212 = This compact engine harnasses the capabilities of staged combustion to deliver astonishing performance. Although slightly less powerful than the latest Isor engines, the combination of high chamber pressure and a 1:400 expansion ratio results in an incredible 474s of vacuum Isp. Designed from the ground up for extended on orbit appplications such as space tugs.
        #LOC_KSPZH_4170 = SM01 "Aphid" Nuclear Engine
        #LOC_KSPZH_5617 = Using a left over small reactor design fromt the "NERV" development program, this tiny nuclear engine features an unusual sideways folding nozzle to maximise room inside limited spaceplane payload bays.
        #LOC_KSPZH_3782 = PXR-129 "Hausenblase" Cryogenic Engine
        #LOC_KSPZH_3220 = Leo-B1G-CCA "Raphael-A" Interstage Adapter
        #LOC_KSPZH_2867 = Interstage Adapter for the Leo-B1G capsule with "Raphael" cylindrical service module. Includes 1.875m, 2.5m, 3.125m, 3.75m, and 4.25m mounting options.
        #LOC_KSPZH_3219 = Leo-B1G-4200 Uplink Antenna
        #LOC_KSPZH_957 = An extending antenna for keeping the B1G spacecraft in contact with ground stations.
        #LOC_KSPZH_3217 = Leo-B1G "Botticelli" Crew Module
        #LOC_KSPZH_1164 = As operations in space become more complex, more crew members are needed. This expanded crew module replaces the standard Leo service module, allowing four additional Kerbals to ride to space.
        #LOC_KSPZH_3221 = Leo-B1G-CCC "Raphael-C" Cargo Module
        #LOC_KSPZH_1769 = Cargo module for the conical B1G service module. Place below the retro module. Includes cargo space(theoretically), as well as a supply of monopropellant and electricity. It also includes a built in decoupler for jettisoning from the retro module. Engines sold separately.
        #LOC_KSPZH_3223 = Leo-B1G-CCR "Raphael-R" Retro Module
        #LOC_KSPZH_2767 = Hollow structural adapter for the conical B1G service module. Includes sump tanks for the OAMS system as well as mounting points for 8 retro solids. Hold the ALT key when placing them on the nodes.
        #LOC_KSPZH_3227 = Leo-B1G-PCC "Raphael-C" Pressurized Cargo Module
        #LOC_KSPZH_1770 = Cargo module for the cylindrical B1G service module. Place below the equipment module. Includes cargo space, electricity, and fuel cell. It also includes an optional built in decoupler for jettisoning from the equipment module. Engines sold separately.
        #LOC_KSPZH_3222 = Leo-B1G-CCR "Raphael-R" Equipment Module
        #LOC_KSPZH_2181 = Equipment module for the cylindrical B1G service module. Contains the main supply of monopropellant, mounting points for the RCS thrusters, and a crew access tube to connect the capsule to the Pressurized Cargo Module.
        #LOC_KSPZH_3248 = Leo-M-3VS 2.5m Capsule Decoupler
        #LOC_KSPZH_3347 = Low profile decoupler for separating the Leo-B1G "Botticelli" capsule from the service module.
        #LOC_KSPZH_3224 = Leo-B1G-DPC Drogue Parachute
        #LOC_KSPZH_2097 = Drogue parachute for the B1G capsule. Attach to the node in the nose section.
        #LOC_KSPZH_3225 = Leo-B1G-LES Launch Escape System
        #LOC_KSPZH_472 = A powerful Launch Escape System based on the Kane-11-LES, modified to fit the Leo-B1G capsule. Stage to jettison. For best results jettison high in (or out of) the atmosphere, usually around first stage cut off. After firing during an emergency abort, canards deploy to flip the capsule retrograde for parachutes. Automatically added to the abort action group. Autostrut to heaviest part to stop wobbling.
        #LOC_KSPZH_3226 = Leo-B1G-MPC Landing Parachute System
        #LOC_KSPZH_3176 = Large, tri-canopy parachute for the B1G spacecraft. Remarkable for how much parachute is packed into such a small volume.
        #LOC_KSPZH_3218 = Leo-B1G Nose Segment
        #LOC_KSPZH_819 = Advanced nose segment for the Leo-B1G spacecraft. While it lacks hardware for docking, it still provides the most important task of any part: Aesthetics. And covering up the main chutes, we suppose. It also includes a spot for the drogue chutes, if crews have started complaining about G-loads during parachute deployment.
        #LOC_KSPZH_3216 = Leo-B-ATE "Angelo" Adapter Module
        #LOC_KSPZH_5044 = The lower half of the Leo-B adapter, includes two separation rockets, batteries, and a decoupler for separating from the retro section.
        #LOC_KSPZH_3215 = Leo-B-6RST "Michel" Retro Module
        #LOC_KSPZH_5269 = This hollow structural adapter is designed to sit on top of the Leo-B adapter section and includes mounting points for six retro motors.
        #LOC_KSPZH_3229 = Leo-C-MOTML "Pitseolak" Service Module
        #LOC_KSPZH_5405 = This service module was essentially created by welding together a Leo's Retro and Equipment modules. The interiors have been entirely rearranged, making way for a crew tunnel and a small pressurized volume in the aft section. While this prevents it from being as packed with fuel as the Meduci-M, it works better as a crew ferry vehicle with a rear-mounted docking port.
        #LOC_KSPZH_3249 = Leo-M-63E "Vinci" Command Pod
        #LOC_KSPZH_2882 = It is clear that only so much can be accomplished by single kerbals in space. Though we'd eventually like to be launching even more in a single launch, this two-kerbal pod is an important step in developing the skillsets our program will need for more complex missions in the future.
        #LOC_KSPZH_3256 = Leo-M-CSM 1.5m Decoupler
        #LOC_KSPZH_3346 = Low profile decoupler for separating the Leo capsule from the retro module.
        #LOC_KSPZH_3257 = Leo-M-CSM 1.875m Decoupler
        #LOC_KSPZH_3252 = Leo-M-6NDP Nose Docking Mechanism
        #LOC_KSPZH_3694 = One of the most crucial skills that the Leo program is meant to develop is the ability to rendevous and dock in space. This simple docking mechanism doesn't have the ability to transfer crew or resources, but it will allow you to connect two vessels in flight. This male active docking mechanism corresponds to the female Belle Docking Adapter. It includes an indexing key that slides into the V shape on the Belle Docking Adapter, to help line the two craft up properly.
        #LOC_KSPZH_3254 = Leo-M-8DC Drogue Parachute
        #LOC_KSPZH_2099 = Drogue parachute for the Leo capsule. Attach to the node in the nose section.
        #LOC_KSPZH_3213 = Leo-A-O7NB "Meduci-E" Equipment Module
        #LOC_KSPZH_3214 = Leo-A-O7NBE "Meduci-S" Structural Equipment Module
        #LOC_KSPZH_5376 = This orbital service module includes 8 rotational control thrusters, but lacks a supply of monopropellant and electrical equipment. It also includes a built in decoupler for jettisoning from the Retro Module. Engines sold separately.
        #LOC_KSPZH_3258 = Leo-M-SZR 1.5m Heatshield
        #LOC_KSPZH_2888 = It's like a frisbee! 1.5m heatshield for the Leo capsule.
        #LOC_KSPZH_3259 = Leo-M-SZR 1.875m Heatshield
        #LOC_KSPZH_2889 = It's like a frisbee! 1.875m heatshield for the Leo capsule.
        #LOC_KSPZH_3260 = Leo-M-SZR 2.5m Heatshield
        #LOC_KSPZH_2890 = It's like a frisbee! 2.5m heatshield for the Leo capsule.
        #LOC_KSPZH_3245 = Leo-M-2A2 Horizon Scanner Module
        #LOC_KSPZH_2768 = Horizon scanners module for the Leo CSM with a jettisonable fairing. Provides SAS modes.
        #LOC_KSPZH_3242 = Leo-L-MFBS "Bellini" Service Module
        #LOC_KSPZH_5445 = This stretched Leo equipment module includes batteries, a pressurized volume for cargo, larger fuel tanks. It has sets of RCS thrusters for lateral and retro translation, as well as attitude control. For use with the standard Leo retro module.
        #LOC_KSPZH_3230 = Leo-D-L8SM "Raphael" Service Module
        #LOC_KSPZH_5404 = This service module was essentially created by welding together a Leo's Retro and Equipment modules. Omitting the retro solids and packing in more fuel and batteries allows it to perform longer duration missions, perhaps on a lunar free return trajectory with a sufficiently powerful launch vehicle. Engines sold separately.
        #LOC_KSPZH_3261 = Leo-MRC-A Discone Antenna
        #LOC_KSPZH_595 = A small extending antenna used for maintaining communications between the Leo spacecraft and the ground from distance beyond low orbit.
        #LOC_KSPZH_3268 = Leo-XP-NRC Nose Camera
        #LOC_KSPZH_5154 = This adaptation of the Leo nose replaces the docking hardware with a set of cameras, for mapping terrain.
        #LOC_KSPZH_3262 = Leo-MRC-D High Gain Dish
        #LOC_KSPZH_588 = A small dish meant to fit in the aft compartment of a Leo spacecraft, for high bandwidth communications from distances beyond low orbit.
        #LOC_KSPZH_3267 = Leo-XP-MFD Magnetometer Boom
        #LOC_KSPZH_597 = A small extending magnetometer boom to be mounted in the trunk of the Leo spacecraft's adapter section.
        #LOC_KSPZH_3253 = Leo-M-7RC Landing Parachute System
        #LOC_KSPZH_4640 = Standard 0.625m inline parachute.
        #LOC_KSPZH_3244 = Leo-M-1NAC Aerodynamic Nose Cover
        #LOC_KSPZH_1879 = Covers up the nose of the Leo Docking Mechanism to protect it during ascent. Jettison once out of the atmosphere.
        #LOC_KSPZH_3232 = Leo-EOMAS "Gus" Manuevering Thruster
        #LOC_KSPZH_5467 = This tiny thruster is nevertheless more than sufficient to manuever the Leo capsule around in low Kerbin orbit. Can function as both a primary engine and posigrade rcs thruster.
        #LOC_KSPZH_3269 = Leo-XP-REP Training Subsatellite
        #LOC_KSPZH_644 = A small subsat meant to fit in the trunk of the Leo spacecraft's adapter section. Used for practicing rendezvous and stationkeeping techniques. Includes batteries, antennas, and visual acquisition lights.
        #LOC_KSPZH_3251 = Leo-M-68V Reentry Reaction Thrusters
        #LOC_KSPZH_5149 = This RCS system provides full 3 axis stabilization for a pod. It is meant to be used during reentry, and is disabled by default. It can be manually enabled in flight.
        #LOC_KSPZH_3212 = Leo-A-O6NB "Meduci-R" Retro Module
        #LOC_KSPZH_5268 = This hollow structural adapter is designed to sit on top of the Leo equipment section and house a quad of retro motors for reentry. Houses six translational control thrusters. We're sure you can find other uses for this too.
        #LOC_KSPZH_3233 = Leo-ET385 "Banger" Retro Solid
        #LOC_KSPZH_3210 = Leo retro solid derived from the Staara-13-A "Retras". Place in 4x symmetry in the gaps of the retro module cruciform. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and manuevers.
        #LOC_KSPZH_3250 = Leo-M-63F "Giotto" Crew Module
        #LOC_KSPZH_1163 = As operations in space become more complex, more crew members are needed. This expanded crew module replaces the standard Leo service module, allowing an additional Kerbal to ride to space.
        #LOC_KSPZH_3270 = Leo-XP-SPE Spectrometer Instrument
        #LOC_KSPZH_610 = A small ion spectrometer, meant to be mounted to the Leo spacecraft's adapter section. The data cannot be transmitted so remember to collect your data for returning to Kerbin.
        #LOC_KSPZH_3263 = Leo-MRC-U Uplink Antenna
        #LOC_KSPZH_596 = A small extending antenna used for maintaining communications between the Leo spacecraft and the ground.
        #LOC_KSPZH_3265 = Leo-S-714E "Zhengming-E" Equipment Module
        #LOC_KSPZH_5377 = This orbital service module includes a supply of mono propellant for extensive orbital maneuvers, batteries, and 8 rotational control thrusters. It also includes a built in decoupler for jettisoning from the Retro Module. Engines sold separately.
        #LOC_KSPZH_3264 = Leo-S-714AC Aerodynamic Nose Cover
        #LOC_KSPZH_1880 = Covers up the nose of the Leo Docking Mechanism to protect it during ascent. This nose is meant to be kept on for rear-docking configurations, but nothing stops you from jettisoning after ascent.
        #LOC_KSPZH_3266 = Leo-S-714R "Zhengming-R" Retro Module
        #LOC_KSPZH_5456 = This structural adapter is designed to sit on top of the Leo equipment section and house a quad of retro motors for reentry. Houses six translational control thrusters. We're sure you can find other uses for this too.
        #LOC_KSPZH_2083 = Dona-LK217 Miniature Lander Can
        #LOC_KSPZH_5244 = This extremely small capsule is darn near the smallest capsule you can make to hold a single kerbal. Contains just enough supplies and features to enable a short romp down to the surface and back. Its pressurized cockpit makes it (slightly) safer than an external command seat, though there isn't room to take off one's helmet. Please peruse the other Dona parts in order to turn this capsule into a complete lander system.
        #LOC_KSPZH_2082 = Dona-LDAE8 Lander Engine
        #LOC_KSPZH_5396 = This remarkably simple and robust engine might not be the best in terms of thrust or efficiency, but its light weight and small size makes it ideal for small, lightweight landers. A single example is used as both the descent and ascent engine of the Dona lander, using the empty toroidal descent stage tank as a takeoff platform.
        #LOC_KSPZH_2084 = Dona-LTT60 Descent Stage Tank
        #LOC_KSPZH_2038 = Descent tank for the Dona Lander system. Attach to the bottom node of the engine. The descent stage can decouple using a built in decoupler. Meant to have 4x legs attached, but you can probably get away with less if you're brave. The ladder can be toggled in the VAB for uncrewed landers.
        #LOC_KSPZH_2080 = Dona-L3GG Landing Leg
        #LOC_KSPZH_5688 = While Professor Wernher was looking for his golf clubs, we were working on this landing leg for the Dona lander system. Attach in 4x symmetry to the descent stage. Swings downwards before locking into place - while this improves stability, it means there is no suspension system to absorb impacts.
        #LOC_KSPZH_1336 = Belle Low Profile Docking Port
        #LOC_KSPZH_5437 = This special docking port is designed to capture the Leo nose cone's docking mechanism. The simple mechanical connection won't even allow you to transfer resources, much less crew, but it will securely attach two vessels together, for berthing or travel. This low profile model needs to be deployed in order to dock. Be warned, it is not as forgiving as its larger sibling.
        #LOC_KSPZH_2081 = Dona-LAT25 Ascent Stage Tank
        #LOC_KSPZH_1171 = Ascent tank for the Dona lander system. Place on either side of the lander can, make sure that any extra fuel in the descent tank is transferred before you tank off. Includes a whopping 8 integrated RCS thrusters.
        #LOC_KSPZH_1340 = Belle-4900 Fairing Base
        #LOC_KSPZH_215 = A 0.98m fairing base used as the standard shroud for the Belle upper stage. Used for payloads such as Aeolus. Later adapted as the standard fairing for the Daleth-E upper stage.
