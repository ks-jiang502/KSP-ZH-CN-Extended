        #LOC_KSPZH_2848 = Inon-DM 1500 Cryogenic Upper Stage
        #LOC_KSPZH_3724 = Our engineers found discarded blueprints for an interestingly shaped upper stage in the dumpster of a rival space agency. They adapted this design into a small, 1.875m Inon-based hydrolox upper stage/kick stage designed to be used in conjunction with the Inon-D-1(A/T) upper stage. While designed to be used on top of Bossart-Centaur or Sarnus IB-CE as a kick stage, this little upper stage that could can be used for a wide number of applications. Can be used with or without jettisonable insulation panels. Comes with integrated RCS thrusters.
        #LOC_KSPZH_2850 = Inon-MPF 2.08m Fairing Base
