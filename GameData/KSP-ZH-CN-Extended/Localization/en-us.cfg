        #LOC_KSPZH_125 = 2.5m Interstage decoupler to allow 2.5m spacecraft or stages to be mounted to the top of the SIV stage. Also has a version to allow such stages to be attached to 1.875m lower stages.
        #LOC_KSPZH_4271 = Sarnus-SIV A6BP Payload Adapter
        #LOC_KSPZH_467 = A payload adapter designed to mate 2.5m payloads to the Sarnus-SIV stage. While designed specifically for mating SIV with the Kane Boilerplate Service Module, this adapter can be used for a wide range of applications. Also the primary mount for the Condor satellite, and as such includes a toggleable mount to hold the Condor satellite as well as toggleable guide rails to guide the Kane Boilerplate safely off of Condor. Includes an integrated decoupler and a toggleable extension.
