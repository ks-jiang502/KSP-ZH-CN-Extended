        #LOC_KSPZH_1799 = Chryslus-IV-K45 "Hunter" Liquid Engine
        #LOC_KSPZH_5477 = This upper stage engine fills the gap between the Belle and Prometheus upper stage engines. Intended for use on the Chryslus IV-B second stage. Using a unique heated hybrid cycle, it eliminates the need for turbopumps while saving mass over traditional pressure fed engines. Surplus hot gas from the generator is fed through a vernier nozzle for roll control.
        #LOC_KSPZH_1800 = Chryslus-IV-K6 "Seeker" Liquid Engine
        #LOC_KSPZH_3886 = Primitive upper stage engine. Don't activate it in the atmosphere - the engine bell is optimized for vacuum performance. Neither the most powerful nor most efficient engine, but it's a start. Designed for use on the Chryslus IV-A second and IV-B third stages, and also used on the Vejur 3rd stage. Includes 0.3125m mounting hardware.
