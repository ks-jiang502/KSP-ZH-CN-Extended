        #LOC_KSPZH_3902 = Project Gemini
        #LOC_KSPZH_3903 = Project Gemini was NASA's second human spaceflight program. Conducted between projects Mercury and Apollo, Gemini started in 1961 and concluded in 1966. The Gemini spacecraft carried a two-astronaut crew. Ten Gemini crews flew low Earth orbit (LEO) missions during 1965 and 1966, putting the United States in the lead during the Cold War Space Race against the Soviet Union.
        #LOC_KSPZH_3904 = Project Mercury
        #LOC_KSPZH_3905 = Project Mercury was the first human spaceflight program of the United States, running from 1958 through 1963. An early highlight of the Space Race, its goal was to put a man into Earth orbit and return him safely, ideally before the Soviet Union. Taken over from the US Air Force by the newly created civilian space agency NASA, it conducted twenty uncrewed developmental flights (some using animals), and six successful flights by astronauts.
        #LOC_KSPZH_4835 = The Apollo Program
        #LOC_KSPZH_4837 = The Apollo program, also known as Project Apollo, was the third United States human spaceflight program carried out by the National Aeronautics and Space Administration (NASA), which accomplished landing the first humans on the Moon from 1969 to 1972. First conceived during Dwight D. Eisenhower's administration as a three-man spacecraft to follow the one-man Project Mercury which put the first Americans in space, Apollo was later dedicated to President John F. Kennedy's national goal of "landing a man on the Moon and returning him safely to the Earth" by the end of the 1960s, which he proposed in an address to Congress on May 25, 1961.&br;&br;Kennedy's goal was accomplished on the Apollo 11 mission when astronauts Neil Armstrong and Buzz Aldrin landed their Lunar Module (LM) on July 20, 1969, and walked on the lunar surface, while Michael Collins remained in lunar orbit in the Command/Service Module (CSM), and all three landed safely on Earth on July 24. Five subsequent Apollo missions also landed astronauts on the Moon, the last in December 1972. In these six spaceflights, twelve men walked on the Moon.
        #LOC_KSPZH_4977 = The Skylab Program
        #LOC_KSPZH_4480 = Skylab was the United States' first space station, orbiting Earth from 1973 to 1979, when it fell back to Earth amid huge worldwide media attention. Launched and operated by NASA, Skylab included a workshop, a solar observatory, and other systems necessary for crew survival and scientific experiments. It was launched unmanned by a modified Saturn V rocket, with a weight of 170,000 pounds (77,111 kg). Lifting Skylab into low earth orbit was the final mission and launch of a Saturn V rocket (which was famous for the first--and subsequent--manned moon landings).
        #LOC_KSPZH_4858 = The Corona Program
        #LOC_KSPZH_4859 = The Corona program was a series of American strategic reconnaissance satellites produced and operated by the Central Intelligence Agency Directorate of Science & Technology with substantial assistance from the U.S. Air Force. There were 4 different keyhole satellite types used for Corona (KH-1, KH-2, KH-3, KH-4). The Corona satellites were used for photographic surveillance of the Soviet Union (USSR), the People's Republic of China, and other areas beginning in June 1959 and ending in May 1972. Corona started under the name "Discoverer" as part of the WS-117L satellite reconnaissance and protection program of the US Air Force. It has been estimated that 850 million dollars was spent on the Corona program. Adjusted for inflation it would be equal to 6.84 billion dollars in 2019.
        #LOC_KSPZH_4903 = The Lanyard Program
        #LOC_KSPZH_1824 = Codenamed Lanyard, the KH-6 was the unsuccessful first attempt to develop and deploy a high-resolution optical reconnaissance satellite by the United States National Reconnaissance Office. Launches and launch attempts spanned the period from March to July 1963. The project was quickly put together to get imagery of a site near Tallinn suspected of having anti-ballistic missiles. The satellite carried Itek's "E-5" camera developed for the Samos program, which had been cancelled. The camera had a focal length of 1.67 meters and could discern objects on the ground 1.8 m in size. The ground swath of the camera was 14 km by 74 km. The satellite weighed 1500 kg, and had a single re-entry vehicle in which exposed film was returned to earth for a mid-air aircraft recovery. The KH-6 was manufactured by Lockheed and launched from Vandenberg Air Force Base on Thor-AgenaD rockets.
        #LOC_KSPZH_4876 = The Gambit Program
        #LOC_KSPZH_1822 = Codenamed Gambit, the KH-7 (Air Force Program 206) was a reconnaissance satellite used by the United States from July 1963 to June 1967. Like the older Corona system, it acquired imagery intelligence by taking photographs and returning the undeveloped film to earth. It achieved a typical ground-resolution of 2 ft to 3 ft.In its summary report following the conclusion of the program, the National Reconnaissance Office concluded that the Gambit project was considered highly successful in that it produced the first high resolution satellite photography, 69.4% of the images having a resolution under 3 ft. (0.91 m); its record of successful launches, orbits, and recoveries far surpassed the records of earlier systems; and it advanced the state of the art to the point where follow-on larger systems could be developed and flown successfully. The report also stated that Gambit had provided the intelligence community with the first high resolution satellite photography of denied areas, the intelligence value of which was considered "extremely high". In particular, its overall success stood in sharp contrast to the two first-generation photoreconnaissance programs, Corona, which suffered far too many malfunctions to achieve any consistent success, and Samos, which was essentially a complete failure with all satellites either being lost in launch mishaps or returning no usable imagery.
        #LOC_KSPZH_4877 = The Gambit-3 Program
        #LOC_KSPZH_1823 = Codenamed Gambit-3, the KH-8 was a long-lived series of reconnaissance satellites of the "Key Hole" (KH) series used by the United States from July 1966 to April 1984, and also known as Low Altitude Surveillance Platform.[3] The satellite ejected "film-bucket" canisters of photographic film that were retrieved as they descended through the atmosphere by parachute. Ground resolution of the mature satellite system was better than 4 inches (0.10 m). There were 54 launch attempts of the 3,000 kilogram satellites, all from Vandenberg Air Force Base, on variants of the Titan III rocket.
        #LOC_KSPZH_4874 = The Ferret Program
        #LOC_KSPZH_4110 = SAMOS-F or Air Force Program 102 refers to a series of SIGINT reconnaissance satellites launched and operated by the United States Air Force and National Reconnaissance Office during the 1960s.
        #LOC_KSPZH_4955 = The SAMOS Program
        #LOC_KSPZH_4969 = The Samos E or SAMOS ("Satellite and Missile Observation System") program was a relatively short-lived series of reconnaissance satellites for the United States in the early 1960s, also used as a cover for the initial development of the KH-7 Gambit system. Reconnaissance was performed with film cameras and television surveillance from polar low Earth orbits with film canister returns and transmittals over the United States. Samos was first launched in 1960 from Vandenberg Air Force Base.
        #LOC_KSPZH_4914 = The MIDAS Program
        #LOC_KSPZH_4926 = The Missile Defense Alarm System, or MIDAS, was an American system of 12 early-warning satellites that provided limited notice of Soviet intercontinental ballistic missile launches between 1960 and 1966. Originally intended to serve as a complete early-warning system working in conjunction with the Ballistic Missile Early Warning System, cost and reliability concerns limited the project to a research and development role. Three of the system's 12 launches ended in failure, and the remaining nine satellites provided crude infrared early-warning coverage of the Soviet Union until the project was replaced by the Defense Support Program. MiDAS represented one element of the United States's first generation of reconnaissance satellites that also included the Corona and Samos series. Though MiDAS failed in its primary role as a system of infrared early-warning satellites, it pioneered the technologies needed in successor systems.
        #LOC_KSPZH_4899 = The Kosmos Program
        #LOC_KSPZH_3059 = Kosmos is a designation given to a large number of satellites operated by the Soviet Union and subsequently Russia. Kosmos 1, the first spacecraft to be given a Kosmos designation, was launched on 16 March 1962.
        #LOC_KSPZH_5000 = The Vostok Program
        #LOC_KSPZH_5001 = The Vostok program was a Soviet human spaceflight project to put the first Soviet citizens into low Earth orbit and return them safely. Competing with the United States Project Mercury, it succeeded in placing the first human into space, Yuri Gagarin, in a single orbit in Vostok 1 on April 12, 1961. The Vostok capsule was developed from the Zenit spy satellite project, and its launch rocket was adapted from the existing R-7 Semyorka intercontinental ballistic missile (ICBM) design. The name "Vostok" was treated as classified information until Gagarin's flight was first publicly disclosed to the world press. The program carried out six crewed spaceflights between 1961 and 1963. The longest flight lasted nearly five days, and the last four were launched in pairs, one day apart. This exceeded Project Mercury's demonstrated capabilities of a longest flight of just over 34 hours, and of single missions. Vostok was succeeded by two Voskhod program flights in 1964 and 1965, which used three- and two-man modifications of the Vostok capsule and a larger launch rocket.
        #LOC_KSPZH_4998 = The Voskhod Program
        #LOC_KSPZH_4999 = The Voskhod program was the second Soviet human spaceflight project. Two one-day manned missions were flown using the Voskhod spacecraft and rocket, one in 1964 and one in 1965, and two dogs flew on a 22-day mission in 1966. Voskhod development was both a follow-on to the Vostok program and a recycling of components left over from that program's cancellation following its first six flights. The Voskhod program was superseded by the Soyuz program. The Voskhod spacecraft was basically a Vostok spacecraft that had a backup, solid-fueled retrorocket added to the top of the descent module. As it was much heavier, the launch vehicle would be the 11A57, a Molniya 8K78M with the Blok L stage removed and later the basis of the Soyuz booster. The ejection seat was removed and two or three crew couches were added to the interior at a 90-degree angle to that of the Vostok crew position. However, the position of the in-flight controls was not changed, so the crew had to crane their heads 90 degrees to see the instruments.
        #LOC_KSPZH_4982 = The Soyuz Program
        #LOC_KSPZH_4983 = The Soyuz program (Russian: "Union") is a human spaceflight programme that was initiated by the Soviet Union in the early 1960s, originally part of a Moon landing project intended to put a Soviet cosmonaut on the Moon. It was the third Soviet human spaceflight programme after the Vostok and Voskhod programs.
        #LOC_KSPZH_4219 = Salyut Research Program
        #LOC_KSPZH_4968 = The Salyut programme (Russian: Salute or Fireworks) was the first space station programme undertaken by the Soviet Union, which consisted of a series of four crewed scientific research space stations and two crewed military reconnaissance space stations over a period of 15 years from 1971 to 1986. Two other Salyut launches failed. Salyut was, on the one hand, designed to carry out long-term research into the problems of living in space and a variety of astronomical, biological and Earth-resources experiments, and on the other hand this civilian program was used as a cover for the highly secretive military Almaz stations, which flew under the Salyut designation. Salyut 1, the first station in the program, became the world's first crewed space station.&br;&br;Salyut broke several spaceflight records, including several mission duration records, the first ever orbital handover of a space station from one crew to another, and various spacewalk records. The ensuing Soyuz program was vital for evolving space station technology from basic, engineering-development stage, single-docking port stations to complex, multi-ported, long-term orbital outposts with impressive scientific capabilities, whose technological legacy continues to the present day. Ultimately, experience gained from the Salyut stations went on to pave the way for multimodular space stations such as Mir and the International Space Station, with each of those stations possessing a Salyut-derived core module at its heart.
        #LOC_KSPZH_3906 = Project Vanguard
        #LOC_KSPZH_3907 = Project Vanguard was a program managed by the United States Naval Research Laboratory (NRL), which intended to launch the first artificial satellite into Earth orbit using a Vanguard rocket as the launch vehicle from Cape Canaveral Missile Annex, Florida. On March 17, 1958, Vanguard 1 became the second artificial satellite successfully placed in Earth orbit by the United States. It was the first solar-powered satellite. Just 152 mm (6.0 in) in diameter and weighing just 1.4 kg (3.1 lb), Vanguard 1 was described by then-Soviet Premier Nikita Khrushchev as, "The grapefruit satellite." Vanguard 1, and the upper stage of its launch rocket, are the oldest artificial satellites still in space, as Vanguard's predecessors, Sputnik 1, Sputnik 2, and Explorer 1, have decayed from orbit.
        #LOC_KSPZH_4989 = The TIROS Program
        #LOC_KSPZH_4761 = TIROS, or Television Infrared Observation Satellite, is a series of early weather satellites launched by the United States, beginning with TIROS-1 in 1960. TIROS was the first satellite that was capable of remote sensing of the Earth, enabling scientists to view the Earth from a new perspective: space. The program, promoted by Harry Wexler, proved the usefulness of satellite weather observation, at a time when military reconnaissance satellites were secretly in development or use. TIROS demonstrated at that time that "the key to genius is often simplicity.
        #LOC_KSPZH_3899 = Project Courier
        #LOC_KSPZH_3989 = Proposed by the US Army Signal Corps in September, 1958, The Courier Project was a follow up to Project SCORE launched December 18, 1958. SCORE "was the first step of an evolutionary program to develop communication satellite systems for use by the military services" Project Courier was a joint program of the US Department of Defense Advanced Research Projects Agency (ARPA) along with the US Army Signal Research & Development Laboratory at Fort Monmouth, New Jersey. Basically, Courier 1B would receive messages or photographs, store them, and then re-transmit them. Courier 1B was an experimental system to demonstrate the feasibility of using satellites for providing a solution to global communications problems. It was designed to store teletype messages and transmit them at high speed while the satellite is in view of a ground station. It was designed to be orbiting Earth at 690 miles. Courier had an effective message transmission rate of 55,000 bits per second and used ultra–high frequency (UHF) communications. This portion of the electromagnetic spectrum had remained relatively unused and generally free from man-made and atmospheric interference. The Courier satellite could simultaneously transmit and receive approximately 68,000 words per minute while moving through space at 16,000 miles per hour, and could send and receive facsimile photographs.
        #LOC_KSPZH_4939 = The Pioneer Program
        #LOC_KSPZH_4940 = The Pioneer program was a series of United States unmanned space missions that were designed for planetary exploration. There were a number of such missions in the program, but the most notable were Pioneer 10 and Pioneer 11, which explored the outer planets and left the Solar System. Pioneer 10 and Pioneer 11 carry a golden plaque, depicting a man and a woman and information about the origin and the creators of the probes, should any extraterrestrials find them someday.
        #LOC_KSPZH_4949 = The Ranger Program
        #LOC_KSPZH_4950 = The Ranger program was a series of unmanned space missions by the United States in the 1960s whose objective was to obtain the first close-up images of the surface of the Moon. The Ranger spacecraft were designed to take images of the lunar surface, transmitting those images to Earth until the spacecraft were destroyed upon impact. A series of mishaps, however, led to the failure of the first six flights. At one point, the program was called "shoot and hope". Congress launched an investigation into "problems of management" at NASA Headquarters and Jet Propulsion Laboratory. After two reorganizations of the agencies, Ranger 7 successfully returned images in July 1964, followed by two more successful missions.
        #LOC_KSPZH_4918 = The Mariner Program
        #LOC_KSPZH_4919 = The Mariner program was a 10-mission program conducted by the American space agency NASA in conjunction with Jet Propulsion Laboratory (JPL). The program launched a series of robotic interplanetary probes, from 1962 to 1973, designed to investigate Mars, Venus and Mercury. The program included a number of firsts, including the first planetary flyby, the first planetary orbiter, and the first gravity assist maneuver. Of the ten vehicles in the Mariner series, seven were successful, forming the starting point for many subsequent NASA/JPL space probe programs. The planned Mariner Jupiter-Saturn vehicles were adapted into the Voyager program, while the Viking program orbiters were enlarged versions of the Mariner 9 spacecraft. Later Mariner-based spacecraft include the Magellan probe and the Galileo probe, while the second-generation Mariner Mark II series evolved into the Cassini–Huygens probe. The total cost of the Mariner program was approximately $554 million.
        #LOC_KSPZH_4987 = The Surveyor Program
        #LOC_KSPZH_4988 = The Surveyor program was a NASA program that, from June 1966 through January 1968, sent seven robotic spacecraft to the surface of the Moon. Its primary goal was to demonstrate the feasibility of soft landings on the Moon. The Surveyor craft were the first American spacecraft to achieve soft landing on an extraterrestrial body. The missions called for the craft to travel directly to the Moon on an impact trajectory, a journey that lasted 63 to 65 hours, and ended with a deceleration of just over three minutes to a soft landing. The program was implemented by NASA's Jet Propulsion Laboratory (JPL) to prepare for the Apollo program. JPL selected Hughes Aircraft to develop the spacecraft system. The total cost of the Surveyor program was officially $469 million. Five of the Surveyor craft successfully soft-landed on the Moon, including the first one. The other two failed: Surveyor 2 crashed at high velocity after a failed mid-course correction, and Surveyor 4 was lost to contact (possibly exploding) 2.5 minutes before its scheduled touch-down. All seven spacecraft are still on the Moon; none of the missions included returning them to Earth. Some parts of Surveyor 3 were returned to Earth by the crew of Apollo 12, which landed near it in 1969. The camera from this craft is on display at the National Air and Space Museum in Washington, DC.
        #LOC_KSPZH_4911 = The Lunar Orbiter Program
        #LOC_KSPZH_4912 = The Lunar Orbiter program was a series of five unmanned lunar orbiter missions launched by the United States from 1966 through 1967. Intended to help select Apollo landing sites by mapping the Moon's surface, they provided the first photographs from lunar orbit and photographed both the Moon and Earth. All five missions were successful, and 99 percent of surface of the Moon was mapped from photographs taken with a resolution of 60 meters (200 ft) or better. The first three missions were dedicated to imaging 20 potential manned lunar landing sites, selected based on Earth-based observations. These were flown at low-inclination orbits. The fourth and fifth missions were devoted to broader scientific objectives and were flown in high-altitude polar orbits. Lunar Orbiter 4 photographed the entire nearside and nine percent of the far side, and Lunar Orbiter 5 completed the far side coverage and acquired medium (20 m (66 ft)) and high (2 m (6 ft 7 in)) resolution images of 36 preselected areas. All of the Lunar Orbiter spacecraft were launched by Atlas-Agena-D launch vehicles.
        #LOC_KSPZH_4888 = The IntelSat I Program
        #LOC_KSPZH_2863 = Intelsat I (nicknamed Early Bird for the proverb "The early bird catches the worm") was the first commercial communications satellite to be placed in geosynchronous orbit, on April 6, 1965. It was built by the Space and Communications Group of Hughes Aircraft Company (later Hughes Space and Communications Company, and now Boeing Satellite Systems) for COMSAT, which activated it on June 28. It was based on the satellite that Hughes had built for NASA to demonstrate that communications via synchronous-orbit satellite were feasible. Its booster was a Thrust Augmented Delta (Delta D). After a series of maneuvers, it reached its geosynchronous orbital position over the Atlantic Ocean at 28° west longitude, where it was put into service.
        #LOC_KSPZH_3900 = Project Echo
        #LOC_KSPZH_3901 = Project Echo was the first passive communications satellite experiment. Each of the two American spacecraft, launched in 1960 and 1964, was a metalized balloon satellite acting as a passive reflector of microwave signals. Communication signals were bounced off them from one point on Earth to another.
        #LOC_KSPZH_2778 = IDCSC Network I
        #LOC_KSPZH_4863 = The Defense Satellite Communications System (DSCS) provides the United States with military communications to support globally distributed military users. Beginning in 2007, DSCS is being replaced by the Wideband Global SATCOM system. A total of 14 DSCS-III satellites were launched between the early 1980s and 2003. Two satellites were launched aboard the Space Shuttle Atlantis in 1985 during the STS-51-J flight. As of 23 November 2015, seven DSCS-III satellites were still operational. DSCS operations are currently run by the 4th Space Operations Squadron out of Schriever Air Force Base. DSCS went through three major phases — IDCSP (Interim Defense Communication Satellite Program), DSCS-II, and DSCS-III. Since the first launch, DSCS has been the "workhorse" of military satellite communications. All DSCS III satellites have exceeded their 10-year design life. The National Science Foundation use the DSCS satellites to provide additional bandwidth to Amundsen–Scott South Pole Station and McMurdo Station on Ross Island on the continent of Antarctica.
        #LOC_KSPZH_3296 = Lincoln Experimental Satellite
        #LOC_KSPZH_4907 = The Lincoln Experimental Satellite series was designed and built by Lincoln Laboratory at MIT between 1965 and 1976, under USAF sponsorship, for testing devices and techniques for satellite communication. The series had satellites named LES1 through LES9. They suffered a number of launch problems.
        #LOC_KSPZH_4990 = The Transit System
        #LOC_KSPZH_4991 = The Transit system, also known as NAVSAT or NNSS (for Navy Navigation Satellite System), was the first satellite navigation system to be used operationally. The system was primarily used by the U.S. Navy to provide accurate location information to its Polaris ballistic missile submarines, and it was also used as a navigation system by the Navy's surface ships, as well as for hydrographic survey and geodetic surveying. Transit provided continuous navigation satellite service from 1964, initially for Polaris submarines and later for civilian use as well.
        #LOC_KSPZH_4960 = The SECOR Program
        #LOC_KSPZH_4117 = SECOR (Sequential Collation of Ranges) was a series of small United States Armed Forces satellites launched in the 1960s for geodesy measurements that precisely determined the locations of points on the Earth's surface, particularly of isolated islands in the Pacific. This data allowed for improved global mapping and precise positioning of ground stations for other satellites. Any SECOR satellite could be linked to four mobile ground stations: three were placed in accurately determined known locations, and a fourth one was placed in an unknown location. By measuring a satellite's distance from the three known stations, its position in space was determined. Then, the distance between the unknown ground station and the previously determined satellite's position was used to compute the unknown ground station's coordinates. This process was repeated many times, to enhance the accuracy of the measurement. Once the unknown station's position was accurately determined, it became a known station. Then one of the four stations was moved to a new unknown point, and the process began again. SECOR was a predecessor to navigational satellite systems such as Timation and Navstar-GPS (Global Positioning System).
        #LOC_KSPZH_4937 = The Orbiting Solar Observatory Program
        #LOC_KSPZH_4936 = The Orbiting Solar Observatory (abbreviated OSO) Program was the name of a series of American space telescopes primarily intended to study the Sun, though they also included important non-solar experiments. Eight were launched successfully into Low Earth orbit by NASA between 1962 and 1975 using Delta rockets. Their primary mission was to observe an 11-year sun spot cycle in UV and X-ray spectra. The initial seven (OSO 1–7) were built by Ball Aerospace, then known as Ball Brothers Research Corporation (BBRC), in Boulder Colorado. OSO 8 was built by Hughes Space and Communications Company, in Culver City, California. The basic design of the entire series featured a rotating section, the "Wheel," to provide gyroscopic stability. A second section, the "Sail," was driven electrically against the Wheel's rotation, and stabilized to point at the Sun. The Sail carried pointed solar instruments, and also the array of solar photovoltaic cells which powered the spacecraft. The critical bearing between the Wheel and the Sail was a major feature of the design, as it had to operate smoothly for months in the hard vacuum of space without normal lubrication. It also carried both the power from the Sail and the data from the pointed solar instruments to the Wheel, where most of the spacecraft functions were located. Additional science instruments could also be located in the Wheel, generally looking out on a rotating radius vector which scanned the sky, and also across the Sun, every few seconds.
        #LOC_KSPZH_1179 = Atlas Centaur Test Launches
        #LOC_KSPZH_4845 = The Atlas-Centaur was an American expendable launch system derived from the SM-65 Atlas D missile. Launches were conducted from Launch Complex 36 at the Cape Canaveral Air Force Station in Florida. Convair, the manufacturer of the Atlas, developed the Centaur upper stage specifically for that booster, sharing its inflated balloon skin. It was also the first production rocket stage to utilize liquid hydrogen (LH2) and liquid oxygen (LOX) as propellants. Despite high performance, LH2 nonetheless had problems because it had to be chilled at extremely low temperatures (lower than LOX) and its light molecular density meant that large fuel tanks were needed.
        // ---- Cormorant Aeronology ----
        #LOC_KSPZH_1869 = Cormorant Aeronology
        #LOC_KSPZH_718 = A strong believer that most things are better with wings, Cormorant engineers focus their efforts on safe and reusable spacecraft.
        #LOC_KSPZH_1587 = CA - Shuttle Right Wing Flag
        #LOC_KSPZH_2304 = Flag and Name. Check the texture sheet to add your own.
        #LOC_KSPZH_1586 = CA - Shuttle Name Plate
        #LOC_KSPZH_4734 = Switchable Names to lable your shuttles. Check the texture sheet to add your own.
        #LOC_KSPZH_1588 = CA - Shuttle Side Decal US
        #LOC_KSPZH_5574 = US themed switchable cargo bay side decal
        #LOC_KSPZH_1576 = CA - ST-25 "Toelle" Liquid Fuel Engine
        #LOC_KSPZH_4984 = The Space Transit engine program formed to further develop the KS-25 to reduce costs for use in other applications. The ST-25 is streamlined for use as Shuttle main engines where its reduced weight improves the handing of a shuttle during re-entry and flight.
        #LOC_KSPZH_1566 = CA - O-90 Orbital Engine
        #LOC_KSPZH_4932 = The O-90 engine was created using spare parts from some old Mun mission.
        #LOC_KSPZH_1567 = CA - O-90 Orbital Engine Offset
