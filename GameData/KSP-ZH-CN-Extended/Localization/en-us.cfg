        #LOC_KSPZH_1162 = Army Ballistic Missile Agency
        #LOC_KSPZH_4843 = The Army Ballistic Missile Agency (ABMA) was formed to develop the U.S. Army's first large ballistic missile. The agency was established at Redstone Arsenal on 1 February 1956, and commanded by Major General John B. Medaris with Wernher von Braun as technical director. Von Braun continued work on the design for what became the Jupiter-C IRBM. This was a three-stage rocket, which, by coincidence, could be used to launch a satellite in the Juno I configuration. In September 1956, the Jupiter-C was launched with a 30 pounds (14 kg) dummy satellite. It was generally believed that the ABMA could have put a satellite into orbit at that time, had the US government allowed ABMA to do so. A year later, the Soviets launched Sputnik 1. When the Vanguard rocket failed, a Redstone-based Jupiter-C launched America's first satellite, Explorer 1, on 31 January 1958.[1] Redstone was later used as a launch vehicle in Project Mercury. Redstone was also deployed by the U.S. Army as the PGM-11, the first missile to carry a nuclear warhead.
