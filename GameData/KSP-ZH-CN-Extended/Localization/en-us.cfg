        #LOC_KSPZH_1955 = Daleth SSR-68 "Bruno"
        #LOC_KSPZH_4218 = Said to have been developed for less than the cost of a new safety razor design, the SSR-68 is an incredibly powerful cryogenic booster engine originally meant for the Daleth IV launch vehicle. The rushed design process means it's not the most efficient design but it makes up for it in sheer thrust.
        #LOC_KSPZH_1953 = Daleth IV Unified Booster Core 20790 Lower Liquid Fuel Tank
        #LOC_KSPZH_3137 = Large 3.125m cryogenic fuel tank designed to be the lower half of the Daleth IV rocket's first stage. Includes a special structural extension at the bottom to attach to attach to the SSR-68 "Bruno" engine boattail as well as a more generic option.
        #LOC_KSPZH_1954 = Daleth IV Unified Booster Core 6210 Upper Liquid Fuel Tank
        #LOC_KSPZH_1958 = Daleth-CGR-40 "Ruby" Solid Rocket Booster
        #LOC_KSPZH_946 = An evolution of the Dioscuri booster design, the Ruby utilizes new production methods, making it one of the most advanced SRBs ever built. Despite this, it remains a cost effective way to add thrust to rockets. Switcheable between ground lit and air lit versions.
        #LOC_KSPZH_1959 = Daleth-CGR-40I "Garnet" Solid Rocket Booster
        #LOC_KSPZH_947 = An evolution of the Dioscuri booster design, the Ruby utilizes new production methods, making it one of the most advanced SRBs ever built. Despite this, it remains a cost effective way to add thrust to rockets. This version is meant for inline mounting and can vector the nozzle.
        #LOC_KSPZH_1960 = Daleth-CGR-46 "Emerald" Solid Rocket Booster
        #LOC_KSPZH_5139 = This CGR series rocket is slightly bigger than the Ruby, and includes a vectoring nozzle to help keep the rocket pointing straight. Typically used on Daleth III and Daleth II Heavy vehicles where 6 SRBs are ignited on the ground and 3 altitude optimized versions are ignited after they burn out. Switcheable between ground lit and air lit versions.
        #LOC_KSPZH_1961 = Daleth-CGR-60 "Sapphire" Solid Rocket Booster
        #LOC_KSPZH_815 = Advanced booster in the CGR line. It features an extended 0.9375m case as well as a vectoring nozzle, and an extended variant.
