        #LOC_KSPZH_3486 = Micro ISRU
        #LOC_KSPZH_4924 = The Micro ISRU was originally designed for emergency situations, but customers found it useful as an everyday porable omni converter. It can be reconfigured in the field to produce a variety of products from the local resources. It comes equipped with a built-in solar panel, but the conversion process usually requires a lot more power than it provides.
        #LOC_KSPZH_2162 = Electro Plasma
        #LOC_KSPZH_1864 = Core Heat
        #LOC_KSPZH_1841 = Compressed Atm
        #LOC_KSPZH_3130 = Lab Time
        #LOC_KSPZH_2217 = Exposure Time
        #LOC_KSPZH_4356 = Scope Time
        #LOC_KSPZH_4539 = Solar Reports
        #LOC_KSPZH_4431 = Simulator Time
        #LOC_KSPZH_3520 = Mk1 Station Arm
        #LOC_KSPZH_5441 = This station arm is great for moving payloads around. You can create a series of snapshots of the arm's position to form a sequence. Sequences let you program the arm to animate it to perform routine tasks such as pre-positioning it to various locations.
        #LOC_KSPZH_3056 = Konstruction Krane
        #LOC_KSPZH_5322 = This krane works well as a capsule retrieveal device or for picking up wayward kerbals.
        #LOC_KSPZH_2340 = Fusion Pellets
        #LOC_KSPZH_1220 = Au
        #LOC_KSPZH_4711 = Super Lightweight
        #LOC_KSPZH_2481 = Gold Digger Portable Mini-Drill
        #LOC_KSPZH_3052 = Kerbodyne / Wild Blue Industries
        #LOC_KSPZH_899 = Also known as the Dancing Devil, the Gold Digger digs into the crust of planets or into asteroids to obtain core samples. These samples are then analyzed to determine the accuracy of resource scans which will improve or hinder resource extraction rates for all drills in the biome. It can also serve as a mini resource drill in a pinch; when operated by a skilled scientist, you'll be able to improve its efficiency. Comes with a free case of dust wipes.
        #LOC_KSPZH_4198 = SRM
        #LOC_KSPZH_4720 = Surface Construction Study
        #LOC_KSPZH_1482 = Botanical Research Experiment
        #LOC_KSPZH_4533 = Solar Activity Monitoring Experiment
        #LOC_KSPZH_2485 = Gravioli Wave Experiment
        #LOC_KSPZH_3700 = Orbital Reconnaissance
        #LOC_KSPZH_3064 = LDEF Botany Module
        #LOC_KSPZH_5693 = While the Mark One Botany Lab generates Plants even when there are no experiments loaded, the lab isn't always available. That's where the LDEF Botany Module comes in. It can generate a small amount of Plants- required by plant growth experiments- but at the cost of ElectricCharge, Water, and Fertilizer
        #LOC_KSPZH_3065 = LDEF Command Processor
        #LOC_KSPZH_4552 = Sometimes you need an independent control source for your Long Duration Exposure Facility. The Command Processor has you covered.
        #LOC_KSPZH_3061 = L.D.E.F. Double Core
        #LOC_KSPZH_4909 = The Long Duration Exposure Facility (LDEF) Double Core provides a dedicated attachment point for LDEF External Experiment Carriers and/or support modules.
        #LOC_KSPZH_3066 = LDEF Equipment Container
        #LOC_KSPZH_5686 = When you need to stick some parts into a glovebox, this part is for you.
        #LOC_KSPZH_3060 = L.D.E.F. Core
        #LOC_KSPZH_4908 = The Long Duration Exposure Facility (LDEF) Core provides a dedicated attachment point for LDEF External Experiment Carriers and/or support modules.
        #LOC_KSPZH_3069 = LDEF Resource Container
        #LOC_KSPZH_5415 = This small container holds a number of resources for your experiment needs.
        #LOC_KSPZH_3070 = LDEF Science Processor
        #LOC_KSPZH_5692 = While the M.O.L.E. Experiment Lab generates LabTime even when there are no experiments loaded, the lab isn't always available. That's where the Science Processor comes in. It can generate a small amount of LabTime- required by many LDEF experiments- but at the cost of ElectricCharge and ResearchKits.
        #LOC_KSPZH_3071 = LDEF Solar Battery
        #LOC_KSPZH_5430 = This solar rechargable battery powers your experiments and other support modules.
        #LOC_KSPZH_3062 = L.D.E.F. Tripple Core
        #LOC_KSPZH_4910 = The Long Duration Exposure Facility (LDEF) Tripple Core provides a dedicated attachment point for LDEF External Experiment Carriers and/or support modules.
        #LOC_KSPZH_1315 = Be sure to check "More Info" to understand the experiment's requirements. Bontanical research is an important subject for long term space habitation. Learning to grow plants in microgravity will hopefully lead to growing edible crops in the future- once we perfect the technology.
        #LOC_KSPZH_1321 = Be sure to check "More Info" to understand the experiment's requirements. The DStaal Institute of Technology (DIT), in association with RepoSoftTech, needs some help testing out various cryogenic storage enabling fluids in a microgravity environment.
        #LOC_KSPZH_1316 = Be sure to check "More Info" to understand the experiment's requirements. How do crystals grow in space? Can they really be used for warp drives? And how do you get them to rotate in one direction, stop, and rotate in the opposite direction? This experiment will answer those questions and more.
        #LOC_KSPZH_3067 = LDEF Goo Study
        #LOC_KSPZH_1319 = Be sure to check "More Info" to understand the experiment's requirements. So... We found this weird stuff in a dumpster, and we want to know more about it. Maybe sending it to space will help. Sponsored by the DStaal Institute of Technology (DIT).
        #LOC_KSPZH_1314 = Be sure to check "More Info" to understand the experiment's requirements. Bill & Jeb's Excellent Ice Cream wants to study how to make ice cream in microgravity. Find out what it takes, and be ready to sample the results.
        #LOC_KSPZH_3038 = Kerbal Nutrition Utilization Transfer Study (KNUTS)
        #LOC_KSPZH_1323 = Be sure to check "More Info" to understand the experiment's requirements. The kerbal Nutrition Utilization Transfer Study (KNUTS) studies how the kerbal's body processes nutrients, both incoming and outgoing. Ok, it's a fancy way of saying that the experiment studies mulch.
        #LOC_KSPZH_3324 = Long-Term Cyrogenic Storage (Preliminary Study)
        #LOC_KSPZH_1325 = Be sure to check "More Info" to understand the experiment's requirements. We want to see what happens to something frozen and stored in space - and in a break from tradition, we're going to try it on something besides Kerbals first. Sponsored by the DStaal Institute of Technology (DIT).
        #LOC_KSPZH_1317 = Be sure to check "More Info" to understand the experiment's requirements. How do materials react to long-term exposure to space? This experiment will find out.
        #LOC_KSPZH_3068 = LDEF Modular Experiment Wedge
        #LOC_KSPZH_1324 = Be sure to check "More Info" to understand the experiment's requirements. This experiment will test various construction methods to see what works and what doesn't in a microgravity environment. The results of this experiment will determine how future craft will be built and maintained in orbit.
        #LOC_KSPZH_1326 = Be sure to check "More Info" to understand the experiment's requirements. What happens if you try to turn a screwdriver in space? The Power Tools Evaluation will evaluate different designs for power tools to find the ones that work best in a microgravity environment.
        #LOC_KSPZH_1322 = Be sure to check "More Info" to understand the experiment's requirements. The Solar Activity Monitoring Experiment (SAME) endeavors to watch the sun and study its activity. By studying its properties, we might some day predict when its solar storms occur, and perhaps find a way to harness its energy for space travel beyond mere solar panels.
        #LOC_KSPZH_5461 = This study will investigate the physiological and psychological effects of microgravity on the kerbal body. Be sure to check "More Info" to understand the experiment's requirements.
        #LOC_KSPZH_3072 = LDEF Temperature Study
        #LOC_KSPZH_1320 = Be sure to check "More Info" to understand the experiment's requirements. The DStaal Institute of Technology (DIT) came up with this study to learn how temperatures change in space. Does being in the sun help? We're not sure yet - go find out.
        #LOC_KSPZH_3073 = LDEF Thermal Study
        #LOC_KSPZH_1318 = Be sure to check "More Info" to understand the experiment's requirements. Living in space requires keeping things hot or cold - study how different materials transmit heat in space. Sponsored by the DStaal Institute of Technology (DIT).
        #LOC_KSPZH_2639 = Heat Shield (2.5m)
        #LOC_KSPZH_5439 = This specially designed heat shield has a crew hatch cut into the bottom to permit crew transfers. Tests indicate that closing the hatch before re-entry appears to provide the best chance for survival.
        #LOC_KSPZH_2638 = Heat Shield (1.875m)
        #LOC_KSPZH_1807 = Coach Logistics Module
        #LOC_KSPZH_5687 = When you want to haul a small amount of stuff, it's time to travel in Coach. This shipping container offers no-frills storage. Who needs things like "structural bracing," "legroom," and "cargo nets" when you can get a container so cheaply! The Coach cannot be flown on blackout days. Sales are non-refundable. Storage items cost extra. Void where prohibited. Warranty void if removed from the VAB or SPH. Not responsible for damaged or lost goods.
        #LOC_KSPZH_1806 = Coach 500 Logistics Module
        #LOC_KSPZH_2952 = KH-10 Control Module
        #LOC_KSPZH_334 = A handy but no frills probe core, the Control Module provides a control point for accurately pointing telescopes and spacecraft in the right direction.
        #LOC_KSPZH_3057 = Korona Lite
        #LOC_KSPZH_4898 = The Korona Lite is a small automated return capsule that holds experiment data and a small amount of resources. Light beer not included.
        #LOC_KSPZH_3521 = Mk1-85 Appaloosa
        #LOC_KSPZH_4928 = The Mk1-85, known as the Appaloosa and nicknamed the "Backseat" by pilots, is what happens when engineers spill coffee on blueprints and then try to interpret the smeared results. It was originally intended as an upgraded Mk1 Command Pod, but when submitted to KSC for review, the company received a resounding "NO" in response. Wild Blue Industries saved face by offering the Mk1-85 as a backseat extension for the Mk1 or as a standalone pod.
        #LOC_KSPZH_3382 = MOLE White
        #LOC_KSPZH_1074 = Appaloosa Block 2
        #LOC_KSPZH_5707 = Wild Blue's engineers "improved" crew space in the Block 2 variant by removing storage space and cramming two additional kerbals into the capsule for increased misery.
        #LOC_KSPZH_1075 = Appaloosa Orbital Module
        #LOC_KSPZH_4935 = The Orbital Module provides travelers with some extra room to stretch their legs while in outer space- or a convenient place to throw someout out the airlock.
        #LOC_KSPZH_1076 = Appaloosa Shielded Tank
        #LOC_KSPZH_5374 = This odd storage tank also has a heat shield just in case it endures atmospheric entry.
        #LOC_KSPZH_3372 = MK1 Flight Control Package V2
        #LOC_KSPZH_5259 = This handy extension to the Mk1 Command Pod provides small reaction wheels to improve torque as well as a built-in parachute.
        #LOC_KSPZH_5092 = Theme: Dark
        #LOC_KSPZH_5102 = Theme: White
        #LOC_KSPZH_5095 = Theme: Gray and White
        #LOC_KSPZH_5089 = Theme: Brumby
        #LOC_KSPZH_5099 = Theme: Mk2
        #LOC_KSPZH_3375 = MK2 Docking Port
        #LOC_KSPZH_4929 = The Mk2 Docking Port offers an alternative to the Clamp-O-Tron port that has a built-in docking light and the ability to snap its alignment to a specific rotation. Both ports must have the alignment snap turned on.
        #LOC_KSPZH_4478 = Size: Full
        #LOC_KSPZH_4479 = Size: Slim
        #LOC_KSPZH_4477 = Size: Buffalo
        #LOC_KSPZH_1944 = DR-18 Docking Ring
        #LOC_KSPZH_5227 = This docking ring has a hollow center to allow pass-through for other components.
        #LOC_KSPZH_3518 = Mk1 Decoupler
        #LOC_KSPZH_582 = A small decoupler for use with the Mk 1 Rendezvous & Recover Section.
        #LOC_KSPZH_1976 = Dark
        #LOC_KSPZH_3370 = MK1 Docking Port V2
        #LOC_KSPZH_4927 = The Mk1 Docking Port has an integrated drogue chute and is designed to facilitate the docking of two vessels in space. It is fully compatible with the Clamp-O-Tron Jr. port. Unlike Junior, an access hatch allows transfer between vessels. Contrary to popular belief, kerbals actually can fit through the hatch as long as they leave their helmets behind. In other news, helmet sales have dramatically increased.
        #LOC_KSPZH_3374 = MK1 Radial Docking Port V2
        #LOC_KSPZH_5600 = Unlike its stack-mounted counterpart, the Mk1 Radial Docking Port can be attached radially. It lacks a drogue chute, however. It is fully compatible with the Clamp-O-Tron Jr. port, and two Mk1 ports can be welded together. Unlike Junior, an access hatch allows transfer between vessels. Contrary to popular belief, kerbals actually can fit through the hatch as long as they leave their helmets behind.
        #LOC_KSPZH_5093 = Theme: Dark / Crew Hatch
        #LOC_KSPZH_5094 = Theme: Dark / No Crew Hatch
        #LOC_KSPZH_5103 = Theme: White / Crew Hatch
        #LOC_KSPZH_5104 = Theme: White / No Crew Hatch
        #LOC_KSPZH_5096 = Theme: Gray and White / Crew Hatch
        #LOC_KSPZH_5097 = Theme: Gray and White / No Crew Hatch
        #LOC_KSPZH_5090 = Theme: Brumby / Crew Hatch
        #LOC_KSPZH_5091 = Theme: Brumby / No Crew Hatch
        #LOC_KSPZH_5100 = Theme: Mk2 / Crew Hatch
        #LOC_KSPZH_5101 = Theme: Mk2 / No Crew Hatch
        #LOC_KSPZH_3519 = Mk1 Rendezvous & Recovery Section
        #LOC_KSPZH_3669 = Not to be confused with something that lets kerbals go on vacation, far from it! The "R&R Section" houses parachutes and monopropellant so that when kerbals come back from vacation, they don't slam into the ground. The bottom fits over a standard Mk16 Parachute, while the top has space to house the standard Mk12-R Radial-Mount Drogue Chute
        #LOC_KSPZH_4696 = Structural Adapter
        #LOC_KSPZH_3711 = Originally created as a boilerplate test article for the Mk1-85, Wild Blue's engineers realized that they could outfit the boilerplate into a structural adapter. It has a crew tunnel built into its center and it can even store some rocket fuel thanks to a hidden fuel tank. The marketing team still can't figure out the engineers' facination with crew tubes. They're hoping it's just a phase.
        #LOC_KSPZH_881 = Airlock Module
        #LOC_KSPZH_4834 = The Airlock Module is designed to allow kerbals to go outside and stretch their legs. It even has a set of spacesuits to counter those ackward moments when someone might try to throw someone else out of an airlock without a spacesuit.
        #LOC_KSPZH_3378 = MOLE Battery Module
        #LOC_KSPZH_5680 = When it became apparent that stations would run out of power on the night side of their orbits, Wild Blue Industries bought several off-sized surplus z500 batteries and wired them into a cylindrical chassis. The end result is a giant battery pack capable of holding a large charge. The Power Module team got jealous, and now both teams regularly face off in vigours badminton matches.
        #LOC_KSPZH_1387 = Bigby Decoupler
        #LOC_KSPZH_1395 = Bigby Tools created a large orbital laboratory... and forgot to build the components needed to launch it. The Bigby Decoupler is sized for the Bigby Orbital Workshop, though it's more expensive than similar parts.
        #LOC_KSPZH_1389 = Bigby Fairing
        #LOC_KSPZH_1394 = Bigby Tools
        #LOC_KSPZH_5677 = When Bigby Tools created their large orbital workshop, they didn't consider how to launch the workshop into orbit. With this limited capability fairing, they can now shield their workshop from aerodynamic forces.
        #LOC_KSPZH_1386 = Bigby Crew Module
        #LOC_KSPZH_1312 = Based upon the Appaloosa design, the Bigby Crew Module was designed in partnership with Bigby Tools to serve as a crew module. It can hold up to 4 kerbals in a slightly cramped space.
        #LOC_KSPZH_1392 = Bigby Orbital Workshop
        #LOC_KSPZH_4709 = Subcontracted to Bigby Tools, the Bigby Orbital Workshop offers a wide variety of different configurations to choose from, ranging from industrial production to scientific research and even asteroid processing. Is there nothing the Orbital Workshop can't do?
        #LOC_KSPZH_3522 = Mk1-88 Brumby
        #LOC_KSPZH_2958 = KSC rejected Wild Blue Industries' first attempt at upgrading the Mk1 command pod, but the company saved its reputation by turning their design into the successful Mk1-85 Appaloosa "Backseat." For their next attempt, the engineers redesigned the Backseat and created their 2-seater Mk1-88 "Brumby" command pod. This design proved easier to fly for docking maneuvers, mostly because kerbals don't like backseat drivers.
        #LOC_KSPZH_5648 = WB-2 "Corvette" Liquid Fuel Engine
        #LOC_KSPZH_5003 = The WB-2 is an upper stage motor that can be mounted to various tank diameters. Its thrust and ISP can be upgraded after researching new technologies. Engineers wanted to add bamboo as a second fuel option, but red pandas kept eating the test samples.
        #LOC_KSPZH_1943 = DR-18 Docking Port
        #LOC_KSPZH_5438 = This specialized docking port is well suited to docking 1.875m modules together. Even better, it has a built-in docking light and the ability to snap its alignment to a specific rotation. Both ports must have the alignment snap turned on.
        #LOC_KSPZH_5496 = Titan Aerodynamic Fairing (1.875m)
        #LOC_KSPZH_2246 = FLOOYD Dynamics Labs
        #LOC_KSPZH_5691 = While the Kerbals at Mission Control were still figuring out how to get their rockets back down to Kerbin safely, the research engineers at FLOOYD were quickly realising that protecting parts on ascent was just as important. Heavy research into two-dimensional-input driven procedural construction was then funded with the hopes of making protective shells for important payloads and interstage areas of the crafts. The protective shells also have the benefit of making the craft more aerodynamic, hopefully saving on precious rocket fuel! The AE-FF18 is an intermediate size available from FLOOYD.
        #LOC_KSPZH_3371 = MK1 Flight Control Package
        #LOC_KSPZH_3035 = Kargo Bay
        #LOC_KSPZH_5409 = This simple cargo bay is cheap but effective. Frills not included.
        #LOC_KSPZH_3058 = Korona Supply Capsule
        #LOC_KSPZH_576 = A small automated container made from a heavily modified Mk1 command pod, the Korona Supply Capsule (KSC) holds experiment data and a small amount of resources. Beer not included.
        #LOC_KSPZH_3495 = Mini Decouplatron
        #LOC_KSPZH_429 = A mini decoupler/separator for getting rid of small unwanted parts. You can switch between separation mode and decoupler mode before launch.
        #LOC_KSPZH_3517 = Mk1 Cupola
        #LOC_KSPZH_5220 = This cupola provides unprecedented views to the outside world and even has some command functionality. Or it's a great place to pack a bunch of stuff.
        #LOC_KSPZH_3369 = MK1 Docking Port
        #LOC_KSPZH_3373 = MK1 Radial Docking Port
        #LOC_KSPZH_1905 = Crew Hatch
        #LOC_KSPZH_3625 = No Crew Hatch
        #LOC_KSPZH_2868 = Interstage Service Compartment
        #LOC_KSPZH_4889 = The Interstage Service Compartment (ISC) bears a striking resemblance to a small WadeCo swimming pool, right down to the siding and bracing. That similarity is purely coincidental according to the Wild Blue Industries' atorneys. The service compartment is quite good at protecting equipment inside from outside temperatures- so long as you keep the open end out of the airstream. It even has a built-in decoupler and active cooling system. It can be further upgraded as technology improves.
        #LOC_KSPZH_2835 = In trying to reduce their inventory of defective fuel tanks, Wild Blue Industries built the Mark One Laboratory Extension (MOLE) out of a Titan-900 originally slated for scrap. With at least one crewmember aboard, this lab can conduct experiments using research kits to produce science. Or it can be configured to process experimental data for additional science, and clean experiments for reuse. It's mostly leakproof. Mostly.
        #LOC_KSPZH_3677 = OMS Kit
        #LOC_KSPZH_4934 = The OMS Kit is the direct result of what happens when documents are sent to the office printer and never picked up. It is desiged to fit inside the Interstage Service Compartment and provide both orbital maneuvering and trunk space to haul stuff into orbit. In an emergency, the OMS kit can fire its abort motors to escape an exploding vehicle. On top of all that, the OMS Kit provides crew access between capsules and space stations.
        #LOC_KSPZH_3380 = MOLE Power Module
        #LOC_KSPZH_5703 = Wild Blue Industries realized that they needed more power for their fledgling space station so they borrowed an MPU module from the Mk1-85 and coupled it to a bunch of monopropellant tanks. It didn't work at first so they read the directions. When that still didn't work, they followed them.
        #LOC_KSPZH_5497 = Titan Decouplatron
        #LOC_KSPZH_4551 = Sometimes tanks and station modules don't get along, and something's got to separate them. That's where the Titan Decouplatron comes in. You can switch between separation mode and decoupler mode before launch.
        #LOC_KSPZH_5494 = Titan 2.5m Decouplatron
        #LOC_KSPZH_4550 = Sometimes tanks and station modules don't get along, and something's got to separate them. That's where the Titan 2.5m Decouplatron comes in. You can switch between separation mode and decoupler mode before launch.
        #LOC_KSPZH_4115 = SD-18 Decoupler Adapter
        #LOC_KSPZH_2109 = Due to the wide variety of rocket designs out there, the SD-18 ships in kit form with common parts shared by a number of differently sized adapters. You can disable and enable the decoupler before flight. Some assembly required, though the directions are written in a foreign language.
        #LOC_KSPZH_4116 = SD-25 Decoupler Adapter
        #LOC_KSPZH_3295 = Like the SD-18, the SD-25 is a kit that requires assembly. You can disable and enable the decoupler before flight. Strangely, the instructions are in a completely different set of foreign languages that are different from the SD-18 despite being from the same manufacturer.
        #LOC_KSPZH_4024 = RPND-A Service Compartment
        #LOC_KSPZH_4952 = The Refurbished Payload Navigation Device -A variant (RPND-A) offers a small amount of room to store your stuff in. It even has a crew tube that you can add and remove.
        #LOC_KSPZH_4481 = Slanted Adapter Tank
        #LOC_KSPZH_5354 = This misshapen sturctural test article utterly failed as a prototype for the Mk1-85, but engineers thought it "looked cool" as a slanted fuel tank.
        #LOC_KSPZH_4534 = Solar Battery Module
        #LOC_KSPZH_5168 = This advanced module combines the electrical storage capacity of the Battery Module with a dual-axis solar array that tracks the sun in two dimensions. Imperial fighter pilot not included.
        #LOC_KSPZH_5527 = Titan-1800 Storage Tank
        #LOC_KSPZH_1309 = Based on their successful FLM series of multipurpose storage tanks, the new Titan line not only stores a wide variety of resources, it can also be used to store equipment and parts. The Titan 1800 is truly the titan in the Titan tank series. Did we say Titan enough? The Marketing Department wanted to make sure we had good product placement.
        #LOC_KSPZH_5528 = Titan-450 Storage Tank
        #LOC_KSPZH_1310 = Based on their successful FLM series of multipurpose storage tanks, the new Titan line not only stores a wide variety of resources, it can also be used to store equipment and parts. The Titan-450 is the smallest in the series, offering 40% more storage space when compared to the Buckboard MC-1000. Wild Blue's atorneys insist that any similarity to WadeCo swimming pools is purely coincidental and they will flatly deny any allegations that customers have found WadeCo labels on the inside of the tanks.
        #LOC_KSPZH_5529 = Titan-900 Storage Tank
        #LOC_KSPZH_1311 = Based on their successful FLM series of multipurpose storage tanks, the new Titan line not only stores a wide variety of resources, it can also be used to store equipment and parts. The Titan-900 is the mid-sized tank. It's guaranteed to leak less that previous models, and it's actually cost-effective.
        #LOC_KSPZH_5495 = Titan Adapter Tank
        #LOC_KSPZH_5706 = Wild Blue came up with their brand new Titan and Titan II fuel tank lines, but nobody thought to create a fuel tank that could bridge the two diameters- until now. Introducing the Titan Tank Adapter, designed to hold a small amount of rocket fuel while bridging the divide between the 1.875m Titan tanks and the 2.5m Titan II tanks. That's what the marketing brochure says, the engineers actually goofed and tried to weld two end caps of different sizes together.
        #LOC_KSPZH_5524 = Titan Instrument Unit
        #LOC_KSPZH_5705 = Wild Blue Industries wanted an outdoor swimming pool and their subcontractor built them a warehouse full of fuel tanks instead. The company repurposed them into a guidance package by using the guts of Stayputnik probe core and tacking on gyros from the Mk-85 command pod. The end result was a simple but effective probe core that could also be used to provide flight stabilization. And that's when they realized that they also needed fuel tanks sized for the insturment unit. The Titan Instrument Unit's capabilities improve as technology does, but it isn't very good a predicting when the AE-35 Unit will experience a failure.
        #LOC_KSPZH_5526 = Titan Nose Cone
        #LOC_KSPZH_370 = A large nose cone for covering up exposed areas of big rockets. It is based on the Mk7 nose cone, only smaller.
        #LOC_KSPZH_5565 = Twin Engine Coupler
        #LOC_KSPZH_5069 = The same bean counter at Wild Blue Industries who thought up the Interstage Adapter came up with this twin engine coupler. Just clip one to the aft end of a Titan tank and then bolt a couple of engines onto it. Due to budget cuts, it lacks the ability to stack components below it, but it has a small amount of fuel as compensation.
        #LOC_KSPZH_5651 = WB-700 Storage Tank
        #LOC_KSPZH_5004 = The WB-700 is another fuel tank that serves as a reminder to Wild Blue's management that engineers need to cut back on eating donuts.
        #LOC_KSPZH_4183 = SPF-4 Solar Array
        #LOC_KSPZH_5364 = This narrow solar array is perfectly sized for attachment to the Solar Observatory.
        #LOC_KSPZH_3545 = Monopropellant Power Unit
        #LOC_KSPZH_5418 = This small power cell generates electric charge by consuming monopropellant.
        #LOC_KSPZH_4185 = SPF-8 Photovoltaic Panels
        #LOC_KSPZH_2111 = During a visit to Probodobodyne, Wild Blue's engineers discovered that their OX-4 series of solar panels are quite fragile. Their "you break it you buy it" policy left Wild Blue with numerous broken solar panels that would've left the company in financial ruin had a clever engineer not come up with a plan to piece the panels back together. The end result was the SPF-8, a large solar panel that can track the sun but can only be deployed once. The design was so successful, Wild Blue's engineers now look forward to the annual company trip to Probodobodyne.
        #LOC_KSPZH_4184 = SPF-6 Solar Array
        #LOC_KSPZH_4965 = The SPF-6 is an early attempt at creating deployable solar array. The technology is pretty new, so the solar array cannot be retracted, and the engineers don't know how to point the array at the sun. And watch out for micrometeor shields, they tend to destroy the solar array. NOTE: BE SURE TO CHECK THE SOLAR PANEL'S ORIENTATION BEFORE LAUNCH! You can right-click the part and press "Mirror Panel" to mirror the solar panel.
        #LOC_KSPZH_4180 = SPF-1 Solar Array
        #LOC_KSPZH_5429 = This solar array provides solar power for your power needs.
        #LOC_KSPZH_4181 = SPF-2 Solar Array
        #LOC_KSPZH_4182 = SPF-3
        #LOC_KSPZH_5229 = This dual-axis solar array tracks the sun in two dimensions. Imperial fighter pilot not included.
        #LOC_KSPZH_3379 = MOLE Battery Module V2
        #LOC_KSPZH_5086 = Theme: Black
        #LOC_KSPZH_3381 = MOLE Power Module V2
        #LOC_KSPZH_4535 = Solar Battery Module V2
        #LOC_KSPZH_1415 = Bolt Abort Motor
        #LOC_KSPZH_4847 = The Bolt is a monopropellant engine that once turned on, it won't turn off. That makes it pretty useless... except as a launch abort motor.
        #LOC_KSPZH_3674 = O-2 "Oxygen" MonoPropellant Engine
        #LOC_KSPZH_5704 = Wild Blue Industries tried to make an RCS thruster for the space program but lost the competition when their prototype thruster's fuel valves kept getting stuck open and burned uncontrollably. Marketing execs saw the design flaw as an opportunity to produce an engine could serve as a launch abort motor in an emergency. The engineers are sure that the O-2's stuck valve problem is fixed, making it also useful as a small orbital engine that burns monopropellant. Well, they're mostly sure.
        #LOC_KSPZH_5649 = WB-20R "Colt" Liquid Fuel Engine
        #LOC_KSPZH_5393 = This radially attached motor works well at high altitudes and even comes with built-in reaction control thrusters.
        #LOC_KSPZH_3104 = LV-T270 "Fulcrum" Liquid Fuel Engine
        #LOC_KSPZH_2911 = Jebediah Kerman's Junkyard and Spacecraft Parts Co
        #LOC_KSPZH_4892 = The Junkyard combined an uprated LV-T30 with the thrust vecoring capabilities of the LV-T45 to produce the LV-T270 "Fulcrum" engine. It represents the pinnacle of LV-T engine technology and uses more "pieces found lying about" than any engine in the LV-T series.
        #LOC_KSPZH_4105 = S-300 Solid Fuel Segment
