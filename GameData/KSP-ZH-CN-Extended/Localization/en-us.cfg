        #LOC_KSPZH_1366 = Belle-RPP 1.25m "Rhoeas" Fairing Base SAF
        #LOC_KSPZH_5249 = This flared 1.25m fairing base was originally made for a secretive surveillance satellite. One of the larger options available for the Belle upper stage, it has plenty of other uses though.
