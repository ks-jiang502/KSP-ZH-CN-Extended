        #LOC_KSPZH_4753 = TBD
        #LOC_KSPZH_5624 = VL-9D "Octopus" Liquid Fuel Engine
        #LOC_KSPZH_474 = A powerful cluster of 9 DF-1C "Marlin" engines which are a smaller brother of the powerful RU-1C "Marlin" Vacuum engine.
        #LOC_KSPZH_1301 = Bagorah K1-125 Tank
        #LOC_KSPZH_5671 = We wanted a tank that was big, but not wide. So we made a very tall fuel tank suitable for heavy launchers.
        #LOC_KSPZH_4030 = RU-1C "Marlin" Vacuum Engine
        #LOC_KSPZH_5478 = This upper stage engine is mostly designed for use in the vacuum of space, so it is really useful for upper stages. Caution: Don't look directly in the engine bell when the engine is firing.
        #LOC_KSPZH_1302 = Bagorah K2-42 Tank
        #LOC_KSPZH_4465 = Since none of the other tanks fit well with the K1-180 tank, we took that tank, cut it in a smaller piece, repainted it, and called it a new tank.
        #LOC_KSPZH_3550 = Mothra Aerodynamic Fairing
        #LOC_KSPZH_5245 = This fairing half will protect your payload from the heavy forces put on them during launch. Yet don't quote us on that!
        #LOC_KSPZH_4759 = TE-6B Small Stack Decoupler
        #LOC_KSPZH_556 = A slim decoupler that is packed with explosives to separate what it is attached to. There are no guarantees that the explosives won't explode the entire rocket.
        #LOC_KSPZH_3551 = Mothra Aerodynamic Fairing Adapter
        #LOC_KSPZH_5381 = This petite payload adapter will only hold the cutest of satellites, which is fine for a rocket as small as Mothra.
        #LOC_KSPZH_4031 = RU-1Ci "Marlin 1Ci" Booster Engine
        #LOC_KSPZH_5367 = This newly designed first stage engine is small, cheap, and modern, perfect for small rockets.
        #LOC_KSPZH_3552 = Mothra B1-21 Fueltank
        #LOC_KSPZH_5338 = This lightweight and modern first stage fuel tank should be able to punch above its weight, just like the company that made it.
        #LOC_KSPZH_4816 = Tetra VAC Engine
        #LOC_KSPZH_5366 = This newly designed engine is the core of getting things done, Although we can't guarantee that this will make it to orbit.
        #LOC_KSPZH_3553 = Mothra B2-52 Fueltank
        #LOC_KSPZH_5339 = This lightweight and modern second stage fuel tank should be able to punch above its weight, just like the company that made it.
        #LOC_KSPZH_2469 = Ghidorah Launcher Platform
        #LOC_KSPZH_3525 = Modern rockets need modern launchpads.
        #LOC_KSPZH_2466 = Ghidorah 40 Launcher Platform
        #LOC_KSPZH_1300 = Bagorah 40 Launcher Platform
        #LOC_KSPZH_1805 = Classic rockets need classic erectors.
        #LOC_KSPZH_810 = Advanced Haddock Gas Thruster
        #LOC_KSPZH_817 = Advanced liquid fuel and oxidizer RCS block to push your rockets from dangerous things.
        #LOC_KSPZH_1403 = Black
        #LOC_KSPZH_1937 = DF-1K Marlin Liquid Fuel Engine
        #LOC_KSPZH_471 = A powerful DF-1K "Marlin" engines which are a smaller brother of the powerful RU-1K "Marlin" Vacuum engine. Some say this tiny engine is cabable of heavy lifting.
        #LOC_KSPZH_5560 = Truss
        #LOC_KSPZH_2341 = G-01 Fairing Half
        #LOC_KSPZH_2262 = Fairings are designed to keep your spacecraft safe during launch... Atleast they say they do...
        #LOC_KSPZH_4739 = T-25 Fairing Adapter
        #LOC_KSPZH_2261 = Fairings are designed to keep your spacecraft safe during launch.. Atleast they say they do..
        #LOC_KSPZH_5625 = VL-9R "Octopus" Liquid Fuel Engine
        #LOC_KSPZH_475 = A powerful cluster of 9 DF-1K "Marlin" engines which are a smaller brother of the powerful RU-1K "Marlin" Vacuum engine. This cluster of engines is equipped with three modes; one being all of the engines, the next being three engines, and the other being only the center engine for more precise burns.
        #LOC_KSPZH_5622 = VC-13B Booster Guidance Unit
        #LOC_KSPZH_5388 = This probe core is integrated with the interstage of the Ghidorah first stage, and comes with a decoupler built in to separate the second stage.
        #LOC_KSPZH_2467 = Ghidorah K1-180 Tank
        #LOC_KSPZH_4032 = RU-1K "Marlin" Vacuum Engine
        #LOC_KSPZH_2468 = Ghidorah K2-81 Tank
        #LOC_KSPZH_2343 = GH-01 Nose Cone Guidance Unit
        #LOC_KSPZH_5389 = This probe core is integrated with the nose cone of the Ghidorah Heavy's sideboosters.
        #LOC_KSPZH_2342 = G-02 Extended Fairing Half
        #LOC_KSPZH_4749 = T-625 Rideshare Adapter
        #LOC_KSPZH_237 = A 4 sided, 0.625m payload adapter for all your satellite needs. Make sure to stack it up so your satellite friends are not alone!
        #LOC_KSPZH_4750 = T-625 Top Rideshare Adapter
        #LOC_KSPZH_205 = A 0.625m payload adapter for all your satellite needs. Make sure to stack it up so your satellite friends are not alone!
        #LOC_KSPZH_5626 = VL-9S "Octopus" Structure
        #LOC_KSPZH_5460 = This structure is best used together with the powerful DF-1K Marlin Liquid Fuel Engine. Some say having more engines together looks better, others say it adds something meaningful. Either way, it looks very powerful.
        #LOC_KSPZH_144 = 3-way Barracuda Thruster
        #LOC_KSPZH_3544 = Monoprop RCS block to push your precious from dangerous things.
        #LOC_KSPZH_2344 = GH-02 Booster Decoupler
        #LOC_KSPZH_5563 = Tundra after numerous delays presents its new decoupler, this time for side stuff! Originally developed for a heavy lifter, now it's up to be used by numerous enterprises.
        #LOC_KSPZH_4740 = T-3125 Rideshare Adapter
        #LOC_KSPZH_239 = A 6 sided, 0.3125m payload adapter for all your satellite needs. Make sure to stack it up so your satellite friends are not alone!
        #LOC_KSPZH_3771 = PICA-289 Heatshield
        #LOC_KSPZH_5564 = Tundra exploration
        #LOC_KSPZH_229 = A 2.5m heatshield made for a specific use case. It's lightweight and holds little Ablator in order to meet the Gigan pod's mass limits.
        #LOC_KSPZH_2470 = Gigan Command Pod
        #LOC_KSPZH_4549 = Some scientists said that we need a command pod to carry extra snacks and cool science stuff but not carry kerbals, so we made this. A 2.5m pod with integrated RCS ports, be sure to pack parachutes to save the snacks on landing!
        #LOC_KSPZH_5653 = WK-41 1x4 Solar Array
        #LOC_KSPZH_374 = A large solar array capable of generating as much power for you craft as you want, that is if you are in sunlight.
        #LOC_KSPZH_4197 = SRC-9 Unpressurized Cargo Trunk
        #LOC_KSPZH_401 = A little roomy cargo container where you can store unpressurized payloads like snacks and cool science stuff.
        #LOC_KSPZH_5623 = VC-13C SpaceCraft Separator
        #LOC_KSPZH_5402 = This separator is used to decouple spacecrafts into orbit. Be aware that these store tiny bits of explosions!
        #LOC_KSPZH_4216 = SX-21 Aerodynamic Shroud
        #LOC_KSPZH_930 = An aerodynamic shroud to fit on top of the Gigan pod since some scientists told us some stuff about the atmosphere and said this was necessary.
        #LOC_KSPZH_5572 = UD-7 Aerodynamic Cover
        #LOC_KSPZH_929 = An aerodynamic cover designed to go onto the WK-4 solar array. Be sure to not be in front of it when decoupling!
        #LOC_KSPZH_2471 = Gigan XL Avionics Module
        #LOC_KSPZH_942 = An especially versatile payload craft needs a very capable head. This command module cuts loose with storage for power and RCS fuel. It even has some space for inventory but some of the heads at Tundra really wonder why it has that space when the tank exists.
        #LOC_KSPZH_809 = Advanced 3-way Barracuda Thruster
        #LOC_KSPZH_812 = Advanced Monoprop RCS block to push your precious from dangerous things.
        #LOC_KSPZH_2472 = Gigan XL Storage Container
        #LOC_KSPZH_5308 = This is just a 2.5m fuel tank, right? No. This tank is meant to hold equipment, resources and even science results, including repeats!
        #LOC_KSPZH_2473 = Gigan XL Utility Head
        #LOC_KSPZH_2880 = Is it the head or the tail? We're not sure. But it looks like it could hold a few processors of things and that's always good.
        #LOC_KSPZH_4095 = Rodan Cargo Pod
        #LOC_KSPZH_2771 = How can we copy something but change it enough so that nobody notice it? Lets just remove the windows and call it a day! So we made this. A 2.5m pod with integrated RCS ports, be sure to pack parachutes to save the snacks on landing!
        #LOC_KSPZH_4096 = Rodan Command Pod
        #LOC_KSPZH_1396 = Bigger than it's little brother, the Mk 1-2, this powerful command pod has 8 Super Kerbo engines built in it with very powerful thrust and 4 RCS thrusters on it. It also comes equipped with an Aeroshroud to cover your docking ports on ascent.
        #LOC_KSPZH_4097 = Rodan Drogue Parachutes
        #LOC_KSPZH_5207 = This chute is designed to slow you down at upper altitudes. Do not use it for landing! This chute will not slow you down enough and you will slam to the ground!
        #LOC_KSPZH_4099 = Rodan Tourism Command Pod
        #LOC_KSPZH_1397 = Bigger than it's little brother, the Mk 1-2, this powerful command pod has 8 Super Kerbo engines built in it with very powerful thrust and 4 RCS thrusters on it. It also comes equipped with an glass dome to look outside!
        #LOC_KSPZH_4098 = Rodan Main Parachutes
        #LOC_KSPZH_5347 = This main parachute is used for gentle landings. Each parachute is carefully designed and colored for your landing needs. Try not to tangle them!
        #LOC_KSPZH_3772 = PICA-K Advanced Heatshield
        #LOC_KSPZH_336 = A heatshield which is very slightly larger than 2.5m, has a more durable hull without Ablator, and has integrated landing gear. It loses some inner heat tolerance due to exposing inner moving parts when the legs deploy.
        #LOC_KSPZH_4037 = RVS-42 Unpressurized Cargo Trunk
        #LOC_KSPZH_4812 = Telescopic Camera Data
        #LOC_KSPZH_4575 = Space Dust Collecter Data
        // ---- WildBlueIndustries ----
        #LOC_KSPZH_4681 = Station Light
        #LOC_KSPZH_3431 = Mark One Botany Lab
        #LOC_KSPZH_4848 = The Botany Lab is a fuel tank converted into an orbiting experimental garden to study plant growth in space. The designers originally wanted to call it the Botany Bay, but crews expressed concerns about the bay secretly holding cryopods full of genetically engineered, highly intelligent, BadS super kerbals capable of simultaneously being pilots, engineers, and scientists that would take over the space station. After numerous failed attempts to show that no secret cryopods existed, engineers relented and renamed the converted tank to the Botany Lab.
        #LOC_KSPZH_3353 = M.O.L.E.
        #LOC_KSPZH_3432 = Mark One Habitat
        #LOC_KSPZH_1882 = Created by Dolores "I am NOT sleeping in a cramped cockpit!" Kerman, the Dolores Mark One Habitat, created as part of Project Dolores, provides relatively spacious accommodations for up to two kerbals.
        #LOC_KSPZH_5702 = Wild Blue Industries is an advanced technology research and development firm that takes crazy ideas, develops them, and markets the successful results- and sometimes the unsuccessful results too! Their products range from engine technologies to spacecraft to colonization systems that push the envelope. At Wild Blue Industries, their motto is: If you want to boldly go, we'll get you there. (TM)
        #LOC_KSPZH_3358 = MC-1000 Buckboard
        #LOC_KSPZH_5701 = Wild Blue Industries
        #LOC_KSPZH_2186 = Essentially a redesigned SC-62 Standard Container, The Buckboard can hold a wide variety of different resources. It's essential equipment for the kerbal on the go.
        #LOC_KSPZH_3359 = MC-2000 Buckboard
        #LOC_KSPZH_2320 = For those kerbals that have more stuff than fits in a standard storage box, this double-length Buckboard gives you more room. Of course, empty space needs filling, so it's an endless cycle of getting more room and then filling it..
        #LOC_KSPZH_3360 = MC-3000 Buckboard
        #LOC_KSPZH_2050 = Designers took a look at the MC-2000 with envy and created this larger MC-3000, a triple-length version of the SC-62-derived MC-1000. Now you have even more storage to fill up!
        #LOC_KSPZH_3361 = MC-6000 Buckboard
        #LOC_KSPZH_2183 = Especially designed to lose your luggage, the Bucboard 6000 provides a significant amount of storage.
