        #LOC_KSPZH_511 = A series of 3.125m to 2.5m adapters made from surplus DHSS interstages. We're sure you can find many uses for these.
        #LOC_KSPZH_1967 = Daleth-III-DHSS Cryogenic Upper Stage
        #LOC_KSPZH_1947 = Daleth Hydrogen Second Stage. A large cryogenic upper stage with avionics and attitude control thrusters, only missing an engine. Available in two sizes the original version for Daleth III and the stretched version for Daleth IV Medium.
        #LOC_KSPZH_4785 = TSS-2B Dual Payload Adapter Base
