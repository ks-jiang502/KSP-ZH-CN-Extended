        #LOC_KSPZH_4332 = Saturn Upgrade
        #LOC_KSPZH_4239 = Sarnus-LE1F-2214 "Regor" Liquid Engine
        #LOC_KSPZH_5055 = The most powerful single-chamber engine ever constructed, the LE1F 'Regor' is a powerful engine for the most powerful of rockets. As if it weren't powerful enough upgrades are also available.
        #LOC_KSPZH_4233 = Sarnus-HE2J-515 "Dnoces" Cryogenic Engine
        #LOC_KSPZH_856 = After Inon-derived upper stages proved too weak for large launchers, a new high-powered, high efficiency vacuum engine was created. While it sacrifices a bit of efficiency, the thrust to weight ratio is better for lifting upper stages.
        #LOC_KSPZH_4236 = Sarnus-HE2JT "Tohces" Cryogenic Aerospike
        #LOC_KSPZH_300 = A development of the Dnoces engine, the Tohces reuses a number of components such as turbopumps, while exchanging the bell-shaped thrust chamber for an annular aerospike. The result is a slightly lighter engine, with higher ISP. Unlike some aerospikes, it is able to perform limited gimbaling using differential thrust.
        #LOC_KSPZH_3408 = MV-4 "Zufar" Film Camera
        #LOC_KSPZH_5690 = While taking measurements with instruments is all well and good, it is also important to get an idea of what space actually looks like. To that end, we've provided this film camera in a space-friendly casing. The film has to be returned to us in order for it to be developed, so make sure the unit is recovered if you want results.
        #LOC_KSPZH_1813 = Codac LO-2180 "Eastkan" Film Camera
        #LOC_KSPZH_2292 = Film cameras are limited in that the film must be returned to Kerbin in order to be developed. In order to get a better idea of what lies further out in space, we have developed this advanced film camera in conjunction with our partner Codac. After exposing the film, it is developed automatically and then transmitted in strips using a primitive photoscanner. A significant amount of detail is lost in this process, so the images aren't as valuable as actually returning the film. The film is stored after development, and can be still be examined if it happens to be returned.
        #LOC_KSPZH_5652 = WDU-W3T Surface Hydrometer
        #LOC_KSPZH_5292 = This instrument measures a planet's atmosphere for moisture, one of the most important substances known to Kerbalkind, and a building block of life as we know it. Also useful for washing the ship before takeoff.
        #LOC_KSPZH_767 = AIL-CH Infra-red Spectrometer
        #LOC_KSPZH_3485 = Micro Goo™ Radiometer
        #LOC_KSPZH_2769 = Houses a Micro Goo™ sample and exposes it to different types of radiation. Also extremely fragile! Own a brand name goo sample today!
        #LOC_KSPZH_1259 = BDB Upgrade Logo
        #LOC_KSPZH_3385 = MONK-E-WHBF Whip Antenna
        #LOC_KSPZH_528 = A simple extending whip antenna, designed to be mounted on the MONK-E Goo Laboratory.
        #LOC_KSPZH_3383 = MONK-E-MGL Orbital Goo Laboratory
        #LOC_KSPZH_5675 = What is the mystery goo? How did it get here? What does it want? Those questions, and many more, will be answered here: The MONK-E Orbital Goo Laboratory. Capable of supporting, and studying, two goo "samples" for long durations in orbit - both crew tended, or as a station module - and then safely packaging them for return home. They'll love it, we're sure.
        #LOC_KSPZH_3384 = MONK-E-PPS Photovoltaic Power Supply
        #LOC_KSPZH_1788 = Cheap, primitive solar panel with a simple deployment mechanism. Folds up for storage in fairings, but doesn't track the sun.
        #LOC_KSPZH_2717 = Hokulani OLM-NC25 Aerodynamic Nose Fairing
        #LOC_KSPZH_231 = A 2.5m hollow nose cone with built in decoupler.
        #LOC_KSPZH_2716 = Hokulani OLM-HGD15 High Gain Antenna
        #LOC_KSPZH_2683 = High speed communications system for space stations.
        #LOC_KSPZH_3352 = M-PBG15 Plutonium Brayton-cycle Generator
        #LOC_KSPZH_4419 = Similar to an RTG, the Plutonium Brayton-cycle generator does not use a reactor, just a lump of very radioactive and hot Plutonium-238. However, heat is converted to electricity using the far more efficient (albeit more complex) Brayton cycle.
        #LOC_KSPZH_2723 = Hokulani PR-11 Equipment Rack
        #LOC_KSPZH_335 = A handy equipment rack for 4.25m space stations.
        #LOC_KSPZH_3386 = MORL-RJE12 Resistojet Electric RCS Unit
        #LOC_KSPZH_4080 = Resistojets heat up the propellant using an electric current passed through a resistive heating element. Engineers deny it was inspired by the tea kettle in the lab. This Resistojet based RCS block therefore requires EC to function but in return achieves very high Isp. Available with MonoPropellant and Liquid Hydrogen variants.
        #LOC_KSPZH_2749 = Hokulani-OLM-SP12 Solar Panel Wing
        #LOC_KSPZH_3168 = Large tracking solar panel designed for a 4.25m profile.
        #LOC_KSPZH_2748 = Hokulani-OLM Laboratory
        #LOC_KSPZH_2727 = Hokulani-ACT RCS Unit
        #LOC_KSPZH_4055 = Reaction control thruster block for the Hokulani orbital workshop, place them on the front and back of the OWS radiator mount, on the white corrugated section at the bottom.
        #LOC_KSPZH_2728 = Hokulani-ALM Airlock Module
        #LOC_KSPZH_5363 = This multipurpose part serves as a 4.25m-1.875m adapter module, fairing base, life support and service compartment, crew tube, and an airlock all in one! Just be sure your Kerbals watch their heads on their way out. The hatch might have a familiar look to it...
        #LOC_KSPZH_3029 = Kane-OCO-CA Command Antenna
        #LOC_KSPZH_4496 = Small command antenna designed to be attached to the bottom of the Kane OCO core.
        #LOC_KSPZH_3026 = Kane-OCO Telescope Mount
        #LOC_KSPZH_4895 = The Kane telescope mount forms the core of the Hokulani space station's solar science observatory. Place the experiment unit on top. Although designed to be deployed via a robotic truss, it includes hardware for autonomous control, so it can be properly docked to a station remotely or used as a probe core.
        #LOC_KSPZH_3027 = Kane-OCO Telescope Mount Experiment BLock
        #LOC_KSPZH_5462 = This suite of advanced instruments is used to observe the activity of Kerbol at a level of detail unattainable by ground based telescopes.
        #LOC_KSPZH_3028 = Kane-OCO-ASP Solar Panel
        #LOC_KSPZH_2220 = Extending solar panels for the Kane-OCO Telescope Mount. Attach to the railing on the bottom of the telescope experiment unit 45 degrees off primary axes.
        #LOC_KSPZH_2730 = Hokulani-DCA Discone Antenna
        #LOC_KSPZH_619 = A small omni antenna on a very long rod, in case you need to take your space station pole vaulting.
        #LOC_KSPZH_2747 = Hokulani-MDX Multiple Docking Node Extension
        #LOC_KSPZH_281 = A crew passable adapter that can expand the number and type of docking ports your space station can use. Can also be detached in an emergency as a free flying lifeboat. If you're very desperate!
        #LOC_KSPZH_2705 = Hokulani HDT-1 Visual Docking Target
        #LOC_KSPZH_587 = A small device used as a visual alignment guide for docking. This is a standalone model made from spares for use with docking ports of your choice.
        #LOC_KSPZH_2757 = Hokulani-RMPS Aft Docking Adapter
        #LOC_KSPZH_5481 = This useful module adds multiple docking nodes, extra consumables and an airlock to the rear of the Hokulani station. The airlock can be swapped out for a larger docking node.
        #LOC_KSPZH_2738 = Hokulani-EOSS-DS1 Communication Dish
        #LOC_KSPZH_577 = A small backup comm dish for space stations.
        #LOC_KSPZH_2740 = Hokulani-EOSS-IM Interstage Station Module
        #LOC_KSPZH_2742 = Hokulani-EOSS-MS5 Mass Spectrometer
        #LOC_KSPZH_931 = An aerodynamically shielded doployable mass spectrometer isntrument.
        #LOC_KSPZH_2743 = Hokulani-EOSS-MSSB Multispectral Sensor
        #LOC_KSPZH_958 = An extending boom with a multispectral sensor.
        #LOC_KSPZH_2735 = Hokulani-EOSS Microwave Spectrometer
        #LOC_KSPZH_961 = An extending with a microwave spectrometer on the end.
        #LOC_KSPZH_2739 = Hokulani-EOSS-HG15 High Gain Antenna
        #LOC_KSPZH_2682 = High speed communications system for large spacecraft.
        #LOC_KSPZH_2741 = Hokulani-EOSS-MMR Radar Antenna
        #LOC_KSPZH_293 = A deployable high resolution mapping radar system for large space stations and spacecraft.
        #LOC_KSPZH_2762 = Hokulani-eROSA Experimental Rollout Solar Array
        #LOC_KSPZH_953 = An experimental rollout solar array. Lighter, smaller and more powerful than regular panels!
        #LOC_KSPZH_2763 = Hokulani-eROSA Experimental Rollout Solar Array (Tracking)
        #LOC_KSPZH_954 = An experimental rollout solar array. Lighter, smaller and more powerful than regular panels! This version is capable of sun tracking
        #LOC_KSPZH_2744 = Hokulani-EOSS-SCT14 Radar Scatterometer
        #LOC_KSPZH_5392 = This radar scatterometer instrument can measure weather patterns on planets below.
        #LOC_KSPZH_2736 = Hokulani-EOSS Solar Wing
        #LOC_KSPZH_2315 = Folding solar arrays designed to fit inside of the Hokulani EOSS interstage station module. Deploy one after the other to avoid clipping.
        #LOC_KSPZH_2737 = Hokulani-EOSS Solar Wing 90 Deg
        #LOC_KSPZH_5631 = Variant of the Hokulani EOSS interstage Solar Wings designed to fold out at a 90 degree angle for more versatility.
        #LOC_KSPZH_2695 = Hokluani-EOSS "Planetwave" Multi Telescope System
        #LOC_KSPZH_3875 = Powerful multi telescope system with direct crew access to instruments at the back. Features geperal purpose, x-ray and solar instruments.
        #LOC_KSPZH_2702 = Hokulani EVA Lightbulb
        #LOC_KSPZH_1783 = Cheap compact light designed to be placed externally on space stations to assist in spacewalking activities.
        #LOC_KSPZH_2706 = Hokulani HS-191 Infra-red Spectrometer
        #LOC_KSPZH_2709 = Hokulani HS-194 L-Band Radiometer
        #LOC_KSPZH_4900 = The L-band microwave radiometer is a remote sensing instrument that can be used to monitor soil moisture.
        #LOC_KSPZH_2746 = Hokulani-MDA Multiple Docking Adapter
        #LOC_KSPZH_282 = A crew passable structural adapter with points for 2 docking ports. More can be added via radial docking adapters if desired.
        #LOC_KSPZH_2707 = Hokulani HS-192 Multispectral Scanner
        #LOC_KSPZH_5166 = This advanced instrument is capable of remote sensing resources in 13 different bands! Real bang for your buck.
        #LOC_KSPZH_2760 = Hokulani-UB22 "Brolly" Sun Shield
        #LOC_KSPZH_295 = A deployable sunshield for emergency cooling! Attach to the Hokulani zenith scientific airlock (on EVA if necessary) and shield your precious station from the baleful glare of Kerbol.
        #LOC_KSPZH_2729 = Hokulani-AMP Pressurized Mating Adapter
        #LOC_KSPZH_477 = A pressurized structural extension that gives more clearance for docking spacecraft.
        #LOC_KSPZH_2753 = Hokulani-PXXL Power Tower Solar Panel
        #LOC_KSPZH_2178 = Enormous high tech solar panels to support your space station exppansion needs.
        #LOC_KSPZH_2754 = Hokulani-PXXL2 Power Tower Solar Panel Double
        #LOC_KSPZH_2179 = Enormous high tech solar panels to support your space station exppansion needs. Now with twice the power output!
        #LOC_KSPZH_2719 = Hokulani PMBP-A Power Module Berthing Port (Active)
        #LOC_KSPZH_2720 = Hokulani PMBP-P Power Module Berthing Port (Passive)
        #LOC_KSPZH_539 = A simplistic berthing port intended only to allow power and data transfer.
        #LOC_KSPZH_3032 = Kane-PMTC Power Module Core
        #LOC_KSPZH_2826 = If you wanted to build some kind of "tower of power", this component can act as the foundation. Features a probe core, reaction wheels and large batteries for power regulation. An interface for a solar support structure is provided above to attach large deployable solar panels. Radial attach points are also available if you prefer to berth this to a station using a robotic arm. This core was built using left overs from a famous space telescope.
        #LOC_KSPZH_2722 = Hokulani PMBP-RDT Radiator (Tracking)
        #LOC_KSPZH_485 = A radially attachable deployable radiator. This version tracks to point edgewise to the sun for better cooling. Available in single and double sizes.
        #LOC_KSPZH_2721 = Hokulani PMBP-RDT Radiator (Fixed)
        #LOC_KSPZH_484 = A radially attachable deployable radiator. This version does not feature solar tracking to allow for more restrictive placement but is less efficient as a result. Available in single and double sizes.
        #LOC_KSPZH_2715 = Hokulani MSPT Solar Support Structure
        #LOC_KSPZH_719 = A structural adapter with useful attach nodes for solar panels and radiators.
        #LOC_KSPZH_2708 = Hokulani HS-193 Radar Altimeter
        #LOC_KSPZH_5391 = This radar altimeter dish can be used to map the surface height of the body below. It can also collect radar spectrometry data to determine surface-level wind speeds.
        #LOC_KSPZH_2758 = Hokulani-RMPS Radiator Unit
        #LOC_KSPZH_4050 = Radiator that replaces the engine mount on the Hokulani dry workshop. Includes monopropellant storage for the station's RCS thrusters.
        #LOC_KSPZH_2756 = Hokulani-RAP Radial Attachment Point
        #LOC_KSPZH_949 = An expansion node for the Hokulani Multiple Docking Adapter. Can be used to add more docking points or other structural connections to a station.
        #LOC_KSPZH_2726 = Hokulani Solar Radio Noise Burst Antenna
        #LOC_KSPZH_5353 = This might look like a small comms dish but its actually designed to listen to stellar radio burst noise.
        #LOC_KSPZH_2751 = Hokulani-PPA Solar Panel Wing
        #LOC_KSPZH_3175 = Large, poorly shielded solar panels for providing power to your orbital workshops. Place radially, 30 degrees off center. The panels will automatically mirror to face the correct direction. Be careful not to lose them on the way up!
        #LOC_KSPZH_2714 = Hokulani MSA 1.875m Structural Adapter
        #LOC_KSPZH_536 = A simple structural adapter built from left over Hokulani parts to transition from 1.875m to smaller diameters.
        #LOC_KSPZH_2698 = Hokulani EFB-HA12 High Gain Antenna
        #LOC_KSPZH_2684 = High speed communications system for transmitting data across interplanetary distances.
        #LOC_KSPZH_2699 = Hokulani EFB-MXB Multi-experiment Science Boom
        #LOC_KSPZH_959 = An extending boom with both a magnetometer and mass spectrometer for your crewed interplanetary science needs.
        #LOC_KSPZH_2700 = Hokulani EFB-R4 Atmoshperic Entry Probe
        #LOC_KSPZH_535 = A simple self contained probe with all the requirements for planetary atmospheric science. Includes a heatshield, antennas, rcs, and a small course correction solid motor. If you're lucky it might even survive impact with the surface! Features hydrometer and atmosphere analysis experiments.
        #LOC_KSPZH_2732 = Hokulani-EFB-ESM Planetary Flyby Mission Module
        #LOC_KSPZH_437 = A modified Sarnus LAM yielded this mission module, packed with useful equipment for a basic, simple interplanetary flyby. Attachment works the same as the other LAMs - attach the hidden node on the Kane Engine Plate to the top, and then attach four SLAMs to the nodes on the sides. A docking port and a Hokulani EFB-HA12 High Gain Antenna should go on top. An unpressurized cargo bay is built into the bottom of the module to carry the AAT 25 "Stellartron" telescope EFB-R4XH Multi Probe Dispenser (or indeed anything else you wish to store there instead).
        #LOC_KSPZH_2734 = Hokulani-EFB-WS Interplanetary Wet Workshop
        #LOC_KSPZH_2701 = Hokulani EFB-R4XH Multi Probe Dispenser
        #LOC_KSPZH_277 = A cosy little box to hold up to four atmospheric entry probes. Use a set of any 0.3125m decouplers inside to attach the probes.
        #LOC_KSPZH_2733 = Hokulani-EFB-R12 Solar Panel
        #LOC_KSPZH_5111 = These hardy solar panels were designed for interplanetary flybys and provide both power and micrometeorite protection! The panels are deployable and though they do not track, they can be individually oriented to the sun via a deploy limit in the part action window. Place 12 radially around the Hokulani-LWWS Light Wet Workshop underneath the aero shield.
        #LOC_KSPZH_2696 = Hokulani AAT 27 "Stellartron" telescope
        #LOC_KSPZH_3151 = Large fixed mount telescope system designed for a crewed planetary flyby mission though it surely has other applications. Features multiple experiment instruments.
        #LOC_KSPZH_2761 = Hokulani-WWS Wet Workshop
        #LOC_KSPZH_2759 = Hokulani-SMDA Combo Airlock & Docking Adapter
        #LOC_KSPZH_395 = A lighter combination airlock and docking adapter designed to fit inside the Sarnus-SIVB-LAM adapter. Well suited for wet workshop stations.
        #LOC_KSPZH_2750 = Hokulani-OWS Orbital Workshop
        #LOC_KSPZH_2731 = Hokulani-EALM Expansion Airlock Module
        #LOC_KSPZH_592 = A small expansion module for the Hokulani OWS that includes an external airlock, meaning EVAs can be carried out without disrupting operations in the rest of the station.
        #LOC_KSPZH_2745 = Hokulani-FRM Foreign Research Module
        #LOC_KSPZH_382 = A large, 3.125m lab segment to be added to the Hokulani OWS. Developed and built by our foreign investors.
        #LOC_KSPZH_2755 = Hokulani-RAM Adapter Module
        #LOC_KSPZH_5362 = This multipurpose part serves as a 4.25m-1.875m adapter module, fairing base, life support and service compartment, and crew tube! The only thing missing is an airlock...
        #LOC_KSPZH_2711 = Hokulani HTHR-1 Handrail
        #LOC_KSPZH_2633 = Habtech
        #LOC_KSPZH_352 = A high quality handrail imported from Habtech industries. Attach radially for a convenient gripping point for EVAs.
        #LOC_KSPZH_2710 = Hokulani HSP-11 Science Pallet
        #LOC_KSPZH_4639 = Standalone version of the science experiment pallet from the Hokulani-FRM Foreign Research Module. A nice little platform to mount your experiments to.
        #LOC_KSPZH_2752 = Hokulani-PPAx Double Solar Wing Panel
        #LOC_KSPZH_5606 = Upgraded solar panels with double the surface area for providing power to your orbital workshops. Place radially, 30 degrees off center. The panels will automatically mirror to face the correct direction. Be careful not to lose them on the way up.
        #LOC_KSPZH_2718 = Hokulani PCS Monitoring TV Camera
        #LOC_KSPZH_270 = A compact camera with a convenient built in light.
        #LOC_KSPZH_2724 = Hokulani QLS Illumination Unit
        #LOC_KSPZH_1839 = Compact light to assist with docking.
        #LOC_KSPZH_2712 = Hokulani MDS-C 0.3125m Passive Docking Mechanism
        #LOC_KSPZH_3514 = Miniature probe-and-drogue docking system. This is the passive port, designed to catch the active port's probe.
        #LOC_KSPZH_2713 = Hokulani MDS-P 0.3125m Passive Docking Mechanism
        #LOC_KSPZH_3513 = Miniature probe-and-drogue docking system. This is the active port, Approach the target with the probe extended. Once soft docking is achieved and the vessels properly aligned, retract the probe to hard dock and establish a solid connection.
        #LOC_KSPZH_2697 = Hokulani CRRS-A12 Omni Antenna
        #LOC_KSPZH_1836 = Compact and robust antenna for short range communication.
        #LOC_KSPZH_2704 = Hokulani H-RSS "Sisyphus" Robotic Retreival System Core
        #LOC_KSPZH_4976 = The Sisyphus probe core is the basis of a modular space tug system. Designed originally to boost the orbit of space stations, it can function as a standalone probe core with six axis attitude control and can operate with up to four H-RRP2 Propulsion Kits (or without them at all).
        #LOC_KSPZH_2703 = Hokulani H-RRP4 Propulsion Kit
        #LOC_KSPZH_4370 = Self contained strap on propulsion kit with large propellant tanks and 8 thrusters.
        #LOC_KSPZH_2725 = Hokulani RRS-S10 Solar Panel
        #LOC_KSPZH_603 = A small fixed solar panel for the Hokulani Robotic Retrieval System. Comes with variants that can be mounted snugly on sharp corners or on a flat surface.
        #LOC_KSPZH_3407 = MSPB-II Upper Stage Kit
        #LOC_KSPZH_5411 = This small RCS kit can be used to add 3-axis control and a set of small monopropellant engines to the Staara 37 kick motor but in can be used with any 0.625m stage.
        #LOC_KSPZH_2065 = Dioscuri-1 & 2 Solid Rocket Booster
        #LOC_KSPZH_2032 = Derived from an in line second stage for an all solid small launcher, this strap on solid booster can help you get more TWR and Delta-V out of your first stage. Attach it to a radial decoupler and let-er-rip! The Discouri 1 was used on early thrust augmented Daleth rockets and Discouri 2 was used on subsequent upgrades through to Daleth 2000.
        #LOC_KSPZH_2067 = Dioscuri-4 'Dziran' Solid Rocket Motor
        #LOC_KSPZH_4488 = Small 0.625m solid booster motor, useful as a radial booster. The nozzle is angled to deflect the thrust away from the core stage. Used as strap on boosters on some Daleth, Daleth II and Bossart IIAS.
        #LOC_KSPZH_2068 = Dioscuri-4AX "Dziran-A XL" Solid Rocket Motor
        #LOC_KSPZH_4693 = Stretched version of the "Dziran-A" solid motor, useful as a radial booster. The nozzle is angled to deflect the thrust away from the core stage. Used as strap on boosters for cryogenic rockets from the East.
        #LOC_KSPZH_2070 = Dioscuri-ESMR Radial Decoupler
        #LOC_KSPZH_4510 = Small radial decoupler originally designed for use on Fenris rockets with the Dioscuri 1 and 2 SRBs.
        #LOC_KSPZH_2960 = KTA-SH "PIBS" Upper Stage
        #LOC_KSPZH_3880 = Precision Insertion Booster System. Self contained upper stage for performing correction burns, orbital insertions, etc. Includes a spherical monopropellant tank and three RCS thrusters configured to work as engines.
        #LOC_KSPZH_2959 = KTA-LH "Super PIBS" Upper Stage
        #LOC_KSPZH_1384 = Big brother to the Precision Insertion Booster System. Self contained upper stage for performing correction burns, orbital insertions, etc. Includes four spherical monopropellant tanks and twelve small blowdown thrusters. Used on Pulgasari III.
        #LOC_KSPZH_4788 = TSS-ACR Avionics and Control Package
        #LOC_KSPZH_1227 = Avionics for the Tandem Solid Stage. Place the Orbitas-6 solid motor in the inner node and then attach the interstage to the bottom.
        #LOC_KSPZH_4789 = TSS-IDA Interstage Adapter
        #LOC_KSPZH_60 = 1.5m interstage decoupler for the Tandem Solid Stage. Attach to the bottom of the Avionics and Control Package. Also includes interstage options for the Orbitas-21, including a slightly undersized 1.875m variant to fit inside a 1.875m fiaring.
        #LOC_KSPZH_3706 = Orbitas-21 1.5m Solid Rocket Motor
        #LOC_KSPZH_2296 = First motor for the Tandem Solid Stage, as well as the core of the Perigee Kick Stage. Use the IUS attach point for the TSS interstage, and the TOS attach point for the Perigee Kick Stage. The TSS Interstage also includes variants for mounting this motor to an upper stage. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_3707 = Orbitas-6 0.9375m Solid Rocket Motor
        #LOC_KSPZH_4357 = Second motor for the Tandem Solid Stage. Place inside the Avionics and Control Package before attaching the interstage. It features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_3773 = PKS-ACP Avionics and Control Package
        #LOC_KSPZH_1225 = Avionics and attitude control for the Perigee Kick Stage. Switch the Orbitas-21 to TOS mode and attach.
        #LOC_KSPZH_3494 = Minerva-VLL-III 2.5m Adapter
        #LOC_KSPZH_134 = 2.5m flared adapter for the Minerva 3 rocket.
        #LOC_KSPZH_3491 = Minerva-VLL-30 "Leda" Solid Rocket Booster
        #LOC_KSPZH_2061 = Developed from the civilian variant of the Paxus-MGL118/CGR120 this large 1.5m upper stage booster is vacuum optimized for use in upper stages. It is essentially a shortened "Tyndareus" with a slightly different fuel mixture and nozzle. It is primarily used as the second stage of the Minerva 1 launch vehicle, and the third stage of the Minerva 2. It features BDB's proprietary SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_3492 = Minerva-VLL-30XL "Philanoe" Solid Rocket Booster
        #LOC_KSPZH_2060 = Developed from the civilian variant of the Paxus-MGL118/CGR120 this large 1.5m upper stage booster is vacuum optimized for use in upper stages. An improved version of the "Leda", it has nearly twice the fuel mass resulting in a large payload gain. It features BDB's proprietary SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_3493 = Minerva-VLL-AIM "Kehrl" Orbital Assist Module
        #LOC_KSPZH_2107 = Due to the inherent imprecise nature (or at least, difficulty) of solid-based launch vehicles, they benefit from the addition of a controllable, liquid terminal stage. For the Minerva launch vehicle family, this was the "Kehrl" Orbital Assist Module. Featuring 6 spherical monopropellant tanks, 6 RCS thrusters for 3-way attitude control, and four additional RCS thrusters wired to an engine control circuit for prograde thrust. Useful for refining the orbit of your satellites, or deploying ridesharing satellites to different orbits.
        #LOC_KSPZH_3997 = Pulgasari-VGA Control Module
        #LOC_KSPZH_2499 = Guidance and control module for the Pulgasari upper stage. Includes mounting hardware for 0.9375m and 0.625m upper stages.
        #LOC_KSPZH_3998 = Pulgasari-VSIS 1.5m Interstage
        #LOC_KSPZH_4384 = Short 1.5m interstage with three lengths. The shorter version is used in the Pulgasari-IV and the longer version is used for the Pulgasari-V.
        #LOC_KSPZH_3795 = Paxus-MGL118/CGR120 "Tyndareus/Thestius" Solid Rocket Booster
        #LOC_KSPZH_3693 = One of the largest monolithic solid motors ever created, the 1.5m diameter "Tyndareus" implements advanced construction techniques shared with our CGR booster family. Originally used as the first stage of a very peaceful nuclear deterrent, surplus boosters have been purchased and refurbished by BDB and sold to you, our valued customer, at a discount. Some extra charges may apply. Use part switching to choose between the more powerful military MGL118, and the civilican GGR120/GGR120-AIR variants. GGR120 is commonly used as the first stage of Minerva 1 and Minerva 2. The altitude optimized GGR120-AIR is used as the second stage of Minerva 2.
        #LOC_KSPZH_3794 = Paxus-MGL/S4-PSBS "Orestes" Post Boost Vehicle
        #LOC_KSPZH_3718 = Originally serving as the upper stage of the Paxus missile, the "Orestes" contains an avionics core, full 3-axis RCS control, and a small LFO engine with fuel supply. BDB recently purchased a large quantity of these on their way to the scrapyard, and would prefer they are used up sooner rather than later - we promised that they would be disposed of.
        #LOC_KSPZH_3796 = Paxus-MGL119/SR2 "Minos" Solid Rocket Booster
        #LOC_KSPZH_5130 = This 1.5m monolithic solid booster is partially vacuum optimized, with an extending engine bell and two axis TVC. Originally the second stage of a very peaceful nuclear deterrent, surplus boosters have been purchased and refurbished by BDB and sold to you, our valued customer, at a discount. Some extra charges may apply.
        #LOC_KSPZH_3797 = Paxus-MGL120/SR3 "Menelaus" Solid Rocket Booster
        #LOC_KSPZH_514 = A short 1.5m solid booster with a vacuum optimized, two-stage extending nozzle and two axis TVC. Originally the third stage of a very peaceful nuclear deterrent, surplus boosters have been purchased and refurbished by BDB and sold to you, our valued customer, at a discount. Some extra charges may apply. Features BDB's SafeSolid™ system, allowing the engine to be shut down in flight, allowing for more accurate orbital insertions and maneuvers.
        #LOC_KSPZH_3596 = Mutineer-M55 "Musket" Solid Rocket Motor
        #LOC_KSPZH_1176 = At one point, this solid rocket motor was the first stage for a nuclear-armed missile. Now that they've been decommissioned, we're free to use them in our launch vehicles. Just be careful - the fuel is older than most of the engineers working on it!
        #LOC_KSPZH_3593 = Mutineer-1ISD 1.25m Adapter Interstage
        #LOC_KSPZH_47 = 1.25m to 0.9375m structural interstage built for Mutineer rockets.
        #LOC_KSPZH_2689 = Hippogriff-2ISD 0.9375m Interstage
