        #LOC_KSPZH_129 = 2.5m dual payload adapter for the Commercial Prometheus III. This innovative device has an integrated fairing on top and has room to carry another payload underneath. First attach your lower payload to the stock version of the 2.5m Prometheus fairing base and then place this on top. The adapter needs to be manually decoupled in the part action window after the upper payload has deployed.
        #LOC_KSPZH_2152 = Easton-AFB 0.625m Fairing Base SAF
        #LOC_KSPZH_694 = A special fairing base for the Easton Rocket. Has plenty of room in the cylindrical base for a solid kick motor and features an adjustable fairing cone on top.
        #LOC_KSPZH_1846 = Condor-SUS "Boxy" Probe Core
        #LOC_KSPZH_752 = A unique and robust probe core, the Condor-SUS "Boxy" probe core is a rectangular electronics cansiter that houses various satellite equipment and systems. This probe core was designed specifically for satellites that are integrated with their upper stages, this one being specifically designed for the Sarnus S-IV mounted Condor satellite. As a result, this probe core does not have very large batteries as it is meant to rely on the batteries of its upper stage. Despite this, it can be repurposed for other uses and comes with equipment such as a built-in direct antenna, reaction wheels, and small aft mounted thermal control radiators.
        #LOC_KSPZH_1844 = Condor-RME3 Electron Spectormeter
        #LOC_KSPZH_5281 = This instrument is designed for the Condor satellite with the intent of measuring trapped radiation to construct maps of planetary radiation belts.
        #LOC_KSPZH_1842 = Condor-FSP1 Solar Panel
