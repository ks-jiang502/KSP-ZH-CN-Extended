        #LOC_KSPZH_3207 = Launch adapter and decoupler for the SG-9 "Nonagon" satellite. Place on top of the Prometheus-III avionics unit - the space inside the avionics truss is needed for the service engine.
        #LOC_KSPZH_4140 = SG9-LRC Lifeboat RCS
        #LOC_KSPZH_4521 = Small, backup set of RCS thrusters for the SG-9 "Nonagon" spy satellite. Disabled by default - must be manually activated. Place in 2x symmetry on the small blocks on the bottom of the service module.
        #LOC_KSPZH_4141 = SG9-MCB RCS Block
        #LOC_KSPZH_3883 = Primary attitude control for the SG-9 "Nonagon" spy satellite. Place in 2x symmetry in the open spots on the sides of the service module.
        #LOC_KSPZH_4135 = SG9-9MS "Meadow" Mapping Camera System
        #LOC_KSPZH_4716 = Supplementary mapping camera system meant to mount to the nose of an SG-9 "Nonagon". Uses the smaller recovery vehicle feature on earlier Spyglass satellites.
