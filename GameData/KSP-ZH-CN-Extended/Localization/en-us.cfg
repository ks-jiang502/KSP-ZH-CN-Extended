        #LOC_KSPZH_5601 = Unlike some prickly telescopes that like to explode when pointed at the sun, the Bigby Solar Observatory is specially designed to observe solar activity. Its cameras can detect minute changes in the sun in wavelengths ranging from ultraviolet to infrared. It has a built-in probe core and Monopropellant for station keeping as well. And with the right modifications, the observatory can even search for asteroids.
