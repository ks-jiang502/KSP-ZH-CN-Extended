        #LOC_KSPZH_2192 = Etoh-340-QTU "Feldspar" Liquid Fuel Engine
        #LOC_KSPZH_2829 = In an effort to extend the service life of the basic "Sandstone" engine design, engineers have modified the engine significantly. Four downrated thrust chambers are now powered by set of common pumps and machinery. The net effect is this 1.5m powerplant has significant lifting power compared to contemporary engines, but still lacks efficiency.
