        #LOC_KSPZH_3172 = Large, fold out non-tracking solar array for the SG-9 "Nonagon" satellites. Place in 2x symmetry on the aft face of the service module, ensuring that they are horizontal (relative to orbital attitude) when deployed.
        #LOC_KSPZH_4148 = SG9-TSD Truss Segment
        #LOC_KSPZH_3542 = Modular truss segment for the SG-9 "Nonagon" satellite. Includes a mounting point and decoupler for the larger SG-9 recovery capsules.
        #LOC_KSPZH_4176 = SP9-VHB Helical Antenna
        #LOC_KSPZH_5642 = Very High Frequency (VHF) antenna for the Nonagon spy satellite. Mounts on the nose of the craft, and should point towards the surface when in orbital orientation.
