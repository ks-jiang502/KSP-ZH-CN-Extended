        #LOC_KSPZH_4136 = SG9-ASD Adapter Segment
        #LOC_KSPZH_4704 = Structural section that adapts from the SG-9 "Nonagon" camera system to the modular truss segments. Includes a mounting point and decoupler for the larger SG-9 recovery capsules.
        #LOC_KSPZH_4124 = SG-9 "Nonagon" Reconnaissance System
        #LOC_KSPZH_5348 = This massive camera assembly forms the core of the SH-9 "Nonagon" Spy Satellite. A pair of rotating 'optical bars' record large format, stereoscopic images covering vast swathes of the ground below. The system is a technological marvel, referred to as some as the most mechanically complex object ever put in space. A set of infrared sensors, originally used for star tracking, can also be repurposed to take IR radiometry measurements.
