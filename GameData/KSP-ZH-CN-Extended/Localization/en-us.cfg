        #LOC_KSPZH_3559 = Mounting plate for attaching single or dual upper stage engines to 1.875m tanks. Includes a node just below the top rim for attaching the interstage fairing. Used primarily on the Inon upper stage.
        #LOC_KSPZH_2851 = Inon-R-10A "Isor" Cryogenic Engine
        #LOC_KSPZH_1524 = By using cryogenic hydrogen and oxygen as propellants, engines are capable of reaching efficiency levels unheard of using traditional propellants. The R-10A "Isor" upper stage engine is the first such engine to use these fuels. Use one or two as the engines for the Inon upper stage family, and six in the Sarnus SIV upper stage. Be sure to check that any tanks connected to it are filled with the correct propellants, and remember its fuel will boil off over time. Has switcheable upgrades.
        #LOC_KSPZH_2847 = Inon-D-1 1800 Fuel Tank
