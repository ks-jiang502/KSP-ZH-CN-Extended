        // ---- CoatlAerospace ----
        #LOC_KSPZH_5017 = The blueprints show that this was a case for some science experiment, but there was a page missing. To prevent design delays, the engineers just crammed a dense battery in it.
        #LOC_KSPZH_5068 = The rotating head with a mirror window allows the camera to take a mosaic of pictures of the landing site for analysis without having to move the actual camera. This is useful for evaluating the safety of a landing site ahead of sending a Kerbal crew, but there is only enough film for one site survey. If you need to run more surveys, bring additional cameras or have a Kerbonaut ironically replace the film.
        #LOC_KSPZH_5153 = This actuated arm can be used to interact with the topsoil to expose material for photography. It can help analyze physical properties of the surface material but collects none and can run no chemical analysis. Be sure to check that the arm can reach the ground because, well, that would be embarrassing...
        #LOC_KSPZH_5416 = This small engine is designed to be mounted to the Landvermesser as a set of three. It is a fairly efficient early design, but far too fragile to be mounted on a stack.
        #LOC_KSPZH_2112 = Dust Analysis
        #LOC_KSPZH_2349 = Gamma Ray Spectrometry
        #LOC_KSPZH_2878 = Ionization and Electrostatic Analysis
        #LOC_KSPZH_3698 = Orbital Images
        #LOC_KSPZH_4051 = Radio Plasma Wave Data
        #LOC_KSPZH_4467 = Site Survey Imagery
        #LOC_KSPZH_4723 = Surface Material Exposure
        #LOC_KSPZH_4542 = Solar Wind Measurement
        #LOC_KSPZH_5578 = Ultraviolet and Atmospheric Analysis
        #LOC_KSPZH_3488 = Micrometeoroid Impact Data
        #LOC_KSPZH_1810 = Coatl Aerospace began as a manufacturer for electronic circuits. Under the leadership of founder and CEO Leo Kerman, the company began manufacturing their own probe cores and have since expanded into many areas of aerospace; pioneering autonomous space exloration.
        #LOC_KSPZH_1594 = CA-55i Landvermesser Battery
        #LOC_KSPZH_1808 = Coatl Aerospace
        #LOC_KSPZH_1614 = CA-CAM-S1 Landing Site Survey Camera
        #LOC_KSPZH_1648 = CA-L100 'Landvermesser' Lander
        #LOC_KSPZH_5482 = This very light and rugged probe is designed to perform landing site surveys ahead of crewed flights. Includes a set of landing legs and propellant for its 3 vernier engines (Sold separately). The Solid Fuel Retromotor will be required for normal de-orbit maneuvers.
        #LOC_KSPZH_1610 = CA-AE20 HGA Antenna and Solar Panel
        #LOC_KSPZH_4901 = The Landvermesser mast holds a Planar-array High-Gain Antenna and a single Solar Panel for charging the batteries; neither of which should be use for grilling, but those radio waves will likely cook something... eventually
        #LOC_KSPZH_1599 = CA-A07 Landvermesser Omni Antenna
        #LOC_KSPZH_5144 = This Omni antenna is a masterful re-use of old plumbing equipment and electronic parts from the bargain bin. It complements Landvermesser's HGA for short-range or emergency communication
        #LOC_KSPZH_1590 = CA-100B 'Landvermesser' B Core
        #LOC_KSPZH_2319 = For ease of manufacturing and parts compatibility, we developed a modified bus based on our Landvermesser lander platform for orbital operations. The mass saved from the removal of the landing hardware was invested in larger propellant tanks for its 3 vernier engines (Sold separately) which vastly extends its range and course correction capability. New antenna and solar panels specialized for space operations are also available
        #LOC_KSPZH_1604 = CA-A20-B HGA Antenna
        #LOC_KSPZH_5148 = This Planar-array High-Gain Antenna was modified for use with our Landvermesser orbiter model. The flat panel offers a slim profile with DSN tracking and pointing, but has reduced range than traditional dish designs
        #LOC_KSPZH_1694 = CA-SC28-L Topsoil Scoop
        #LOC_KSPZH_1641 = CA-ET120 Solar Array
        #LOC_KSPZH_5431 = This solar wing is part of the orbital Landvermesser line. The pure-bred panels are trained right out of the factory to track the sun whenever possible and to return any insults thrown at their owners. Warranty void if you grow attached to them "Emotionally or physically." Our lawyers asked us to clarify.
        #LOC_KSPZH_1689 = CA-SB15 Landvermesser Solid Rocket Retromotor
        #LOC_KSPZH_5432 = This solid fuel retromotor provides the main thrust necessary for Landvermesser de-orbit and landing deceleration. Features a built-in decoupler (Staging Disabled by default) and can be shutdown using "SolidSafe" technology we found scribbled on a napkin.
        #LOC_KSPZH_1652 = CA-LV03 Landvermesser Vernier
        #LOC_KSPZH_1597 = CA-A02 Conic Antenna
        #LOC_KSPZH_2108 = Due to the lack of roads on Kerbin, we were able to purchase a large number of surplus traffic cones and turn them all into a fairly efficient omni antenna. Multiple attachment options and colors available using the toggle buttons.
        #LOC_KSPZH_1647 = CA-KPS KerbNet Position System Antenna
        #LOC_KSPZH_5181 = This antenna provides access to the KerbNet system for very detailed tracking of the spacecraft's position. It can be used as a omni-directional antenna, but it is not very powerful
        #LOC_KSPZH_1598 = CA-A06 'Quetzal' Omni Antenna
        #LOC_KSPZH_2040 = Designed as a low-gain antenna for our 'Quetzal' probe line. Free with the purchase of every CA06 probe core, just pay separate shipping and handling. This antenna is absolutely NOT a broken Communotron 16 wrapped in thermal foil. Please forward all RMA claims to Ionic Symphonic Protonic Electronics' customer service department.
        #LOC_KSPZH_1596 = CA-A01 Ground Plane Antenna
        #LOC_KSPZH_4849 = The CA-A01 is not a TV antenna, it's a Space-grade TV antenna. WARNING: The CA-A01 is deployed by spring tension. Wear proper eye protection!!! Once deployed, it CANNOT be retracted
        #LOC_KSPZH_1600 = CA-A10 Small Folding Relay Antenna
        #LOC_KSPZH_4850 = The CA-A10 provides the advantages of a dish antenna without cluttering the front of your spacecraft. Electric servos fold the dish close to the hull during launch.
        #LOC_KSPZH_1609 = CA-AD1-R Small Folding Relay Antenna
        #LOC_KSPZH_4853 = The CA-AD1-R Relay dish is one of the most compact antenna of its size. It provides early tech relay functionality to jump-start any space program's network.
        #LOC_KSPZH_1603 = CA-A190 Hera Dish Antenna
        #LOC_KSPZH_2644 = Hera's rather small High-gain antenna is powered by a very powerful transmitter for its size. It is complimented by a medium and a low gain antenna mounted on the dish's periphery. Toggle option for its thermal foil are available on the right-click menu
        #LOC_KSPZH_1606 = CA-A300 Torekka Relay Antenna
        #LOC_KSPZH_2039 = Designed alongside the 'Torekka' probe, this antenna has greater bandwith, size, and is more efficient than the A200. All for about the weight. NOTE: When mated to a 'Torekka' probe, utilize the antenna's top attachment node to enable its struts.
        #LOC_KSPZH_1605 = CA-A200 Quetzal Relay Antenna
        #LOC_KSPZH_4852 = The CA-A200 was manufactured to be used for longer range missions with the Quetzal probe core. This complex antenna has built-in Yaw and Roll RCS and an array of micrometeorite detector pads.
        #LOC_KSPZH_1601 = CA-A100 Small Dish Antenna
        #LOC_KSPZH_4851 = The CA-A100 is a compact but efficient dish antenna with sufficient range for use in the inner Kerbol system. Warranty void if used beyond the orbit of Duna.
        #LOC_KSPZH_1602 = CA-A180 Tatsujin Relay Antenna
        #LOC_KSPZH_5178 = This antenna is small but features powerful transmitters for high bandwidth while sacrificing some range. You can toggle the antenna's cover from the right-click menu
        #LOC_KSPZH_1615 = CA-D02 Medium Folding Relay Antenna
        #LOC_KSPZH_5352 = This medium dish lowers spacecraft launch profile by folding the dish as close to the hull as possible. To reduce cost and size, the dish is not equipped with relay electronics
        #LOC_KSPZH_1695 = CA-SC573 Orbital Camera System
        #LOC_KSPZH_4958 = The SC573 is a camera imaging system built with our partners, AP Optics, and powered by a telescoping TV camera with multi color filters an a Vidikon tube system for converting images into an electric signal for transmission. The assembly's turntable can be programmed to angle depending on the encounter parameters of each mission. Up to 5 images can be stored in the film. It is designed to mount upside-down directly on an Argo Mk2 bus.
        #LOC_KSPZH_1633 = CA-ED3 Argo Dish Antenna
        #LOC_KSPZH_5264 = This high-power dish antenna can provide signal for interplanetary missions. The attachment node behind it contains structural support for the Argo Mk2 Mast, Toggle the Thermal cover from the right-click menu.
        #LOC_KSPZH_1611 = CA-AMA Argo Mast Assembly
        #LOC_KSPZH_4840 = The Argo Mk2 Mast Assembly is designed to mount to its Dish Assembly. The Mast houses a number of systems: the Argo Low-Gain omni antenna, a Magnetometer, and an Ionization Chamber and Geiger Counter for radiation science. Warranty void is any colors are hoisted.
        #LOC_KSPZH_1636 = CA-EP12-SPV Solar Panel
        #LOC_KSPZH_2045 = Designed for the Argo Mk2 series. This solar array features multiple prototype technologies, including solar winds vanes for attitude control augmented by a cold-gas RCS system at the outer edge of the panel. The spring loaded deployment mechanism prevents the panel from being retracted.
        #LOC_KSPZH_1630 = CA-E8b 'Argo Mk2'
        #LOC_KSPZH_481 = A purpose-built explorer for interplanetary missions. Argo's 8-sided bus provides ample bays for attaching equipment and includes a recessed area at the bottom for mounting a CA-SC573 Camera. A prototype Kanopus star tracking camera provides attitude control reference. Dual internal Monopropellant tanks can fuel RCS and propulsion systems.
        #LOC_KSPZH_1634 = CA-ED3b Argo Mk3 Dish Antenna
        #LOC_KSPZH_5266 = This high-power dish antenna can provide signal for interplanetary missions. This is a modified version of our HGA for Argo Mk2 missions, mean to be used for inner solar system missions. As such, the antenna is angled for optimal comm angle back towards the DSN. The attachment node behind it contains structural support for the Argo Mast, Toggle the Thermal cover from the right-click menu.
        #LOC_KSPZH_1637 = CA-EP13 Solar Panel
        #LOC_KSPZH_2046 = Designed for the Argo Mk3 series. This solar array features a cold-gas RCS system at the outer edge of the panel, and is designed for inner solar system missions. The solar cells are attached on the reverse side as compared to the Mk2 array. Concerns about heat damage near the sun prompted engineers to install temperature sensors in each panel. A spring loaded deployment mechanism prevents the panel from being retracted.
        #LOC_KSPZH_1631 = CA-E8c 'Argo Mk3'
        #LOC_KSPZH_5140 = This E8c bus is an upgrade over Argo-mk2 probes. The improvements were added to specialize the bus for inner solar planet missions closer to the sun and feature additional battery and propellant capacity, as well as improved thermal resistance and structural integrity. To support optimal flyby of inner planetary bodies, a number of features were mounted on the non sun-facing side, such as the Kanopus tracker and some of the sensors
        #LOC_KSPZH_1696 = CA-SCA4 Orbital Scan Platform
        #LOC_KSPZH_4959 = The SCA4 is 2-axis motor-actuated assembly. Multi-spectral cameras are mounted on the platform from Ultraviolet to Infrared wavelengths.
        #LOC_KSPZH_1678 = CA-RDA67 Argo Mk4 Dish Antenna
        #LOC_KSPZH_5265 = This high-power dish antenna can provide signal for interplanetary missions. The dish has new construction and design over the Mk3 dish, which allows a much higher bit-rate and improved signal range. The excellent bitrate allows for multiple simultaneous channels, so the antenna can function as a relay. The attachment node behind it contains structural support for the Argo Mast.
        #LOC_KSPZH_1612 = CA-AMA2 Argo Mast Assembly
        #LOC_KSPZH_4841 = The Argo Mk4 Mast Assembly is designed to mount to its Dish Assembly. The Mast provides omnidirectional low-gain communication as well as a temperature sensor mounted along the waveguide. Warranty void is any colors are hoisted.
        #LOC_KSPZH_1638 = CA-EP14 Solar Panel
        #LOC_KSPZH_4842 = The Argo Mk4 line for planetary exploration required more electrical power than our previous panels could provide. These new solar cells are made with better materials and are coated to protect them against solar flares and some radiation. A cold-gas RCS system is mounted at the outer edge of the panel. A spring loaded deployment mechanism prevents the panel from being retracted.
        #LOC_KSPZH_1632 = CA-E8d 'Argo Mk4'
        #LOC_KSPZH_1091 = Argo Mk4 further refines the improvements over our previous model without making it obsolete. Better internal structural bracing was added in order to support motor-actuated optics or heavier external equipment. The attitude control system is re-used from the Mk3, but we improved the computer's fault recovery and batteries.
        #LOC_KSPZH_1667 = CA-MV04-CP "Jib" MonoPropellant Engine
        #LOC_KSPZH_5152 = This a modified version of our CA-MV04 "Jib" Monopropellant engine. This version adds a computer module to allow the parent craft to calculate maneuvers from the engine's center of thrust. It can be surface or stack mounted.
        #LOC_KSPZH_1672 = CA-Q1300 'Barça'
        #LOC_KSPZH_1306 = Barça is the largest or our QBE buses and the older brother to the Barquetta bus. Features advanced electronics and attitude control systems.
        #LOC_KSPZH_1670 = CA-Q02-M 'Barquetta' ** DEPRECATED **
        #LOC_KSPZH_4 = ** DEPRECATED ** Do not create craft or use subassemblies with this part. For subassemblies, resave after replacing this with the non-deprecated version. Existing craft will continue to work.
        #LOC_KSPZH_1708 = CA-V601 'Aegis'
        #LOC_KSPZH_5321 = This is the strongest, most heavily shielded probe core out there! Affectionately known as "The vault," Aegis was designed alongside our Hera probe core. Aegis is heavily shielded from radiation, interference, and 2-year olds. Its shields leave little room for fancy features, but its redundant data-storage facilities will guard that sweet science
        #LOC_KSPZH_1669 = CA-Q02-M 'Barquetta'
        #LOC_KSPZH_1305 = Barquetta is the smallest bus offered in our QBE series. Ideal for compact science or telecommunication profiles. The stability system is complimented by a thoughtfully placed RCS system with built-in propellant.
        #LOC_KSPZH_1595 = CA-602 'Hera'
        #LOC_KSPZH_2643 = Hera is our largest probe core. Advanced star-trackers, batteries, RCS and propellant tanks are pre-installed. Internal components use strong and exotic construction materials to protect it from hostile radiation belts
        #LOC_KSPZH_1709 = CA06 'Quetzal'
        #LOC_KSPZH_4826 = The 'Quetzal' probe bus was our first commercially available design and provides all the basic control functions of a pioneering space program.
        #LOC_KSPZH_1671 = CA-Q04-M 'Tatsujin'
        #LOC_KSPZH_2877 = Introducing our new, advanced QBE probe bus. Larger and 75% more cubic than Barquetta. Designed for daring science missions out to wherever, whenever.
        #LOC_KSPZH_1710 = CA08-M 'Torekka'
        #LOC_KSPZH_2 = 'Torekka' is a larger, heavier, and more rugged probe bus for longer voyages. The bus design allowed a hollow center where we installed a monopropellant tank. Unfortunately, there was little room for batteries or stability systems.
        #LOC_KSPZH_1673 = CA-Q20-M 'Xihe'
        #LOC_KSPZH_3710 = Originally commissioned for a Kerbol science contract, Xihe is now available for use in other missions. Designed with redundant MP tanks, reaction wheels, and inertial units for longevity. The secondary RCS system is for roll control. Now packed with improved Ring-laser gyros and IMU fault-recovery programming!
        #LOC_KSPZH_1607 = CA-AACS Advanced Attitude Control System
        #LOC_KSPZH_5296 = This integrated computer system utilizes two star trackers to provide the spacecraft with attitude direction information. The advaced software runs on redundant 166 MHz computer processors and 640K of RAM, which ought to be enough for any mission profile. It also includes a small battery backup.
        #LOC_KSPZH_1731 = CAE-RM01 RCS Thruster Block
        #LOC_KSPZH_1809 = Coatl Aerospace East
        #LOC_KSPZH_5230 = This dual-nozzle block provides directional RCS power. The elongated nozzles are the same featured in our Linkor Service Module and are very efficient in a vaccuum.
        #LOC_KSPZH_1732 = CAE-RM02 RCS Thruster Block
        #LOC_KSPZH_436 = A modified RM01 RCS Module with its nozzles facing in opposite directions; meant for rotational control. The elongated nozzles are the same featured in our Linkor Service Module and are very efficient in a vacuum.
        #LOC_KSPZH_1733 = CAE-RM03 RCS Thruster Block
        #LOC_KSPZH_3722 = Our design team wanted a K-shaped RCS nozzle, but our engineers disagreed and fought for an easier to manufacture and use, T-shaped, 3-way RCS. Can be used to compliment Linkor-based designs.
        #LOC_KSPZH_1734 = CAE-RM04 RCS Thruster Block
        #LOC_KSPZH_5255 = This four-nozzle RCS block is designed to compliment attitude control systems in small to medium spacecraft.
        #LOC_KSPZH_1682 = CA-RS01 RCS Thruster Block
        #LOC_KSPZH_5412 = This small RCS system provides directional thrust in a very compact package.
        #LOC_KSPZH_1683 = CA-RS04 RCS Thruster Block
        #LOC_KSPZH_5254 = This four-nozzle RCS block is designed to compliment attitude control systems in small spacecraft.
        #LOC_KSPZH_1684 = CA-RST RCS Thruster Block
        #LOC_KSPZH_5213 = This compact monopropellant thruster block can fire a single nozzle as a directional RCS or all three as an engine.
        #LOC_KSPZH_1688 = CA-RW3 Reaction Wheel Assembly
        #LOC_KSPZH_5138 = This Assembly uses three reaction wheels working together to provide stronger attitude control.
        #LOC_KSPZH_1687 = CA-RW2 Reaction Wheel Assembly
        #LOC_KSPZH_860 = After much research, we found that one of the more effective ways to increase performance was to Add MOAR Boosters!!! Erm, reaction wheels. Here's a dual assembly for better control.
        #LOC_KSPZH_1685 = CA-RW1 Reaction Wheel
        #LOC_KSPZH_5425 = This small spinning flywheel stores angular momentum. Small changes in the spin rate and direction can help steer the craft without using up fuel! Our Engineers did not include instructions for recharging the momemtum, however.
        #LOC_KSPZH_1686 = CA-RW1a Reaction Wheel
        #LOC_KSPZH_823 = Advances in manufacturing techniques have allowed us to improve the performance of our RW1 models by close to 50%, while reducing the size. You're welcome.
        #LOC_KSPZH_1608 = CA-ACS 'Startrack' Attitude Control System
        #LOC_KSPZH_5112 = These higly sensitive Kanopus star trackers provide attitude control information for maneuvers. Warranty void if used for locating movie celebrities.
        #LOC_KSPZH_1593 = CA-300i Battery
        #LOC_KSPZH_4828 = The 300i is currently the largest battery available in our i-series. Featuring six top-performing rechargeable banks for all your electrical needs!
        #LOC_KSPZH_1591 = CA-100i Battery
        #LOC_KSPZH_3723 = Our dual battery bank is efficient, light, and durable. It can be recharged many times using external sources without losing performance. Warranty valid in Kerbin only
        #LOC_KSPZH_1592 = CA-25i Battery
        #LOC_KSPZH_5072 = The smallest offering of our i-series batteries, featuring an ultra-light, low-profile casing will be useful for compact or light-weight needs.
        #LOC_KSPZH_1674 = CA-R2000 Radioisotope Thermoelectric Generator
        #LOC_KSPZH_2479 = Go where solar panels cannot take you. The new R-Series of electric generators provide reliable electric charge in the outer Kerbol system by harnessing the heat released by the radioactive decay of the souls of our competitors. Keep it away from delicate electronics with the built-in boom.
        #LOC_KSPZH_1675 = CA-R3900 Radioisotope Thermoelectric Generator
        #LOC_KSPZH_825 = Advances in thermocouple technology have allowed us to develop a triple RTG assembly for those even more distant travels. Includes a thermometer and an attachment point for a DMagic Magnetometer.
        #LOC_KSPZH_1627 = CA-E320 1x2 Solar Panel
        #LOC_KSPZH_3719 = Our E320 photovoltaic panel system has a lot of densely packeed solar cells on its modestly-sized panels.
        #LOC_KSPZH_1628 = CA-E340 1x4 Solar Panel
        #LOC_KSPZH_4866 = The E340 packs twice as many photovoltaic panels as our E300A for only twice the price! This is great for missions that really need the additional power
        #LOC_KSPZH_1622 = CA-E12c 1x4 Solar Panel
        #LOC_KSPZH_2832 = In order to power science missions out to Jool's orbit, we designed these massive solar panels! These offset the cost and environmental concerns of RTGs. Due to their large mass, these panels do not track the sun, but we're working on that
        #LOC_KSPZH_1621 = CA-E12MG 1x3 Solar Panel and Magnetometer
        #LOC_KSPZH_2833 = In order to power science missions out to Jool's orbit, we designed these massive solar panels! These offset the cost and environmental concerns of RTGs. Due to their large mass, these panels do not track the sun, but we're working on that. This 12MG Model replaces the outer panel for a very sensitive magnetometer
        #LOC_KSPZH_1619 = CA-E100 1x2 Solar Panel
        #LOC_KSPZH_2876 = Introducing our improved E-series of solar panels! This bulky but sturdy and compact assembly gives you a way to re-charge your batteries for free* using sunlight! *Unit purchase costs not included
        #LOC_KSPZH_1620 = CA-E100-SPV 1x2 Solar Panel
        #LOC_KSPZH_2875 = Introducing our improved E-series of solar panels! Our scientists tell us that these optional Solar Pressure Vanes give your craft a bonus +1 Charisma and +1 to Tumble checks.
        #LOC_KSPZH_1629 = CA-E400MG 1x2 Solar Panel
        #LOC_KSPZH_5162 = This advanced gullwing solar panel system provides excellent sunlight capture and power at a distance but without sun-tracking capabilites. To complete the package, we've mounted compact Magnetometers on the tips.
        #LOC_KSPZH_1624 = CA-E200 3x1 Solar Panel
        #LOC_KSPZH_5307 = This is a very efficient photovoltaic array with an eccentric pivot point to minimize its stowed footprint and win you cool points in some social circles. WARNING: Very low clearance!
        #LOC_KSPZH_1625 = CA-E200B 1x2 Solar Panel
        #LOC_KSPZH_861 = After receiving several class-action suggestions, our engineers designed an alternate Photovoltaic system with vastly improved clearance, based on our award-winning E200 Series.
        #LOC_KSPZH_1623 = CA-E140 1x2 Advanced Solar Panel
        #LOC_KSPZH_4754 = TBW
        #LOC_KSPZH_1677 = CA-R8200 Advanced Radioisotope Thermoelectric Generator (LEGACY)
        #LOC_KSPZH_4760 = THIS PART IS RETIRING SOON! This advanced RTG was developed by the Atomic Research division, designers of our NERVA-HT nuclear engine, and features the same arachnid power source, or so we were told.
        #LOC_KSPZH_1613 = CA-BCSS Draco Back Cover Subsystem
        #LOC_KSPZH_2091 = Draco's insulated aeroshell protects it during cruise to whatever is the lander's destination. Explosive bolts separate it from the heatshield and have thus far not blown up the lander during testing and simulations
        #LOC_KSPZH_1730 = CAE-PD7-B Draco Drogue Parachute
        #LOC_KSPZH_5372 = This nylon-kevlar parachute is adapted from our Fomalhaut lander for use with the Draco lander system. Slightly different parachute geometry passes more air through to lessen the drag effect for thicker atmospheres. As an advantage, the parachute can withstand greater speeds and stress, allowing to be deployed much earlier in the entry procedure
        #LOC_KSPZH_1642 = CA-FRSS-200 Draco Front Shield Subsystem
        #LOC_KSPZH_786 = AQ60 Tiles cover this heatshield assembly designed to protect the Draco probe during atmospheric entry. A combination of aerodynamic shaping and ablative material transfers the heat/kinetic energy caused by atmospheric friction away from the shield and the lander above it.
        #LOC_KSPZH_1728 = CAE-P16-B Draco Parachute
        #LOC_KSPZH_5373 = This nylon-kevlar parachute is adapted from our Fomalhaut lander for use with the Draco lander system. This lighter system is less shielded and relies on the Draco's aeroshell for protection
        #LOC_KSPZH_1655 = CA-MER-A400 Meridiani Dish Antenna
        #LOC_KSPZH_5061 = The powerful Meridiani relay antenna can communicate out from deep into the system. A built-in Radar can provide KerbNet terrain information. Warranty void if used as debris shield. Toggle the mounting hardware and thermal foil covers from the right-click menu
        #LOC_KSPZH_1659 = CA-MER-R4-D "Dominique" Liquid Fuel Engine
        #LOC_KSPZH_4923 = The Meridiani craft design calls for highly reliable propulsion; enter the MER-R4-D. This hypergolic-fueled, pressure regulated system features the best construction materials available and mounts a secondary fully functional backup engine in case the first fails. Full retail price expected on the second engine. Whether you use it or not!
        #LOC_KSPZH_1656 = CA-MER-FT140
        #LOC_KSPZH_5318 = This is the main fuselage for the Meridiani series. It stores all propellants, and houses the attitude thrusters, electronics, propulsion valves, Kanopus Star Trackers, and a backup rReaction Wheel. Toggle the thermal cover from the right-click menu
        #LOC_KSPZH_1657 = CA-MER-LEU Meridiani Lower Equipment Unit
        #LOC_KSPZH_3479 = Meridiani's LEU holds the craft's primary attitude control reaction wheels, short-rang omni antenna, as well as the primary power source; three High-power RTGs. Toggle the rtg's shields from the right-click menu
        #LOC_KSPZH_1658 = CA-MER-MAG300 Magnetometer Boom
        #LOC_KSPZH_5167 = This advanced magnetometer boom extends its dual magnetometers several meters away from the craft. The two magnetometers use different technologies to collect and cross-reference measurements, eliminating spacecraft interference and increasing accuracy. Toggle foil covers from the right-click menu. The magnetometers are calibrated only for orbital use.
        #LOC_KSPZH_1616 = CA-DSA Draco Structural Adapter
        #LOC_KSPZH_5306 = This is a standalone assembly of Meridiani's Draco decoupler and structure, for use with other parent spacecrafts. Explosive bolts release the lander payload. New designs reduce the chance of unwanted follow-up explosions 1% of half of the time!
        #LOC_KSPZH_1660 = CA-MER-RSP Meridiani Remote Sensing Pallet
        #LOC_KSPZH_3480 = Meridiani's Remote Sensing Pallet is an assembly of cameras and spectrometry instruments designed for capturing images in multiple spectral wavelenghts for Science! We installed Infrared and Ultra-violet spectrometers, while our partners at AP OPtical provide narrow and wide angle visual cameras for an orbital telescope package.
        #LOC_KSPZH_1676 = CA-R8200 Advanced Radioisotope Thermoelectric Generator
        #LOC_KSPZH_5159 = This advanced RTG was developed by the Atomic Research division, designers of our NERVA-HT nuclear engine, for our 'Meridiani' line of products. It features the same arachnid power source as the NERVA-HT, or so we were told.
        #LOC_KSPZH_1661 = CA-MER-VLA Vehicle Launch Adapter
        #LOC_KSPZH_2042 = Designed for Meridiani and other probes, this payload adapter connects the payload to the launch rocket. Explosive bolts separate the payload for its mission; most of the time. Erm.... optional monopropellant storage available!
        #LOC_KSPZH_1649 = CA-L1200 'Draco' Atmospheric Lander
        #LOC_KSPZH_2090 = Draco is a very rugged, waterproof, and *hopefully* buoyant probe designed for atmospheric landing. The tight compartment also contains batteries, control computer, radar altimeter, landing cameras, and a full compact atmospheric analysis suite. The probe requires an orbital relay for communications! (Sold separately)
        #LOC_KSPZH_1654 = CA-MER-08 'Meridiani' Bus
        #LOC_KSPZH_3181 = Larger than our Torekka probes, Meridiani is the next step up in long-range exploration systems. The compact electronics suite allows for a partially hollow structure for mounting equipment. Propellant and additional functionality provided by our series of Meridiani-class parts, sold separately. Warranty void if used for lithobraking
        #LOC_KSPZH_1666 = CA-MV04 "Jib" MonoPropellant Engine
        #LOC_KSPZH_2052 = Despite the maritime legacy of its name, we're pretty sure we've seen sails push a craft with more "oomph." Despite the fact, this internally mounted engine has found its uses for light craft. It can also be surface-mounted for design flexibility
        #LOC_KSPZH_1653 = CA-LV10 "Lahar" Liquid Fuel Engine
        #LOC_KSPZH_4718 = Surf the wave! Our small LV10 engine is designed for outstanding vacuum performance. Great for course corrections and orbital insertions of small spacecrafts. It is rated for multiple restarts, some of which may even be on purpose.
        #LOC_KSPZH_1724 = CAE-LV35 "Linkor" Service Module
        #LOC_KSPZH_1 = "Linkor" is our super compact Service Module, containing a vacuum-rated engine, RCS systems for fine control, and built-in propellants! The middle attachment node is for smaller payloads, the top is for larger ones.
        #LOC_KSPZH_1668 = CA-MV15 "Trident" MonoPropellant Engine
        #LOC_KSPZH_5679 = When an angry mob armed with pitchforks surrounded his office, our lead engineer had the outstanding idea of a fork-shaped triple-nozzle engine using three CA-MV4s!
        #LOC_KSPZH_1698 = CA-SRB-24C Stella 24C Solid Rocket Motor
        #LOC_KSPZH_5426 = This small vacuum-rated Stella Series motor was originally designed alongside our Explorer telescope. Our Stella series motors are encased in Titanium for the highest quality. Features a built-in jettison system and the same SolidSAFE tech we found scribbled on a napkin.
        #LOC_KSPZH_1650 = CA-LT80 “Double” Liquid Fuel Tank
        #LOC_KSPZH_2765 = Holds two liquids for the price of one. Drinking either = Not Recommended. Can be attached inside the craft using the middle attachment node (near the bottom), or used in a regular stack.
        #LOC_KSPZH_1665 = CA-MT170 “Single” MonoPropellant Fuel Tank
        #LOC_KSPZH_2764 = Holds a large amount of a single liquid. Can be attached inside the craft using the middle attachment node (near the bottom), or used in a regular stack. Not recommended for use in baking.
        #LOC_KSPZH_1664 = CA-MT10 MonoPropellant Fuel Bottle
        #LOC_KSPZH_2884 = It turns out that diving equipment is built rugged enough to go to space! These compact radial bottles have left their scuba days behind and can now carry a small amount of monopropellant for when you need a little extra.
        #LOC_KSPZH_1644 = CA-H2RS High-Resolution Radar System
        #LOC_KSPZH_5142 = This High-Resolution Radar System uses its 6 antennas mounted in 3 booms to create very accurate radar scans. The system is very sensitive and can track direction and speed of object in the surface. It was designed to both track the speed of vehicles moving between KSC buildings (For speeding tickets) and to justify yet another satellite launch. Win-win
        #LOC_KSPZH_1645 = CA-HOLA Laser Altimeter
        #LOC_KSPZH_4464 = Since KSC pilots kept crashing into mountains to the West, we were asked to help. We developed an instrument to lower their altitude by shooting lasers at their peaks from orbit. That failed completely, but we discovered that the laser bounced back at different time intervals depending on the altitude, thus the High-Power Orbital Lazer Altimeter was born
        #LOC_KSPZH_1706 = CA-TRIXIE Multi-spectral Imager
        #LOC_KSPZH_4783 = TRIXIE pairs two camera assemblies to image and scan multiple light wavelengths from Ultraviolet to Near-Infrared. This provides a good way to determine surface features and biomes from orbit. The principal designer, Dr. Ed Kerman, did not include what the heck the acronym stands for. There is an optional cover which you can toggle from the right-click menu
        #LOC_KSPZH_1692 = CA-SC103 Accelerometer
        #LOC_KSPZH_4957 = The SC103 has sensitive sensors that can detect seismic vibrations and vehicle acceleration.
        #LOC_KSPZH_1691 = CA-SC102 Barometer
        #LOC_KSPZH_4956 = The SC102 has and internal probe which deploys to measure the local atmospheric pressure pushing down on me, you, or your spacecraft.
        #LOC_KSPZH_1617 = CA-DUST-C Dust Collector
        #LOC_KSPZH_4861 = The DUST-C features a gel-coated collector for trapping dust particles to bring them to Kerbin for analysis. The sturdy case is NOT a waffle maker and can withstand three different kinds of heat to return the samples. EXPERIMENT MUST BE RETURNED
        #LOC_KSPZH_1618 = CA-DUST-X Dust Experiment
        #LOC_KSPZH_1493 = Built out of a telescope tube, DUST-X has the capability of funneling the collected dust particles into a built-in lab for in-flight analysis. Full analysis on Kerbin is still recommended
        #LOC_KSPZH_1635 = CA-ELIX Electrostatic Science
        #LOC_KSPZH_1416 = Born from a failed attempt to build a detector of static charge in door knobs, ELIX, the Electrostatic and Ionization Experiment, turned out to be really good at detecting electric charges and ionized particles in planetary atmospheres. ELIX can be run in low orbit, or directly in the ionosphere.
        #LOC_KSPZH_1693 = CA-SC104 Gravity Wave Detector
        #LOC_KSPZH_2885 = It turns out that gravity is what keeps our rockets from going up. This delicate instrument can measure gravitational forces and waves. It turns out Albert Kerman was not crazy after all...
        #LOC_KSPZH_1643 = CA-GRS Gamma Ray Spectrometer
        #LOC_KSPZH_5663 = We are not sure why our scientists wanted a Gamma Ray Spectrometer before an Alpha or a Beta one but here it is! The instrument is particular sensitive to the Hydrogen spectrum in order to locate water.
        #LOC_KSPZH_1646 = CA-KLIR Infra-Red Spectrometer
        #LOC_KSPZH_4894 = The KLIR (Kerbal Long-range Infra-Red Spectrometer) is used to measure the thermal emissions of planetary bodies and can calculate surface temperature or even map surface features. The spectrometer can also measure the wavelength of IR emissions to detect certain elements on the surface.
        #LOC_KSPZH_1651 = CA-LUV Ultraviolet Spectrometer
        #LOC_KSPZH_3549 = More than just help make sunscreen suggestions, LUV can take and analyze imagery in the lower wavelength UV spectrum to bring out features and detect elements on the surface. The sunscreen suggestion is always "wear a spacesuit" anyway.
        #LOC_KSPZH_1680 = CA-RPWS Radio-Plasma Wave Science
        #LOC_KSPZH_5070 = The science design team did not include the specification document along with this part. We assume it measures Radio Station ratings and Plasma TV reviews. Wear proper eye protection around the deployable antennae!
        #LOC_KSPZH_1681 = CA-RPWS-S Radio-Plasma Wave Science
        #LOC_KSPZH_5365 = This new RPWS system is much more compact and of lower profile by mounting the electronics inside the bus rather than on the outside. Not responsible for eye injuries sustained during operation.
        #LOC_KSPZH_1697 = CA-SCB01 Torekka Science Boom
        #LOC_KSPZH_5668 = We designed this science boom for our Torekka probe core. The boom mounts Narrow and Wide field cameras for orbital survey images, as well as an Infrared and an Ultraviolet spectrometer. Deploy the boom to keep experiments away from interference and radiation.
        #LOC_KSPZH_1663 = CA-MSW-150 Xihe Science Boom
        #LOC_KSPZH_5717 = Xihe's science boom carries a very compact magnetometer and a new experimental solar wind experiment that detects and measures electrons in solar plasma. It's early technology, but we hope it takes off!
        #LOC_KSPZH_1699 = CA-SWIS Solar Wind Analyzer
        #LOC_KSPZH_5684 = When solar wind began trending on the Internet, scientists realized that current meteorological instruments could not detect it. Our Solar Wind Science (SWIS) instrument is designed specifically to detect and measure solar wind data. Look for our Solar Wind chimes, coming soon!
        #LOC_KSPZH_1679 = CA-ROTFL Orbital Telescope
        #LOC_KSPZH_4023 = ROTFL, or Reconnaissance Orbital Telescoping Focusing Lens, is an advanced Kerman-Kerman Reflector telescope to take close-up images of the ground. The lens and software are calibrated for orbital use and will not work on the surface.
        #LOC_KSPZH_1690 = CA-SC100 Thermometer
        #LOC_KSPZH_5034 = The first step to mastering space exploration is knowing where to pack a sweater, and where your "first step for kerbal-kind" will end with your foot and your space boot melting into a pile of goo that will have the lab boys back home exploding with excitment. Our thermometer is here to help.
        #LOC_KSPZH_1662 = CA-MG100 Magnetometer Boom
        #LOC_KSPZH_3555 = Mounted at the end of this folding boom is the main part of a Helium Vector Magnetometer, used to detect the location of party balloons. Correction: Apparently this measures magnetic fields instead.
        #LOC_KSPZH_1701 = CA-T8E 'Explorer' Orbital Telescope
        #LOC_KSPZH_2216 = Explorer is an industry leading Imaging system with specialty ultraviolet sensors. Includes built in Batteries, Hydrazine attitude system, and multiple short-range comm systems. The bus electronics are assembled around the main optical system, which is calibrated for long range observation; although it is capable of low-res orbital UV science. The rear of the craft has a structural housing for a Stella 24C solid fuel motor
        #LOC_KSPZH_1626 = CA-E300t Explorer Solar Panel
        #LOC_KSPZH_3546 = More advanced photovoltaic cells cover the solar panels for our Explorer telescope series. 3-in-1 arrays are built to fold very close to the hull for optimal clearance when stowed. This has the benefit of increasing the angles at which the panels receives power; should the sunlight tracking system fail
        #LOC_KSPZH_1704 = CA-TCL8 Thermal Control Louver
        #LOC_KSPZH_5107 = Thermal Control Louvers are heat control systems that can expel heat by exposing cooling fins and a radiator. Toggle the vents open to release heat from the spacecraft. This system has double the height and performance of the TCL4-B for better cooling.
        #LOC_KSPZH_1702 = CA-TCL4 Thermal Control Louver
        #LOC_KSPZH_5106 = Thermal Control Louvers are heat control systems that can expel heat by exposing cooling fins and a radiator. Toggle the vents open to release heat from the spacecraft. This is the standard size system
        #LOC_KSPZH_1703 = CA-TCL4-B Thermal Control Louver
        #LOC_KSPZH_5105 = Thermal Control Louvers are heat control systems that can expel heat by exposing cooling fins and a radiator. Toggle the vents open to release heat from the spacecraft. This is an alternate, longer version of the TCL4
        #LOC_KSPZH_1705 = CA-TPM-37E Torekka Propulsion Module
        #LOC_KSPZH_5533 = Torekka's Propulsion Module attaches to its adapter truss. The system is powered by a modified version of our Stella-37E Solid Motor. The built-in RCS are for maneuver guidance (since the Stella does not gimbal) but monopropellant is NOT included! Integrated decoupler is disabled by default, detach using the right-click menu.
        #LOC_KSPZH_1700 = CA-T2A-R33 Torekka Truss Adapter
        #LOC_KSPZH_5457 = This structural attaches to the bottom of the Torekka bus to safely and securely attach its propulsion module. Our engineers have included a Shunt Radiator which doubles as a... and let us tell you, we know shunting, we have the best shunting; you're going to love it. Now, where were we?
        #LOC_KSPZH_1639 = CA-ESM Quetzal Extended Service Module
        #LOC_KSPZH_4868 = The ESM provides the necessary utilities for long-range expeditions. It features additional batteries, reaction wheels, thermal control, and a monopropellant bottle.
        #LOC_KSPZH_1640 = CA-ESM2 Quetzal Extended Service Module
        #LOC_KSPZH_5681 = When life give you lemons (or broken Quetzal probes from the factory), learn to make lemonade (Stick inside of them a fuel tank, batteries, new electronics). Profit!
        #LOC_KSPZH_1729 = CAE-PD7 Fomalhaut Drogue Parachute
        #LOC_KSPZH_4548 = Some Fomalhaut atmospheric entry profiles call for earlier and/or more gentle braking. For those, we've designed this massive and resilient drogue chute. Warning: This chute is not rated for low touch-down velocities. Prepare for harsh, bumpy landings
        #LOC_KSPZH_1720 = CAE-HS100 Fomalhaut Heat Shield
        #LOC_KSPZH_5314 = This is the bottom piece of the Fomalhaut spherical atmospheric entry shell. It is coated with a very heat-resistant ablative material to keep the stuff inside from getting cooked.
        #LOC_KSPZH_1727 = CAE-P16 Fomalhaut Parachute
        #LOC_KSPZH_5379 = This part is the top cover of the Fomalhaut atmospheric entry capsule. This parachute attaches directly to the Fomalhaut lander for deployment after re-entry. It does so successfully most of the time.
        #LOC_KSPZH_1717 = CAE-E175 Fomalhaut Solar Panel
        #LOC_KSPZH_574 = A small and basic solar panel angled for mounting on the Fomalhaut lander collar to provide electric recharge of the batteries
        #LOC_KSPZH_1736 = CAE-SC-VIS Vorona Imaging System
        #LOC_KSPZH_4995 = The VIS assembly mounts a complete orbital imaging package comprised of a UV spectrometer for atmospheric analysis, IR spectrometer for surface analysis, and a compact low-res Telescope camera for pretty pictures in the visual range. There are two mounting options: 30 degrees for use with Vorona, and 90 degrees for use with other designs and surfaces. Toggle with the right-click menu.
        #LOC_KSPZH_1715 = CAE-A03 Vorona Communication Array
        #LOC_KSPZH_5646 = Vorona's Comm Array mounts dual conic antennae for short range, low-gain communication. The system also has a mount for a high-gain dish, designed for the Vorona CAE-102 dish (Sold separately).
        #LOC_KSPZH_1713 = CAE-102 Vorona Dish Antenna
        #LOC_KSPZH_4996 = The Vorona dish has a powerful transmitter for its size, that should allow a fair bit of range in communication in the inner solar system; whether you want it to or not.
        #LOC_KSPZH_1723 = CAE-LV175A "Kurt" Vorona Liquid Fuel Engine
        #LOC_KSPZH_5237 = This engine is fairly compact although a little heavier and less efficient than our other similar models. It does, however, maintain superior atmospheric ISP than other vacuum models. The smaller footprint allows for mounting on tight spaces.
        #LOC_KSPZH_1725 = CAE-MG03 Magnetometer
        #LOC_KSPZH_5304 = This is a really high-tech dowsing rod that detects and measures magnetic fields. For H2O dowsing rods, contact the Coatl Horticulture department. Any claims that dowsing is pseudo-science are imaginative, or fictitious. Any resemblance to actual claims, proven or not, are purely coincidental.
        #LOC_KSPZH_1726 = CAE-MT12 MonoPropellant Fuel Tank
        #LOC_KSPZH_5143 = This MonoPropellant containment sphere is quite a tank, literally! It can withstand stronger bumps that other units, but we still discourage you from landing on it.
        #LOC_KSPZH_1735 = CAE-SAR15 Synthetic-Aperture Radar System
        #LOC_KSPZH_3721 = Our Synthetic-Aperture Radar System can provide better altimeter and even more resource data than comparable "100% Organic-Aperture Radar" alternatives, don't fall for the hype! The two cone antennae can provide short-range communication. Contains no additives. Proudly using only use free-range plastics and metals during manufacturing.
        #LOC_KSPZH_1716 = CAE-D13-F Stack Decoupler
        #LOC_KSPZH_4791 = Takes two pieces for connect together and after not when you want to not have together more. Many quality part made in Kaiwan!
        #LOC_KSPZH_1719 = CAE-E600-A Vorona Solar-Thermal System
        #LOC_KSPZH_5647 = Vorona's wings hold large panels of photovoltaic cells as well as a large radiator for the cooling system.
        #LOC_KSPZH_1718 = CAE-E300 Vorona Solar-Thermal System
        #LOC_KSPZH_5176 = This alternate assembly of Vorona's photovoltaic cells excludes the outer panels for missions requiring less power
        #LOC_KSPZH_1722 = CAE-LT98 Vorona Liquid Fuel Tank
        #LOC_KSPZH_5484 = This very sturdy fuel tank is part of the Vorona orbiter system. The top of the tank has a special structure that can fit a Fomalhaut lander inside its spherical capsule, or really large eggs.
        #LOC_KSPZH_1721 = CAE-L165 'Fomalhaut' Lander Probe
        #LOC_KSPZH_4854 = The CAE Planetary Science Division has produced this rugged 'metal tank', and crammed it with batteries, radiation lining, a thermometer, a camera to image the landing site, and an antenna wrapped around the top. It is designed to survive rough landings in extreme environments
        #LOC_KSPZH_1714 = CAE-200 'Vorona'
        #LOC_KSPZH_4997 = The Vorona probe system is designed to work in tandem with a Fomalhaut lander to conduct simultaneous orbital/surface science. It packs batteries, avionics, and monopropellant in a very rugged case.
        #LOC_KSPZH_3414 = Magnetometer Data
        #LOC_KSPZH_2840 = Infrared Spectrometry
        #LOC_KSPZH_4048 = Radiation Data
        #LOC_KSPZH_1763 = Camera images
        #LOC_KSPZH_1707 = CA-Upgrade
        // ---- ContractPacks ----
        #LOC_KSPZH_2694 = HistoryofSpaceflight
        #LOC_KSPZH_2693 = Historical Contracts
        #LOC_KSPZH_5575 = USSR
        #LOC_KSPZH_4981 = The Soviet Union, officially the Union of Soviet Socialist Republics (USSR), was a socialist state in Eurasia that existed from 1922 to 1991. Nominally a union of multiple national Soviet republics, its government and economy were highly centralized. The country was a one-party state, governed by the Communist Party with Moscow as its capital in its largest republic, the Russian Soviet Federative Socialist Republic (Russian SFSR). Other major urban centres were Leningrad, Kiev, Minsk, Alma-Ata, and Novosibirsk. It spanned over 10,000 kilometres east to west across 11 time zones, and over 7,200 kilometres north to south. It had five climate zones: tundra, taiga, steppes, desert and mountains. The Soviet Union was a powerhouse of many significant technological achievements and innovations of the 20th century, including the world's first human-made satellite, the first humans in space and the first probe to land on another planet, Venus. The country had the world's second largest economy and the largest standing military in the world. The Soviet Union was recognized as one of the five nuclear weapons states and possessed the largest stockpile of weapons of mass destruction. It was a founding permanent member of the United Nations Security Council as well as a member of the Organization for Security and Co-operation in Europe (OSCE), the World Federation of Trade Unions (WFTU) and the leading member of the Council for Mutual Economic Assistance (CMEA) and the Warsaw Pact.
